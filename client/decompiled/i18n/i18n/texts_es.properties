content.20.169=Efecto: Disminuye en un 25%<image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/ALL.tga" align="west"></image> los daños del objetivo, el ocra gana 25% <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/ALL.tga" align="west"></image>por objetivo afectado (1 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>).\nCritico : Disminuye en un 40% <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/ALL.tga" align="west"></image>los daños del objetivo, el ocra gana 40 % <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/ALL.tga" align="west"></image>por objetivo afectado (1 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>).
content.20.170=Efecto: Inflige 4 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/WIND.tga" align="west"></image>, inmoviliza al objetivo (1 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>)\nCrítico: Inflige 6 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/WIND.tga" align="west"></image>, inmoviliza al objetivo ( 2 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>)
