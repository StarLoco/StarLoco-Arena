content.29.267=¿Qué, qué? ¿Realmente crees que puedes vencerme? El demonio I debe estar falto de guerreros como para enviarme a mequetrefes como tú... Adelante, ¡muéstrame lo que sabes hacer!
content.29.268=¿Qué, qué? ¿Realmente crees que puedes vencerme? El demonio I debe estar en falta de guerreros como para enviarme a mequetrefes como tú... Adelante, ¡muéstrame lo que sabes hacer!
content.29.269=¿Qué, qué? ¿Realmente crees que puedes vencerme? El demonio I debe estar en falta de guerreros como para enviarme a mequetrefes como tú... Adelante, ¡muéstrame lo que sabes hacer!
content.29.270=¿Qué, qué? ¿Realmente crees que puedes vencerme? El demonio I debe estar en falta de guerreros como para enviarme a mequetrefes como tú... Adelante, ¡muéstrame lo que sabes hacer!
