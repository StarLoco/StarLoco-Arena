content.31.3=Tienes unas botas...que me gustan...amigo...\n\n¿Qué vienes a hacer en nuestra tierra, campesino?\nAquí estás en el Hell's tofus, ¡así que habla mientras te queden dientes!\n\n¿Qué? ¿Llevarme junto a SuperBidi? ¿Han oído eso muchachos? Hay un mocoso con ganas de probar mi bate. \nEso me viene bien, tengo un mensajito que darle ¡y voy a escribirlo con tu sangre!\n\nVamos, tienes una oportunidad, quítate el pantalón, la chaqueta y las botas, y lárgate de mi vista.\nSi en 20 segundos, sigues aquí, voy a tener que limpiar las ruedas de mi Harley en tu cara de pedo. ¿Entendido? 
content.31.6=Los yopukas son seguramente mis guerreros preferidos, la encarnación de la fuerza bruta y el combate noble. \n\nEs decir, cuando eres guapo y fuerte...te gusta mostrarte ante el género femenino.\n\nVerás que en el combate que te propongo, aparte de ser una gran motivación para tu yopuka, la encantadora aniripsa que se encuentra en tu equipo te será de mucha utilidad para acabar con el ejército de crujidores que te espera.\n\nUtiliza en el momento adecuado los hechizos de los que ella dispone, su palabra maestra: la curación. Para ello, cuenta con un verdadero diccionario a su disposición: palabra sanadora, palabra de sacrificio, palabra de regeneración, etc.\n\n\nSi consigues este reto, podrás disfrutar de las dulces palabras que te susurrará al oído para felicitarte.
content.31.9=¡Sé rápido y prudente a la hora de combatir! \nSólo tendrás ocras con el hechizo flecha de retroceso para ponerle fin a una armada de sacrificadas kamikazes que se desplazarán más rápido de lo normal. \n\n¡Un desafío explosivo!
content.31.11=El trabajo en equipo...\n\nPara vencer al mega crujidor, el mérito personal no te será suficiente.\n\nLa clave de este desafío reside en la coordinación entre el fuerte, el posicionador y el de apoyo...\n\nAh sí, casi lo olvido, evita quedarte cerca de tu yopuka cuando se ponga furioso.\n\nConsejo:\n\nTu xelor "Tinie" se sacrifica para que uno de los otros dos personajes pueda usar plenamente sus hechizos. La Ira de Yopuka hace daños en dos casillas alrededor de él. En cuanto a los hechizos de levantar y tirar de tu panda, deberían permitirte matar al Mega crujidor si lo tiras en un buen lugar sobre el mapa. 
content.31.12=Desafío prueba (Limero)
content.31.13=En este desafío, deberás conducir a la victoria a Jackie y Abraham, que tienen unos problemillas que resolver con seis sadidas.\n¿Podrán, gracias a ti, librarse de sus enemigos, o deberán continuar luchando a golpes limpios?\n\nEstos desafíos tienen mucha miga, ¡perfecto para cazatesoros hambrientos!\n\n\nPista: \nTus enemigos no realizan ataques directos y uno de tus hechizos tiene efectos secundarios muy particulares que te ayudará a vencerlos. 
content.31.14=¡Por Xelor! ¿Pero quién ha transformado esos relojes gigantes en portales? Rápido, toma esta tropa especial de combate para cerrarlos, ¡sino las locas invocaciones van a perturbar los combates en las arenas!\nNuestros análisis preliminares indican que las invocaciones son agresivas y salen de manera aleatoria de los portales. Sin embargo, parece que el analizador de personajes funciona, así que podrás verificar lo que puede llegar a salir de los portales haciendo un clic en el icono correspondiente de la barra de orden de combate.\nAtención, evita el vapor de las esferas...puede causarle fuertes daños a tu equipo.. \n¡Ah! Tengo una mala noticia, Jeanine, nuestra secretaria aniripsa, está indispuesta....\n\nPista: Cuando los hechizos no funcionen, siempre podrás usar los puños...\n\nAyuda para jugadores principiantes: destruir todas las esferas es una tarea de lo más compleja. Hacerle frente a las invocaciones ya es bastante difícil. Si llegas a soportar 20 turnos o más, podemos considerar que sabes luchar contra ellas.
content.31.15=¡Por Xelor! ¿Pero quién ha transformado esos relojes gigantes en portales? Rápido, toma esta tropa especial de combate para cerrarlos, ¡sino las locas invocaciones van a perturbar los combates en las arenas!\nNuestros análisis preliminares indican que las invocaciones son agresivas y salen de manera aleatoria de los portales. Sin embargo, parece que el analizador de personajes funciona, así que podrás verificar lo que puede llegar a salir de los portales haciendo un clic en el icono correspondiente de la barra de orden de combate.\nAtención, evita el vapor de las esferas... puede causarle fuertes daños a tu equipo...\n¡Ah! Tengo una mala noticia, Jeanine, nuestra secretaria aniripsa, está indispuesta...\n\n\nPista para jugadores principiantes: este desafío es la versión difícil del desafío "paradoja xelórica". Destruir todas las esferas es un tarea de lo más compleja. Hacerle frente a las invocaciones ya es demasiado difícil. Intenta resistir lo máximo que puedas sin perder ni un solo personaje, y así nos pruebas que sabes enfrentarte a invocaciones. 
content.31.16=Vienen de una lejana tierra oriental y están dispuestos a todo para ganar los juegos olímpicos demoníacos.\nMientras tanto, compiten en el lanzamiento de crujidores. \n\nPero su jefe está ausente, seguro que se está agarrando una borrachera en un taberna de Maknala.\n\nVamos pequeño, te toca demostrar lo que vales.
