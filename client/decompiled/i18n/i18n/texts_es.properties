summary=Resumen
summonDescription1=El jalató se dirige hacia el adversario más próximo para atacarlo con el hechizo Mordedura de jalató. Si varios adversarios están a la misma distancia, el jalató eligirá a aquel que tenga menos puntos de vida.
summonDescription2=El prespic es una invocación que sirve para aburrir al adversario. Sus daños son débiles, pero su potencial de molestia es elevado. En cada turno se dirige hacia el adversario más cercano para atacarlo con su hechizo, lo que le hará perder un punto de acción, además de provocarle otros daños leves.
summonDescription3=El tofu es una invocación particularmente rápida y dañina. En cada turno, se dirige hacia el adversario más cercano y en caso de igualdad de distancias, al que tenga menos puntos de vida. El tofu ataca con su hechizo. Cabe destacar, que si se lanza un Chute Motivador sobre un tofu, ataca tres veces en lugar de una sola.   
summonDescription4=La Loca es una invocación que sirve para molestar al adversario. Cada turno, va hacia el adversario más cercano y le roba un punto de acción mediante un hechizo. Si hace un crítico, también le quitará un punto de movimiento. Así mismo, con dos puntos de acción de más, podrá lanzar dos veces su hechizo.
summonDescription40=El doble de los sramos es una invocación que puede perturbar, y mucho, al adversario, ya que posee el mismo nombre que tu sram y es difícil disasociarlo de quien lo ha invocado. Por el contrario, su comportamiento es el más simple: cada turno, se dirige al adversario más cercano y, en caso de que haya dos igual de cerca, a aquel con menos puntos de vida.
summonDescription5=La Bloqueadora se dirige al adversario más cercano y se queda a su lado. No hace nada más. Sin embargo, posee una fuerte capacidad de bloqueo y un número elevado de puntos de vida, lo que la hace particularmente desagradable para todos los guerreros que basan su juego en el movimiento.
summonDescription6=Los árboles son unos excelentes obstáculos pasivos. No hacen nada, ni se mueven. Por el contrario, poseen numerosos puntos de vida y bloquean las líneas de visión. Además pueden proteger eficazmente a los guerreros que se escondan tras ellos.
summonDescription7=La esfera es un obstáculo pasivo. Lo único que hace es lanzar su hechizo Espwejo, que reenvía todos los hechizos de daños hacia el lanzador. Si quieres matar una esfera, vas a tener que utilizar tus puños o un arma. Todos los hechizos de envenenamiento y los daños de empujar también funcionan. Igualmente, si la esfera es deshechizada perderá su protección hasta que vuelva a lanzar Espwejo.
summonDescription8=La Sacrificada es una invocación particularmente temible. Una vez invocada, se dirige al adversario más cercano y, en caso de dos adversarios a la misma distancia, a aquel con menos puntos de vida. Luego, explota, ocasionando daños considerables. Obviamente, el hecho de explotar destruye a la Sacrificada.
summonDescription9=El crujidor es una invocación particularmente poderosa. Cada turno, se dirige al adversario más cercano y, en caso de que haya dos adversarios a la misma distancia, a aquel con menos puntos de vida. Luego, lo atacará dos veces retirándole cada vez un punto de movimiento.
