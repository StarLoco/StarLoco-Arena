content.53.13=En este torneo, las reglas cambian: no tienes límite de capital, pero sólo puedes tener 4 guerreros en tu equipo.
content.53.14=En este torneo cambian las siguientes reglas: \nMínimo de 5 guerreros. \nAdemás, cada turno sólo durará 10 segundos.
content.53.15=Estos torneos utilizan las reglas clásicas de la evolución. Podrás combatir con tu equipo habitual, sea cual sea el nivel de tus guerreros. \nSin embargo, no recibirás experiencia ni sufrirás cansancio, heridas o muertes. Así mismo, tus pócimas y hechizos tendrán efecto a lo largo de todo el torneo y no se agotarán. ¡Es hora de divertirse!
