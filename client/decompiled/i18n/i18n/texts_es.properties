content.59.7=Hola. \n\nMe llamo Baan y estoy aquí para guiarte por el Horamundo, la dimensión en la que te encuentras. ¿Qué quieres saber?
content.59.8=Muy bien. ¿En qué estás interesado?
content.59.10=Vale, dirígete a la arena de entrenamiento. Allí tengo un jalató al que le encanta encajar golpes.
content.59.11=En este modo, tu posición en la <b>clasificación</b> y tu colección de <b>cartas</b> serán tus objetivos principales. \n\nPara ganar mejores puestos en las distintas clasificaciones del Horamundo, debes encadenar victorias en la arena enfrentándote a otros jugadores para demostrar que tú eres el más fuerte. \n\nGanar combates también te permitirá ganar <b>cartas</b> y añadirlas a tu grimorio. Para conseguir todas las <b>cartas</b> del Horamundo, dispones también de <b>sobres</b> (que puedes comprar gracias a las ogrinas en la página web del juego), los <b>Kardmasters</b> que encontrarás en las islas y los <b>laboratorios de fusión</b>. \n\nDe momento, concéntrate en un modo de juego (el modo evolución es un buen comienzo) e intenta acumular victorias.
content.59.12=Hay muchos tipos de combates, también llamados <b>modos de juego</b> en el Horamundo. En esta isla encontrarás <b>gostofos</b> que te explicarán más en detalle cada uno de estos modos de juego. \nEn resumen, lo que tienes que saber es que el <b>modo evolución</b> te permite jugar con un equipo cuya fuerza crece al entrenar. Por el contrario, el <b>modo élite</b> iguala a todos los contrincantes, pero requiere un buen conocimiento del juego, es decir, no comiences por él. El <b>modo élite 2vs2</b> te propone compartir un equipo élite con un amigo. Por último, el <b>modo torneo</b> o <b>modo personalizado</b> te propone jugar con reglas diferentes a cada vez y ¡participar en torneos que te permitirán ganar soberbas <b>cartas</b> e, incluso, items <b>DOFUS</b> o <b>Wakfu</b>!\n\nLos <b>gostofos</b> sólo quieren ayudarte, sus almas de guerreros caídos en la arena necesitan cumplir esta última misión antes de poder ser liberadas, así que no dudes en dirigirte a ellos.
