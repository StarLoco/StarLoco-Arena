content.42.1=<b>¡Participa en los memorables torneos de la Arena League!</b>\n\nLos torneos de la Arena League son los torneos más importantes del Horamundo y ¡los que dan más puntos de torneo!\n\nEn estos torneos se aplican las reglas clásicas de 1vs1. Con cada victoria que consigues en el torneo, ganarás puntos de torneo (cada vez más). <b>Gana 4 combates consecutivos en el torneo y conseguirás el máximo de puntos: 12.</b>.\n\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nEl torneo se activa en el siguiente horario:\n- <b>01:30 - 01:45 GMT+1</b> (Hora DOFUS)\n-<b>12:30 - 12:45 GMT+1</b> (Hora DOFUS)\n- <b>18:30 - 18:45 GMT+1</b> (Hora DOFUS)\n- <b>20:30 - 20:45 GMT+1</b> (Hora DOFUS)\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic, dentro del horario establecido, en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.\n
content.42.4=Torneo del demonio III\n<b>Participa en este duelo al estilo del demonio III</b>\n\n<b>El que gane el torneo se llevará 10 puntos y los demás participantes sólo 1 punto</b>. Exacto, es la ley del más fuerte al estilo del demonio III.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.5=<b>Tus luchadores deben estar unidos como IX y XXI para poder ganar este torneo.</b>\n\nCon cada victoria durante el torneo, ganarás dos puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.6=<b>¿Te gustaría acercarte al poder de medianoche que juega con los avatares de dios? ¡Este torneo es para ti!</b>\n\nCon cada victoria en el torneo, ganas 2 puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.7=<b>Esta noche, ¡que no te dejen sin dientes!</b>\n\nLos torneos rápidos son idénticos a los torneos clásicos de la Arena League. La única diferencia es que en lugar de jugarse durante una semana en cortos períodos de activación, ¡éstos se juegan en una única noche!\n\nCon cada victoria en el torneo, ganarás puntos de torneo.\n\n<b>Gana cuatro combates consecutivos en el torneo y conseguirás el máximo número de puntos: 12</b>.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.8=<b>¿Te encanta crear equipos originales? Ven y pon a prueba tus capacidades en el torneo anutrof.</b>\n\nCon cada victoria en el torneo, ganarás 2 puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic, dentro del horario establecido, en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.9=<b>Al contrario que en el torneo anutrof, el torneo de los ricos te propone crear equipos con mucho más presupuesto que de costumbre.</b>\n\nCon cada victoria en el torneo, ganarás dos puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.10=<b>El torneo ideal para los zurcaráks, o tal vez no.</b>\n\nCon cada victoria en el torneo, ganarás dos puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
