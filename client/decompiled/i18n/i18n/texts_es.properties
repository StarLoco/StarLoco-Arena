help.aoe=<b>Zona de efecto</b>\n\nEs la zona de efecto que abarcará tu hechizo. El valor de abajo indica el tamaño de la zona. Un punto significa que tu hechizo toca una sola casilla. Una cruz significa que tu hechizo abarca una zona en todas las direcciones. Una línea significa que tu hechizo toca todos los objetivos en línea recta.
help.cardActionPoints=<b>Costo en puntos de acción</b>\n\nEs el número de puntos de acción que deberás tener para poder lanzar ese hechizo. 
help.cardRange=<b>Alcance</b>\n\nEs la distancia mínima y máxima a la que ese hechizo puede ser lanzado. Un alcance de 0 indica que el hechizo puede ser lanzado solamente sobre ti mismo, o que es un hechizo que afecta todo el mapa.
help.cardValue=<b>Costo en kamas</b>
helpConsumable=<b>utilización de consumibles</b>\nPara utilizar tus consumibles, haz <b>clic izquierdo</b> sobre la carta y luego sobre el guerrero que elijas.
help.cooldown=<b>Tiempos de espera entre dos lanzamientos (espera global)</b>\n\nEs el número de turnos que habrá que esperar para poder volver a lanzar el hechizo. Si hay una cifra entre paréntesis, significa que ese hechizo tiene un tiempo de espera global, lo que implica que tus demás personajes tampoco podrán lanzar ese hechizo durante ese plazo. Sin embargo, tu adversario sí podrá hacerlo.
help.criticalHit=<b>Porcentaje de golpes críticos</b>\n\nPorcentaje de posibilidades de conseguir un golpe crítico cada vez que el guerrero lanza un hechizo o realiza un ataque.
help.damageRebound=<b>Reenvío de daños</b>\n\nEs el porcentaje de daños reenviados al atacante cada vez que el personaje resulta herido. 
help.dmg=<b>Bonus a los daños</b>
help.dodge=<b>Esquiva</b>\n\nCada vez que tu guerrero abandone el combate cuerpo a cuerpo con un adversario, este último podrá bloquearlo para hacerle perder el turno. Tu nivel de esquiva te indicará el porcentaje de probabilidad de no ser placado. Tener 100% de esquiva te garantiza esquivar los personajes que tienen 0 en placaje, pero ese porcentaje disminuye contra adversarios que tienen un nivel de placaje más alto. Todos los personajes tienen de base 100% de esquiva.
help.earth=<b>Bonus a los daños de tierra</b>\n\nEs un porcentaje de daños extras para todos los ataques que utilizan el elemento tierra. Aparece representado por un icono marrón. 
help.earthRes=<b>Resistencia a los daños de tierra</b>\n\nRepresenta tu porcentaje de resistencia a los daños de tierra. Los ataques que utilizan el elemento tierra, representado por un icono marrón, serán disminuidos de ese porcentaje de daños. Atención, tener 100% de resistencia, no te garantiza estar inmunizado contra este elemento, ya que tu resistencia se reduce con respecto al bonus a los daños de tu adversario.
help.fighterActionPoints=<b>Puntos de acción</b>\n\nTu guerrero tendrá un número de puntos de acción. Durante su turno, podrá utilizarlos para lanzar hechizos o atacar cuerpo a cuerpo. Un personaje con muchos puntos de acción podrá efectuar más acciones durante su turno. En general, los luchadores tienen seis puntos de acción. 
help.fighterRange=<b>Modificaciones de alcance</b>\n\nEs el número de casillas que se podrá añadir al alcance de todos los hechizos que lanza tu personaje. Atención, los hechizos que se lanzan cuerpo a cuerpo no se ven afectados por las bonificaciones o penalizaciones de alcance. 
help.fighterValue=<b>Costo del personaje</b>\n\nEs el costo en kamas de tu personaje. Un equipo estándar cuesta como máximo 6.000 kamas y puede contener de 1 a 6 personajes. 
help.fire=<b>Bonus a los daños de fuego</b>\n\nEs un porcentaje de daños extras para los ataques que utilizan el elemento fuego. Aparece representado por un icono rojo.
help.fireRes=<b>Resistencia a los daños de fuego</b>\n\nRepresenta tu porcentaje de resistencia a los daños de fuego. Los ataques que utilizan el elemento fuego, representado por un icono rojo, serán disminuidos de ese porcentaje de daños. Atención, tener 100% de resistencia, no te garantiza estar inmunizado contra este elemento, ya que tu resistencia se reduce con respecto al bonus a los daños de tu adversario.
help.firework=Gracias al <b>lanzador de hadas artificiales</b>, ¡organiza el espectáculo de pirotecnia más bello del Horamundo! Coloca tus cartas de hadas artificiales en el orden que deseas que sean lanzadas e indica debajo de ellas el tiempo de lanzamiento.
help.healBonus=<b>Bonus a las curaciones</b>\n\nEs el porcentaje de bonus aplicado a todas las curaciones que lanza tu personaje. 
help.healthPoints=<b>Número de puntos de vida</b>\n\nSi un guerrero llega a tener cero puntos de vida, muere. Si todos tus guerreros mueren, pierdes el combate. Los puntos de vida de un guerrero están, en general, entre los 60 y los 100 puntos de vida. 
help.initiativePoints=<b>Puntos de iniciativa</b>\n\nDurante el combate, los guerreros actuarán en el orden inverso a su iniciativa, siempre en el mismo orden, salvo si tienen la misma iniciativa, y en ese caso, será al azar. En general las iniciativas van de 0 a 100.
help.movePoints=<b>Número de puntos de movimiento</b>\n\nEn cada turno, tu guerrero podrá moverse utilizando ese número de casillas. En general, los guerreros tienen 3 puntos de movimiento. 
help.nbSummons=<b>Número de invocación</b>
help.openClose=tutoriales
help.res=<b>Resistencia a los daños</b>
help.summonCC=<b>Dominio de invocaciones: golpes críticos</b>
help.summonDmg=<b>Dominio de invocaciones: daños</b>
help.summonHp=<b>Dominio de invocaciones: puntos de vida</b>
help.summonRes=<b>Dominio de invocaciones: resistencia</b>
help.summonTackle=<b>Dominio de invocaciones: bloqueo</b>
help.tackle=<b>Placaje</b>\n\nCada vez que un guerrero intente abandonar el cuerpo a cuerpo con su adversario, éste intentará bloquearlo para impedírselo. En este caso, el primero deberá antes hacer una prueba de esquiva contra la capacidad de placaje del segundo. Esta característica te dará el porcentaje de probabilidad de bloquear a un adversario que posee 100% de esquiva. Muchos guerreros tienen 0% en placaje y no podrán bloquear jamás a un adversario.
help.target=<b>Objetivo</b>\n\nLibre significa que el hechizo puede ser lanzado donde se desee. Vacío significa que se trata de un hechizo a lanzar sobre una casilla no ocupada. Aliado es un hechizo que afecta sólo a los aliados. Uno mismo significa que es un hechizo que debe ser lanzado sobre ese guerrero exclusivamente. Invoc es un hechizo que debe ser lanzado sobre una invocación. 
help.water=<b>Bonus a los daños de agua</b>\n\nEs un porcentaje de daños de más para todos los ataques que utilizan el elemento agua. Aparece representado por un icono azul. 
help.waterRes=<b>Resistencia a los daños de agua</b>\n\nRepresenta tu porcentaje de resistencia a los daños de agua. Los ataques que utilizan el elemento agua, representado por un icono azul, serán disminuidos de ese porcentaje de daños. Atención, tener 100% de resistencia, no te garantiza estar inmunizado contra este elemento, ya que tu resistencia se reduce con respecto al bonus a los daños de tu adversario.
help.wind=<b>Bonus a los daños de aire</b>\n\nEs un porcentaje de daños de más para todos los ataques que utilizan el elemento aire. Aparece representado por un icono verde. 
help.windRes=<b>Resistencia a los daños de aire</b>\n\nRepresenta tu porcentaje de resistencia a los daños de aire. Los ataques que utilizan el elemento aire, representado por un icono verde, serán disminuidos de ese porcentaje de daños.  Atención, tener 100% de resistencia, no te garantiza estar inmunizado contra este elemento, ya que tu resistencia se reduce con respecto al bonus a los daños de tu adversario.
