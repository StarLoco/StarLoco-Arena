content.9.1=Masacre y destrucción son las bases de la religión yopuka... Pensándolo bien, matanza y carnicería también. Bueno, que ya estás listo para pegar más fuerte y hacer más daño.
content.9.2="Al mejor pastor, el lobo le roba un jalató". Es sorprendente como los viejos refranes reflejan la realidad y hacen que los srams se pongan de buen humor.
content.9.3="¡Uno para todos y todos a por el sacro!" Éste es un grito de guerra que les encanta a los sacrógrito. O, como dice un texto sagrado sacrogrito: "Sobre la arena caerán la bendición de tu diosa y el cuerpo inerte de tus enemigos".
content.9.4="El viejo que se cura, cien años dura". Dichos como éste son los que hacen que los aniripsas se pongan a curar todo lo que se menea, y que no sea hostil.
content.9.5=Parece que Sadida, al crear a las Sadiditas, las dotó de un carácter muy puñetero. A Sadida gracias, también creó millares de las muñecas más dóciles que nunca hayan existido.
content.9.6=Discípulos de Osamodas, siempre os han gustado los animalitos y vuestro dios ¡lo sabe! Agujerear al enemigo con un tofu, desmembrarlo con un jalató... ¡Ah, qué linda es la vida!
content.9.7="Donde pongo el ojo, la clavo". Esto fué lo que dijo Ocra refiréndose a su flecha, pero sus discípulos prefieren usarla en más amplios contextos. Si así son felices...
content.9.8=Ver correr a un discípulo de Anutrof siempre causa una gran impresión. ¡Sorprende a tus amigos! El dios Anutrof acaba de regalarte una gran libertad de movimientos.
content.9.9=El dios Xelor tiene la prudencia de aparecerse sólo a los que creen en él. Lo cual es profundo, verdadero, y te abre nuevas perspectivas.
content.9.10=Los zurcaráks son encantadores, porque muestran la misma sensibilidad ante la belleza de un trébol de cinco hojas y la de un enemigo molido a palos.
content.9.11=¡La diosa Feca te ofrece una auténtica armadura blindada! Ya me dirás qué tal... Ligera, práctica y resistente, seguro que te salva la vida. O al menos lo intentará.
content.9.12=Bueno, no es que nos aburramos, ¡pero tampoco vamos a quedarnos aquí hasta que vuelva a amanecer!
content.9.13=La fatalidad. La desdicha. El infortunio. La desventura. La mala pata. El desastre. La desgracia de unos es la suerte de otros.
content.9.14=Golpear, esquivar, hechizar... A la larga, un guerrero se cansa, ¡y eso sin contar con los golpes y las agujetas! Es normal que se tomen un descanso.
content.9.15=¿Creías que podrías seguir botando de aquí para allá todo el rato? Pues va a ser que no...
content.9.16=Acabas de volverte alérgico al agua. Al agua de mar, al agua de río, al agua de lago, al agua de colonia, al aguacero, al aguanieve, al aguarrás, al aguamiel, al aguardiente... así que tendrás que AGUAntarte un poco.
content.9.17=Por aquí huele a frío... lo menos que se puede decir es que, a la mínima llama, vas a acabar todo churruscadito.
content.9.18=Si sientes que te ahogas, que te falta el aire, no te extrañes. Esta calma chicha  impediría volar hasta a los buitres.
content.9.19=¡Aquí huele a sudor y a lárgimas... Sólo falta un ligero toque sangriento y todo estará perfecto.
content.9.20=Por el venerable Magnalebus, el más glorioso de los taumaturgos, de gran espíritu y musculoso cuerpo. ¡Todo el mundo va mejor!
content.9.21=Como Hoanna Dharcu, la famosa arquera ocra, oyes voces que te anuncian: "¡Va a correr la sangre! ¡Y va a salpicar!". Es un buen presagio, ¿no crees?
content.9.22=¿No hay nada que te conmueva? ¿Eres un auténtico brutote? Pues aprovecha: esto es una masacre. ¡Sólo apta para los más fuertes!
content.9.23=Ya iba siendo hora de que sabiduría (la tuya) rimase con covardía (la que provocarás en tu adversario). Y ya puestos con delirium tremens, pero ésto mejor déjalo para después del combate.
content.9.24=Si eres de los que sólo se creen lo que ven, esto te va a abrir los ojos. Quizás no veas el aire, pero no podrás dejar de sentir este viento.
content.9.25=Repite diez veces esta frase a voz alta: "Espíritu de la ola que moja, tú que provocas congoja, ¡golpea a mi enemigo y que su ropa encoja!". Este ritual es tan simple como eficaz.
content.9.26=¡Esta roca se descompone sola! Así que ten cuidado en donde pones los pies, si no quieres hacerte daño. Date por avisado...
content.9.27=¿Un combate interminable? ¿Y tú ya tienes ganas de celebrar la victoria, o de ahogar tu derrota en una jarra? No te preocupes, Pandawa está aquí para regalarte una ronda mientras sigues con la carnicería.
content.9.43=Las últimas pruebas que se han realizado no han sido concluyentes, por lo cual, nuestro especialista se encuentra en una intensa fase de reflexión. Las invocaciones, por su parte, están que no paran.
content.9.44=En su intento por bloquear el flujo temporal, nuestro "experto" sólo habría conseguido desencadenar una ola de violencia entre las invocaciones.
content.9.45=Nuestro especialista está intentando reparar la esfera. Sus últimas pruebas podrían tener resultados no deseados.
content.9.46=Parece que nuestro enviado especialista, Montrakristo, ha descubierto nuevas propiedades en las criaturas invocadas, particularmente, un aumento de la resistencia.
content.9.47=Hemos perdido el contacto con nuestro especialista, Montrakristo. Hemos oído, por el contrario, un grito de oso como sólo los osamodas saben hacerlo.
content.9.48=Los zurcaráks son encantadores, porque muestran la misma sensibilidad ante la belleza de un trébol de cinco hojas y la de un enemigo molido a palos.
content.9.49=Masacre y destrucción son las bases de la religión yopuka... Pensándolo bien, matanza y carnicería también. Bueno, que ya estás listo para pegar más fuerte y hacer más daño.
content.9.50=Sus discípulos la alaban por revelarles el arte secreto de desenfundar las flechas con estilo y rapidez.
content.9.51="Más vale palabra en mano que ciento en la punta de la lengua". Preceptos como éste son los que utilizan los aniripsas para curar a diestro y siniestro, a todo lo que se mueve.
content.9.52=La diosa Feca ofrece a sus discípulos una verdadera coraza, ¡una armadura blindada! Ya me contarás qué tal. Seguro que te salva de más de una...
content.9.53="¡Uno para todos y todos a por el sacro!". Éste es el grito de guerra que lanzan los sacrógritos. Tu diosa llora lágrimas de sangre, ¡una sangre que te da fuerzas para resistir cualquier combate!
content.9.54=El dios Xelor tiene la prudencia de aparecerse sólo a los que creen en él. Lo cual es profundo, verdadero, y te abre nuevas perspectivas.
content.9.55="Cría srams y te vaciarán los bolsillos". Hay que ver como estos viejos refranes cuentan la verdad y halagan a los srams.
content.9.56=¿Qué pasa con el combate? ¿Todo el mundo se ha ido a festejar la victoria o a ahogar su derrota? Afortunadamente, Pandawa está ahí para darte lo mismo, ¡pero sin dejar la carnicería de lado! 
content.9.57=Ver a un discípulo de Anutrof correr produce una sensación extraña. Sorprende a tus amigos: ¡el dios Anutrof te gratifica con una gran libertad de movimiento!
content.9.58=A los discípulos de Osamodas les gustan los animales de compañía y ¡su dios lo sabe! Linchar a un enemigo con un tofu, descuartizarlo con un jalató... ¡Eso es vida!
content.9.59=Parece que Sadida, al crear a las Sadiditas, las dotó de un carácter muy puñetero. A Sadida gracias, también creó millares de las muñecas más dóciles que nunca hayan existido.
