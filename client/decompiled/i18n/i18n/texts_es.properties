content.20.172=Efecto: Si el objetivo sufre daños, el lanzador le intercambia la posición y sufre los daños en su lugar.\nObjetivo: aliados.
content.20.173=Efecto: Inflige 2 daños neutrales al objetivo cuando comienza su turno, siempre que esté bajo los efectos del envenenamiento (4 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>).\nCrítico: Inflige 3 daños neutrales al objetivo cuando comienza su turno, siempre que esté bajo los efectos del envenenamiento (4 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>).\nEl envenenamiento es un hechizo que cambia de estado.
