content.33.1=Tras haber deliberado, el consejo de los 24 ha decidido penalizar a tu mejor equipo disminuyendo su fuerza, como consecuencia de su inactividad durante las dos últimas semanas.\nY no lo olvides, ¡en las arenas del Horamundo no hay sitio para los holgazanes!
content.33.2=¡Bravo!\nGracias a tu participación en un evento de Arena, has ganado objetos exclusivos.\nNo dudes en pasearte por el Horamundo para presumir un poco de ellos.\n\nEl equipo Ankama.
content.33.3=El objeto adjunto procede de la página web de Arena.\nGracias por confiar en nuestro servicio postal.\nEsperamos que disfrutes de nuestros envíos exprés tanto como desees. \n\nEl cartero demoníaco.
content.33.4=En recompensa, por haber participado en la pre-gold de Arena, te enviamos en exclusiva estas runas, últiles para la evolución de tus luchadores.\n¡Mucha suerte!\n\nEl equipo Ankama.
