content.29.300=¡Ay! Parece que uno de tus guerreros está herido. No es una buena noticia: si no le curas, la herida le impedirá luchar normalmente a partir de ahora.
content.29.301=De hecho, muchas heridas pueden provocarle la muerte. Pero al fin de cuentas, son tus guerreros, puedes hacer lo que quieras.
content.29.302=Claro, puedes elegir el no curarle... Pero debes saber que cuanto más cansado o herido está un guerrero, más posibilidades tiene de recibir más heridas.
content.29.303=El otro día escuché a otro jefe decir que había recibido muchos objetos de cura en un sobre...
content.29.304=Cuando hayas encontrado una pócima de resurrección, ve al cementerio para recuperar el cuerpo de tu guerrero. Si no sabes dónde está, consulta el mapa (con la tecla M).
content.29.305=De momento, te aconsejo que envíes a tu guerrero al cementerio, donde podrá descansar en paz.
content.29.306=Tranquilo, no estás perdido. ¿Recuerdas los sobres de cartas de los que te hablé? Además de objetos de curas, también podrás encontrar pócimas de resurrección.
content.29.307=¡Te lo dije! Pero no has querido escucharme y uno de tus guerreros ha muerto.
content.29.308=¡Hola! ¡Tú! ¡Sí, tú! No pongas esa cara de atontado y ven a hablar conmigo. ¿Qué? ¿Que no sabes cómo desplazarte? Es simple, puedes elegir entre hacer clic derecho y clic izquierdo.
