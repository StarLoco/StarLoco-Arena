content.31.29=Vayamos lentamente y veamos cómo te desenvuelves contra un simple jalató... Con tres guerreros no deberías tener problemas, aunque seas un mequetrefe...
content.31.30=¿¿Has derrotado al jalató?? ¡Muy bieeeen! Veremos cómo te desenvuelves contra la banda de monstruos que te esperan en el siguiente desafío. \n\nAtención, están deseando hacerse con tus puntos de acción. Avisado quedas, ¡luego no te sorprendas si no puedes seguir lanzando hechizos!
content.31.31=OK, OK. Había muchos prespics y locas, pero no hacían demasiado daño, ¿eh?\n\nVeamos qué puedes hacer contra un verdadero adversario.  Un grupo de tres guerreros debería ser suficiente para derrotarlo, pero no será fácil. \n\nEl crujidor es forzudo, da unos buenos golpes y roba puntos de movimiento. Un pequeño consejo si es que no quieres terminar como una alfombra: intenta pegarle de lejos todo lo que puedas antes de que él te plaque en el cuerpo a cuerpo. 
content.31.32=He aquí un combate como nos gustan: terminado en segundos, rápido y sangriento. Nunca olvides la importancia de las cartas de acción, siempre deberás utilizarlas en el mejor momento. Cuestan pocos puntos de acción y casi siempre son más fuertes que el hechizo de un guerrero. Las cartas de acción te brindarán la polivalencia que te conducirá a la victoria. 
content.31.33=¡Por fin estás listo! Ve a ver al demonio I, que te otorgará el derecho a participar en el gran torneo. Y si luego quieres venir a entrenarte con nosotros, pues ni lo dudes. Tus guerreros ganarán un poco más de experiencia mientras sigan siendo debutantes. Luego, deberás enfrentarte a otros jefes para ganar experiencia de la gorda.  
content.31.34=¡Bravo! Qué victoria tan fenomenal. No olvides nunca que las casillas de bonus pueden darte una ventaja decisiva en el combate. En las arenas del gran torneo, casi siempre las encontrarás en medio del terreno. Intenta utilizarlas y verás cuánto pueden cambiar el desenlace de un combate. 
content.31.35=Has burlado las trampas del demonio del minuto 52, bien hecho. Nunca te olvides de las casillas de trampa en los combates, pueden ocasionarte grandes daños. Las casillas de muerte, por su parte, matarán a un personaje en fracción de segundos. Si tienes personajes que pueden empujar o atraer al enemigo, o intercambiarle la posición, no dudes en intentar dejar a tu enemigo sobre una casilla de muerte.
content.31.36=Y... fin. Un arquero no puede hacer gran cosa en un combate cuerpo a cuerpo. Una vez que llegues al gran torneo, será necesario que mantengas el reflejo de mirar tus cartas de los dos próximos turnos. No serán nunca tan violentas como las que acabas de ver, pero siempre pueden cambiar el resultado de un combate. 
content.31.37=¿Te sientes mal, chiquitín? ¿Mucho veneno? Oooh, pequeño enclenque...
content.31.38=¡Muajajajajajaja!\nAmas a ese yopuka.\nA nosotros siempre nos hace reír, sobretodo cuando aplasta a un equipo miserable.
content.31.39=Hemos pensado en poner un solo guardián que haga preguntas. \nPero es más emocionante cuando las flechas de retroceso salen en todas direcciones. \nUna pena que nadie haya caído...
content.31.40=¿Te gusta mi huerta? \nCultivo zanahowias.\nPero para evitar wabbits, siempre pongo a algún guardián que se ocupe de aplastarlos. 
content.31.41=¿Eso es todo?\nQueríamos ver cuánto vaLes...Estamos decepcionados...¿estás seguro de poder lucirte en el torneo, mequetrefe?
content.31.42=Waaaa, un buen desafío como éste te hace recobrar las fuerzas. \nEs nuestro reconstituyente secreto.\nUn sram y ¡es la hora de las tortas!
content.31.43=Qué curiosos esos aniripsas. Distribución de curaciones y de bofetadas. Así el adversario resiste más tiempo, sufre más tiempo y nosotros cuánto nos divertimos.
content.31.44=Ya que has podido sentir la fuerza de los demonios de los segundos, vuelve a la arena para enfrentarte a tus semejantes. \nQueremos combate, heridas y muertos. ¡Ejecución!
content.31.45=¡Bravo! Le has dado una buena lección a ese demonio. ¡Gracias a ti, Bernabé está libre! A partir de ahora, usa su carta para devolvérselo a su propietario en el Mundo de los Doce.
