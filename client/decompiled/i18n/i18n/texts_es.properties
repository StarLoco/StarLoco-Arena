content.11.1=A tus enemigos siempre les olerá a chamusquina.
content.11.2=¿Qué mejor para luchar contra un picajoso que una bola de pinchos?
content.11.3=Si tienes un tofu a mano, ¡nadie intentará desplumarte!
content.11.4=Los volverá a todos locos. Quizás a ti también...
content.11.5=No hay que confundirla con la hinchable, ¡aunque esta suela hinchar los Dofus!
content.11.6=Este árbol no te impedirá ver el bosque, pero quizás haga que tu rival no te vea a ti.
content.11.7=Desde siempre, los xelors han usado esta esfera para desorientar a sus adversarios.
content.11.8=Con tu edad, ya va siendo hora de madurar. ¡Sacrifica tus muñecas!
content.11.9=Si el crujidor se cruje los nudillos, al adversario no tardarán en crujirle todos los huesos... ¡¡dos veces!!
