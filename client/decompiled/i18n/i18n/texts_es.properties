content.42.13=<b>Torneo de test de Poch</b> \n\n¡Hemos venido a ganar, no a cotillear!\n\nCon cada victoria en el torneo, ganas 2 puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.14=<b>¡Este torneo es para los impacientes!</b> \n\nCon cada victoria en el torneo, ganarás dos puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic, dentro del horario establecido, en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.15=<b>¡Hoy es el turno de los jugones!</b> \n\nLos torneos de evolución son en general parecidos al modo evolución, pero sin límites de ligas. Muéstrale a todo el mundo la superioridad de tus guerreros y tu increíble capacidad de entrenamiento. \n\nCon cada victoria durante el torneo, ganarás dos puntos de torneo. <b>Gana cuatro combates consecutivos en el torneo y conseguirás el máximo número de puntos: 12</b>.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.16=<b>Un torneo para los que adoran que la muerte sea rápida y abundante</b>. \n\nPara qué esperar 15 turnos antes de que se enfrenten los equipos. La muerte súbida es ahora. Buena suerte. \n\nCon cada victoria durante el torneo, ganarás dos puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.17=Note de MBigotte : Ne pas modifier sans mon accord.\n\nCette définition de tournoi est utilisée UNIQUEMENT pour des tests avec de bons paramètres par défaut.\n
content.42.18=<b>En estos días oscuros, los muertos se levantan y deciden unirse a la fiesta. ¡Los guerreros de tu cementero que piensan que la eternidad es un poco larga estarán contentos de participar en este torneo!</b>\n\nEste excepcional torneo te propone recompensas que despertarán a los muertos: además de <b>100 fichas de torneo, ¡el ganador obtendrá el sombrero del pío rojo!</b> \n\nCon cada victoria en el torneo, ganas 2 puntos de torneo.\nSin embargo, si te eliminan, abandonarás automáticamente el torneo (con los puntos que ya has conseguido, por supuesto).\n\nPara lanzar un combate en un torneo, sólo tienes que hacer clic en la carta de invitación que aparece abajo a la izquierda en tu pantalla y buscar un adversario adecuado.
content.42.19=¿Tienes lo que hace falta para ser el SUPERJEFE? \n\nEnfréntate a la Élite de los Jefes en los torneos por eliminación directa. Lucha por tu honor, por sobrevivir... ¡y gana la recompensa de los mejores! \nAcceso limitado a las personas que posean un Ticket SuperJefe, disponible sólo en los sobres SuperJefe.
