content.29.90=¡Ay! ¡Ay! ¡Ay! 
content.29.91=¿Qué es esto? ¿Y tú quién eres?
content.29.92=¡Aghhh! Ya no se puede dar un paseo dimensional sin meterse en un sitio lleno de basura...
content.29.93=A menos que... ¡Esto tiene que ser un truco de los demonios de las horas! No andan muy lejos, ¿verdad?
content.29.94=Ya veo, no tienes ni idea de qué estoy hablando. Te explico: mi nombre es  Adamai. Te ha capturado un demonio de las horas, ¡estás siendo teletransportado hacia su mundo! Una vez allí, tendrás que reclutar una tropa de gladiadores que lucharán por ti...
content.29.95=Si tú y tus guerreros obtenéis un número suficiente de victorias, os clasificaréis los primeros y... ¡Seréis libres!
content.29.96=Si no... en fin... morirás.
content.29.97=¡Cuidado! ¡Agárrate!
content.29.98=Hay dos o tres cosas que debes saber. Puede que pases un mal rato si no te lo cuento.
content.29.99=Por ejemplo, esto...
content.29.100=Entonces, cuando te diga: "si haces clic en las espadas, das pie a una búsqueda de combate", harás clic en las espadas y desencadenarás un combate. Sorprendente, ¿verdad? Pero NO lo hagas ahora...
content.29.101=Eres disciplinado, me gusta. Ahora, haz clic donde brilla. Date prisa, que tengo más cosas que hacer.
content.29.102=Ésta es una tropa predefinida. Pronto, podrás ponerla a prueba o desencadenar un combate haciendo clic...
content.29.103=¿Haciendo clic en...?
content.29.104=¡Haciendo clic en las espadas! ¡Bien! Sé que quieres hacerlo, pero vas a tener que esperar un poco.
content.29.105=Lo que vas a hacer ahora es sin duda lo más importante de tu vida de jefe: dirigir tu tropa y equipar a tus luchadores.
content.29.106=Haz clic sobre el botón que se ilumina para crear una nueva tropa; a continuación dale un nombre y luego haz clic en OK
content.29.107=Ahora haz clic en "Reclutar" y, a continuación, cuando hayas determinado su clase y su nombre, dale a "Validar" para añadirlo a tu grupo.
content.29.108=Vas a añadirle un sombrero de 100 Kamas. Encuentra el sombrero llamado Dantgul y haz doble clic sobre él.
content.29.109=¡Ya está! El luchador goza de un bonus del 15% a los daños de tierra. Si no sabes lo que es, es que no has leído el manual. Y eso está... ¡MUY MAL!
content.29.110=Puedes cerrar esta ventana. Aún te quedan cosas por saber, te dejo que las descubras por ti mismo.
content.29.111=Haciendo clic en las espadas, das comienzo a una búsqueda de combate contra otro jefe. Antes de empezar, pon a prueba tu tropa y perfecciona tus tácticas.
content.29.113=Es el momento de que nos digamos adiós. Te envío junto a otros de tu condición. Y yo me voy, que por aquí huele a demonios...
content.29.114=Bueno, no olvides comprar también unos hechizos para tus luchadores, se añaden como con el equipo, pero los tienes que escoger en la lista de la derecha. Ya verás, ¡te serán muy útiles!
content.29.115=¡Eh! ¡Te he dicho que no toques eso! Déjalo y escúchame un poco, que lo vas a necesitar.
content.29.116=Saltarse el tutorial
content.29.117=Hummm, me parece que tú llegarás lejos.\n\n¡Enséñame de lo que eres capaz en combate! Yo podría enseñarte algunos trucos para que sobrevivas... y ¿quién sabe? ¡Quizás algún día puedas luchar para mí en las arenas de combate!
content.29.118=<b>Estás en una isla de Arena.</b>\n\nAquí controlas al jefe de tus tropas y puedes interactuar con otros jefes (con otros jugadores) o con los objetos y PNJs (personajes no-jugadores).\n\nUn clic derecho te permite avanzar y un clic izquierdo sobre un objeto o jugador, te permite interactuar con ellos. Puedes modificar e invertir los clics en el menu opciones. 
content.29.119=<b>Estás en un combate, para conseguir más información sobre las ventanas de combate, busca al demonio III en la isla de Maknala o lee el capítulo correspondiente en el manual del jugador que encontrarás en la carpeta en la que instalaste Arena.</b>
content.29.120=<b>Estás en la ventana de clasificación.</b>\n\nEsta ventana muestra la clasificación de los mejores jugadores de Arena.\nAdemás de mostrarte qué puesto ocupa el jugador, esta ventana te da información sobre el mejor equipo de cada jugador: lafuerza, el número de victorias y derrotas del jugador con dicho equipo, etc.
content.29.121=<b>Estás en la ventana de las estadísticas del jefe.</b>\n\nEn esta ventana, encontrarás información sobre tu cuenta, como el tiempo que has pasado jugando a Arena, o el número de victorias y derrotas del conjunto de tus equipos.
content.29.122=<b>Estás en la vetana de vida social.Aquí puedes gestionar tu lista de amigos, de ingorados y tu clan.</b>
content.29.123=<b>Estás en la ventana del inventario del jefe.</b>\n\nAquí encontrarás la lista de todas las cartas de jefe que poseas (las cartas que ganas al término de un combate y que sólo pueden utilizarse en las islas de los jefes).\n\nLas pestañas de la parte superior de la ventana representan las distintas familias de cartas: cartas del ajuar (inventario y sets), cartas especiales y cartas de teleportación (zaaps).\n\nPara ayudarte a encontrar las cartas que buscas, dispones de varios filtros que se activan y desactivan en las casillas situadas a la derecha. También posees un menú desplegable en la parte superior de algunas ventanas. 
content.29.124=<b>Estás en la ventana de gestión de los equipos.</b>\nAquí podrás consultar todos tus equipos.\nSe organizan en orden decreciente de potencia. El equipo con mayor potencia determinará  el nivel del jefe (si tu mejor equipo tiene una potencia que equivale a nivel 14, tu jefe también será de nivel 14).\nPara cambiar la composición de un equipo, basta con que arrastres un luchador de la reserva (en la parte derecha, abajo) hasta el equipo en cuestión para añadirlo, y que hagas la operación inversa para quitarlo.\nSi quieres crear un nuevo guerrero para una tropa, haz primero clic en el botón "Recltar" (al pie de la ventana, a la derecha). Luego aparecerá en tu reserva, desde donde podrás ponerlo en el equipo deseado.\nNo olvides que la única regla importante a la hora de crear un equipo es que no puede sobrepasar el coste de 6.000 puntos.
content.29.125=<b>Estás en la ventana de comunicación de bugs.</b>\n\nDescribe tu problema y, si puedes, explica como reproducirlo. Escribe tus explicaciones en los campos apropiados. Luego haz clic en "validar" para enviar tu mensaje directamente a los programadores del juego. Ellos no te responderán directamente, ¡pero intentarán resolver el problema que has descrito en el menor tiempo posible!
content.29.126=<b>Estás en la menú de opciones del juego.</b>\n\nAquí puedes ajustar los distintos parámetros del juego. Atención, los parámetros de vídeo pueden afectar seriamente a la velocidad del juego llegando incluso a impedir su funcionamiento.
content.29.127=<b>Estás en la ventana de tu buzón.</b>\n\nGracias al buzón, puedes enviar mensajes a otro jefe y recibir los mensajes que los demás jefes te quieran enviar (estén conectados o no).\nLos buzones funcionan como una cuenta de correo electrónico, y hasta puedes enviar cartas de jefe poniéndolas en los lugares previstos cuando creas un nuevo mensaje.
content.29.128=<b>Estás en la ventana de creación de un nuevo mensaje.</b>\n\nEsta ventana te permite enviar un mensaje a un jefe (conectado o no). Para ello, debes introducir el nombre del jefe y hacer clic en el botón "Validar" que se encuentra al lado de esa ventana (para comprobar que el destinatario de tu mensaje existe).\n\nLuego, sólo necesitas poner un título a tu mensaje y... ¡a escribir! Cuando lo termines, haz clic en el botón "Enviar".\n\nTambién puedes enviar cartas de ajuar de jefe junto con tu mensaje. Para ello se han previsto unas ventanas de "Archivos adjuntos" en donde sólo tendrás que introducir la(s) carta(s) que quieras enviar, para que éstas le lleguen al otro jefe.
content.29.129=<b>¡Estás en la ventana del KardMaster! El KardMaster es un demonio menor que te cambiará tus cartas por otras que él tenga.</b>\nPara ello, selecciona en la ventana de la izquierda la carta que te interese, hasta puedes seleccionar varias mediante la tecla SHIFT (mayúsculas). \n\nCuando hayas seleccionado la(s) carta(s) que quieras, verás que debajo se muestra el precio en kamas que te pide el KardMaster por ella(s).\n\nUn vez hecho esto, coloca las cartas que quieras de tu inventario en la zona de intercambio del KardMaster (que se encuentra en la ventana de la izquierda) hasta que alcances o sobrepases el valor requerido (verás que el valor total de las cartas que vas a vender aparece justo encima de tus cartas, a la izquierda del símbolo  ' / '.\n\nCuando tengas suficientes cartas, podrás hacer clic en el botón "Comprar", una ventana emergente te informará que la transacción se ha realizado satisfactoriamente y encontrarás las nuevas cartas en tu inventario.
content.29.130=<b>Estás en la ventana de utilización de un zaap.</b>\n\nLos zaaps son el medio de transporte entre las distintas islas de Arena. Para utilizar un zaap, debes poseer la carta del destino al que quieres llegar. \n\nLas cartas zaap se ganan, principalmente, cuando tu jefe sube a determinados niveles.
content.29.131=<b>La ventana del chat se encuentra en la parte inferior derecha de tu pantalla. Gracias a ella, puedes comunicarte con los demás jugadores.</b>\n\nEl chat posee varios canales de comunicación con los que podrás elegir mejor a quién quieres hablar. Para definir el canal en el que hablas, utiliza el atajo correspondiente. \n\nLos canales más importantes son:\n\nEl canal "General", con el que hablarás a todos los jugadores que estén cerca de ti (atajo: '/s').\nEl canal "Clan", que sirve para hablar con la gente de tu clan (atajo: '/c').\nEl canal "Comercio", que está destinado al intercambio de cartas. Lo podrá ver todo el que se encuentre en la misma isla que tú, pero sólo podrás escribir en él una vez cada 30 segundos (atajo: '/t').\nEl canal "Privado", que te permite hablar con una única persona (atajo: '/w' seguido de un espacio y del nombre del jefe al que quieras hablar).\n\n\nLas pestañas que se encuentran encima de la ventana del chat te permitirán configurar los canales que quieras mostrar en tu ventana, ¡y pasar rápidamente de una configuración a otra!
content.29.132=<b>Estás en la ventana de información de un luchador.</b>\n\nEsta ventana reune toda la información que necesitas conocer acerca de uno de tus luchadores o de un luchador rival.
content.29.133=Pas géré pour le moment. Sait on jamais plus tard. Ne pas traduire
content.29.134=<b>Estás en la ventana de fin de combate.</b>\n\nEsta ventana resume la información más importante de la partida: quién ha ganado, cuánto tiempo ha durado el combate y qué cartas se ha llevado el vencedor (para ganar cartas, hay que ganar como mínimo dos combates seguidos). También encontrarás información sobre ambos jefes, como por ejemplo su nivel.
content.29.135=<b>Estás en la ventana de inicio del combate.</b>\n\nEsta ventana te presenta brevemente la composición de la tropa rival, así como algunas estadísticas de su jefe (o de sus jefes, si se trata de un combate múltiple).
content.29.136=<b>Estás en la fase de colocación.</b>\n\nDurante esta fase, podrás colocar a tus luchadores sobre las distintas casillas de inicio del mapa. \n\nPara mover a un personaje, haz clic en él (se iluminará) y luego haz clic en la casilla en la que quieras situarlo.\nSi ya hay otro luchador en la casilla de destino, entonces ambos luchadores intercambiarán sus respectivas posiciones.
content.29.137=<b>Estás en la ventana de intercambio de cartas, aquí podrás dar y/o recibir cartas de un modo seguro.</b>\n\nEl principio es muy sencillo: primero introduce las cartas que quieras dar (o cambiar) en los emplazamientos que están al lado de tu jefe.\n\nAhora espera a que el otro jefe coloque sus cartas en su interfaz. Una vez que las hayas examinado y sepas qué es lo que quieres, podrás hacer clic en "Listo".\n\nUna vez que hayas hecho clic en "Listo", si el otro jefe cambia las cartas que pretendía intercambiar verás como la casilla "Listo" se deseactiva automáticamente. Esto es normal, es una medida de seguridad que evitará que un jugador malintencionado retire sus cartas en el último momento y te estafe. Así que puedes estar tranquilo: ¡los intercambios de esta interfaz son seguros!
content.29.138=<b>Estás en la ventana de creación de un luchador.</b>\n\nSi -a pesar del tutorial de inicio del juego- aún no te queda claro cómo crear un luchador, dirígete al manual del jugador que encontrarás en la carpeta en que instalaste Arena.
content.29.139=<b>Estás en la ventana de modificación de un luchador.</b>\n\nSi -a pesar del tutorial de inicio del juego- aún no te queda claro cómo modificar un luchador, dirígete al manual del jugador que encontrarás en la carpeta en que instalaste Arena.
content.29.140=<b>Estás en la ventana de creación de una tropa.</b>\n\nAquí puedes crear una nueva tropa. No te olvides de incluir luchadores en tu tropa ¡O no podrás jugar!\nNo olvides que la única regla importante a la hora de crear un equipo es que no sobrepases el coste de 6.000 puntos.
content.29.141=<b>Estás en la ventana de creación de una tropa en modo cooperativo.</b>\n\nAquí puedes crear una nueva tropa con un amigo que hayas incluido en tu lista de amigos.\n\nNo olvides que la única regla importante a la hora de crear un equipo es que no sobrepases el coste de 6.000 puntos.
content.29.142=<b>Estás en la fase de observación.</b>\n\nEsta fase te permite analizar los luchadores de tu adversario y ver su equipo, sus hechizos y dónde y cómo están situados.
content.29.143=<b>Estás en un reto.</b>\n\nLos retos son combates que no cuentan para ningún ranking, pero con los que puedes aprender a manejar el juego o mejorar tu técnica.\nTambién existen algunos retos previstos para los jugadores experimentados, así que no te preocupes si no los superas a la primera.\n\nEn cualquier caso, nunca perderás nada si no ganas un reto. Sin embargo, al superar algunos retos obtendrás cartas de jefes como recompensa.
content.29.144=Demonio III
content.29.145=Tofu de SuperBidi
content.29.146=¡Oye Men!\n\n¿Qué haces ahí? ¿No has oído hablar de los Hell's Tofus? ¿Les pido ya que preparen tu ataúd o lo dejamos para más tarde?
content.29.147=Hemos llegado al Horamundo y créeme, no es el lugar más acojedor que conozco. 
content.29.148=Corres el riesgo de cruzarte con algunos demonios de las horas en algún rincón. Te aconsejo hacer lo que ellos te dicen. No les gusta demasiado que se les contradiga. 
content.29.149=Bueno, voy a tener que dejarte, no puedo quedarme por aquí mucho tiempo. 
content.29.150=Una última cosa, ¿prefieres utilizar el clic derecho o el izquierdo para desplazarte? (Si algún día cambias de opinión, podrás ir al menú opciones para cambiarlo).
content.29.151=Sólo tienes que atravesar el puente de ahí a la izquierda y seguir el camino. Yo me voy, que por aquí ya empieza a oler a demonio...
content.29.152=¡Hola aventurero! Es increíble lo pequeño que eres. ¿Se te ha olvidado crecer o qué?  Bueno, al menos debes saber quién soy, por las dudas me presento, soy el demonio III y estoy buscando jefes, los más fuertes, ¡los verdaderos! Demuéstrame que no eres un blandengue...
content.29.153=Si no quieres quedarte en esta isla por tiempo indefinido, debes realizar los 3 desafíos que voy a proponerte. A menos que prefieras quedarte aquí hasta el final de tus días, eres tú quien decide...\nPero antes que eso, debes reclutar a tres guerreros. Si no hay guerreros, no hay desafíos ¿de acuerdo? ¿Te ha quedado claro en tu cabeza de chorlito?
content.29.154=Mmm... tienes demasiados luchadores bajo tus órdenes, puedes eliminar a uno de tu equipo seleccionándolo y haciendo un clic sobre la cruz. Ven a verme luego si quieres reclutar a otros.
content.29.155=¡Hey tú! ¿Porqué has mirado mi peinado de esa forma? Soy un yopuka, ¡guerrero belicoso y sin reproches! Nuestro lema es: ¡Atacar y luego reflexionar! O atacar sin reflexionar... no lo sé... 
content.29.156=¡Hola aventurero! Me ha dicho un pajarito que eres nuevo por aquí... Yo soy un ocra, ¡y nadie maneja tan bien los arcos como yo! ¿Quieres que te lo demuestre? ¡Da media vuelta y empieza a correr!
content.29.157=¡Ahí tienes! Un recién llegado...¡Qué hermosa sorpresa! ¿Qué me has venido a traer? ¿Cómo que nada? Soy una anutrofita y los kamas ¡son mi afición! ¿Te molestaría que eche un ojeada dentro de tu bolsa? 
content.29.158=¡Saludos aventurero! Se te nota un poco perdido...no te preocupes, conmigo no corres ningún riesgo. Soy un feca, ¡defensor sin par! Nuestro lema es: ¡Sal siempre protegido!
content.29.159=Qué raro, no recuerdo haberte invocado... ¿Eres nuevo por aquí? Soy un osamodas, invocador y domador de criaturas. ¡Es muy práctico durante un combate! O cuando quiero un nuevo par de botas forradas en piel...
content.29.160=¡Buenos días aventurero! Soy un sram, ladrón y asesino. Bueno, de acuerdo, no es algo de lo que estar orgulloso... ¡Pero te aseguro que puede ser muy útil! Estoy convencido de que el día que desees una joya pensarás en mí...
content.29.161=¡Hey tú! Bienvenido, soy un sacrógrito, también llamado berserker. Cuando mis enemigos me golpean, ¡no hacen más que aumentar mis fuerzas! Por otra parte, ¿tú no querrás golpearme verdad? Hoy me siento un poco débil...
content.29.162=¡Saludos al nuevo! Soy un zurcarák, jugador empedernido. ¡Las grandes apuestas no me dan miedo! Cuando la fiebre del juego me invade, imposible detenerme...por otro lado, ¿qué me dices de una pequeña partida? Amistosa, claro...
content.29.163=¡Bienvenido aventurero! Tu cara no me dice nada... debes ser nuevo por aquí. Soy un aniripsa, mi particularidad es: curar mediante la palabra, y de las grandes heridas me ocupo yo. En resumen, soy ¡el gran remedio! Como dicen por ahí...
content.29.164=¡Bienvenido, joven! Soy un sadida. Cuando no estoy al día con mis ungüentos o venenos ¡juego a las muñecas! Adelante ríete todo lo que quieras, pero si un día tienes que tratar con ellas, no creo que siga pareciéndote divertido...
content.29.165=Te deseo la bienvenida aventurero. Soy un xelor y domino el tiempo. ¿Ralentizar a un enemigo? ¿Teletransportarse? ¡Eso es fácil! Y sí, amigo mío... ¡saber pelear es tan importante como pelear a la hora!
content.29.166=¡Hola! ¡Hip!...aventu ¡hip!...soy un pandawa guerrero y aumento mi fuerza gracias a la ¡hip! Bebida...¡epa! Tó da vueltaaaas...pero si quieres ¡hip! Saber un poco más sobre mí, podemos conversar con unas copillas de por medio, ¡hip!
content.29.167=Bueno, ve a ver a los maestros de clase, ellos te ayudarán. Para encontrarlos, puedes utilizar tu mapa (clic en M).\nSi eres muy perezoso para caminar, puedes reclutar a los guerreros haciendo clic en la interfaz de gestión de equipo (el botón con las dos espadas, F4).
content.29.168=Perfecto, parece que tu equipo sabe lo que hace, ahora vas a poder intentar superar mis 3 desafíos. ¿Estás listo?
content.29.169=¿Te burlas de mi? ¿Y los guerreros que debías traerme? ¿Los has perdido en el camino? Te doy una última oportunidad, pero ésta vez, ¡trata de no perder de vista tu misión! ¡No estamos aquí para divertirnos!
content.29.170=Pepítox
content.29.171=Cikatrin 
content.29.172=Gruñy
content.29.173=Vidow
content.29.174=Patapuf
content.29.175=Estalad
content.29.176=Roger
content.29.177=Litio
content.29.178=Gus
content.29.179=Dazil
content.29.180=Edy Raiser
content.29.181=Gatiel
content.29.182=Como has podido ver, tu interfaz es todavía muy básica. 
content.29.183=Bueno, pareces un poco torpe, así que te lo explicaré: el pequeño rectángulo abajo a la derecha es un chat. Gracias a él podrás comunicarte con otros jefes de tropa como tú. También te servirá para otras cosas, pero eso ya lo verás más adelante... si sobrevives...
content.29.184=Aquí está la interfaz de gestión de tu equipo. Haz clic.
content.29.185=Evidentemente, ¡tu equipo está mas vacío que el cerebro de un yopuka!
content.29.186=Ahora, ve a visitar a los maestros de clases, ellos te permitirán reclutar a tus 3 primeros guerreros. 
content.29.187=Para encontrarlos, debemos dirigirnos al noroeste. Si estás perdido puedes consultar tu mapa, aquí.
content.29.188=¿A qué esperas? ¡Vamos, agiliza un poco! ¡Ya deberías haberte ido! Si me necistas, haz clic en mí. 
content.29.189=¿Qué? ¿Qué es este logro estúpido?
content.29.190=¡Grrrr! Bueno, este icono representa los logros que has realizado en el juego. Durante tus primeros pasos en el Horamundo, aparacerá en varias ocasiones. 
content.29.191=¡Vamos, no pierdas el tiempo! ¡Tus guerreros te esperan más al norte!
content.29.192=Es hora de que te explique en dónde nos encontramos. Qué desorden hay por aquí, ¿verdad?
content.29.193=Esos son los demonios de las horas, nuestros maestros que han construido el Horamundo. Arrancaron de aquí y de allá en diferentes épocas parcelas de distintos mundos de este universo. Es por eso que este lugar parece una inmensa obra en construcción. 
content.29.194=Pero... ¡todavía no has reclutado a tus guerreros! ¡Vamos despierta, no es momento para holgazanear!
content.29.195=¿El demonio III? ¡¿Aquí?! ¡Podemos decir que tienes suerte! Para hablarle, haz clic en él.
content.29.196=El demonio III viene a veces a la isla. Es el que hace las pruebas a los jefes como tú. Si las pasas, podrás acceder al Tótem Arena donde se realizan las pruebas de clasificación para los grandes torneos.
content.29.197=¿Qué me dices de jugar un poco? ¡Te propongo intentar superar los 3 desafíos!
content.29.198=¡Ahhh, por fin! ¡Hemos llegado a los maestros de cada clase!
content.29.199=Cada uno de ellos va a explicarte las características de su propia clase. 
content.29.200=¡Bravo! ¡No te desenvuelves nada mal para ser un principiante! Un pequeño consejo que te podrá ser de utilidad: cuando golpeas a un enemigo de costado, haces un 20% de daños de más y un 40% de daños cuando lo atacas de espaldas. Siempre es bueno saberlo ¿verdad?
content.29.201=Si consigues ganar este nuevo desafío, te hablaré de la experiencia. 
content.29.202=Sin duda alguna ¡tienes un gran potencial! Lo que prueba que no hay que dejarse llevar por las apariencias, ¡jajaja!
content.29.203=Conforme vas realizando combates, los miembros de tu equipo se harán más fuertes y ganarán en experiencia. 
content.29.204=Cierra la ventana de fin de combate y abre tu interfaz de gestión de equipo, voy a mostrarte cómo utilizar esos puntos de experiencia. 
content.29.205=¡Perfecto! Ahora, haz clic sobre el botón "Kanodo" que se encuentra aquí.
content.29.206=¡Muy bien! Tu kanodo representa la evolución de cada guerrero. Como puedes ver, éste aún se encuentra en el punto de partida de su kanodo.
content.29.207=La mayor parte de las esferas ubicadas en el trayecto de tu kanodo te dan bonus. Para obtenerlos, debes aterrizar en estas esferas.  
content.29.208=Para saber de qué bonus se trata, pasa el cursor por encima. Prueba con la primera esfera del kanodo. Luego para seleccionar una esfera, haz clic en ella, pero ya que estás comenzando, voy a hacerlo por ti. 
content.29.209=Como puedes ver, el botón "Comprar" ha aparecido abajo a la derecha, justo debajo del precio en XP de la esfera. 
content.29.210=Sabiendo que tienes 3 XP y que para la primera esfera necesitas 2 puntos de experiencia, puedes comprarla. Sólo debes hacer clic sobre el botón "Comprar". 
content.29.211=¡Perfecto! Tu guerrero tiene ahora ese bonus. Una vez que tengas suficientes puntos de experiencia, podrás comprar el siguiente, y así sucesivamente. Evidentemente cuanto más avanzas en el Kanodo, más potentes son los bonus. 
content.29.212=Pasemos ahora al último desafío del demonio III. No olvides que cada guerrero tiene su kanodo, debes aprovechar la experiencia de cada uno para avanzar en las esferas. 
content.29.213=¡Bien hecho! ¡Ese crujidor merecía una buena lección! Y ahí lo tienes, transformado en polvo. 
content.29.214=¿Has visto eso? El demonio III ha reconocido tu fuerza, ¡te ha dado acceso a las nuevas opciones de interfaz! Vas a poder reclutar hasta 4 guerreros sin tener que ir a ver a los maestros de clase, simplemente haciendo un clic en la interfaz de gestión de equipo. 
content.29.215=Tendrás todo el tiempo necesario para descubrir esas opciones más tarde. La única cosa que debes recordar de momento es que puedes consultar siempre tus logros y tu grimorio. 
content.29.216=Ah sí, el grimorio... es simple, se trata del lugar en donde están guardadas todas las cartas que has ganado, comprado o intercambiado. 
content.29.217=Con las cartas vas a poder, por ejemplo, vestirte. ¡Algo que podría llegarte a ser muy útil! ¡Jajaja! Para mostrar su grandeza, los mejores jefes se visten con sets legendarios. Además, estos sets les otorgan bonus.  
content.29.218=Pero ya veremos eso más adelante, por el momento dejemos este lugar y ¡vayamos al zaap!
content.29.219=¡Y aquí está! Ahora haz clic en el zaap.
content.29.220=Como puedes ver, haciendo clic en el zaap, has abierto tu grimorio de cartas de zaap. Para reunirte con el demonio I, selecciona la categoría "Zaaps de las primeras islas" y haz doble clic en la carta "Guarida del demonio I". Vamos, no te cortes, ¡haz clic!
content.29.221=Bastante simpática la decoración por aquí, ¿verdad?
content.29.222=¡Eso se llama tener suerte! ¡Hemos aterrizado en un buen lugar y en un buen momento! El demonio I se encuentra un poco más allá. Es él quien se encarga de las inscripciones para el gran torneo. 
content.29.223=¡Vamos, no seas tímido! ¡Corre a inscribirte!
content.29.224=Te presento al demonio del minuto 58. Sé prudente, es un buen invocador y golpea fuerte... Para salir sano y salvo de este combate, deberás utilizar las casillas bonus de la arena. 
content.29.225=Cuando un guerrero empieza su turno sobre una casilla bonus, se beneficia de algunos efectos. Esta casilla podrá aportarle PA, resistencia y otras cosas más. 
content.29.226=Utilizadas en el momento oportuno, las casillas bonus de resistencia ¡te conducirán a la victoria!
content.29.227=Ahí tienes, mira, ¡ese pérfido demonio del minuto 52! No es muy poderoso, pero su arena está llena de casillas de trampas. ¡Debes ser prudente! 
content.29.228=Las casillas malus se activan al principio de un turno. Una casilla mortal matará instantáneamente al guerrero, mientras que una casilla trampa le infligirá heridas. 
content.29.229=El demonio del minuto 52 tiene la particularidad de utilizar los hechizos de atracción para arrastrar a los guerreros hacia las casillas de trampas. ¡Ten cuidado! 
content.29.230=Una última cosa, gracias a los hechizos de estabilización, podrás impedirle que te arrastre hacia una casilla de trampa. ¡Piénsalo! 
content.29.231=Él es el demonio del minuto 46. Le llamamos el "sniper". Para vencerlo, avanza hacia él protegiéndote gracias a los obstáculos y ¡mantente atento a tus cartas de eventos!
content.29.232=Tus cartas de eventos aparecen arriba a la derecha de tu pantalla. La primera es aquella que se activa para el turno actual. Ella aportará beneficios o perjuicios a todos los guerreros presentes en el combate. 
content.29.233=Las dos otras cartas de eventos se activarán en el próximo turno. ¡El secreto de un buen jefe es echarles siempre una ojeada para preparar la mejor estrategia!
content.29.234=Para este desafío, deberás utilizar las cartas de eventos que podrán ser de tu beneficio. No olvides esconderte bien cuando las cartas del demonio del minuto 46 aparezcan. 
content.29.235=Te presento al demonio del minuto 25. Que aunque parezca un enclenque es rápido y muy fuerte. 
content.29.236=Para vencerlo debes utilizar las cartas de acción. Se trata de hechizos especiales utilizables una sola vez por combate y por cualquiera de tus guerreros. 
content.29.237=No voy a mentirte, en el combate que te espera, todo se jugará en el primer turno. ¡Tu victoria depende del buen uso de tus cartas de acción!
content.29.238=Es tiempo de pasar a cosas más serias... ¡Vas a tener que comenzar a aplicar todo lo que yo te he enseñado!
content.29.239=Un último consejo: intenta situar bien el objetivo al que debes atacar primero. 3...2...1.... ¡Buena suerte! 
content.29.240=¡Felicidades! ¡Estoy realmente impresionado!
content.29.241=Ahora estás listo para atacar a otros jefes. Pero antes debes confirmar tu inscripción con el demonio I. 
content.29.242=Bueno, ya es hora de pasar a las cosas serias. Necesitas un adversario para empezar a hacerte un nombre. Para eso, abre tu interfaz de gestión de equipo. 
content.29.243=Cada vez que quieras encontrar un combate del gran torneo, debes hacer clic en el botón de interfaz de gestión de equipo y, luego, hacer clic en "Luchar". Puedes hacerlo donde sea que te encuentres. No dudes en aventurarte en las otras islas, ¡hay magníficos lugares que visitar! 
content.29.244=El gran torneo va a permitir aumentar tu popularidad. Si ganas un gran número de combates podrás convertirte en el jefe más popular del gran torneo. 
content.29.245=Para ver aparecer la clasificación de los mejores jefes de la temporada, haz clic en el botón "Clasificación".
content.29.246=Para que tu nombre aparezca en la clasificación, deberás estar entre los 2000 mejores jefes. El botón "Jefe" te permitirá conocer tu posición exacta.
content.29.247=No olvides que tus guerreros no son inmortales, ¡y necesitan mucha atención!
content.29.248=A veces es necesario dejarlos descansar en el banquillo, ya que si no pueden fatigarse o incluso lastimarse. 
content.29.249=Ocúpate también de su estado de ánimo. Para eso, asegúrate de que no pierdan demasiados combates y que no queden KO muy a menudo. ¡Evita también olvidarlos en el banquillo!
content.29.250=Hablaremos de ello más tarde. Ya es hora de que vayas a explorar las demás islas. Cuando te sientas preparado, podrás lanzar un combate en el gran torneo.
content.29.251=Entonces, ¿quieres probar fortuna en el gran torneo? Has llegado en el momento justo, hemos tenido muchas pérdidas estos últimos tiempos, ¡un poco de sangre nueva no nos vendrá nada mal!
content.29.252=Para validar tu inscripción, debes pasar las pruebas de clasificación. ¡Al público no le interesa perder su tiempo con debutantes!
content.29.253=Si consigues vencer a los otros cinco demonios presentes en la isla, podrás irte con el pase al gran torneo en tus manos. 
content.29.254=He escuchado decir que has triunfado venciendo a los cinco demonios de los minutos, ¡bien hecho! ¡Dame cinco! ¡Ah, pero si ya lo has hecho! ¡jajaja!
content.29.255=Mmm... bueno, has demostrado que eres digno de participar en el gran torneo. ¡Te daré el pase en seguida! Toma esta carta de zaap, te permitirá entrar en las otras islas. 
content.29.256=¡Muy bien! ¡Has sobrevivido! No eras tan blandito como parecías... Jajaja ¡es broma!
content.29.257=Pareces nervioso...¿un poco enfermo quizás? No te preocupes, muchos otros han pasado por aquí antes que tú, incluso ha habido supervivientes...
content.29.258=Mm... bueno, si quieres ganar tu libertad, ¡vas a tener que demostrar tu fuerza y coraje!
content.29.259=¡Siento que vamos a divertirnos mucho tú y yo! Voy a ayudarte a dar tus primeros pasos en la arena, estoy ansioso de ver cómo te desenvuelves. 
