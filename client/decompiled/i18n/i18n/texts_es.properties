challengeHelpDescription32=Has aguantado 10 segundos, pero puedes hacerlo mejor. Es necesario utilizar las cartas de acción de tu jefe. Tienes tres. Viento repulsivo empuja a un adversario. Si observas bien, el demonio de abajo se encuentra justo delante de la casilla mortal, empújalo hacia ella. La carta relámpago cuenta con un gran alcance, lo que te permitirá alcanzar el doble. La carta aceleración te hará ir mucho más rápido.
challengeHelpDescription33=Bueno, voy a ayudarte, porque no es algo que lo sepan todos. El primer cristal que debes matar es el regenerante, a la izquierda. Pero para alcanzarlo debes prestarle atención al cristal de potencia que lo protege. Intenta utilizar las habilidades de tus personajes, como: invisibilidad, salto, aceleración, ralentización o tiro tranquilizante para pasar sin ser herido.
challengeHelpDescription34=¡Ay, ay, ay! ¡Es grande y hace daño! Te voy a dar un consejo: en el mapa puedes ver dos casillas marrones además de las estrellas amarillas. Si tus personajes comienzan su turno sobre esas casillas, ganarán muchos puntos de daños, y deberán matar rápidamente al gran demonio.
challengeHelpDescription35=Has caído en las trampas del demonio del minuto 52. Tu objetivo es hacer pasar un solo personaje, una vez que hayas llegado al demonio, él no te atacará y podrás matarlo fácilmente. ¿Por qué no te colocas en la casilla del medio...? Intenta dejar a un personaje encima de ella, por ejemplo. Sí, sí, confía en mí. 
challengeHelpDescription36=¡¡Ponte a cubierto!! ¿Cómo quieres ganar contra un arquero si te quedas en medio de la arena como una gran manzana roja? Deberías acabar siempre tu turno detrás de un árbol. Para ayudarte, hay cartas de eventos bonus. Cada 6 turnos, tus guerreros ganarán puntos de movimiento. Aprovecha ese turno para pasar de un árbol a otro. 
challengeHelpDescription45=Esta vez no lo has conseguido, ¡pero no desesperes! Utiliza en el momento oportuno las casillas bonus y evita los ataques simultáneos de los cristales. Si con eso no basta, ¡entrena a tus guerreros y vuelve a enfrentarte a ese maldito demonio con un máximo de bonus a los daños!
