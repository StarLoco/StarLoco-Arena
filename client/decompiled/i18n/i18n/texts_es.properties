content.20.163=Efecto: Aumenta en 10 el total de puntos de vida de los aliados y sufre 35 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/FIRE.tga" align="west"></image> de vuelta.\nCrítico: Aumenta en 12 el total de puntos de vida de los aliados y sufre 30 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/FIRE.tga" align="west"></image> de vuelta.
content.20.164=Efecto: hace perder el 20% de la vida al objetivo (daños neutros).\nCrítico: hace perder el 25%  de la vida al objetivo (daños neutros).\nObjetivo: libre.
