content.26.48=Estas cartas deben utilizarse directamente después de la muerte de un guerrero o en el cementerio para resucitarlo de entre los muertos.
content.26.49=Encuentra el lanzador y haz tus propias composiciones variando los colores y los tipos de hadas artificiales. 
content.26.51=Los demonios se reunieron un día para prohibir la épeho, dados sus efectos demasiado poderosos. Afortunadamente, jamás se pusieron de acuerdo. La pócima de épeho despierta a un muerto de cansancio.
content.26.52=Motiva a tu clan gracias a estos bonitos estandartes. Durante el próximo combate, todos los miembros de tu gremio ganarán un bonus. Atención, dos estandartes no pueden estar activos al mismo tiempo.
content.26.53=¿Estás en baja forma y con la moral por los suelos? Con una pócima Arena Max nada te detendrá. Arena Max: ¡la bebida de los valientes!
content.26.54=Pócimas que puedes utilizar si quieres aumentar tus posibilidades de ganar buenas cartas al final de un combate. Las pócimas A, Re y Na son las únicas que pueden ser utilizadas todas al mismo tiempo. 
content.26.55=Las runas sirven para desbloquear candados en el kanodo de tus guerreros. Además, durante algunos combates, aumentarán sus capacidades. Las runas menores son utilizadas para los candados centrales de todos los kanodos. 
content.26.56=Las pócimas de experiencia te permiten darle un empujoncito a uno de tus guerreros. Muy práctico si decides reclutar a un guerrero principiante. 
content.26.57=Gracias a este set fantasmático, ¡tus amigos pensarán que tienes poderes para-anormales! 
content.26.58=Con este set encima, podrás controlar a los jalatós... o quizás sólo consigas que te corneen ¡por haber desollado a su jefe!
content.26.59=Un set para todos aquellos que quieren mostrar su riqueza ostensiblemente...¡o para todos aquellos que sueñan con que alguien les robe!
content.26.60=Si eres un partidario del desequilibrio, éste set ha sido hecho para ti. Si eres un desequilibrado...también. 
content.26.61=Las pócimas elementales aumentan los daños de uno de tus personajes en un elemento y durante 3 combates. Atención, todas estas pócimas también tienen un efecto negativo a tener en cuenta.
content.26.62=Cada una de estas pócimas permite proteger a uno de tus guerreros contra un elemento en particular, y durante 3 combates. Atención todas estas pócimas también tienen un efecto negativo a tener en cuenta. 
content.26.63=Pequeñas pócimas para aumentar las capacidades de un guerrero. Atención, todas estas pócimas también tienen un efecto negativo a tener en cuenta.
content.26.64=Unas pócimas para aumentar las capacidades de un guerrero. Atención, todas estas pócimas también tienen un efecto negativo a tener en cuenta. 
content.26.65=Buenas pócimas para aumentar las capacidades de un guerrero. Atención, todas estas pócimas también tienen un efecto negativo a tener en cuenta. 
content.26.66=Magníficas pócimas para aumentar las capacidades de un guerrero. Atención, todas estas pócimas también tienen un efecto negativo a tener en cuenta. 
content.26.67=¿Polvo de ángel en el Horamundo?\nEstá prohibido por los demonios de las horas, y todo el que lo utilice corre el riesgo de ver caer su reputación. Pero es realmente poderoso...¿Quién podría resistirse a probarlo?
content.26.68=Estas pócimas permiten curar todas las heridas leves de un guerrero. Atención, todas estas pócimas también tienen un efecto negativo a tener en cuenta. 
content.26.69=Estas pócimas permiten curar todas las heridas graves de un guerrero. Atención, todas estas pócimas también tienen un efecto negativo a tener en cuenta. 
content.26.70=Estas pócimas permiten curar todas las heridas leves de un luchador. Atención, la mayoría de estos elixires también tienen un efecto negativo a tener en cuenta. 
content.26.71=Estas pócimas permiten curar todas las heridas graves de un luchador. Atención, la mayoría de estos elixires también tienen un efecto negativo a tener en cuenta. 
content.26.72=Estos hechizos permiten curar las heridas leves de todo el equipo. Atención, todos estos hechizos también tienen un efecto negativo a tener en cuenta. 
content.26.73=Estos hechizos permiten curar las heridas graves de todo el equipo. Atención, todos estos hechizos también tienen un efecto negativo a tener en cuenta. 
