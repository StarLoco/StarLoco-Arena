content.6.1=Esta clase posee los hechizos de protección más eficaces. Un maestro de este gremio puede atravesar campos de batalla sufriendo los asaltos más violentos y llegar a salir indemne. Feca respeta mucho a sus fieles y los protege tanto de los golpes de sus enemigos como de las inclemencias y enfermedades. 
content.6.2=Los discípulos de esta clase entrenan criaturas y las equipan para que peleen en su lugar. Los osamodas poseen un perfecto conocimiento de la naturaleza. 
content.6.3=Los discípulos de Anutrof no son muy duchos en el arte del combate, pero con el tiempo pueden convertirse en temibles adversarios gracias a su equipo. 
content.6.4=Los discípulos de Sram son los individuos más ladinos del mundo de Amakna. Son ladrones sagaces que lo único que respetan es al dios Sram.
content.6.5=Los discípulos de Xelor juegan con las distorsiones del tiempo. Pueden ralentizar o acelerar a sus enemigos y aliados si lo desean. Su dios Xelor, al parecer, tiene forma de reloj. 
content.6.6=Los discípulos de esta clase son jugadores natos y son capaces de arriesgar hasta su propia vida por amor al juego. Siempre corren el riesgo de que sus hechizos se vuelvan en contra de ellos mismos. 
content.6.7=El principio de los hechizos de estos curanderos es el uso de la palabra. Por lo tanto la mayoría funcionan si el alcance permite al enemigo oír el hechizo. 
content.6.8=Yopuka, dios de la potencia y del poder, desprecia a los débiles. Por eso sus discípulos actúan sin esperar la intervención divina. 
content.6.9=Precisión, agilidad y destreza son las principales palabras para describir a esta clase. Sus discípulos son sencillamente arqueros conversos.
content.6.10=La clase Sadida está compuesta por curiosas criaturas que duermen 23 horas al día y viven en armonía con la naturaleza. 
content.6.11=Los discípulos de la diosa Sacrógrito tienen un perfecto conocimiento del dolor y sus técnicas de combate se basan en la voluntad y la resistencia. 
content.6.12=El discípulo de Pandawa obtiene su legendaria fuerza mediante el consumo de bebidas fermentadas. Su espinazo flexible y sus hombros sólidos le permiten cargar dos veces su peso. El pandawa no duda en levantar a sus aliados del suelo para protegerlos o en mandar a su enemigos por los aires para lastimarlos (o matarlos, los días que están en mejor forma).
content.6.13=Los tymadores son maestros del engaño y la traición. Atacan a distancia, sobre todo mediante las bombas que pueden hacer explotar en cadena, y poseen hechizos que les libra de quedar atrapados en el cuerpo a cuerpo.
content.6.14=Los zobals coleccionan y utilizan máscaras, que son la fuente de sus poderes. Cada máscara les proporciona poderes diferentes, por lo que deben cambiarlas con astucia durante los combates para pasar de ser un guerrero berserker en el cuerpo a cuerpo a un cobarde que se resguarda a distancia.
