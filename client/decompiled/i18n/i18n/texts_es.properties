content.59.42=El Horamundo es un enlace entre diferentes lugares y épocas. Desde Arena puedes enviar ciertos objetos a DOFUS o a Wakfu. Si participas en torneos, podrás ganar fichas que permiten comprar, por ejemplo, ítems DOFUS.
content.59.44=Toma, una carta de zaap que te llevará a la guarida del demonio I (para utilizarla, haz clic en el zaap y luego elige la carta de la guarida del demonio I). Él podrá enseñarte tácticas útiles para tus próximos combates.
content.59.45=Hola. \n\nCuando estaba vivo, era un campeón del modo élite. ¿Qué quieres saber?
content.59.46=El modo élite está reservado a los jefes que hayan conseguido dominar todos los hechizos y objetos equipables del juego. En el modo élite, dispones de un capital de 6000 puntos para crear tu equipo y atribuir a los guerreros tanto hechizos como equipo. Incluso si debutas en el modo élite, tienes tantos puntos como el mejor de los jugadores de élite y accedes a los mismos hechizos y equipo que él. En el modo élite, todo el mundo combate al mismo nivel. \n\nTu nivel en el modo élite aumenta cuando ganas combates y disminuye cuando pierdes. Gracias a este nivel, los demonios intentarán encontrarte un adversario de tu talla.  
content.59.47=En la interfaz de gestión equipo, haz clic en la pestaña "Élite". Podrás ver tres equipos prehechos que te permiten entrenar un poco y comprender mejor cómo se hacen los equipos. \n\nHazte un nuevo equipo cuando te sientas listo. Luego, añade guerreros a este equipo haciendo clic en "Reclutar". \n\nNo olvides que dispones de 6000 puntos de capital, ni uno más, por lo que tendrás que elegir entre 2 o 3 guerreros muy bien equipados con muchos hechizos o 5 o 6 no tan bien equipados pero que se beneficiarán de la ventaja del número.
content.59.48=Muy bien, tengo dos desafíos perfectos para ti. \n\nEn el primero, tendrás prestar mucha atención a dónde te colocas en la arena y usar las curas de tu aniripsa en el momento oportuno. \n\nEn el segundo, tendrás que coordinar perfectamente a los miembros de tu equipo y sus capacidades para vencer a tus enemigos.
content.59.49=Cuantos más <b>combates seguidos</b> ganes, más aumentan tus posibilidades de conseguir cartas al ganar un combate. Obviamente, las cartas serán más raras y preciosas cuanto mayor sea tu <b>nivel</b>.
content.59.50=Hola. \n\nEstoy aquí para ayudarte a entender el modo evolución. ¿Qué quieres saber?
content.59.51=El modo evolución es el mejor si acabas de llegar al Horamundo. Gracias al kanodo, desbloquearás poco a poco hechizos y objetos equipables para cada uno de tus guerreros, por lo que es más fácil aprenderlos y formar tu primer equipo.
content.59.52=En evolución, solo dispones de un equipo y un banquillo de sustitutos. Crea directamente a tus guerreros en este equipo gracias a los botones de reclutamiento. \n\nSi quieres modificar tu equipo, pon a los guerreros que quieras en el banquillo y recluta otros nuevos en su lugar o haz subir a los que antes estaban en el banquillo.
content.59.53=El <b>kanodo</b> representa el aprendizaje de un guerrero. Está compuesto de esferas que hay que comprar con los puntos de experiencia ganados en combate. \n\nSolo podrás comprar la próxima esfera directa en el camino a aquella en la que esté situado el cursor de progresión (que está representado por la cabeza del guerrero). Las esferas, ya compradas, dan bonus que pueden ser, o bien un aumento de una característica, un nuevo hechizo o un conjuto de objetos equipables que se desbloquea para ese guerrero. Atención, también hay esferas que dan malus, lo que representa un sacrificio que el guerrero debe hacer para avanzar en su aprendizaje. \n\nTambién existen esferas especiales como las esferas de portal que te teletransportan a otro punto del kanodo, o esferas de obstáculo que exigirán que sacrifiques una carta para desbloquear el paso.
content.59.54=Si has escuchado lo que te hemos dicho sobre el modo evolución, sabrás que tus guerreros pueden salir heridos y, por lo tanto, deben ser curados. Un guerrero que no se haya curado recibe malus en combate y hay muchas posibilidades de que su herida se agrave.
content.59.55=Ganar cartas en el modo evolución es completamente diferente. En el modo evolución, dispones de bonus para mejorar la posibilidad de encontrar cartas (colección), por un lado, y la posibilidad de que sean raras (prospección), por otro. \n\nEstos bonus se encuentran, sobre todo, en los sets con los que te equiparás. Además, cuanto más alto sea tu nivel y más combatas en ligas más elevadas, tendrás más posibilidades de recibir más cartas si ganas. \n\nEn modo evolución es generalmente más fácil recibir cartas que en los otros modos, lo cual es lógico si pensamos que, a su vez, hay que usarlas -para curarse, por ejemplo.
content.59.56=¡Hey!  \n\nAntes de que me preguntes: No, no es mi doble, es mi gemelo. Somos los hermanos Noctis y ¡juntos éramos los campeones del modo 2vs2! ¿Qué quieres saber?
content.59.57=El modo 2vs2 te permite crear un equipo de élite con un amigo y compartir el control de los guerreros para dirigirlos juntos en la arena. Este modo es muy divertido porque os exige a ti y a tu compañero de equipo conoceros muy bien y ser capaces de comunicaros rápidamente si queréis ganar.
content.59.58=En la interfaz de gestión de quipo, haz clic en la pestaña 2vs2. Crea tu nuevo equipo haciendo clic en uno de los botones de creación de la parte inferior de la ventana. Para validar la creación de tu equipo, debes elegir a un amigo que se encuentre en tu lista de amigos con el que quieras compartirlo y darle un nombre a este equipo. Luego, añade guerreros al equipo haciendo clic en "recrutar". \nNo olvides que dispones de 6000 puntos de capital, ni uno más, por lo que tendrás que elegir entre 2 o 3 guerreros muy bien equipados con muchos hechizos o 5 ó 6 no tan bien equipados pero que se beneficiarán de la ventaja del número. Finalmente, antes de jugar, sólo tienes que usar el botón de atribución de guerreros para compartirlos y ¡a jugar!
content.59.59=Cuantos más <b>combates seguidos</b> ganes, más aumentan tus posibilidades de conseguir cartas al ganar un combate. Obviamente, las cartas serán más raras y preciosas cuanto mayor sea tu <b>nivel</b>.
content.59.60=¡Hey, hola! \n\nVen a ver a este viejo gostofo anutrof que fue un temible rival en los torneos de otro tiempo. ¿Qué quieres saber?
content.59.61=El modo torneo es un modo aparte. Voy a explicarte un poco de este modo, ¡pero no le hinques el diente antes de haber dominado al menos uno de los otros modos! \n\nEn el Horamundo se organiza un torneo, al menos, una vez al día y normalmente se desarrolla a unas horas precisas. Puedes ver todos los torneos previstos haciendo clic en el icono del calendario en la parte inferior de tu interfaz. \n\nLa particularidad de los torneos es que las reglas de los combates cambian de uno a otro: el capital puede cambiar, algunos hechizos pueden estar prohibidos, u otras muchas cosas más. \n\nPara participar en un torneo, te tienes que inscribir y luego crear un equipo que pueda participar. Cuando llegue la hora, podrás seleccionar el torneo y tu equipo y lanzarte a la búsqueda de un adversario desde tu propia interfaz.
content.59.62=Para inscribirme en un torneo, tienes que ir a la isla de los torneos y hacer clic en el tótem de torneos, o bien usando tu calendario haciendo clic en su icono en la parte inferior de tu interfaz. \n\nLos torneos tienen periodos de inscripción variables: a veces tendrás que inscribirte obligatoriamente antes de tal o cual fecha. \n\nPara otros torneos, necesitarás dar una carta como pago por tu inscripción. Estos torneos suelen ofrecer recompensas mucho más interesantes. \n\nPor último, algunos torneos no son accesibles para todos, pueden ser privados y reservados a un gremio o a los mejores jugadores. Por lo tanto, lee bien la descripción de un torneo para conocer las modalidades de inscripción.
content.59.63=¡Me gusta tu espíritu!\n\nAl participar en torneos, ganarás <b>fichas de torneo</b>. En la <b>isla de los torneos</b>, podrás cambiar esas fichas por <b>cartas exclusivas</b>.\nEntre esas cartas, algunas te permitirán <b>enviar objetos</b> a juegos de Ankama, como <b>DOFUS</b>. Por ejemplo, puedes enviar pergaminos de características o de hechizos, ¡o incluso el famoso set del Campeón!
content.59.65=Bienvenido a mi isla. \n\nSoy el demonio I. Si quieres un aprendizaje avanzado de combate, ve a ver a mis sirvientes, los demonios de los minutos.
content.59.66=Es muy simple lanzar un combate: sólo necesitas hacer clic en el botón <b>"Gestión de equipo"</b>, con el que abrirás una ventana en la que podrás administrar todos tus equipos. \n\nEl modo de juego por defecto es el modo evolución, pero puedes administrar otros equipos en otros modos de juego haciendo clic en las correspondientes pestañas en la parte superir de la ventana. \n\nUna vez que hayas seleccionado el modo de juego, sólo tienes que crear tu equipo y reclutar guerreros antes de hacer clic en "Luchar" para que los demonios se encarguen de buscarte un adversario de tu talla.
content.59.69=Oui, effectivement n'oublie pas de bien <b>orienter</b> tes combattants après chaque <b>mouvement et attaque</b> pour ne pas te retrouver désavantagé.\nMais tu peux aussi tirer <b>profit</b> des placements de tes adversaires !\n\nUne attaque de dos inflige <b>40%</b> de dégâts supplémentaire.\nEt une attaque de coté <b>20%</b> de dégâts supplémentaire donc n'hésite pas a être <b>fourbe.</b>\n\nPar contre les dégâts de zone ou neutres ne bénéficient pas de ce bonus.
content.59.70=Blou 
content.59.71=Nouveau message
content.59.72=pour créer un retour de dialogue, il faut:\n-sélectionner le dialogue sur lequel on veux retourner\n-le copier\n-sélectionner le dialogue sur lequel on veux une réponse qui crée un retour\n-et coller
content.59.73=Nouveau message
content.59.74=Le sujet est vaste.\nQue veux-tu savoir précisément ?
content.59.75=Il existe quatres types de cartes en fonction de leur rareté, qui sont représentées par quatres couleurs différentes.\n\n- <b>Noir</b>, qui représente les cartes les plus banales.\n- <b>Cuivre</b>, pour les cartes communes.\n- <b>Argent</b>, symbolisant les cartes rares.\n- <b>OR</b>, qui est réservé aux cartes Ultra-rares.
content.59.76=Ici, tu te bat contre d'autres <b>joueurs</b> !\n\nNe t'étonne pas donc, si tu <b>perd</b> tes premiers matchs le temps de te faire la main.\nMais la victoire n'en sera que plus savoureuse !
content.59.77=Les kards représentent la totalité des <b>biens matériels</b> du jeu.\n\nElles forment ton <b>équipement, les compétences de tes combattants, ton argent</b>, etc.
content.59.78=Effectivement, chaque kard à une valeur en <b>kamas</b>, et fait office de monnaie.\nTu peux donc t'enrichir en collectionnant les kards.\n\n<b>C'est tellement plus simple de payer par carte de nos jours, tu sais.</b>
content.59.79=Pas toutes banane !\n\nCertaines kards sont effectivement des <b>morceaux d'armure</b>, et tu peux les équiper comme tel.\nDis toi qu'une kard est juste un <b>support</b> qui te permet d'indexer plus facilement ce que tu possède ! Tu ne revêt pas la carte évidemment !\n\nCependant fait <b>attention</b> au <b>niveau</b> de la kard ! même si tu revêt une pièce d'armure qui demande un niveau 15 par exemple, et que tu es niveau 10, tu ne <b>bénéficie pas</b> des bonus relatifs à celle-ci !\nMais ça ne t'empêche pas de le porter.
content.59.80=Il existe <b>beaucoup</b> de manières d'obtenir une kard.\n\n- La plus courante, est grâce aux <b>boufteurs</b> que tu peux récupérer sur le site en échange de quelques ogrines.\n- En mode évolution, à chaque fois que tu <b>gagne</b> un match, tu as une chance de gagner une Kard relative à ton niveau.\n- Tu peux aussi faire des <b>échanges</b> avec d'autres joueurs, et gonfler ta collection\n- Il existe certains <b>challenges</b> qui permettent d'en gagner !\n- Pour obtenir certaines kards rares tu dois aller en acheter chez un <b>kard master !</b>\n- Sinon tu as aussi les <b>Autels de fusion</b>, qui vont te permettre de créer des cartes que d'autres joueurs ne connaissent peut-être pas.\n- Et pour finir, tu peux obtenir des Kards inédites en participant à des <b>tournois !</b>
content.59.81=En cierto modo, los Kardmasters son <b>vendedores</b> de cartas. Podrás encontrarlos diseminados a través del Horamundo.
content.59.82=¡Voy a explicártelo todo en detalle!\n\nEl altar de fusión permite <b>obtener</b> una carta a cambio de <b>sacrificar</b> otras cartas, siguiendo una receta predefinida o, a menudo, <b>¡desconocida!</b>\nPor esta razón, debes <b>probar</b> suerte para encontrar las recetas exactas.\n\nCada altar de fusión es <b>diferente</b> y más o menos <b>poderoso</b> en función de la zona en la que esté. En una zona de nivel muy alto, un altar de fusión boosteado al máximo, puede ser tan poderso que puede tener una tasa de éxito de ¡<b>100%</b>!\n\nPero el porcentaje de éxito de una fusión depende de muchos criterios, así que te voy a explicar cómo funciona.\n\nExisten <b>cartas de fusión</b>, que se han concebido especialmente para <b>boostear</b> los altares, por lo que, por ejemplo, si deseas hacer una fusión con cartas de nivel muy alto, no solo necesitas un altar <b>extremadamente poderoso</b>, sino también una carta de fusión que <b>boostee</b> tus posibilidades de éxito.\n\nLo que debes recordar es: cuanto más poderosa sea la fusión que quieres, más difícil es conseguirla. ¡Así que tienes que asegurarte de tener todas las probabilidades posibles contigo!\n\nDicho esto, si no consigues una fusión, no pierdas la esperanza. En función de la potencia del altar, tienes una oportunidad de recuperar las cartas utilizadas.\n\nPero recuerda que las cartas más poderosas solo pueden obtenerse de esta manera y, quién sabe, puede que te encuentres con una carta única jamás vista.
content.59.83=Le tacle est une compétence que <b>chaque combattant possède</b>, il permet d'avoir une chance de <b>bloquer le mouvement</b> d'un adversaire si il passe près de toi, et lui faire <b>passer son tour.</b>\n\nLe tacle est influencé par deux caractéristiques des combattants,<b> l'esquive, et le blocage !</b>\nL'esquive te permet de <b>réduire</b> tes chances de te faire bloquer par un adversaire.\nTandis que le blocage te permet d'avoir <b>plus </b>de chance de bloquer celui-ci.\n\nSi tu veux savoir combien de chances tu as d'esquiver un tacler sur une case, tu dois <b>placer</b> le curseur sur la case en face du combattant qui doit se déplacer. tu auras un nombre qui s'affichera.
content.59.84=El <b>grimonio</b> de cartas permite <b>consultar</b> fácilmente qué cartas posees y cuáles no.\n¡También te permite administrar tu <b>equipo</b> de jefe!\n\nTiene otra particularidad más: contiene una <b>enciclopedia</b> de todas las clases y sus hechizos, de todas las invocaciones posibles y de todas las cartas de acción utilizables en comabte.\n\nDicho de otro modo: ¡es <b>indispensable</b>!\n\n¿Que no sabes dónde está? ¡Lo encontrarás justo debajo del botón de gestión de guerreros! ¡El gran botón anaranjado que hay ahí abajo!
