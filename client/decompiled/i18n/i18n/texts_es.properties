content.26.1=Sedforme, el set de la gente a la que no le importan las formas.
content.26.2=El Set Rompedor perteneció a Tumah Dré durante mucho años, pero con el cambio de manos casi temabién le cambia el nombre de Rompedor a roto...
content.26.3=Krono siempre estaba corriendo de aquí para allá. Por eso, para no llegar tarde por las mañanas, siempre se vestía con lo mínimo.
content.26.4=Este set no debe, en ningún caso, llevarse del revés... salvo si eres un osamodas.
content.26.5=Relájate, ponte un Jalatranki y recuerda lo que dice el dicho: "No siembres ni comas hierbabuena en tiempos de guerra"
content.26.6=Es el set preferido de los ciegos a los que les gusta pesar los pros y los contras antes de cortar la pera en dos.
content.26.7=Conejo o coneja, varias veces por hora en menos de 30 segundos, ¡Eso hace un montón de zanahowias!
content.26.8=¿No tienes ni un pelo en el pecho? ¡El set Barbararo está pesnado para ti! y para todos los imberbes que se ceban a testosterona.
content.26.9=La Palabrería sería, originariamente, una unidad de caballería que se decidió a cambiár sus lanzas por palas de combate.
content.26.10=Un poco de gelatina, un molde y ¡Hop! Ya tienes un escudo antilaser vivo.
content.26.11="Kam kam" hace la lengua putrefacta del Chaferombi antes de cargar contra el enemigo.
content.26.12="¡Tus cartas o la vida!", gritan los salteadorillos en los caminos sinuosos.
content.26.13=Una estaca, una parrilla, o un simple hierro caliente. El Ferdugh'O siempre tiene lo necesario para atormentar a los invitados de tus fiestas entre enemigos.
content.26.14=Simepre hay que apoyarse en un Campiñón para ganar en cualquier deporte.
content.26.15=¡Enrólate! -decían- ¡Acabrás siendo caballero!
content.26.16=¡Comamos, zampemos, devoremos y saboreemos al bufón!
content.26.20=¡Has ganado un tornéo en la Isla de los Avatares! Así que has ganado el derecho a llevar puesto este prestigioso set.
content.26.22=¡Has ganado un tornéo oficial de Arena! Así que has ganado el derecho a llevar puesto este prestigioso set.
content.26.23=Grilembore era un gran estratega, un maestro de la magia marcial. Él fundó la escuela que lleva su nombre, para que niños de los cuatro rincones del Mundo pudiesen liarse a sopapos, puntapiés y guantazos según las reglas del arte. ¡Qué gran hombre!
content.26.25=Probablemente, L.Men'Tal sea el mayor detective de todo Amakna. Acompañado de su amigo, el doctor Keíjo, él fue quien resolvió el célebre misterio del wauwau de los Allisterville.
content.26.26=Premio para los campeones de los torneos del Dragón Blanco
content.26.27=El set de todo vampyro que se precie.\nCon él, no solo darás miedo a tus enemigos, sino también a tus amigos.
content.26.28=El jálabol es un poco como un combate en la arena, ¿no? Pero con una jalabola de por medio...
content.26.29=Las cartas de emoticonos te permiten expresarte de una manera más... física.
content.26.30=Estas cartas te permitirán utilizar los zaaps de cada isla. Haz clic derecho en un zaap y doble clic en la carta que indica tu destino. 
