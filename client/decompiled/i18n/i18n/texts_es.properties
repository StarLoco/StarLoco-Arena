content.20.167=Efectos: El objetivo gana + 15% <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/ALL.tga" align="west"></image> (1 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>).\nCrítico: El objetivo gana + 20% <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/ALL.tga" align="west"></image> (1 <image pixmap="jar:file:contents/gui.jar!/gui/miscellaneous/elements/TURN.tga" align="west"></image>).\nUso: Un objetivo sólo puede beneficiarse dos veces por turno de: "Amplificación".
