content.4.187=Este hechizo también es conocido como la maldición del "¡Mal rayo te parta!", aunque este rayo sí que dejará tieso a más de uno.
content.4.188=No funciona como una pata de cunejo, que siempre reparte suerte. La Pata de Zurcarák es "doble o nada" así que, ¡a tu cuenta y riesgo!
content.4.189=Ahora te desplazas más rápido que los demás. ¿Cómo? ¿Que además quieres que tus movimientos sean gráciles y delicados como los etéreos saltos de una bailarina? Ya, y yo quiero un apartamento en la quinta avenida con Broadway.
content.4.190=¡Es la hora de las tortas! Ahora vas a poder destacar por la bravura y corage de tus gestas. O al menos eso es lo que de ti se espera...
content.4.191=Alcanzar más lejos para golpear antes al enmigo y masacrar su filas sembrando muerte y destrucción. Cuando lo piensas, la vida de un guerrero es de lo más aburrido ¿No?
content.4.192=Espero que seas un experto en el arte de la curación, así tus habilidades se habrán mejorado considerablemente. Si no es el caso, considérate afortunado de no recibir sobre tu cabeza la furia de los Doce.
content.4.193=¡Rictus Arghísimo! ¡Slurpación tóxica! ¡Sensación Glupesca! ¡Te han envenenado!
content.4.194=Este hechizo contiene un poder más repulsivo que el olor de un milubo en celo... Puede serte muy práctico si te gustan los arrumacos de milubo.
content.4.195=Además de ser agradable y placentero, el viento atrayente te permititrá acercar a un enemigo para que lo despieces más cómodamente sin moverte del sitio ¡y sin perder la sonrisa!
content.4.196=Esta muñeca está que revienta en deseos de jugar a los kamikazes... Vamos, que va a explotar de alegría cuando sea su turno.
