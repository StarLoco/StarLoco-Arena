content.4.3=Esta flecha se clavará en cualquier enemigo, y además suele buscar las partes más carnosas de su anatomía.
content.4.4=Especial para los adversarios más resistentes. ¡Pega duro!, ¡Pega fuerte! y ¡Pega mento!
content.4.5=La espada del destino se llama así porque es una maestra en acelerar el destino final de tus adversarios.
content.4.6=Nada mejor que un salto para salir de un mal trago o atacar tranquilamente.
content.4.7=Vitalidad es energía, es salud, es vida, pero sobre todo ¡Es genial!
content.4.8=¡Aprovecha la legendaria valentía de los yopukas!
content.4.9="Para ser fuerte hay que saber sufrir" (antiguo proverbio Yopuka)
content.4.10=A veces la victoria pende de un hilo, o más bein de una moneda. La derrota también, por cierto. Y si no me crées, ¡Pruéba tú mismo!
content.4.11="Astuto como un gato" es una expresión muy utilizada, sobre todo por los zurcaráks.
content.4.12=El profeta comenzaba así su rezo: "Oh discípulos de Zurcarák, vosotros que sois saltarines como los champi champs...". Sí, vale, de acuerdo que no estaba en su estado normal...
content.4.13=Su nombre ya lo dice todo, ...¡o nada!, o...  bueno, el caso es que ya estás avisado.
content.4.14=Un trébol es muy bueno para dar mejor sabor a tus ensaladas. En este caso también es muy útil para tener algo de suerte.
content.4.15=Aquí tienes un hechizo típicamente Zurcarakesco, creado por el mago Lah'Ky' apodado "el gafe".
content.4.16=Esta flecha no sólo es mágica (la encantó Dardondakal, el dragón blanco), sino que ¡además pincha!
content.4.17=Una flecha helada que, como los cucuruchos, gustará a pequeños y a grandes.
content.4.18=Ideal para las barbacoas de verano y para las largas noches de invierno. Dejará un recuerdo grabado a fuego en tus adversarios.
content.4.19=El Ojo de Topo se pegará en la cabeza de tu adversario haciendo que no vea tres en un burro. ¿Qué se dice?
content.4.20=La diosa Ocra otorgó el Ojo de Lince a sus discípulos para que pudiesen disparar más lejos. Pero muchos lo usan para no tener que comprarse gafas ...¡Tacaños!
content.4.21=Un hechizo que viene especialmente bien cuando estés muy mal.
content.4.22=¡Marchando una de curas para un aliado! ¡¡¿El siguienteeee?!!
content.4.23=Nada mejor que este hechizo para estimular a tus aliados y que se vayan a recibir una buena.
content.4.24=Un buen ejemplo de devoción como se ven pocos hoy en día.
content.4.25=Tras una buena terapia de grupo, tus aliados se sentirán mucho mejor.
content.4.26=El Asalto es un hechizo especialemente temido por el enemigo, sobre todo su variante denominada "As-alto Riesgo".
content.4.27=Este hechizo atraerá a tus enemigos hacia ti como a Moskitos hacia una boñiga de Trool ...Con perdón por la comparación.
content.4.28=Lo que menos soporta un sacrogrito es que cualquier otro héroe reciba los golpes en su lugar. Con este hechizo podrás remediarlo.
content.4.29=La Locura Sanguinaria te ayudará a reponerte en los pequeños momentos de bajón, inevitables en las batallas más largas.
content.4.30="La fuerza de tus golpes este hechizo aumentará. Un mal trago para tu enemigo será." Dejémonos de poesía, va siendo hora de desencadenar la Furia de Sacrogrito.
content.4.31=El que desafía a un Feca se expone a recibir los ataques de las nubes feroces. Al principio te dará la risa, solo al principio. 
content.4.32=Nada mejor que una buena armadura para hacer que los mejores ataques de tus enemigos te resbalen como la lluvia.
content.4.33=Nada mejor que una buena armadura para hacer que los mejores ataques de tus enemigos no te hagan ni cosquillas.
content.4.34=Este hechizo te ayudará, a ti y a tus compañeros, a superar las desventuras menores de la vida de un guerrero: rozones, cicatrices, moratones, cortes, etc.
content.4.35=Con este hechizo, tus enemigos se sentirán tan flojos que, cuando los extermines, será como hacerles un favor.
content.4.36=Este hechizo te ayudará a suprerar las mayores desventuras de la vida de un guerrero: fracturas, desmembraciones, empalamientos, decapitaciones y demás.
content.4.37=Su nombre lo dice todo, tus enemigos no podran ni abrocharse una camisa... Así que ¡Imagina combatir!
content.4.38=¡¿Un enutrof lanzando monedas?! Yo de ti no me fiaría, tiene que haber gato encerrado.
content.4.39=Ideal tanto para cargar contra el enemigo, como para salir en retirada. Los Anutrofs siempre abusan de este hechizo.
content.4.40=Si este hechizo pudiese, además, quitarle la ropa interior a las Anutrofillas, sería el hechizo perfecto.
content.4.41=Ésta es la pala que estabas buscando para poder deshacerte de los bichejos que invaden tu jardín... y tus arenas de combate.
content.4.42=De repente, tus enemigos se vuelven más sosos que un yogur de agua. ¡Aprovéchate!
content.4.43=Aunque parezca increible, este arma que Xelor dio a sus discípulos no se la inspiraron los relojes, ¡Sino los Perspic! 
content.4.44=Xelor tuvo que hacer varios intentos antes de conseguir su famoso Reloj Divino, algunos de ellos funcionaban tan mal que soltaban rayos y demás cosas que hacen daño... pero, a fin de cuentas, eso no está tan mal.
content.4.45="¡Arcana tempus fugit!" 
content.4.46=Nada más altruista que un Xelor en plena acción. Siempre dispuesto a sacrificarse para que los demás puedan liarse a golpes tranquilamente.
content.4.47=Se cuenta que los discípulos de Xelor se cubren el cuerpo con vendajes que les protegen la piel de los destrozos que provoca el paso de los años. No es del todo verdad, pues este vendaje también impide aque alguien se case con un xelor únicamente por su belleza.
content.4.48=De repente, tus amigos te aprecian mucho más, y también tus enemigos.
content.4.49=Dice un viejo proverbio: "Donde hay celos hay amor, donde hay viejos hay dolor". Los enutrof se sienten particularmente orgullosos cuando lo oyen. ¿Por qué será?
content.4.50=Tus enemigos, cual niños malcriados, se merecen ser muy bien castigados.
content.4.51="Tofu invocado, a reír sin cuidado". Gracias a este proverbio, conseguiras engañar a más de uno. En realidad, si el dicho fuese realista sonaría más bien como... "Tofu invocado, enemigo desangrado".
content.4.55="Amigo de los animales, amigo de las personas". No puedes fiarte de estos viejos dichos. Ser amante de los animales no te impedira hacerte unas bonitas chaquetas de cuero con la piel tus rivales.
content.4.57=Discípulos de Osamodas, reservad vuestros latigazos para las criaturas invocadas. Es todo lo que se merecen.
content.4.61=Al principio te resultará difícil imaginarte que un cuervo pueda ser tan práctico como proyectil. Pero luego uno hasta llega a preguntarse si fue así como aprendió a volar y se hizo pájaro.
content.4.63=¡¿A quién se le ha ocurrido decretar que un golpe directo en cuerpo a cuerpo es un golpe solapado... ?!
content.4.65=El famoso truco de lanzar la piedra para despistar... ¡Y además funciona!
content.4.67=¿Qué es lo que hace que el adversario recule frente al guerrero Sram? ¿Será su aguerrida posición de combate? ¿La reputación de su bravura en la batalla? ¿Su aliento nauseabundo? ¿O el edor que se desprende de sus pies? El misterio sigue intacto...
content.4.69=Espero que los casos de doble personalidad no te asusten, porque este tiene sus ventajas...
content.4.71=¿Sabías que los Sram tiene un ligero gusto por el vampirismo? Definitivamente, les va a costar mucho hacerse una reputación decente.
content.4.73=Este ataque provoca varias pérdidas en su objetivo, no sólo perderá la vida, también  la vista, el gusto, el tacto... hasta puede que pierda el sentido del humor.
content.4.75=Este es un hechizo espinoso. Espinoso... ¡y dañino!
content.4.79=¡Bienaventurado el sadida, que puede invocar muñecas! Como se suele decir "menos es nada", ¿No?
content.4.83=Cuando los enemigos ven que un sadida se prepara para lanzar "Temblor", empiezan a temblar antes siquiera de recibir el hechizo. Luego temblarán aun más hasta que descansen... ¡En paz!
content.4.85=¿Siempre quisiste jugar con muñecas y nunca te dejaron? ¡Pues éste es el momento de cumplir tus sueños!
content.4.104=El Tofu es un auténtico Casanova: sus besos son tan interesantes que podrían cerrarte el pico... ¡Para siempre!
content.4.105=Algo que nunca hay que olvidar es que el jalató, cuando tiene hambre, puede pastar cualquier cosa... ¡De hecho le encantan los miaumiaus!
content.4.106=Si el prespic es el rey de las bromas, sin duda se debe a que su humor es tan agudo como picante... Aunque a menudo sus burlas hieren a quienes las reciben.
content.4.107=Esta muñeca se volverá loca de contenta con la sola idea de tocarte las narices... ¡Y romperte los oidos! su agudo grito ya ha agujereado más de un tímpano
content.4.109=Para crear esta muñeca, se usó la tela de un viejo saco de patatas. Algunos piensan que las coletas son un toque de humor, pero en realidad es relleno que se escapa por dos viejos agujeros de la tela.
content.4.110=Bajo su aspecto de bonachón, el Jalató no tiene nada que envidiar a los mejores perros de guerra. ¡Aquí está la prueba!
content.4.111=El prespic invocado es bastante malicioso; plantará sus espinas en los lugares más inesperados de la anatomía de tu rival.
content.4.112=Sus enemigos dicen de ella que es un estorbo. A veces hasta tú también lo pensarás.
content.4.117=Está claro que sabes cómo cuidar de tus tropas, pero eso no te convierte en una divinidad, así que no dejes que se te suban los humos.
content.4.126=¡Atención! Aunque este hechizo te permita "levantar" a un compañero, no es obligatorio que éste esté durmiendo. De hecho, más le vale estar despierto.
content.4.127=El lanzamiento, ¡ésa sí que es una técnica sorprendente! Sobre todo para tus enemigos, cuando vean cómo un guerrero va volando hasta darles de lleno en las narices.
content.4.128=Si un pandawa te dice que te va a invitar a una ronda, pregúntale de qué bebida se trata y no corras ningún riesgo.
content.4.129="It's raining Pandawas. Hallelujah!" (Este famoso canto Pandawa, acompañado de la danza ritual -conocida como Danza Lluvipán o "Danza-del-pandawa-que-cae-d'arriba-p'abajo"- componen el conjuro de la lluvia de pandas). Puede resultar muy cómico, sobre todo en Carnaval.
content.4.130=Gracias a este hechizo, serás más duro que una roca, imperturbable, como clavado al suelo... ¿Qué más se puede decir cuando ya está dicho todo?
content.4.131=Soltar un Soplido Alcoholizado a la cara del enemigo cuando se está en estado de ebriedad, suele dejar huella...
content.4.132=Un pandawa no se contenta con echarse a sus aliados a la espalda, también puede cargar con ellos largo tiempo... o cargárselos para siempre.
content.4.133=Regenerarse es un hechizo típicamente aniripsesco. Además, los efectos de esta magia son duraderos. Así que ya tienes con qué enfadar un buen rato a tus enemigos.
content.4.134="¡No va mas!"
content.4.135=Hay que ser muy sacrógrito para alegrarse de recibir los golpes en lugar de los demás.
content.4.136=Metamorfosearse en arbol, ésta sí que es una moda que sólo los sadidas podían inventar.
content.4.137="Tanto va la pompa a la fuente que al final se revienta" (antiguo proverbio Feca)
content.4.138="¡El que lo ha dicho, lo es! ¡Que rebote y que no vuelva!" Pueril, pero eficaz.
content.4.139=¡Qué bien sienta cuando el enemigo deja de hacerte daño!
content.4.140=Ideal para salir de vacaciones o de una pelea indeseada, pero sobre todo muy útil para no salir con los pies por delante.
content.4.141=Chutar a un aliado para que se motive... sólo a Osamodas podrían ocurrírsele tales ideas.
content.4.142=¡Nada mejor que un caparazón para ponerse a cubierto de la maldad del enemigo!.
content.4.143=Pocos lo saben, pero el Crujidor es un excelente compañero cuando se trata de contar chistes, beber unos tragos y aplastar unas cabezas... así que, ¿Por qué privarse?
content.4.144=Un oso que grita ya hace un ruido bastante raro, pero cuando encima es un osamodas el que grita como un oso enfurecido, el resultado es tan raro como insoportable.
content.4.145=Sólo los anutrofs tienen problemas de vista.
content.4.147=Con este hechizo podrás inmovilizar a tu enemigo, aunque seguirá fresco como una rosa... ¡No se puede tener todo!\n
content.4.148=Con la fosilización, tu adversario no llegará a viejo.
content.4.149=¡Uuups!
content.4.150=En la antigua lengua xelor, a este hechizo se lo llamaba "Espwejo". Con él no sólo herirás la carne de tus enemigos, ¡sino también su ego!
content.4.151="Ahora me ves. Ahora no me ves. Ahora me ves. Ahora no me ves... ¿Dónde estoy?" Graciosillo este sram...
content.4.152=Nada mejor que hacer que desaparezca un aliado para luego crear un precioso efecto sorpresa.
content.4.153=Antes de que se disipe esta bruma, van a pasar muchas cosas... Puedes dejarlo en manos de los Sram.
content.4.154=Instalar una trampa está muy bien, pero si la trampa es mortal ¡entonces mejor!	
content.4.155=Por mucho que pongas pies en polvorosa, el tiempo corre más rápido que tú.
content.4.156=¡Oh tiempo, detén tu carrera! ¡Oh mi enemigo, ven que te azote como a una estera!\nLa poesía siempre es más pura cuando suena verdadera.
content.4.157=Después de esto, no es de extrañar que tus enemigos no te pidan ni la hora.
content.4.158=¿Sabías que el 6º sentido de los zurcaráks hace visible lo invisible? Y antes que preguntes, no funciona del revés.
content.4.159=A los zurcaráks les gusta mucho este hechizo pues, como en la lotería, "a veces te toca y a veces no". Pero a quien le toque ahora, no se va a alegrar demasiado...
content.4.160=Este hechizo hará mentir a todo aquel que diga que una Zurcarák no puede dejarlo a uno de piedra.
content.4.161="A veces es mejor poder esconderse en el paisaje, que el que lo desplumen a uno como a un dragopavo salvaje"  (Antiguo proverbio eniripsa).
content.4.162=Los aniripsas no sólo son unos curanderos sin par, también son excelentes en el sutil arte de desembrujar. Si quieres pruebas, empieza por aquí.
content.4.163=¡Ayyy! Éste es el grito que te enseñaron a hacer en la escuela de magia por si acaso algúno de tus hechizos resultase también ser un poco doloroso para ti.
content.4.164="Lo siento cariño, pero creo que esto se va a cortar"
content.4.165=Que Yopuka descargue su ira sobre ti, es algo más que una simple expressión: sobre todo es la dolorosa comprobación de una ingrata realidad por parte de tus adverasarios.
content.4.166=La Espada Celeste es la única espada que golpéa en cruz. Además de poder serte útil en el campo de batalla, eso le hace ser uno de los más lindos ataques que puedas ver.
content.4.167=¿Tus golpes hacen daño? ¿Mucho daño? Pues ahora harán realmente MUCHO MUCHO daño...
content.4.168=Puede que no sea muy elegante, pero hacer retroceder al enemigo a flechazos, al menos es eficaz.
content.4.169=El poder absorbente de este hechizo es comparable al de la arena para Miaumiaus, pero sin malos olores.
content.4.170=Nadie sabrá nunca por qué Tiris le puso este nombre a un hechizo que más bien debería llamarse "Flecha Inmovilizadora"... Digamos que es otro de los enigmas de Arena.
content.4.171=Si aplicas el Tormento Visual sobre tus enemigos, a penas les quedarán ojos para llorar...
content.4.172=Recibir los golpes que estaban destinados a un compañero, ése es el acto más hermoso de una batalla... y también el más doloroso.
content.4.173=Ten cuidado, este veneno no sólo es peligroso, también es venenoso.
content.4.174=Esta muñeca saltará al cuello de tus enemigos. No te preocupes, no les hará ilusión por mucho tiempo.
