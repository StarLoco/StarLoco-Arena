content.4.176=...Y ahora los sacrógrito se creen eniripsas. ¡Lo que hay que ver!
content.4.179=Gracias a este hechizo, tus aliados estarán tiesos como rocas, bien duros, como si los hubieses pegado al suelo con pegamento.
content.4.183=¿Brutal? Y también feroz, rudo, implacable, malvado, salvaje y otros que me callo. Vamos, que tu compañía no va a ser lo que se dice "muy recomendable".
