content.29.273=¡Bien hecho pequeñín! Pareces estar listo para enfrentarte a los adversarios más tenaces. Ten, una carta de zaap, utilízala en el zaap situado al noreste de la isla.\n¡Adiós! Si vuelves a Maknala, pasa a verme, tendré otros desafíos que proponerte. 
content.29.274=No eres digno de enfrentarte a mí. Intenta vencer a los otros cuatro demonios de los minutos que se encuentran en esta isla. Si regresas, me dignaré a concederte un duelo. 
content.29.275=¡Muajajaja! He raptado a Bernabé y no lo dejaré marchar... ¡nunca! A no ser que derrotes a mis colegas los cristales...
content.29.276=Demonio de los segundos
content.29.277=¡Mira, ahí está 37! II es uno de los esclavos del demonio del minuto 12. Seguro que te acuerdas de él: ¡es el demonio al que te enfrentaste cuando llegaste al Horamundo!
content.29.278=Ha construido una prisión en la que está encerrado un detenido de gran importancia para su maestro. Según él, es impenetrable. ¿Qué te parecería probarle que se equivoca?
content.29.279=¡No olvides que el tener 100% de resistencia no le hace invulnerable! Si tus bonus a los daños son suficientemente altos, tus golpes podrán afectar al objetivo.
content.29.280=¿Qué estoy oyendo? ¿Quieres liberar a nuestro prisionero? ¡Ja, ja! No tienes ninguna posibilidad de hacerlo, he mejorado el sistema de prisión cristalina de mi maestro. ¡Ahora es invulnerable!
content.29.281=Demonio del segundo 37
content.29.282=Esto comienza a ponerse serio. Antes de nada, puedes colocar tu yopuka durante la fase de colocación.
content.29.283=Al ser un entrenamiento, no tienes tiempo límite, pero en un combate real sólo dispondrás de 30 segundos para colocar a todos los guerreros.
content.29.284=Para colocar un guerrero, selecciónale haciendo clic izquierdo sobre él y después selecciona la casilla a la que quieres desplazarlo. Si otro guerrero se encuentra en ella, intercambiarán posiciones (ahora no tendrás problema, tu yopuka está solo).
content.29.285=Una vez que lo hayas entendido todo, haz clic en el botón "Listo".
content.29.286=Ya te has dado cuenta de que, después de la fase de colocación, hay una fase de observación que dura 10 segundos.
content.29.287=Durante la fase de observación, puedes ver dónde se encuentran los enemigos y sus características si haces clic en la barra de orden de combate arriba a la izquierda.
content.29.288=En este entrenamiento, he anulado el cronómetro que determina que un turno sólo puede durar 30 segundos en un combate real, así que, si quieres, tienes tiempo de ver la barra de orden combate ahora.
content.29.289=Una vez que te sientas listo, ataca al jalató. Dispones de 3 PM (Puntos de Movimiento) para acercarte a él haciendo clic en la casilla que tiene delante de él.
content.29.290=¡No tengas miedo! Acércate a él haciendo clic en la casilla que tiene justo delante de él. Depende de la elección que hayas hecho al llegar aquí, tendrás que hacer clic izquierdo o derecho. Y si no te gusta, lo puedes cambiar.
content.29.291=¡Muy bien! Ahora, usa el hechizo "Presión" para matarlo. Haz clic en el hechizo en la barra de hechizos que está abajo a la izquierda y luego haz clic sobre tu objetivo.
content.29.292=Hmm... No ha estado mal, pero es mejor que hagas clic en la casilla en la que está el jalató si quieres darle. Si no, puede serte difícil vencerlo...
content.29.293=¡Muy bien! ¡Le has dado! Otro golpe con "Presión" y lo habrás vencido, lo que concluirá esta sesión de entrenamiento.
content.29.294=Puedes ver el total de tus PA (Puntos de Acción) abajo a la izquierda en un globo azul. Necesitas 3 PA para lanzar "Presión": si te quedan suficientes, lánzalo una segunda vez, si no, pasa tu turno para recuperar los 6 PA.
