content.2.1=Esta espada fue bendecida con las lágrimas del ángel Raziel. Satisfecho, gritó: "Cuidado con Raziel, el que te arranca el corazón sin tocarte la piel". Bastante elocuente, ¿no?
content.2.2="Una hoja sensacional para los aventureros que buscan lo excepcional". Esto es lo que pone en el libro de instrucciones... Definitivamente, los libros de instrucciones ya no son lo que eran.
content.2.3=La hoja de esta espada se templó bañándola en lágrimas de mediulubo. Muchos aventureros piensan que les otorgará fuerza y coraje en el campo de batalla. Ingenuos...
content.2.4=La espada Gúltar ha sido sumergida en la sangre de un dragocerdo. De ella se desprende un olor muy peculiar: ¿Estiércol porcino? ¿Orina dragonil? Imposible de saber exactamente.
content.2.5=Afilada e infernal: estas fueron las palabras del súcubo que la forjó. A menos que sean las palabras que utilizó Vald para describir a su alma, eso ya nadie podría decirlo con certeza.
content.2.6=Uno se pregunta qué hace un Jalató Real con una espada. ¿Afeitarse por las mañanas? Quizás por eso huela a sebo...
content.2.7=Terriblemente cortante e increíblemente chula, puede que esta hoja cause la envidia de tus amigos cuerboks.
content.2.8=¿Te crees lo suficientemente fuerte, hábil y guapo para manejar esta  espada? Perfecto, ahora solo necesitas un poco de suerte para poder cambiarla por una de verdad.
content.2.9=Esta espada pertenecía al célebre Badulo, un valiente guerrero que perdió la cabeza durante un combate.
content.2.10=La Kalámitass es una espada con mucho estilo. Si no consigue asustar a tu adversario, al menos lo impresionará lo suficiente para que puedas sorprenderlo mejor con una artimaña.
content.2.11=Esta espada la forjó un enano verde, del que nadie se acordaría si no le hubiese dado su nombre. Ni os molestéis en intentar saber por qué la llamó Llyoda Da y no Es Llyoda; ese es un secreto que se llevó a la tumba.
content.2.12=Si la sacudes enérgicamente delante de tu rostro, esta hoja puede servirte de abanico. Esa misma técnica también es excelente para diezmar a los moskitos o desfigurar a tus amigos.
content.2.14=De excelente factura, las Dagas Colmillosas también provocan unas excelentes fracturas (abiertas) que harán de ti un guerrero sin igual.
content.2.15=Las Bashers son unas auténticas dagas de asesino. Con tan solo entrever el reflejo de su hoja, tus enemigos saldrán corriendo sin pensárselo dos veces.
content.2.16=Las Blessdags pertenecían al célebre Ogro Mano Oscura que murió luchando contra un paladín del Bimd'Ulo... o cortando un salchichón de bwrok, no está claro.
content.2.17=Las Chakra Style son un par de dagas que pertenecieron a una de las mayores ladronas de todos los tiempos. Era tan buena robando ¡que llegó incluso a robarse a sí misma mientras dormía!
content.2.18=Según la leyenda, estas dagas te permitirán robar absolutamente todo; más concretamente, podrás robarle lo que quieras a quien quieras. ¿O acaso es del revés? La verdad es que ya nadie se acuerda exactamente.
content.2.19=Originalmente utilizadas para cortar setas y brotes aún verdes, no pasó mucho tiempo antes de que alguien comprobase como también eran aptas para cortar cabezas.
content.2.20=Estas magníficas dagas pertenecieron a la sramita más cruel que Amakna haya conocido. Bueno, una de las más crueles... 
content.2.21=Estas dagas tienen un extraño poder que las hace especialmente hábiles al cortar todo lo que se termina por "ones": melones, salchichones, fresones, jamones, melocotones... hasta testículos de dragones.
content.2.22=Estas armas son la última creación del difunto maestro Dagueiro. Para que el artesano pudiese morir feliz, todo el mundo le dijo que eran lo  mejor que se había hecho nunca, aunque no fuesen nada del otro jueves.
content.2.23=Estas dagas son una creación del más rebelde de los descendientes de la familia Olynaa. El joven D.Yankee rompió la tradición familiar al negarse a ser trobador, y llegó a ser un famoso forjador de dagas.
content.2.24=Las Dagas Tigre deben su nombre a sus tres puntas. Como dice el dicho: "Tres tristes dagas trillaban las tripas de un tiritronante trool tigre" ¡Repítelo tres veces!
content.2.25=El hijo de Ezil, forjador de estas dagas, tenía un acento bastante peculiar. De hecho nadie sabe si a las Dagas P'tadas les viene el nombre de "patadas", "petadas", "pitadas", o de otras cosas...
content.2.28=Algunas cuerdas, al vibrar, hacen temblar el corazón de los aventureros sensibles. Pero cuando vibra La Cuerda, los corazones de los aventureros (sensibles o no) más que temblar, se parten.
content.2.29=El creador de este arco, un tal Marcos Desade, nunca fue capaz de utilizarlo correctamente; de hecho conseguía herirse a sí mismo más a menudo que a sus adversarios.
content.2.30=El Arco Perfora Escudos pertenecía al famoso Perfobal. Cansado de que se le considerase el peor arquero de la comarca, decidió seguir los consejos de su maestro y apuntar por encima de la cintura.
content.2.31=O'Chino fue uno de los pocos arqueros ambidiestros que se conocen. Agarraba el arco con las dos manos y tensaba la cuerda con la boca. También puso unas bolitas de cerumen de jalató para, de paso, limpiarse los dientes.
content.2.32=Con este arco, los pescadores podían limpiar la costa de los bichejos más inoportunos sin tener que levantarse de sus asientos, disparando a través de las ventanas de la taberna de los piratas.
content.2.33=El Penetrador es un arco tan perspicaz, que su flechas son capaces de buscar los orificios más estrechos de su víctima, para introducirse por ellos: tímpanos, orificios nasales...
content.2.34=El Arco Cotazo es un arma muy peligrosa, pues las flechas que utiliza buscan instintivamente la cabeza de sus víctimas.
content.2.35=Fruto del cruce fallido entre un tronkónido y un abráknido, este arco es un verdadero éxito para todo escultor de arcos. Ya les gustaría a tus padres poder decir lo mismo de ti.
content.2.36=Uno se pregunta por qué este arco tiene un nombre tan estúpido, y la verdad es que ni siquiera un presidente de república podría saberlo a ciencia cierta.
content.2.37=Este arco disparaba flechas cargadas de amor, sensualidad y voluptuosidad. Un día, el ángel que lo usaba apuntó a una joven y bella feca pero, alcanzó a un minotauroro. Esa fue su última flecha.
content.2.38=El único arco del Mundo de los Doce con caña de pescar integrada, así podras pescar algo más que peces voladores.
content.2.39=Esta varita proviene del Limbo. Con ella todo es posible: jugar al limbo sin parecer un yopuka, practicar limbosucciones, beber limbonada y, por supuesto, lanzar hechizos.
content.2.40=El origen de su nombre es incierto. Aunque la raíz de "Celestial" se reconoce facilmente, el sufijo "ina" plantea más problemas: ¿Divina? ¿Hemoglobina? ¿Letrina? Eso sí, esta varita es 100% madera de pino.
content.2.41=Esta varita, originalmente comestible, se convirtió en un arma cuando Xav el Panadero la olvidó en su horno durante 234 años al irse a repartir tortas a los monstruos que cortaban el acceso a su panadería.
content.2.42=Esta varita fue tallada en madera del bosque de Bubun, lo que explica su nombre. El escultor de varitas tuvo el acierto de evitar la madera del bosque de Zorr.
content.2.43=Esta varita parece tener el poder de hacer obedecer a la gente. Las instrucciones dicen: "Sacuda la varita delante de la persona deseada", pero si sacudes a la persona con la varita funciona igual de bien.
content.2.44=Cuando la tocas, esta varita quema. Pero lo más enigmático es su olor a ceniza que deja entrever que su madera ha sobrevivido al incendio de algún bosque.
content.2.45=Esta varita está hecha a base de elementos más bien blandos, lo que hace que sea una varita muy difícil de manipular. Pero en pleno combate revela su verdadero poder.
content.2.46=La mezcla mágica de elementos sobrenaturales permitió crear esta varita, que raya con las fronteras de lo real. Con ella, más de un aventurero se ha creído en la 4ª dimensión.
content.2.47=Curiosamente, la Ululadora se quedó afónica una noche de desiembro. Esto no deja de ser una ventaja, pues su sola tos puede rasgarte los tímpanos, ¡lo que ya es bastante terrorífico!
content.2.48=Las runas grabadas directamente sobre la madera de Rune dicen que el primero que logre resolver su secreto será coronado rey de Amakna. Francamente, ¿quién puede creerse tales sandeces?
content.2.49=Antaño, esta varita perteneció a un joven y apuesto príncipe que hizo plantar millares de melocotoneros en su reino. Y no lo intentes, el melocotón que cuelga de Pataflón ¡¡NO es comestible!!
content.2.50=La Varita Lasa toma su nombre de la estrella que Viajante, el célebre explorador, usó como guía para su 2º gran viaje; al final parece ser que no era una estrella sino el cuarto de trece lejanos planetas...
content.2.51=El God Rod es un arma terrible. Es tan poderosa que permite que su portador sea de los mejores incluso cuando le entra un pequeño bajón de régimen.
content.2.52=Este bastón viviente ha estado en los lugares más oscuros del universo de Amakna. Se despierta cada 300 años para cambiar de sitio o de dueño.
content.2.53=Este bastón pertenecía al tristemente célebre Wey Wabbit.
content.2.54=El éxito del bastón del Wey Wabbit contribuyó a la aparición de múltiples réplicas, con la única intención de venderlos más fácilmente. Una técnica muy extendida entre algunos promotores inmobiliarios.
content.2.55=Dicen que este bastón permite lograr que una hembra abráknida se ponga colorada, o cosquillear las partes íntimas del Roble Blando para seducirlo mejor. En cualquier caso, es aconsejable no intentarlo: el Roble Blando es tremendamente posesivo...
content.2.56=Cuenta la leyenda que esta raíz es herbívora: se desliza muy deprisa entre las hojas muertas para comerse los pequeños brotes que encuentra. Muy impresionante. Bueno, excepto si combates contra dientes de león, no te servirá para nada.
content.2.57=El Hombre Oso usaba este bastón para adiestrar a los osos que invocaba. A veces también lo usaba para golpear los dedos de sus hijos si estos no hacían los deberes nada más volver del colegio. Él sí que tenía las ideas claras sobre como educar a los niños...
content.2.58=Un día, el sadida Loh Doh ató una muñequita al extremo de su bastón. Desde entonces las yopukitas que la ven se tiran a por ella... para mayor alegría del sadida.
content.2.59="Bastón, ¡te llamarás Stroom!", dijo el maestro sadida. Luego añadió: "¡Que el Stroom Stroomesco te Stroome Strumando". Y lo peor es que tenía razón.
content.2.60=El Inzommio es un bastón que producirá ojeras a su dueño. Aunque lo esencial es que también produce buenas lesiones en el cuerpo de tus enemigos.
content.2.61=El árbol Tosti odia a todos los bípedos capaces de introducirse en su bosque con un hacha. Con lo que hubo que sufrir para crear este bastón, lo mínimo es que quedara reflejado en su nombre.
content.2.62=Durante el combate, este bastón hace un ruido muy extraño, parecido al de las crines de un chafer al frotar contra las tripas de un miaumiau, por eso los héroes que lo usan suelen cantar a sus víctimas (aparte de la tortura extra que pueda significar).
content.2.63=Kaiser es el nombre de un dragocerdo que, de repente, quiso devorar a un malabarista. Desgraciadamente, el malabarista al que atacó estaba ensayando su número de los martillos.
content.2.64=El Ragnarok es un martillo muy poderoso, capaz de desencadenar tormentas o también capaz de atormentar a tus aliados si no sabes utilizarlo.
content.2.65=El último dueño de este martillo fue el mismísimo guardián de la Puerta de los Infiernos. Con él impedía salir a los muertos, entrar a los vivos y moverse a los muertos vivientes.
content.2.66=Un niño con terribles poderes guardaba Sargas como un tesoro. No se sabe lo que pasó con esta arma desde que un aventurero se la cambió por una bolsa de canicas.
content.2.67=Este martillo es tan ridículo que tu enemigo se partirá de la risa al verte. Eso te dará tiempo suficiente para reventarle el cráneo.
content.2.68=Con este martillo se enseña el milenario arte de la tortuga. Aunque la gente se mate en guerras, tú  serás inofensivo para todo el mundo y comestible para apenas unos pocos.
content.2.69=Los Falistos son unos demonios xelors que renegaron de su dios para ser unos forjadores excepcionales (sus martillos son la prueba). Desgraciadamente, tal osadía tiene su precio: ahora siempre llegan tarde.
content.2.70=Este martillo perteneció a Alba Mpirjunter, que lo usaba para "tallar" los craneos de chafer de su futura colección, antes de que el chafer estuviera muerto. Y luego dicen que las mujeres son más delicadas...
content.2.71=Solo los héroes más aguerridos podrán llevar este martillo, pues su portador se verá afectado de agudas flatulencias. Bien pensado, puede serte útil en el cuerpo a cuerpo.
content.2.72=En Amakna, cuando los niños son malos, o que no aprenden las lecciones en el colegio, se les pega en los dedos con un martillo de estos. Este, concretamente, casi solo ha golpeado dedos yopuka.
content.2.73=Es el arma soñada por los xelors un poquillo rebeldes y con ganas de vivir sensaciones fuertes. Les permite, sobre todo, compensar un viejo complejo con respecto a su tamaño francamente ridículo.
content.2.74=El nombre de Barabas es una contracción del grito de guerra de la milicia brakmariana "Barh'Tah'Bass". En lengua demonio significa, aproximadamente: "Cortemos las flores más tiernas y hagamos un ramo". Un tanto estúpido, ¿verdad?
content.2.75=Medio hacha, medio pala, Ares fue una de las siete armas utilizadas por el demonio Kajlir para acabar con la Cofradía de los Anutrofs coleccionistas de Dofus Púrpura.
content.2.76=Barba Gris era el arma favorita del demonio enano Tehle Fónika, que aterrorizó a numerosos campesinos atacándoles a cobro revertido y gritando "¡Si te mueves, te cuelgo!".
content.2.77=Esta pala de jardinero corta los rizomas y la mala hierba como si fuesen mantequilla. También puede ser muy útil a la hora de cortar otras cosas que no sean verduras.
content.2.78=Después de una noche demasiado alcoholizada en la taberna, un anutrof se dio cuenta de que esta pala, en su origen diseñada para excavar túneles, también aplastaba cráneos maravillosamente bien.
content.2.79=Esta pala está enredada, ¿quién la desendredará? El desenrededador que la desenherede buen deresendadedor será...
content.2.80=Los sacerdotes kaníbolas de la isla de Moon utilizan esta pala para invocar a Zébuth, una de sus divinidades a menudo representada bajo una forma vacuna. ¿Por qué? Es un misterio...
content.2.81=Misacal te dará un haliento de chacal. A la larga puede ser malo para tus relaciones sociales así que, si luchas en grupo, procura distanciarte de tus compañeros: ¡Te lo agradecerán!
content.2.82=La Enterradora Infiel ya dio sepultura a más de un despistado que se creía a salvo a su lado; aunque si aprendes a manejar correctamente sus nervios de acero, te será una aliada fiel.
content.2.83=Plantada delante de tu casa, la Guardiana te garantiza una tranquilidad inimaginable. Podrás incluso usarla para enterrar los restos de las visitas indeseadas.
content.2.84=El momento propicio para forjar estas palas es un secreto reservado a los iniciados. Se cuenta que la luna juega un papel según su fase, pero nadie lo sabe a ciencia cierta...
content.2.85=La Solitaria es una pala que no se gasta si no la usas. Dicho esto lo has dicho todo, pero lo más importante es tenerla junto a ti.
content.2.86=Mamayabibo, una pala especialmente diseñada para que los panaderos saquen docenas de bollos del horno de un simple gesto. También sirve para aplastar las cucarachas de la panadería.
content.2.88=Con este lindo perrito podrás apreciar las alegrías del pipí matutino y los paseos bajo la lluvia y el frío. Sus orígenes salvajes, además, harán que te resulte imposible darle de comer... salvo si quieres perder una mano.
content.2.89=Esta bolita de pelos, mimosa y cariñosa, volverá loca a cualquier señorita que se cruce en su camino. Lo que lo convierte en un arma muy interesante...
content.2.90=Este wabbit está amaestrado, así que no te morderá. Sin embargo, a los demás...
content.2.91=Este lindo y pequeño bwak, con el paso del tiempo se transformará en un horrible kwak. Pero hasta entonces, no tengas miedo de guardarlo a tu lado.
content.2.92=Este lindo y pequeño bwak, con el paso del tiempo se transformará en un horrible kwak. Pero hasta entonces, no tengas miedo de guardarlo a tu lado.
content.2.93=Este lindo y pequeño bwak, con el paso del tiempo se transformará en un horrible kwak. Pero hasta entonces, no tengas miedo de guardarlo a tu lado.
content.2.94=Este lindo y pequeño bwak, con el paso del tiempo se transformará en un horrible kwak. Pero hasta entonces, no tengas miedo de guardarlo a tu lado.
content.2.95=Este macaco carterista parece haberte tomado aprecio. Es tan dócil como exigente en el plano alimenticio: solo come productos que vienen de su isla.
content.2.96=La pandawa N'terarroza confeccionó esta magnífica capa con plumas del último pohoyo de Amakna. Es una auténtica rareza que todos los coleccionistas se quitan de las manos.
content.2.97=Para atrapar al gallo que "regaló" las plumas que componen esta capa, su granjero y legítimo propietario, tras correr infructuosamente detrás de él por varias horas, ingenió una trampa con tres botones, un alambre y un viejo calzón gastado... Más vale maña que fuerza.
content.2.98=Para los que quieren ser siempre los primeros en decir qué quieren, cómo lo quieren y para cuándo lo quieren.
content.2.99=Esta capa, cosida con plumas de tofus, permite a quien la lleve puesta correr más rápido y escaparse con gracia de los agresores . Eso sí, perderás todo tu aspecto viril...
content.2.102=Esta capa es, sin duda alguna, una de las más poderosas del mundo. Aumenta considerablemente los poderes de quien se la ponga.
content.2.103=Esta capa pertenecía al famoso Wey Wabbit. Todavía está impregnada con su transpiración, lo que hará que siempre recuerdes al rey de los Was, sobre todo cuando te la pongas.
content.2.104=Esta extraña capa saca toda su fuerza de su aspecto vetusto. Cuanto más sucia esté, más te servirá.
content.2.105=Así ataviado, podrás pavonearte en pleno bosque sin que nadie logre reconocerte. Eso sí, ten cuidado con los abráknidos que podrían andar en busca de brotes primaverales...
content.2.106=Esta capa lo tiene todo: resistencia, confort, buen color, rareza... En cambio su olor puede revelarse fatal para el tabique nasal. Vamos, que uno tampoco puede pedirlo todo...
content.2.107=Una elegante capa que te convertirá en el centro de las miradas de todas las sadiditas.
content.2.108=Aunque parezca haber pasado de moda, el sombrero del paletoso es muy eficaz en combate... para ser un simple sombrero de paja.
content.2.109=Este cráneo de demonio, reconstruido a partir de huesos diversos y variados, procura gracia y elegancia a quien lo lleve puesto... Tus amigas te envidiarán mucho...
content.2.110=Nueve de cada diez exploradores te recomiendan este sombrero.
content.2.111=Este sombrero, hecho a base de slips de cuero de chafer trenzados, te volverá -sin duda alguna- irresistible con las hembras bwork magas, célebres por su desbordante feminidad, acentuada por su barba pelirroja.
content.2.112=Una cáscara de dragohuevo blanco forrada con cueros y lanas; nada mejor para protegerse de los ataques y relámpagos de algún bwork mago borracho. En cambio, parecerá que acabas de salir del huevo.
content.2.113=El Champo pertenecía a uno de los más grandes maestros Boletus de Amakna. Así todo, el valeroso y respetado Boletus Chichón acabó sus días en medio de una tortilla de huevos de tofu. ¡Qué mundo cruel...!
content.2.114=El Clint es un sombrero sobrio pero bastante chulo...
content.2.115=Como tú, la tortuga tiene una cabeza muy pequeña. ¡Genial! Ya que este sombrero está especialmente diseñado para ambas.
content.2.116=Gracias a este magnífico sombrero tendrás, por lo menos, tan buena pinta como el tristemente célebre maestro Cuerbok.
content.2.117=La Melenuda te dará un aspecto de dragón, pero con pelo. Sorprendente, ¿verdad?
content.2.118=El Dofus Esmeralda garantiza una larga, muy larga, larguíííísima vida a su portador.
content.2.119=Gracias al Dofus Turquesa, comprenderás el auténtico significado de la palabra "críticos" en "Golpes críticos".
content.2.120=Este magnífico Dofus, salido directamente de las entrañas de uno de los dragones más majestuosos de Amakna, aumentará los daños terrestres y de fuego de su portador.
content.2.121=Ahowa sabes pow qué los wabbits tienen wápidos los pies y aguda la miwada... La lengua ya es otwa cosa.
content.2.122=Con este Dofus obtendrás una gran libertad de movimientos, entre muchas otras cosas...
content.2.123=Puedes blandir este Dofus al principio de un combate, seguro que dejas helados a tus enemigos.
content.2.125=Este magnífico sombrero te hará ganar fuerza e inteligencia, si consigues acostumbrarte a su olor.
content.2.126=Antiguamente se utilizaba en infusiones, incluso a veces se fumaba. Este sombrero de champi champ tiene, desde luego, muchas utilidades.
content.2.127=Solo hay una cosa más impresionante que un champ champ colérico, y no son dos champ champs coléricos; es un champ champ colérico con su capa.
content.2.128=Esta cofia debe su nombre sorprendente a la excentricidad de un anutrof, que la descubrió al registrar a un viejo moskito enfermo.
content.2.129=Antiguamente, esta mochila hecha con piel y alas de moskitos causaba furor en los colegios. Hoy día, se ha pasado de moda y, en el corazón de los niños, solo queda hueco para la pequeña mochila de escolar del Jefe Cocodrail.
content.2.130=Esta capa de piedra es un poco rígida, pero no deja de ser una excelente protección contra lapidaciones o, más peligroso todavía, escupitajos de crujidor.
content.2.131=Esta pequeña capa pelirroja también se puede usar como alfombrilla a los pies de la cama para cuando te levantas. Eso te permitirá modernizar tu casa de un modo muy económico.
content.2.132=Con este sombrero de prespic en la cabeza, te parecerás casi a Devi Cloquet, célebre cazadora de los tiempos modernos, dispuesta a hacerlo todo para ocultar su incipiente calvicie.
content.2.133=Este casco, directamente tallado en la piedra, vale su peso en oro. Te protegerá hasta de los golpes de un crujibola.
content.2.134=Este arco perteneció a la mismísima Kuri, famosa sacerdotisa del amor y mano izquierda de Abuelita Bombón. Nunca le des la espalda a una sacerdotisa del amor, basta con una única flecha de este arco para romperte el corazón, o incluso las nalgas si no estás de frente a tu adversario.
content.2.156=Los habitantes de la isla Dalbión usan esta capa para ser los primeros en disparar a sus enemigos continentales por la espalda, antes de salir corriendo.
content.2.157=Si tu enemigo te pega, tiende la otra mejilla; si te insulta, ¡dale un coronazo!
content.2.158=Astuto como un tofu hambriento, el buhordilla vuela rápido como un rayo para llegar a la nuca de su víctima y asestarle un picotazo mortal.
content.2.159=Este antiguo wabbit salvó a su tribu del ataque del hombre rayo cuando lo bloqueó con su trasero. Después lo expulsaron de su isla, y ahora sigue buscando amigos.
content.2.162=Aunque no lo parezca, los fotasmas son muy peligrosos, como ejemplo valga el célebre Fotomás que llegó a ser un maestro del crimen de fama mundial.
content.2.163=¡Intenta transformarlo en bolso si te atreves!
content.2.164=El cuerbako es un pariente cercano del cuerbok, aunque éste es algo más proclive a dejar que se le caiga el queso...
content.2.165=Esta es la encarnación de la de la fábula del wabbit y la tortuga.
content.2.166=Que no te quepa duda, no corre muy rápido. Incluso puede que eche raíces si no le obligas regularmente a moverse.
content.2.182=Este arco debe su nombre a su poder devastador, que ha hecho maravillas en la guerra de los clones del Horamundo.
