content.53.4=En este torneo cambian las siguientes reglas: \nSólo puedes jugar con un guerrero, que recibe los 6000 puntos de capital. \nIgualmente, los hechizos Trampa mortal y Corrupción, están prohibidos.
content.53.5=En este torneo cambian las siguientes reglas: \nSólo puedes jugar con un dúo de guerreros de clases diferentes, que obtienen los 6000 puntos de capital. \nAsí mismo, los hechizos Trampa mortal y Corrupción están prohibidos.
content.53.6=En este torneo cambian las reglas siguientes: \nNo hay límite de capital al crear el equipo.
