content.4.3=Dieser Pfeil wird sich in irgendeinen eurer Gegner bohren, wobei er die fleischigsten Stellen der Anatomie bevorzugt.
content.4.4=Das geht an euren Gegner: einmal gut durchprügeln, ohne großes Aufheben darum zu machen. Dann braucht ihr ihn nur noch auf einer Bahre abtransportieren zu lassen.
content.4.5=Der Biss des Schicksalsschwertes schmerzt, und genau das ist das Gute daran.
content.4.6=Es geht doch nichts über einen kleinen Sprung, um aus einer schlechten Lage herauszukommen oder um voller freudiger Überraschung einen Angriff zu starten.
content.4.7=Vitalität, das heißt: neue Kampfeslust, neue Energie und neue Kraft! Und... es ist das Höchste der Gefühle!
content.4.8=Nun könnt ihr und eure Gefährten von der legendären Tapferkeit der Iops profitieren!
content.4.9=Wie der gute alte Gott Iop immer zu sagen pflegt: Wer stark sein will, muss leiden!
content.4.10=Sieg und Niederlage liegen manchmal nur eine Haaresbreite auseinander... oder besser gesagt, eine Münzesdicke. Probiert es mal aus!
content.4.11="Schlau wie die Katz" ist eine sehr gebräuchliche Redewendung, vor allem bei den Ecaflips.
content.4.12=Der Prophet pflegte seine Reden folgendermaßen zu beginnen: "Oh, all ihr Anhänger Ecaflips, die ihr wie Pilzlinge durch die Gegend springt...". Zugegeben, er hatte ein ganz schönes Alkoholproblem.
content.4.13=Ein Wort der Warnung: Alles oder Nichts wurde nicht umsonst so genannt!
content.4.14=Nicht nur praktisch als Salatdressing, sondern sehr wirkungsvoll beim Erhöhen aller Gewinnchancen, sprich des "Glücks" eures Charakters.
content.4.15=Dies ist nun wirklich ein typisch ecaflippischer Zauberspruch! Er wurde vom berühmten Magier "Schwarzseh Klirrikatz" entwickelt, der den meisten besser bekannt ist als "Pechvogelzüchter".
content.4.16=Dieser magische Pfeil wurde vom weißen Drachen Dardondakal verzaubert. Außerdem kann er stechen.
content.4.17=Der Eispfeil erfreut Jung und Alt, wenn auch nicht in Dessertgestalt, er sich durch kleinsten Rüstungsspalt, in weiche Haut bohrt, ganz eiskalt!
content.4.18=Ideal für Barbecues im Sommer, oder für verschneite Winterabende. Hinterlässt euren Gegnern garantiert ein brandheißes Andenken.
content.4.19=Mit dem Zauberspruch Maulwurfssicht könnt ihr euren Gegnern eine entsetzliche Sicht verpassen!
content.4.20=Adlerauge wurde den Anhängern Crâs von ihrer Göttin verliehen, damit sie ihren Verbündeten noch besser helfen können. Dazu meinte sie: "Eure Schüsse werden damit eine noch größere Reichweite haben." Nichts weniger als das!
content.4.21=Dieser Zauberspruch tut da gut, wo es weh tut.
content.4.22=Beeilung! 'Ne Runde Heilung für'n Verbündeten ohne Peilung!
content.4.23=Ein Zauberspruch, der eure Verbündeten stärkt, damit sie sich freiwillig wieder ins Gemetzel stürzen.
content.4.24=Eine schöne Geste der Hingabe, die wir gern öfters sehen würden.
content.4.25=Beeilung! 'Ne Runde Heilung für'n Verbündeten ohne Peilung!
content.4.26=Sturmangriff ist ein gefürchteter Spruch auf dem Schlachtfeld, vor allem in der besonderen Martial-Arts-Variante Sturman-Tritt.
content.4.27=Dieser Spruch wirkt auf eure Feinde wie eine Portion Trooldung auf Moskitos. Er ist zwar nicht gerade heldenhaft, aber dafür sehr wirkungsvoll!
content.4.28=Jeder Sacrieur hasst es, wenn jemand anderes an seiner statt Schläge empfängt. Dieser Spruch löst dieses Problem.
content.4.29=Blutiger Wahnsinn verhindert all die kleinen Schwankungen des Muskeltonus, die manchmal während langer Gefechte vorkommen.
content.4.30="Die Stärke deiner Schläge dieser Zauber verstärk. Ein schwerer Schlag für Gegner dies werd. " Nun genug der Poetrei, machet Platz der Raserei.
content.4.31=Wer einen Féca herausfordert, der sollte sich auf einen Angriff wilder Nebelschwaden gefasst machen. Anfänglich bringt das jeden zum Lachen. Aber auch nur anfänglich...
content.4.32=Es gibt nichts Besseres, als einen guten Panzer. Damit werdet ihr selbst den fürchterlichsten Angriffen eurer Gegner nur noch mit einem mitleidigen Lächeln begegnen.
content.4.33=Es geht doch nichts über eine gute Panzerung. Damit werdet ihr selbst den stürmischsten Angriffen eurer Gegner nur noch mit einem müden Lächeln begegnen.
content.4.34=Dieser Spruch wird euch und eure Verbündeten vor den kleinen Unannehmlichkeiten des Kriegerlebens beschützen, wie: Schrammen, Narben, Schnitte usw.
content.4.35=Durch diesen Zauberspruch werden sich eure Gegner so matt fühlen, dass ihr ihnen sogar einen Gefallen tut, wenn ihr sie auslöscht.
content.4.36=Dieser Spruch wird euch vor den schlimmsten Unannehmlichkeiten des Kriegerlebens schützen: Entleibungen, Splitterbrüche, Aufspießungen, etc.
content.4.37=Und auf einmal werden sich eure Gegner völlig tolpatschig fühlen... Sogar zum Kuscheln zu steif und plump... An Kampf ist da nicht mehr zu denken.
content.4.38=Wenn ein Enutrof anfängt, Münzen zu werfen, dann sollte man besser sehr vorsichtig sein. Das ist unnatürlich. Üblicherweise steckt da etwas dahinter.
content.4.39=Ideal, um zum Sturmangriff zu blasen oder den Rückzug einzuläuten. Enutrofs neigen dazu, von diesem Spruch übermäßig Gebrauch zu machen.
content.4.40=Wenn dieser Zauberspruch zusätzlich auch noch die Unterwäsche des Enutröffchens verschwinden lassen würde, dann wäre er vollkommen.
content.4.41=Dieser Zauberspruch ist sehr hilfreich, unwillkommene Gäste loszuwerden, die euren Garten oder euer Schlachtfeld besiedeln.
content.4.42=Auf einmal werden die Gegner weich wie Gelee... Das sollte man ausnutzen!
content.4.43=Unter dem ganzen Arsenal an Waffen, die der Gott Xélor seinen Anhängern zur Verfügung gestellt hat, gibt es eine, die nicht von Uhrwerken abgeleitet wurde, sondern vom Prespik: "Er sticht sogar die Hand, die ihn füttert."
content.4.44=Das allererste Uhrwerk von Xélor enthielt noch ein Schaufelrad... Das war nicht so ohne, denn ein Schaufelrad dreht sich dank der Wasserkraft, und nicht aufgrund der bloßen Anwesenheit von Schaufeln allein... Xélor korrigierte alsbald den Fehler und nutzte die Idee für einen Zauberspruch.
content.4.45=Sich teleportieren ist ein Kinderspiel für Xélors. Einen Hammerschlag auf die Schläfe ihres Gegner sausen zu lassen ebenfalls.
content.4.46=Es gibt doch keinen größeren Menschenfreund, als einen Xélor inmitten einer Schlacht. Er ist immer bereit, sich voll und ganz hinzugeben, damit die anderen ungestört fechten können.
content.4.47=Es wird allgemein gemunkelt, dass die Anhänger Xélors ihren Körper mit Bandagen umwickeln, um ihre Gegner besser entstellen zu können.
content.4.48=Plötzlich wird man von Freund und Feind gleichermaßen gemocht!
content.4.49="Für jedes Jahr auf dem Schlachtfeld, ein Zahn im Mund dir später fehlt." (bekanntes Enutrof-Sprichwort)
content.4.50=Euren Gegnern und ungezogenen Kindern gebt 'ne Tracht Prügel auf den Hintern. (Alte Volksweisheit)
content.4.51="Beschworene Tofus erheitern ganz Dofus." Dieses Sprichwort hat schon mehr als einen Gegner in die Irre geführt. Denn in Wirklichkeit lacht man nicht über beschworene Tofus. Man blutet!
content.4.55="Wer Tiere mag, der mag auch Menschen". Nichts ist falscher als das! Aber es sollte euch dennoch nicht daran hindern, aus der Haut eurer Gegner ein paar feine Mäntelchen zu fertigen.
content.4.57=Anhänger Osamodas, spart eure Peitschenhiebe für eure beschworenen Kreaturen. Schließlich ist das alles, was diese verdient haben.
content.4.61=Wahnsinn, welch tolles Projektil so ein Rabe abgibt! Man könnte beinahe meinen, dass dies die eigentliche Berufung dieses Tieres sei.
content.4.63=Srams sehen nichts verwerfliches darin, ihre Gegner zurückzustoßen, um Nahkampfangriffen aus dem Weg zu gehen. Von ihrer Warte aus gesehen, ist das nur vernünftig.
content.4.65=Der gute, alte Trick, einen Stein zu werfen, um die Gegner abzulenken, ist allgemein bekannt... doch er funktionniert trotzdem!
content.4.67=Ist es der fürchterliche Gesichtsausdruck des Sram-Kriegers, der die Gegner zurückweichen lässt? Ist es sein schlechter Atem? Die stinkenden Käsefüße? Wer weiß?
content.4.69=Schizophrenie hat manchmal auch seine guten Seiten.
content.4.71=Habt ihr das gewusst? Srams haben so eine kleine vampirhafte Seite an sich. Die wird bestimmt nicht ihren schlechten Ruf verbessern.
content.4.73=Dieser Angriff hat immer einige Unannehmlichkeiten für das Opfer zur Folge, wobei der Tod nicht die Geringste unter ihnen ist.
content.4.75=Diesem Zauberspruch fehlt es nicht an Stacheligkeit. Er ist spitz, dornig und offensiv - also genau so, wie er sein soll.
content.4.79=Glücklich ist der Sadida, der Puppen herbeirufen kann! Das ist immerhin besser als nichts, oder?
content.4.83=Wenn ein Sadida "Beben" auf eine Horde von Feinden wirft, dann schlottern diesen so sehr die Knie, dass sie dadurch selbst ihr eigenes Grab buddeln und dann ihren letzten Schlotter auszucken. Praktisch, nicht?
content.4.85=Ihr durftet in eurer Kindheit niemals mit Puppen spielen, obwohl ihr wolltet? Nun könnt ihr euch dafür rächen!
content.4.104=Tofus sind richtige kleine Casanovas. Seine Küsse sind so intensiv, dass ihr euch noch lange daran erinnern werdet...
content.4.105=Wenn ein Fresssack einmal so richtig Hunger bekommt, mutiert er leicht zum Allesfresser. Dann schreckt er auch vor eurer Maunzmiez nicht zurück...
content.4.106=Wenn der Prespik anfängt, sich über euch lustig zu machen, dann ist das kein gutes Zeichen...
content.4.107=Dieses Püppchen ist verrückt danach, euch auf den Wecker zu fallen... und... euch in den Ohren zu liegen! Ihre kleinen Schreie haben schon so manches Trommelfell zum Platzen gebracht!
content.4.109=Diese Puppe wurde aus Zelttuch gefertigt. Das verleiht ihr dieses charakteristische Aussehen.
content.4.110=Hinter der niedlichen Maske des Fresssacks versteckt sich ein Monster, welches den Vergleich mit den mächtigsten Kriegskolossen nicht zu scheuen braucht. Hier ist der Beweis!
content.4.111=Der beschworene Prespik ist bösartig. Er steckt seine Dornen immer dahin, wo man es gar nicht erwartet...
content.4.112=Ihre Gegner sagen von ihr, dass sie ihnen wie ein Klotz am Bein hänge. Ihre Freunde auch, übrigens.
content.4.117=Oh Wunder! Neue Vitalität durchströmt euch!
content.4.126=Achtung: Nur weil ein Panda einen Verbündeten "auf Händen trägt", bedeutet dies noch lange nicht, dass dieser auch wirklich "in guten Händen ist". Oft hat das Eine mit dem Anderen sogar überhaupt nichts zu tun.
content.4.127=Werfen - das ist wirklich eine überraschende Tätigkeit! Eure Gegner werden überrascht sein, denn einen anderen Krieger ins Gesicht zu bekommen, passiert schließlich nicht alle Tage!
content.4.128=Wenn ein Pandawa den Stöpsel seines explosiven Flachmanns aufspringen läßt, dann ist es gut möglich, dass die nächste Runde für seine Gegner sehr schmerzhaft wird!
content.4.129="Es regnet Pandawa, Halleluja!" Diese bei Pandawas berühmte Beschwörungsformel dient dazu, im wahrsten Sinne des Wortes Pandawas vom Himmel regnen zu lassen. (Verursacht Erdschaden.)
content.4.130=Dank dieses Zauberspruchs seid ihr gleich unverwüstlich und tief verwurzelt, sodass euch nichts mehr umhauen kann. Damit wäre eigentlich alles gesagt.
content.4.131=Im betrunkenen Zustand seinen Alkoholatem den Gegnern entgegenzublasen ist wahre Glückseligkeit für jeden Pandawa.
content.4.132=Es ist schon nicht sehr nett, seine Verbündeten fallen zu lassen, vom Werfen ganz zu schweigen...
content.4.133=Regeneration ist ein typisch eniripsischer Zauberspruch. Darüber hinaus hält seine Wirkung auch noch länger Zeit an, was euren Gegnern ganz schön auf den Geist gehen wird.
content.4.134="Kenne deinen Gegner wie dich selbst!" Bei Roulette wird sich jeder weise Gegner hüten zu handeln, da er sonst sein Leben im wahrsten Sinne des Wortes "aufs Spiel setzt".
content.4.135=Wenn sich jemand daran erfreut, die Schläge eines anderen abzukriegen, dann kann es nur an seinem Sacrieurglauben liegen!
content.4.136=Sich in einen Baum zu verwandeln, liegt bei den Sadidas zur Zeit voll im Trend. Da werden ihre Gegner ganz grün vor Neid...
content.4.137="Die Blase geht so lange zum Wasser, bis sie bricht." - Ein bekanntes Féca-Sprichwort.
content.4.138="Wer das sagt, der ist es selber!" Kindisch, aber wirkungsvoll!
content.4.139=Welch ein Segen, wenn euer Gegner endlich aufhört, euch zu traktieren!
content.4.140=Ideal, um zu verreisen oder Schlachtfelder zu umkreisen, doch allem voran, um nicht ins Gras zu beißen.
content.4.141=Einem Verbündeten eine Spritze geben, um ihn zu motivieren... Auf solch verrückte Ideen können auch nur Osamodas kommen...
content.4.142=Es geht doch nichts über eine gute Panzerung, um sich vor der Feindseligkeit der Welt zu schützen.
content.4.143=Es ist zwar eine nur wenigen bekannte Tatsache, aber ein Krachler kann ein richtig guter Gefährte sein, wenn es darum geht, Witze zu erzählen, ein Bier zu schlürfen oder Köpfe von Feinden einzuschlagen. Was würden wir bloß ohne ihn machen?
content.4.144=Der Schrei eines wütenden Bären ist bereits furchterregend genug... Was aber, wenn es sich um einen Osamodas handelt, der wie ein wütender Bär schreit?
content.4.145=Nicht nur die Enutrofs haben Probleme mit ihren Augen...
content.4.147=Hier habt ihr nun eure Gegner völlig unbeweglich, aber was das "frisch wie ein Fresssäckchen" angeht, so gilt: man kann nicht alles haben...
content.4.148=Ihr seid also einer von denen, die bereit sind, den ersten Stein zu werfen? Hier habt ihr nun euren Gegner, völlig bewegungslos. Ihr könnt sofort loslegen!
content.4.149=Oops! 
content.4.150=Dieser Zauberspruch, der in der alten Sprache der Xélor auch "Mirwar" genannt wird, wird gleichzeitig den Körper und den Stolz eurer Gegner verletzen!
content.4.151=Hier ist er! Nein, da ist er schon nicht mehr. Ist er jetzt dort? Nein, dort ist er auch nicht mehr. Er ist verdammt gut, dieser Sram...
content.4.152=Ha! Es geht doch nichts darüber, einen Verbündeten verschwinden zu lassen, um die Gegner zu überraschen!
content.4.153=Bevor sich dieser Nebel wieder auflöst, wird eine Menge geschehen sein. Da kann man den Srams schon vertrauen!
content.4.154=Fallen stellen, ist schon eine feine Sache. Tödliche Fallen stellen, ist noch feiner.
content.4.155=Das ist genau der Staub von der Sorte, die man besser nicht ins Auge bekommen sollte.
content.4.156="Oh Zeit, unterbrich kurz deinen Lauf! Oh Gegner, jetzt gibt es Haue!" DAS ist wahre Poesie, nicht wahr?
content.4.157=Wundert euch nicht, wenn euch eure Gegner nicht mehr nach der Uhrzeit fragen!
content.4.158=Wusstet ihr das schon? Ecaflips haben einen 7ten Sinn. Damit können sie Unsichtbares sichtbar machen! (Aber umgekehrt geht's nicht).
content.4.159="Lustig ist die Lotterie, bei der ich für die Feinde zieh', das ist für die 'ne Angstpartie, denn verlier'n sie, heißt es Agonie!" (Einleitung der Zauberformel für diesen beliebten Spruch)
content.4.160=Was könnte denn noch gesundheitsgefährdender sein, als einem Ecaflippchen fasziniert nachzustarren? Dem Sensemann eine gute Nacht wünschen, vielleicht?
content.4.161="Manchmal ist es besser, frühzeitig im Hintergrund zu verschwinden, als sich zu spät im Vordergrund zu winden." (Eniripsa-Sprichwort)
content.4.162=Eniripsas sind nicht bloß ausgezeichnete Heiler, sondern darüber hinaus auch hervorragende Entzauberer. Hier ist der Beweis!
content.4.163=Baden in Lebensenergie ist für Verbündete vortrefflich! Leider büßt ihr selbst hierbei an Kräften ein...
content.4.164=Dieser Zauberspruch hat schon manch einem guten Mann Beine und andere Dinge, die an dieser Stelle besser unerwähnt bleiben, gekostet...
content.4.165=Von Iops Wut erfasst zu werden, ist nicht nur eine Redewendung... Es kann auch schnell eine schmerzhafte Wirklichkeit für eure Gegner werden!
content.4.166=Das Göttliche Schwert hinterläßt als leicht erkennbares Merkmal die typischen kreuzartigen Schnittwunden. In der Mitte eines Schlachtfeldes kann das sehr dekorativ aussehen!
content.4.167=Eure Schläge hauen rein? Sehr? Dank der Verstärkung werden sie nun SEHR SEHR SEHR reinhauen!
content.4.168=Gegner mittels Rückstoßpfeilen zurückzutreiben, ist zwar nicht elegant, aber dafür sehr effektiv.
content.4.169=Dieser Zauberspruch imitiert mit seiner phänomenalen Absorptionskraft die der Maunzmiez-Streu. Ohne deren Gestank, natürlich.
content.4.170=Wenn man von einem Lähmpfeil getroffen wird, kann man seine Position wirklich noch mal in Ruhe überdenken.
content.4.171="Unter den Blinden ist der Einäugige König." An diesen Spruch werdet ihr euch mit Sicherheit erinnern, sobald ihr auch euer letztes Auge und somit eure Krone verloren habt. Oh weh..!
content.4.172=Es gibt nichts Edleres, Schöneres und Schmerzhafteres, als euren Kopf für eure Verbündeten hinzuhalten...
content.4.173=Wenn ihr immer so mit allen möglichen Giftarten herumexperimentiert, dann solltet ihr euch nicht wundern, wenn euer Ruf bald nicht mehr der beste ist...
content.4.174=Diese Puppe wird euren Gegnern geradewegs in die offenen Arme fliegen. Aber keine Sorge, deren Freude daran ist nur von kurzer Dauer.
content.4.175="Kommt, lasst uns einen Baum pflanzen!" Auf solche Ideen können auch nur Sadidas kommen.
content.4.176=Ein Sacrieur, der sich für einen Eniripsa hält? Was es nicht alles gibt!
content.4.179=Dank dieses Zauberspruchs kann euch und eure Verbündeten nun nichts mehr umhauen, denn ihr seid wahrlich unverwüstlich und tief verwurzelt.
content.4.183=Brutal? Ja! Aber ebenfalls wild, unbezwingbar, böse, gemein, hart, grausam und gewalttätig! Und das ist noch längst nicht alles. Kurz: Ihr seid wirklich ein Gegner, den man noch nicht einmal zum Freund haben will!
content.4.184=Ihr macht keinen kleinen Finger krumm? Könnt nicht einmal die Ohren spitzen? Kein Zweifel, dann seid ihr versteinert worden, gleich einem alten Troolfossil.
content.4.186=Mit diesem Panzer werdet ihr zwar nicht eure Angst verlieren, Schläge einzustecken. Dafür wird sie alleerdings niemand mehr zu sehen bekommen.
content.4.187=Manche Blitzstrahlen zischen bei Gewitter durch den Himmel... Aber nicht dieser! Dieser saust geradewegs auf das Gesicht eurer Feinde zu!
content.4.188=Ungleich einer Häschenpfote bringt euch Ecaflips Pfote kein Glück. Stattdessen heißt es: Einsatz verdoppeln oder Passen! Die Entscheidung liegt bei euch!
content.4.189=Ihr bewegt euch jetzt schon schneller als alle anderen. Und nun wollt ihr auch noch, dass eure Bewegungen zierlich und elegant aussehen? Sonst noch was?
content.4.190="Und Action!": Jetzt könnt ihr mit euren Heldentaten als Krieger sogar berühmt werden! Jedenfalls kann man ja immer mal drauf hoffen... "Schnitt! Noch einmal!"
content.4.191=Nun seht ihr sogar Ziele, die weiter entfernt sind und habt eine größere Reichweite beim Zuschlagen, wodurch ihr noch besser Tod und Verderben über eure Gegner bringen könnt. Tja ja, das Kriegerleben ist schon sehr langweilig...
content.4.192=Falls ihr schon Experte in der Kunst des Heilens wart, dann werden eure Fähigkeiten hiermit noch verbessert! Falls nicht, so könnt ihr euch glücklich schätzen, vom göttlichen Zorn verschont geblieben zu sein.
content.4.193=Argher Atem? Gaspmatisches Grausen? Gluggriges Gefühl? Ganz klar, ihr seid vergiftet worden!
content.4.194=Nun seid ihr im Besitz einer Macht, die noch abstoßender ist als der Gestank eines brünftigen MuWulfs... Das ist sehr praktisch, solange man nichts gegen das Knuddeln mit WuWulfs hat.
content.4.195=Neben Ärger erlauben es euch die Anziehenden Winde auch eure Gegner anzuziehen (na so was aber auch...), damit ihr sie mit Freude und guter Laune in Stücke hacken könnt.
content.4.196=Dieses Püppchen brennt nur darauf, für euch brennend durchzubrennen.
content.4.197=Wenn ihr einem Krachler begegnet, werdet ihr Lust haben, mehrere Klafter im Boden zu versinken. Aber keine Bange, der Krachler wird euch dabei schon nachhelfen.
content.4.203=Mirwar, Mirwar an der Wand: Wer ist der Stärkste im ganzen Land?
content.4.204=Dieser Angriffszauber fügt Gegnern im Nahkampf Erdschaden zu.
content.4.407=Beim Picheln wird nicht immer nur der Pandawa die Auswirkungen verspüren...
content.4.408=Seltsam, dass Gegner bei einem harten Bambusschlag auf einmal weich werden...
content.4.409="Geht es dem Sacrieur schlecht, gilt das für Gegner erst recht."
content.4.411=
content.4.412=Vom Zorn des Iop getroffen zu werden ist nicht nur eine Redewendung: Für eure Gegner ist es eine schmerzliche Wahrheit!
content.4.413=
content.4.414=Dieser Zauberspruch zieht eure Gegner an, wie Troolhäufchen Moskitos. Das ist nicht besonders ruhmreich aber wirkungsvoll.
content.4.415=Ob es wohl am schrecklichen Gesichtsausdruck des Sram-Kriegers liegt, der die Gegner zurückweichen lässt? Oder an seinem schlechten Atem? Seinen Käsefüßen? Ein echtes Rätsel...
content.4.416=
content.4.417=Also diesen Staub sollte man nun wirklich nicht einatmen.
content.4.418=Manche Blitze sind keine Geistesblitze. Dieser hier auch nicht.
content.4.419=Dieser Zauberspruch schützt euch und eure Verbündeten vor den kleinen Unannehmlichkeiten des Kriegerlebens: Kratzer, Schrammen, Narben, Schnittwunden etc.
