content.6.1=Diese Charakterklasse verfügt über die mächtigsten Verteidigungssprüche. Ein Meister dieser Klasse kann ein ganzes Schlachtfeld durchqueren und dabei die stärksten Angriffe erdulden, ohne dabei auch nur einen Kratzer abzubekommen. Féca achtet sehr auf ihre Anhänger und beschützt sie vor gegnerischen Angriffen, Unwettern und Krankheiten.
content.6.2=Diejenigen, die den Weg dieser Klasse befolgen, züchten und dressieren Kreaturen, damit diese für sie kämpfen. Sie verfügen über hervorragende Kenntnisse über die Wege der Natur.
content.6.3=Diesen guten Schatzsuchern sind die Feinheiten des Kampfes nicht gerade in die Wiege gelegt worden, allerdings können Sie im Laufe der Zeit zu sehr gefährlichen Gegnern werden, dank ihrer guten Ausrüstung.
content.6.4=Sram's Anhänger sind wohl die hinterhältigsten Gestalten von ganz Amakna. Sie genießen den Nervenkitzel beim Diebstahl und ihr Gott Sram ist wahrscheinlich das einzige Wesen, vor dem sie Respekt haben.
content.6.5=Anhänger der Sanduhr von Xélor sind in der Lage die Zeit zu verzerren. Sie können Freund und Feind entweder beschleunigen oder verlangsamen. Es wird gesagt, daß Ihr Gott Xélor, in Gestalt einer Taschenuhr erscheint.
content.6.6=Anhänger dieser Klasse sind die geborenen Spieler. Sie sind dazu fähig, eines bloßen Spieles willens ihr Leben zu riskieren... dieses also im wahrsten Sinne des Wortes „auf's Spiel zu setzen". Das Problem ist, dass sich ihre Zaubersprüche sich jederzeit gegen sie selbst richten können...
content.6.7=Die Zaubersprüche dieser Heiler beruhen auf Silben, Worten und Gebeten. Daher wirken die meisten nur, wenn sich der Gegner in Hörreichweite befindet.
content.6.8=Iop, Gott der Macht und der Herrschaft verachtet die Schwachen. Seine Anhänger sollten also nicht von ihm erwarten, dass er ihnen jederzeit zur Seite steht.
content.6.9=Genauigkeit, Flinkheit und Geschicklichkeit sind die Schlüsselbegriffe im Zusammenhang mit dieser Charakterklasse. Anhänger dieser Klasse sind schlicht und einfach zu Crâ übergetretene ehemalige Bogenschützen.
content.6.10=Die Klasse des Schuhwerks von Sadida besteht aus sehr seltsamen Kreaturen. Sie schlafen 23 Stunden am Tag und koexistieren in vollständiger Harmonie mit der Natur.
content.6.11=Anhänger des Gottes Sacrieur wissen genau über alle Formen von Schmerz Bescheid und ihre Kampftechniken stützen sich auf ihre gewaltige Willenskraft und Zähigkeit.
content.6.12=Pandawas Anhänger ziehen ihre legendäre Stärke aus fermentierten Getränken. Mit ihrem biegsamen Rückgrat und den starken Schultern können sie leicht ein Mehrfaches des eigenen Gewichtes tragen: Pandawas können im Kampf Verbündete auf den Schultern tragen, um sie zu schützen, oder aber ihre Gegner durch die Luft schleudern, um sie zu verletzen (manche Gegner stehen danach nicht mehr auf).
content.6.13=Halsabschneider sind heimtückische und listige Gesellen. Sie schlagen gern aus sicherer Entfernung zu, indem sie ihre Bomben in spektakulären Kettenreaktionen in die Luft jagen. Außerdem besitzen sie Zauber, um sich aus misslichen Lagen zu befreien, sollten sie doch einmal im Nahkampf festhängen.
content.6.14=Maskeradoren sammeln und nutzen magische Masken als Quelle ihrer Macht. Jede Maske verleiht ihnen dabei spezifische Kräfte. Im Kampf müssen die Maskeradoren daher die Fähigkeiten ihrer Masken weise einsetzen und regelmäßig die Maske wechseln, um sich beispielsweise von einem wildgewordenem Berserker im Nahkampf in einen den Gegner hänselnden Fernkämpfer zu verwandeln.
