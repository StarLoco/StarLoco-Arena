content.26.1=Tuu' Matsh: die Mode, die dich trägt, wenn alle anderen dich aufgeben!
content.26.2=Das Kna Utsh-Set befand sich lange Zeit im Besitz von Aent Knitter, bevor es in weniger sorgfältige Hände überging.
content.26.3=Wer's eilig hat, weil er immer auf dem Sprung sein will, ist mit diesem minimalistischen Set bestens bedient. 
content.26.4=Warnung an alle Nicht-Osamodas: Die Kleidungsstücke dieses Sets NICHT nach innen gewendet tragen!
content.26.5=Entspannt euch, zieht eurer Fresscool-Set an, und legt euch einfach ins grüne Gras.
content.26.6=Das Puristen-Set wird gern von jenen getragen, die das Streben nach geläuterter Wahrheyt über den Impuls zur That setzen.
content.26.7=Mehrmals pro Stunde, und jedes Mal in weniger als 30 Sekunden... Das gibt vielleicht Wolle...!
content.26.8=Keine Haare auf der Brust? Das barabarische Set ist genau das Richtige für junge, unreife Testosteronträger!
content.26.9=Ursprünglich ein Possenreißer, ist der Paladin auch heute noch zu Späßen aufgelegt. Vornehmlich, wenn es darum geht, die Feinde zu unterhalten, damit ihr euch aus dem Staub machen könnt.
content.26.10=Etwas Gelee, eine Gussform, und fertig ist der prächtige Laserschutz.
content.26.11=Kokett klackern die Knochen des Chaferburschi, bevor er sich dem Feind zuwendet.
content.26.12=Kards oder Leben? Dies ist der Leitspruch aller welterfahrenen spitzbübischen Brigandiner.
content.26.13=Herr und Herrin Hänk finden immer eine Möglichkeit, feindliche Partygäste in die Verzweiflung zu treiben.
content.26.14=Mit dem Karate-Kitsch-Set werdet auch ihr Kultstatus erlangen!
content.26.15=Wolltet ihr nicht Ritter werden? Dann betätigt euch!
content.26.16=Jedem Narren gefällt seine Kappe!
content.26.20=Ihr habt danach gelechzt und ihr habt es geschafft! Ihr seid als Sieger aus einem Turnier hervorgegangen und habt noch alle beisammen!
content.26.22=Ihr habt danach gelechzt und ihr habt es geschafft! Ihr seid als Sieger aus einem offiziellen Dofus-Arena-Turnier hervorgegangen und dürft daher nun dieses Prestige-Set tragen!
content.26.23=Grilambak war ein ausgezeichneter Stratege, und ein Meister der magischen Kampfkünste. An seiner Magieschule konnten selbst Iop-Kinder noch etwas lernen!
content.26.25=Mitta Lup war ohne Zweifel der größte Detektiv von ganz Amakna. In Begleitetung seines treuen Arztes Doktor Watslos gelang ihm die Aufkärung des Mysteriums von Allisters verschwundenem Schnuffwuff.
content.26.26=Nur für die Sieger des Weißen Drachen Turnieres!
