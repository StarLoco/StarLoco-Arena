summary=Zusammenfassung
summonDescription1=Der Fresssack bewegt sich immer auf den nächstgelegenen Gegner zu. Wenn er ihn erreichen kann, greift er ihn mit seinem Zauberspruch "Biss des Fresssacks" an. Sind mehrere Gegner gleichweit entfernt, nimmt er sich denjenigen vor, der am wenigen LP hat.
summonDescription2=Der Prespik ist eine Beschwörung, die dazu dient, den Gegner zu verärgern. Der Schaden ist nicht groß, aber sein Nervfaktor ist beträchtlich. In jeder Runde greift er den nächststehenden Gegner an und wirkt seinen Zauberspruch, womit er ihm einen Aktionspunkt entzieht und ihm leichten Schaden zufügt.
summonDescription3=Der Tofu ist eine besonders schnelle und schädliche Beschwörung. In jeder Runde greift er den nächststehenden Gegner an und bei Gleichstand wird der Gegner mit den wenigsten Lebenspunkten angegriffen. Dann greift er ihn mit seinem Zauberspruch an. Wenn ihr eine Motivationsspritze auf einen Tofu wirkt, dann greift dieser bis zu dreimal, statt nur einmal an.
summonDescription4=Das Wahnsinnspüppchen ist eine beschworene Kreatur, die für den Gegner ziemlich störend werden kann. Jede Runde bewegt es sich auf den nächstgelegenen Gegner zu und entzieht diesem einen AP. Bei einem kritischen Treffer sogar zusätzlich auch noch einen BP. Erhält es zwei zusätzliche AP, kann es seinen Zauber sogar 2x/Runde wirken.
summonDescription40=Diese beschworene Kreatur kann Gegner ganz schön verwirren. Sie hat nämlich denselben Namen wie der Sram, so dass es schwierig ist den Beschwörer und das beschworene Wesen zu unterscheiden. Jede Runde wird sich letzteres zum nächstgelegenen Gegner bewegen, bei Gleichstand zu dem mit den wenigen LP.
summonDescription5=Das Blockpüppchen bewegt sich auf den nächstgelegenen Gegner zu und heftet sich an ihn. Es kann zwar nicht angreifen, besitzt dafür jedoch einen sehr hohen Blockier-Wert und einiges an Lebenspunkten. Das macht diese beschworene Kreatur sehr störend für alle Kämpfer, die auf gute Mobilität angewiesen sind.
summonDescription6=Bäume werden als passive Hindernisse eingesetzt. Sie selbst tun nichts und können nicht fortbewegt werden. Allerdings besitzen sie zahlreiche Lebenspunkte und behindern Sichtlinien. Sie bieten also Kämpfern die sich hinter ihnen verstecken einen ausgezeichneten Schutz.
summonDescription7=Das Zifferblatt ist ein passives Hindernis. Das Einzige was es tut, ist den Zauberspruch Mirwar zu wirken, der alle Schadenszauber auf den Zaubernden zurückwirft. Wenn ihr ein Zifferblatt unschädlich machen wollt, müsst ihr eure Fäuste oder eine Waffe einsetzen. Alternativ wirken alle indirekten Zaubersprüche wie Gift oder solche mit Schubsschaden auch darauf und ist es erst entzaubert, verliert es seinen Schutz, bis es erneut Mirwar wirkt.
summonDescription8=Das Opferpüppchen ist eine gefürchtete beschworene Kreatur. Sie bewegt sich auf den nächstgelegenen Gegner zu (bei Gleichstand dem mit den wenigsten Lebenspunkten) und explodiert, wobei sie einiges an Schaden anrichtet.
summonDescription9=Der Krachler ist eine mächtige beschworene Kreatur. Jede Runde bewegt sie sich auf den nächstgelegenen Gegner zu (bei Gleichstand dem mit den wenigsten Lebenspunkten) und wird ihm mit seinen zwei mächtigen Angriffen neben Schaden auch noch jeweils einen BP entziehen.
