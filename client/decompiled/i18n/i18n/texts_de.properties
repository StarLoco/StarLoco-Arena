content.59.7=Hallo,\n\n\n\nIch heiße Baan. Ich bin hier, um dich in der Hormonde, der Dimension in der du dich grade befindest zu führen. Was möchtest du wissen?
content.59.8=Sehr gut. Welches Thema interessiert dich?
content.59.10=Ok, ich nehm dich mit in die Trainingsarena. Ich hab da einen Fresssack, der liebt es, Schläge einzustecken.
content.59.11=In dieser Welt sind deine zwei hauptsächlichen Ziele dein Platz im  <b>Ranking</b> und deine <b>Kards</b>sammlung!\n\nUm Plätze in den verschiedenen Rankings der Hormonde zu gewinnen, muss man sich den anderen Spielern stellen und Siege in der Arena hintereinander reihen, um so seine Stärke zu beweisen.\n\nWenn man ein Match gewinnt, dann kann man auch <b>Kards</b> gewinnen und diese seinem Sammelsurium hinzufügen. Um alle  <b>Kards</b> der Hormonde zu erhalten, stehen einem die <b>Booster</b> zur Verfügung (die man mit Ogrinen auf der Webseite des Spiels kaufen kann), die <b>KardMaster</b>, die man auf den Inseln antrifft, sowie <b>Umwandlungslabore</b>.\n\nKonzentriere dich im Moment auf einen Spielmodus (Der Evolution-Modus ist ein guter Anfang) und versuche dort, Siege aneinander zu reihen.
content.59.12=In der Hormonde gibt es zahlreiche Kampfarten, die man auch <b>Spiel-Modi</b> nennt. Auf dieser Insel triffst du auf <b>Gaisder</b>, die dir jeden dieser Spielmodi genauer erklären.  \n\nKurz zusammengefasst ist es so, dass du beim <b>Evolution-Modus</b> mit einem Team spielst, dessen Stärke mit dem Training zunimmt. Im Gegensatz dazu sind im <b>Elite-Modus</b> alle gleichgestellt und es müssen hier gute Spielkenntnisse vorliegen. Anders ausgedrückt sollte man vielleicht nicht mit diesem Modus beginnen. Der <b>2 vs. 2 Elite-Modus</b> bietet dir an, dein Elite-Team mit einem Freund zu teilen. Schließlich gibt es noch den <b>Turnier-Modus</b>, auch <b>Persönlicher Modus</b> genannt, der dir jedes Mal beim Spielen andere Regeln anbietet und bei dem man an Turnieren teilnehmen und tolle <b>Kards</b> und sogar Gegenstände aus <b>DOFUS</b> oder <b>Wakfu</b> gewinnen kann!\n\nDie <b>Gaisder</b> sind dir gerne behilflich, denn ihre in den Arenen gefallenen Kämpferseelen müssen diese letzte Aufgabe erfüllen, bevor sie frei sind, nutze also ihre Hilfe.
