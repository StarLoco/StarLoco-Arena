endFightTurnAchievementDescription0=Ist das alles?\n\nMann, was bist du nur für eine Zimperliese! Hast du etwa Angst vor uns? Willst du einen Teddy zum Einschlafen heute nacht?\n\nPffhh! Dabei wollten wir nur spielen.
endFightTurnAchievementDescription1=Hmm... Nicht schlecht. Aber mach es beim nächsten Mal besser.\n\nWir, wir mögen es, wenn du versuchst Widerstand zu leisten.
endFightTurnAchievementDescription2=Hervorragend! Es war eine Freude, euch bei den Kämpfen zuzusehen.\nHeutzutage gibt es nämlich nur noch wenige Coachs, die in der Lage sind, unseren Wettbewerb gegen die Zeit erfolgreich zu meistern.
endFightTurnAchievementDescription3=Du, du bist ein wahrer Kämpfer! Du hast 30 Runden lang durchgehalten. Gut gemacht!\nIch glaube, von dir wird man noch viel hören. Eine wahre Kämpfernatur, sage ich!
endFightTurnAchievementName0=Du hast es keine 10 Runden durchgehalten
endFightTurnAchievementName1=Du hast ein Dutzend Runden durchgehalten.
endFightTurnAchievementName2=Bravo, du hast dich wacker gehalten.
endFightTurnAchievementName3=Bravo, Champion!
enteringTimeChallenge=Die Stundenglasdämonen finden im Moment keinen Gegner mit deinem Niveau, daher haben sie beschlossen herauszufinden, wieviele Runden du bei einer ihrer "Time Challenges" durchhältst.\n\nVersuche, so lange wie möglich zu überleben, jede überstandene Runde lässt dich an Erfahrung gewinnen. Keine Sorge, bei einer Time Challenge gibt es keine Müdigkeit oder Verletzungen oder Tod zu fürchten und natürlich auch keine Niederlage, die dir angerechnet werden könnte, diese Partie zählt nicht beim Ranking! \n\nViel Glück.
