content.38.284=Yeah! Du hast die letzte Herausforderung des Dämons III gewonnen! Benutze die Zaap-Kard die du erhalten hast, um diese Insel zu verlassen. Begebe dich dazu zum Zaap ganz im Nordosten.
content.38.285=Du bist nicht zufälligerweise ein halber Sadist... Jetzt schau dir mal deinen armen Kämpfer an! Er hält sich die Hoden und fällt zu Boden!\nIch fühle mit ihm...
