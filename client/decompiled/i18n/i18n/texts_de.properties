content.29.300=Oh weh! Einer deiner Kämpfer wurde verwundet. Keine gute Nachricht, denn wenn du ihn nicht heilst, wird er in den nächsten Kämpfen einen Malus erleiden.
content.29.301=Bei einer großen Zahl an Verletzungen kann sogar irgendwann der Tod eintreten. Naja, eigentlich geht mich ja das Ganze nichts an. Schließlich sind es deine Kämpfer und du kannst mit ihnen machen, was du willst.
content.29.302=Natürlich zwingt dich niemand dazu, ihn zu heilen... Allerdings solltest du wissen, dass die Chance weitere Verwundungen zu erleiden umso größer ist, je mehr Verwundungen er erlitten hat und je größer seine Müdigkeit ist.
content.29.303=Mir scheint, ein Coach hätte letztens erzählt, er habe eine Reihe von Heilgegenständen durch einen Booster erhalten.
content.29.304=Wenn du einen Trank der Wiedererweckung gefunden hast, musst du dich zum Friedhof begeben, um deinen Kämpfer ins Leben zurückzuholen. Benutze deine Karte (M-Taste), um herauszufinden, wo sich der Friedhof befindet.
content.29.305=Fürs Erste rate ich dir, den Kämpfer zum Friedhof zu schicken, wo er in Frieden ruhen kann.
content.29.306=Aber noch ist nicht alles verloren. Erinnerst du an die Booster von denen ich dir erzählt habe? Dort sind Heilgegenstände enthalten. Es heißt sogar, es soll Tränke der Wiedererweckung geben.
content.29.307=Ich hatte dich doch gewarnt! Aber du wolltest ja nicht auf mich hören. Jetzt ist einer deiner Kämpfer tot.
content.29.308=He, du da hinten! Ja, genau du! Jetzt mach nicht so ein verdattertes Gesicht und komm her zu mir, damit wir uns ein wenig unterhalten können. Weißt du wie das geht? Das Herkommen, meine ich. Klick ein Feld an, um dorthin zu laufen. Dabei hast du die Wahl zwischen dem Laufen mit linker und mit rechter Maustaste.
