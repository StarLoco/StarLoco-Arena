content.26.51=Eines Tages trafen die Dämonen zusammen, um das PEO zu verbieten, da es zu starke Auswirkungen hatte. Wie gut, dass sie sich nicht einigen konnten. PEO hilft, wenn ihr todmüde seid.
content.26.52=Versammelt euren Clan unter dieser prächtigen Standarte. Beim nächsten Kampf gewinnen alle Mitglieder eurer Gilde einen Bonus. Achtung, zwei Standarten können nicht gleichzeitig aktiv sein.
content.26.53=Ein kleiner Durchhänger? Ist die Motivation auf dem Tiefpunkt? Einmal Arena Max trinken und schon geht es wieder aufwärts! Arena Max - weckt den Tiger in dir!
content.26.54=Wenn ihr eure Chancen erhöhen wollt, am Ende eines Kampfes gute Kards zu gewinnen, dann sind diese Tränke hier angesagt. Die Tränke Ene, Mene, Miste sind die einzigen Tränke, die gleichzeitig benutzt werden können. 
content.26.55=Mit den Runen kann man die Schlösser des Kanedos deiner Kämpfer öffnen. Außerdem werden die Fähigkeiten einige Kämpfe lang erhöht. Kleine Runen kommen vor allem bei den ersten Schlössern des Kanedos zum Einsatz.
content.26.56=Erfahrungstränke geben einem eurer Kämpfer etwas Auftrieb. Das ist vor allem dann praktisch, wenn ihr einen Anfänger als Krieger rekrutiert.
content.26.57=Mit diesem gespenstischen Set könnt ihr nun endlich euren Freunden erzählen, wie geistreich ihr doch seid!
content.26.58=Mit diesem Set auf dem Rücken, könnt ihr Fresssäcke herumkommandieren... oder sie spießen euch auf, weil ihr ihrem Anführer das Fell abgezogen habt!
content.26.59=Ein Set für all diejenigen, die ihren Reichtum offen hervor zeigen wollen... oder jene, die sich gerne ausrauben lassen! 
content.26.60=Wenn ihr dem Ungleichgewicht ausgesetzt seid, dann ist dieses Set genau das Richtige für euch. Und wenn ihr selbst unausgeglichen seid, dann... auch. 
content.26.61=Elementartränke erhöhen 3 Kämpfe lang den Elementarschaden eines eurer Charaktere. Achtung, alle diese Tränke haben zugleich einen negativen Nebeneffekt.
