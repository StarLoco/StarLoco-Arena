content.31.29=Lass uns ganz gemütlich anfangen und mal sehen, wie du dich gegen einen einfachen Fresssack behauptest... Mit drei Kämpfern dürfte das kein Problem sein, sogar bei einem Mickerling wie du es bist.
content.31.30=Ach du hast den Fresssack besiegt? Nicht schleeeecht... Nun, wir werden sehen, wie du dich gegenüber der Flut von Monstern machst, die dich bei der nächsten Herausforderung erwartet.\n\nAchtung, diese haben eine große Vorliebe für deine Aktionspunkte: wenn sie dir zu viele davon stehlen, kannst du keine Zaubersprüche mehr wirken!
content.31.31=Ok, ok, diese Prespiks und Wahnsinnspüppchen waren in der Überzahl, aber dafür hauten sie auch nicht fest zu!\n\nWollen wir doch mal sehen, wie du es mit einem echten Gegner hältst. Ich denke, dass ihr diesmal zu dritt nicht zuviel und nicht zu wenig sein werdet.\n\nDer Krachler ist stark, er schlägt hart zu und außerdem stiehlt er dir Bewegungspunkte. Ein kleiner Tipp, wenn du nicht als Bettvorleger enden willst: versuche so oft es geht, aus der Entfernung zuzuschlagen, bevor er dich in einen Nahkampf verwickelt.
content.31.32=In ein paar Sekunden erledigt. Das ist ein Kampf, wie wir ihn mögen, blutig und schnell. Vergiss niemals die Wichtigkeit der Aktionskarten, setze sie immer im besten Augenblick ein. Sie kosten nur wenig Aktionspunkte und sind oft stärker als der Zauberspruch eines Kämpfers. Sie versorgen dich mit Vielseitigkeit, die dir zum Sieg verhilft. 
content.31.33=Du bist bereit! Geh zum Dämon I, er wird dir die Erlaubnis zur Teilnahme am großen Turnier geben. Du kannst gerne zum Trainieren wieder herkommen. Solange deine Kämpfer Anfänger sind, gewinnen sie ein wenig an Erfahrung. Danach musst du gegen andere Coachs antreten, um mehr Erfahrung zu gewinnen.
content.31.34=Bravo! Was für ein phänomenaler Sieg! Also, nicht vergessen: die Bonusfelder können im Kampf von entscheidendem Vorteil sein. In den Arenen des großen Turniers befinden sich diese oft in der Mitte des Terrains. Versuche sie zu benutzen, du wirst sehen, sie können den Ausgang eines Kampfes beeinflussen.
content.31.35=Du hast die Fallen des Dämons der 52. Minute umgangen, gut gemacht. Vergiss im Kampf niemals die Felder mit Fallen. Diese können großen Schaden anrichten, aber die Todesfelder erledigen einen Charakter ohne viel Federlesens. Wenn du über Charaktere verfügst, die schubsen, anziehen oder gar mit einem Gegner Plätze tauschen können, dann nutze diese Felder zu deinem Vorteil.
content.31.36=Hoppla, und weg damit. Wenn ein Bogenschütze erstmal in einen Nahkampf verwickelt ist, kann er nicht mehr viel machen. Wenn du erstmal mitten im großen Turnier bist, dann solltest du dir es als Reflex angewöhnen, dir immer die Kards der nächsten zwei Runden anzusehen. Diese werden nie so stark sein, wie jene, die du gerade gesehen hast, aber sie können dennoch immer das Ende eines Kampfes beeinflussen.
content.31.37=Na, kleiner Coach, fühlst du dich nicht so gut?\n\nZuviel Gift? Oooh, Warmduscher.
content.31.38=Muwaaahahahaha!\n\nDu magst diesen Iop.\n\nEr bringt uns immer zum Lachen, vor allem wenn er ein lausiges Team zerquetscht.
content.31.39=Wir hatten daran gedacht, einen einzigen Wächter hinzustellen, einen, der Fragen stellt.\n\nAber wenn die Rückstoßpfeile so herumschwirren, ist das lustiger. \nSchade, dass Keiner gefallen ist...
content.31.40=Mein kleiner Garten ist doch nett, oder?\n\nIch lass dort Kawotten wachsen.\n\nAber um sie vor den Wabbits zu schützen, stelle ich immer ein paar Wächter auf.\n\nDie zerquetschen dann die Wabbits.
content.31.41=Nun? Ist das alles?\n\nWir wollten sehen, was du so drauf hast... und sind ein bisschen enttäuscht. Bist du sicher, dass du es im Turnier bringen wirst, Mickerzwerg?
content.31.42=Haaa, eine kleine Herausforderung ist schön erfrischend.\n\nDas belebt und stärkt.\n\nEin Sram und auf geht's.
content.31.43=Diese Eniripsas sind doch nett. Sie heilen und verteilen Backpfeifen. So hält der Gegner länger durch, leidet länger und wir ergötzen uns daran.
content.31.44=Jetzt, wo du die Macht der Sekundendämonen zu spüren bekommen hast, kannst du zurück in die Arena und gegen deinesgleichen kämpfen. \n\nWir wollen Kämpfe, Verletzte und Tote! Ausführen!
content.31.45=Bravo! Diesem Dämonen hast du eine Lektion erteilt! Dank deiner Hilfe ist Barnabas nun frei! Benutze nun seine Kard, um ihn zurück zu seinem Herrchen in der Welt der Zwölf zu schicken. 
content.31.46=
