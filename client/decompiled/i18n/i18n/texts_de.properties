challengeHelpDescription32=Du hast ganze... 10 Sekunden durchgehalten. Das könnte besser sein. Du musst die Aktionskards deines Coachs benutzen. Davon hast du drei. Der zurückstossende Wind stösst einen Gegener zurück. Wie du siehst, steht der Dämon da unten gerade vor einem tödlichen Feld. schubs ihn rein. Die Blitzkarte hat eine grosse Reichweite. Mit ihr müsstest du das Doppelte erreichen. Die Beschleunigungskarte lässt dich schneller werden.
challengeHelpDescription33=Na gut, ich helfe dir, denn es ist nicht ganz so einfach. Der erste Kristall den du erledigen musst, ist der Regenerationskristall, ganz links. Aber um an ihn heranzukommen, musst auf den Kristall der Macht aufpassen, denn dieser beschützt ihn. Versuche die Fähigkeiten deiner Charaktere zu benutzen, wie die Unsichtbarkeit, Beschleunigung, Sprung, Verlangsamen oder gar den Lähmpfeil, um ohne getroffen zu werden durchzukommen. 
challengeHelpDescription34=Oh weia! Das ist ein dicker Brocken und er haut feste zu! Daher werde ich dir einen kleinen Tipp mit auf den Weg geben. Auf den zwei braunen Feldern mit gelben Sternen erhalten deine Charaktere einen Bonus auf den Schaden, den sie anrichten. Dadurch dürften sie den Dämonen besiegen können.
challengeHelpDescription35=Du bist in die Falle des Dämons der 52. Minute hineingeraten.
challengeHelpDescription36=Geh in Deckung! Wie willst du denn gegen einen guten Bogenschützen ankommen, wenn du wie eine Zielscheibe in der Mitte der Arena stehenbleibst? Sieh zu, dass du am Ende jeder Runde hinter einem Baum in Deckung gehst. Etwas, was dir helfen könnte, sind die Kards mit Ereignisboni! Alle 6 Runden erhalten eure Kämpfer dadurch zusätzliche Bewegungspunkte. Nutzt diese Runde, um von einem Baum zum nächsten zu sprinten.
challengeHelpDescription45=Es ging leider schief, aber das ist kein Grund aufzugeben! Setze die Bonusfelder weise ein und weiche den Simultanangriffen der Kristalle aus. Wenn das immer noch nicht reichen sollte, dann trainiere deine Kämpfer noch ein wenig und kehre dann zurück, um diesen vermaledeiten Dämon mit einem großen Bonus auf angerichteten Schaden zu bekämpfen.
