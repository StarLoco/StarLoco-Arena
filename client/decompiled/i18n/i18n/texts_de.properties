help=Hilfe
help.aoe=<b>Wirkungsbereich</b>\n\n\n\nEs handelt sich hierbei um den Wirkungsbereich deines Zauberspruchs. Der Wert darunter zeigt die Größe des Bereichs an. Ein Punkt bedeutet, dass dein Zauberspruch ein einziges Feld trifft. Ein Kreuz bedeutet, dass dein Zauberspruch in alle Richtungen wirkt. Eine Linie bedeutet, dass dein Zauberspruch auf alle Ziele einer gleichen Geraden wirkt. 
help.cardActionPoints=<b>Kosten in Aktionspunkten</b>\n\n\n\nEs handelt sich hierbei um die Anzahl der Aktionspunkte, die zum Wirken dieses Zauberspruchs benötigt werden.
help.cardRange=<b>Reichweite</b>\n\n\n\nEs handelt sich hierbei um die minimale und maximale Entfernung mit der der Zauberspruch gewirkt werden kann. Die Reichweite 0 zeigt an, dass ein Zauber nur auf sich selbst gewirkt werden kann oder dass es sich hierbei um einen Zauberspruch handelt, der auf die ganze Kard wirkt. 
help.cardValue=<b>Kosten in Kamas</b>
helpConsumable=<b>Einsatz von Nahrungsmitteln und Tränken</b>\n\nUm Nahrung oder Tränke zu sich zu nehmen führt einen, <b>Linksklick</b> auf die Kard und dann auf den Kämpfer eurer Wahl aus.
help.cooldown=<b>Cooldown (Globaler Cooldown)</b>\n\n\n\nEs handelt sich hierbei um die Anzahl an Runden, die man abwarten muss, bevor der Zauberspruch erneut gewirkt werden kann. Wenn eine Zahl in Klammern steht, bedeutet dies, dass bei diesem Zauberspruch ein Globaler Cooldown besteht, d.h. deine anderen Charakter können in dieser Zeit den Zauberspruch ebenfalls nicht wirken. Dein Gegner kann allerdings davon Gebrauch machen. 
help.criticalHit=<b>Prozentsatz der Kritischen Treffer</b>\n\n\n\nChance in % einen Kritischen Treffer zu landen und zwar jedes Mal wenn der Kämpfer einen Zauberspruch wirkt oder einen Angriff ausführt.
help.damageRebound=<b> Schaden zurückwerfen</b>\n\n\n\nEs handelt sich hierbei um den Schaden in Prozent der jedes Mal zurückgeworfen wird, sobald der Charakter verletzt wird.
help.dmg=<b>Bonus auf Schaden</b>\n\nAuf alle Angriffe, die auf ein Element (Feuer, Wasser, Erde, Luft) basieren, gibt es einen zusätzlichen Prozentsatz an angerichtetem Schaden.
help.dodge=<b>Ausweichen</b>\n\n\nJedes Mal, wenn ein Kämpfer versucht, aus einem Nahkampf mit einem Gegner auszubrechen, kann dieser einen Blockierversuch machen, um ihn seine Runde verlieren zu lassen. Dein Prozentsatz an Ausweichen erhöht die Chance, nicht blockiert zu werden. \nWenn du über 100% Ausweichen verfügst, dann kannst du charaktern mit 0% Blockierchancen zwar immer ausweichen, aber deine Ausweichchancen verringern sich bei einem Gegner mit mehr Blockierchancen. Alle Charakter verfügen über 100% an Ausweichchancen.
help.earth=<b>Bonus auf Erdschaden</b>\n\n\n\nAuf alle Angriffe die auf Erdelementen basieren, gibt es einen zusätzlichen Prozentsatz an Schaden, der durch ein braunes Icon dargestellt wird.
help.earthRes=<b>Resistenz gegen Erdschaden</b>\n\n\n\nStellt deine Resistenz gegen Erdschaden dar. Angriffe die auf Erdelementen basieren (wird durch ein braunes Icon dargestellt), werden um diesen Prozentsatz verringert. Achtung: über 100% Resistenz zu verfügen, garantiert dir keine Immunität gegen dieses Element, denn der Bonus auf Erdschaden deines Gegners wird von deiner Resistenz abgezogen. 
help.fighterActionPoints=<b>Aktionspunkte</b>\n\n\n\nDein Kämpfer hat jede Runde diese bestimmte Anzahl von Aktionspunkten. Diese können zum Wirken von Zaubersprüchen oder für den Nahkampfangriff eingesetzt werden. Ein Charakter mit vielen Aktionspunkten kann mehr Handlungen ausführen. Im Allgemeinen ist es so, dass Kämpfer sechs Aktionspunkte haben. 
help.fighterRange=<b>Bonus auf Reichweite</b>\n\n\n\nHierbei handelt es sich um die Anzahl der Felder, die zur Reichweite aller Zaubersprüche hinzugezählt werden, die dein Charakter wirkt. Achtung: Boni/Mali auf Reichweite haben bei Zaubersprüchen, die beim Nahkampf gewirkt werden keinen Einfluss.
help.fighterValue=<b>Kosten des Charakters</b>\n\n\n\nHierbei handelt es sich um die Kosten deine Charakters in Kamas. Ein Standard-Team kostet maximal 6000 Kamas und kann 1 bis 6 Charakter enthalten.
help.fire=<b>Bonus auf Feuerschaden</b>\n\n\n\nAuf alle Angriffe die auf Feuerelementen basieren, gibt es einen zusätzlichen Prozentsatz an Schaden, der durch ein rotes Icon dargestellt wird.
help.fireRes=<b>Resistenz gegen Feuerschaden</b>\n\n\n\nStellt deine Resistenz gegen Feuerschaden dar. Angriffe die auf Feuerelementen basieren (wird durch ein rotes Icon dargestellt), werden um diesen Prozentsatz verringert. Achtung: über 100% Resistenz zu verfügen, garantiert dir keine Immunität gegen dieses Element, denn der Bonus auf Feuerschaden deines Gegners wird von deiner Resistenz abgezogen. 
help.firework=Dank des <b>Feenwerkantriebs</b>, könnt ihr die schönsten pyrotechnischen Vorführungen der Hormonde veranstalten! Ordnet eure Feenwerk-Kards in der gewünschten Reihenfolge an, mit der sie abgeschossen werden sollen und zeigt darunter die Abschusszeit an.
help.healBonus=<b>Bonus auf Heilung</b>\n\n\n\nDies ist der Prozentsatz an Boni der zu allen Heilzaubern die dein Charakter wirkt hinzukommt.
help.healthPoints=<b>Anzahl der Lebenspunkte</b>\n\n\n\nWenn ein Kämpfer Null Lebenspunkte hat, dann stirbt er. Sind alle Kämpfer tot, dann ist der Kampf beendet. Im Allgemeinen liegen die Lebenspunkte eines Kämpfers zwischen 60 und 100 Lebenspunkten.
help.initiativePoints=<b>Initiative</b>\n\n\nIm Laufe eines Kampfes, handeln die Kämpfer in umgekehrter Reihenfolge ihrer Initiative und das immer in der gleichen Reihenfolge, es sei denn sie verfügen über die gleiche Punktzahl an Initiative, in diesem Fall entscheidet der Zufall. Im Allgemeinen liegt die Punktezahl zwischen 0 und 100.
help.movePoints=<b>Anzahl der Bewegungspunkte</b>\n\n\n\nWenn dein Kämpfer in einer Runde an der Reihe ist, dann kann er sich so weit fortbewegen, wie er Bewegungspunkte hat. Im Allgemeinen haben die Kämpfer drei Bewegungspunkte.
help.nbSummons=<b>Anzahl an beschwörbaren Kreaturen</b>\n\nDiese Zahl gibt an, wieviele beschworene Kreaturen dein Kämpfer gleichzeitig in einem Kampf kontrollieren kann.
help.openClose=Tutorial
help.res=<b>Schadensresistenz</b>\n\nGibt den Prozentsatz an Resistenz gegenüber einem bestimmten Element an (Luft, Erde, Feuer, Wasser). Angriffe in diesem Element werden um den Prozentsatz an Resistenz darin gesenkt. Hinweis: 100% Resistenz bei einem bestimmten Element bedeutet noch lange nicht, dass man immun darin ist, da der Schadensbonus des Gegners von der Resistenz abgezogen wird.
help.summonCC=<b>Meister der Beschwörung: Kritische Treffer</b>\n\nBeschworene Kreaturen des Kämpfers erhalten im Kampf einen Bonus auf kritische Treffer. Dadurch haben sie eine erhöhte Wahrscheinlichkeit, bei ihren Zaubersprüchen oder Angriffen einen kritischen Treffer zu landen.
help.summonDmg=<b>Meister der Beschwörung: Schaden</b>\n\nBeschworene Kreaturen des Kämpfers richten im Kampf erhöhten Schaden an.
help.summonHp=<b>Meister der Beschwörung: Lebenspunkte</b>\n\nBeschworene Kreaturen des Kämpfers verfügen im Kampf über eine erhöhte Zahl an Lebenspunkten.
help.summonRes=<b>Meister der Beschwörung: Resistenz</b>\n\nBeschworene Kreaturen des Kämpfers verfügen im Kampf über eine erhöhten Schadensresistenz.
help.summonTackle=<b>Meister der Beschwörung: Blockieren</b>\n\nBeschworene Kreaturen des Kämpfers verfügen im Kampf über eine erhöhte Blockierfähigkeit. Jedes Mal, wenn ein Gegner den Nahkampfbereich zu einer beschworenen Kreatur verlassen möchte, wird ein Duell zwischen seinem Wert in Ausweichen und der Blockierfähigkeit der Kreatur durchgeführt.
help.tackle=<b>Blockieren</b>\n\n\n\nJedes Mal wenn ein Gegner versucht, den Nahkampf mit einem deiner Kämpfer zu entkommen, wird dieser versuchen ihn daran zu hindern, d.h. ihn zu blockieren. In diesem Fall erfolgt ein Ausweichversuch gegen deine Blockierfähigkeiten. Diese Eigenschaft bedeutet einen bestimmten Prozentsatz an Wahrscheinlichkeit einen Gegner mit 100% Ausweichchance zu blockieren. Viele Kämpfer haben 0% Blockierchance und können also nie einen Gegner abblocken. 
help.target=<b>Ziel</b>\n\n\n\nFrei bedeutet, dass der Zauberspruch gewirkt werden kann, wo man möchte. Leer bedeutet, dass der Zauberspruch auf ein freies Feld gewirkt werden muss. Verbündet bedeutet, dass der Zauberspruch nur Verbündete betrifft. Eigener Charakter bedeutet, dass ein Zauberspruch exklusiv nur auf diesen bestimmten Kämpfer gewirkt werden muss. Beschwörungen bedeutet, dass der Zauberspruch auf eine Beschwörung gewirkt werden muss.
help.water=<b>Bonus auf Wasserschaden</b>\n\n\n\nAuf alle Angriffe die auf Wasserelementen basieren, gibt es einen zusätzlichen Prozentsatz an Schaden, der durch ein blaues Icon dargestellt wird.
help.waterRes=<b>Resistenz auf Wasserschaden</b>\n\n\n\nStellt deine Resistenz gegen Wasserschaden dar. Angriffe die auf Wasserelementen basieren (wird durch ein blaues Icon dargestellt), werden um diesen Prozentsatz verringert. Achtung: über 100% Resistenz zu verfügen, garantiert dir keine Immunität gegen dieses Element, denn der Bonus auf Schaden deines Gegners wird von deiner Resistenz abgezogen. 
help.wind=<b>Bonus auf Luftschaden</b>\n\n\n\n\nAuf alle Angriffe die auf Luftelementen basieren, gibt es einen zusätzlichen Prozentsatz an Schaden, der durch ein grünes Icon dargestellt wird.
help.windRes=<b>Resistenz auf Luftschaden</b>\n\n\n\nStellt deine Resistenz gegen Luftschaden dar. Angriffe die auf Wasserelementen basieren (wird durch ein grünes Icon dargestellt), werden um diesen Prozentsatz verringert. Achtung: über 100% Resistenz zu verfügen, garantiert dir keine Immunität gegen dieses Element, denn der Bonus auf Schaden deines Gegners wird von deiner Resistenz abgezogen. 
