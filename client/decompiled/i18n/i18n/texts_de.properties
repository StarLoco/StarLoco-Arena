content.29.90=Aua! Au! Autsch!
content.29.91=Was ist denn das für ein Ding? Und wer bist du denn?
content.29.92=Grrrr! Heutzutage kann man ja keinen Spaziergang mehr zwischen den Dimensionen unternehmen, ohne gleich auf Müll zu stoßen...
content.29.93=Es sei denn, es handelt sich dabei um einen Trick der Stundenglasdämonen. Man sagt, sie würden diese Gegend hier unsicher machen.
content.29.94=Lass mich raten: Du verstehst hier nur Bahnhof? Dann hör mir zu. Ich bin Adamaï. Du wurdest von einem Stundenglasdämonen gefangen genommen und wirst gerade zu ihrer Heimatwelt gebracht! Dort wirst du eine Gruppe an Gladiatoren aufstellen müssen, die dann für dich kämpfen werden...
content.29.95=Wenn deine Krieger genug Siege erringen, dann wirst du ganz oben in der Rangliste mitmischen und vielleicht sogar frei sein!
content.29.96=Sonst?... nun ja... sonst stirbst du!
content.29.97=Achtung, nun könnte es etwas holprig werden...
content.29.98=Es gibt hier ein, zwei Dinge, über die man besser Bescheid wissen sollte, sonst sieht die Zukunft düster aus.
content.29.99=So zum Beispiel...
content.29.100=Wenn ich dir sage: "durch Anklicken der Schwerter startest du die Suche nach einem Kampf", musst du auf den entsprechenden Button drücken. Und schon startet ein Kampf. Faszinierend, nicht wahr? Aber noch NICHT jetzt...
content.29.101=Du beweist Disziplin. Aber jetzt klick bitte auf die leuchtende Stelle. Bitte etwas flotter das Ganze - ich habe schließlich nicht den ganzen Tag Zeit.
content.29.102=Hier ist ein vordefiniertes Team. Bald kannst du dieses Team testen oder sogar einen Kampf eröffnen, indem du...
content.29.103=Durch Anklicken?
content.29.104=Indem du auf die Schwerter klickst, genau! Ich weiss, dass es dir in den Fingern juckt, aber du wirst besser noch ein wenig damit warten.
content.29.105=Was du nun als nächsten tun wirst, gehört zu den möglicherweise wichtigsten Dingen in deinem Leben als Coach: nämlich dein Team verwalten und deine Kämpfer ausrüsten.
content.29.106=Klicke bitte auf den leuchtenden Button, um ein neues Team zu erstellen, gib diesem einen Namen und bestätige durch einen Klick auf OK.
content.29.107=Jetzt klick bitte auf "Einen Kämpfer anheuern", wähle dessen Klasse und einen gültigen Namen aus. Bestätige dann durch Ok.
content.29.108=Gib diesem als nächstes einen Hut, der 100 Kamas kostet. Finde den Krachlerhelm und mache einen Doppelklick darauf.
content.29.109=Geschafft! Der Charakter erhält dadurch nun einen Bonus von 15% auf Feuer-Resistenz. Wenn du nicht weißt, was das ist, dann solltest du noch einmal den Leitfaden durchlesen!
content.29.110=Nun kannst du dieses Fenster hier schließen. Es gäbe zwar noch einige Dinge zu sagen, aber ich werde es dir überlassen den Rest selbst herauszufinden.
content.29.111=Durch Anklicken der Schwerter startest du die Suchfunktion für einen Kampf gegen einen anderen Coach. Darum überprüfe vorher am besten noch einmal dein Team und verfeinere deine Taktik.
content.29.113=Nun ist der Moment gekommen und Lebwohl zu sagen. Ich werde nämlich besser verschwinden... meine Nase hat den unangenehmen Geruch eines Dämonen aufgeschnappt...
content.29.114=Ein letzter Rat: Vergiss nicht ebenfalls Zaubersprüche für deine Kämpfer hinzuzufügen. Man fügt sie genau wie Gegenstände hinzu, außer dass sie in einer Liste auf der rechten Seite erscheinen. Du wirst sehen, sie werden dir sehr nützlich sein!
content.29.115=He! Du sollst das doch nicht anfassen, hab ich gesagt! Hör mir noch eine Weile zu, das was kommt ist wichtig! 
content.29.116=Das Tutorial überspringen
content.29.117=Hmm, du hast Potential!\n\nZeig mir mal, wozu du im Kampf fähig bist. Ich könnte dir sogar ein paar Tricks beibringen, damit du überlebst und wer weiss? Vielleicht wirst du eines Tages sogar für mich in der Arena kämpfen! 
content.29.118=<b>Du bist auf einer Insel von Dofus-Arena.</b>\n\nHier steuerst du deinen Coach, der mit anderen Coachs (anderer Spieler), Gegenständen oder NSCs (Nicht-Spieler-Charakter) interagieren kann.\n\nMit einem Rechtsklick kannst du dich fortbewegen, bei einem Linksklick auf einen Gegenstand oder einen Spieler kannst du mit diesen interagieren. Über das Optionsmenü kannst du das aber umstellen und die Klicks austauschen. 
content.29.119=<b>Du befindest dich in einem Kampf. Für mehr Informationen zu den Fenstern während eines Kampfes, suche den Dämon III auf der Insel Maknala oder lies das entsprechende Kapitel im Spielerhandbuch, das du in deinem Installationsverzeichnis von Dofus-Arena findest.</b>
content.29.120=<b>Dies ist das Fenster mit dem Ranking.</b>\n\nHier findest du das Ranking der besten Spieler in Dofus-Arena.\nMan sieht nicht nur die Position des Spielers, sondern bekommt auch Informationen über das beste Team dieses Spielers, über ihre Stärke, die Anzahl der Siege und Niederlagen des Spielers mit diesem Team uvm.
content.29.121=<b>Dies ist das Fenster mit den Coach-Statistiken.</b>\n\nHier erhältst du interessante Informationen wie zum Beispiel, wieviel Zeit du mit dem Spielen von Dofus-Arena verbracht hast, sowie die Zahl deiner Siege oder Niederlagen aller deiner Teams.
content.29.122=<b>Dieses Fenster gestattet es dir, deine Freundesliste, deine "schwarze Liste" und deinen Clan zu verwalten.</b>
content.29.123=<b>Dies ist das Inventar-Fenster deines Coachs.</b>\n\nHier ist eine Liste aller Coach-Kards die du besitzt (das sind die Kards, die du am Ende eines Kampfes gewinnst und die nur auf den Coach-Inseln was bringen). \n\nDie Registerkarte über dem Fenster stellen die verschiedenen Kategorien von Kards dar (Ausrüstung, Spezialkards, Teleportation, usw....).\n\nZum Finden von bestimmten Kards verfügst du über mehrere Filter, die du entweder rechts über kleine Kästchen ankreuzen oder über das Scroll-Menü über manchen Fenstern festlegen kannst. 
content.29.124=<b>Dies ist das Fenster zur Teamverwaltung.</b>\n\nHier werden alle deine Teams aufgeführt, wobei sie nach Stärke geordnet sind (vom stärksten bis zum schwächsten Team). Das stärkste Team bestimmt das Niveau deines Coachs (wenn dein bestes Team auf Stufe 14 ist, dann ist dein Coach ebenfalls auf Stufe 14).\nUm die Zusammenstellung eines Teams zu verändern, musst du nur einen Kämpfer aus deiner Reserve in eines deiner Teams rüberziehen (unten rechts) oder umgekehrt.\nWenn du in einem Team einen neuen Kämpfer erstellen möchtest, dann klicke zuerst unten rechts am Fenster auf den Button "Einen Kämpfer erstellen"; das Fenster erscheint in deiner Kämpfer-Reserve, von dem aus du ihn in dein Team stellen kannst. \nVergiss nicht, dass die einzig wichtige Regel beim Erstellen eines Teams gilt, nämlich niemals mehr als 6000 Budgetpunkte zu verbrauchen.
content.29.125=<b>Dies ist das Fenster zum Melden von Bugs.</b>\n\nGib deinen Text in die entsprechenden Felder ein und beschreibe dein Problem. Wenn möglich, erklär auch, wie man das Problem reproduzieren kann. \nKlick anschliessend auf "Bestätigen", damit deine Nachricht gleich zu den Entwicklern des Spiels geschickt wird. Diese werden dir nicht direkt antworten, aber sie werden versuchen, das von dir beschriebene Problem so schnell wie möglich zu lösen.
content.29.126=<b>Dies ist das Fenster mit den Spiel-Optionen.</b>\n\nHier kannst du die verschiedenen Parameter im Spiel ändern, aber Achtung: die Videoparameter können die Geschwindigkeit des Spiel beeinträchtigen oder das Spiel ganz behindern.
content.29.127=<b>Dies ist das Fenster zur Verwaltung deiner Mailbox.</b>\n\nÜber die Mailboxen kannst du einem anderen Coach eine Nachricht senden und empfangen (egal, ob er eingeloggt ist oder nicht).  \nDie Mailboxen funktionieren wie E-Mail-Adressen und du kannst über sie sogar Coach-Kards verschicken, indem du sie beim Verfassen deiner Nachricht auf die entsprechenden Plätze schiebst. 
content.29.128=<b>Dies ist das Fenster zum Schreiben neuer Nachrichten.</b>\n\nHier kannst du eine Nachricht an einen Coach verschicken (egal, ob eingeloggt oder nicht). Dazu musst du den Namen des Coachs eingeben und auf den Überprüfungsbutton neben seinem Namen klicken, um dich zu vergewissern, dass der Empfänger deiner Nachricht auch existiert.\n\nDann musst du nur noch einen Betreff eingeben und deine Nachricht schreiben. Wenn du fertig bist, klickst du auf den Button "Senden".\n\nDu kannst auch Kards in die dafür vorgesehenen Plätze schieben, um Coach-Kards gleichzeitig mit deiner Nachricht zu verschicken.
content.29.129=<b>Dies ist das Fenster des KardMasters! Der KardMaster ist ein zweitrangiger Dämon, der dir einen Kartentausch vorschlägt: Kards in deinem Besitz gegen Kards in seinem Besitz.</b>\nWähl dazu aus dem linken Fenster die Kard, die dich interessiert. Mit Hilfe der SHIFT-Taste kannst du auch mehrere auswählen. \n\nSobald du die Kard(s) die dich interessieren ausgewählt hast, erscheint unter der Liste der Wert in Kamas, den der KardMaster für die Kards verlangt.\nJetzt schiebst du die Kards aus deinem Inventar in den Tauschbereich des KardMasters\n(der befindet sich unten im linken Fenster) bis der vom KardMaster verlangte Betrag erreicht oder überschritten ist (der Gesamtwert der Kards erscheint über dem Tauschbereich, links vom Zeichen "/".\n\nSobald du genug Kards verschoben hast, klicke auf den Button "Kaufen" und ein Fenster erscheint mit der Information, dass die Transaktion geglückt ist. Du findest deine neuen Kards in deinem Inventar.
content.29.130=<b>Dies ist das Fenster zum Benutzen eines Zaap.</b>\n\nZaaps sind Transportmittel zwischen den verschiedenen Inseln von Dofus-Arena. Um einen Zaap zu benutzen, musst du die Kards des Zielortes besitzen, zu dem du gelangen möchtest. \n\nZaap-Kards gewinnt man vor allem, indem man Stufen mit seinem Coach gewinnt.
content.29.131=<b>Unten rechts am Bildschirm befindet sich das Chat-Fenster. Damit kannst du mit anderen Spielern kommunizieren.</b>\n\nDer Chat verfügt über mehrere Kommunikationskanäle durch die du auswählen kannst, mit wem du reden möchtest. Um den Kanal auszuwählen, benutze die entsprechenden Tastenkürzel. \n\nDie wichtigsten Kanäle sind:\n\nDer "lokale" Chat mit dem du dich an alle Spieler um dich herum wenden kannst (Tastenkürzel: "/s").\nMit dem Clan-Chat kannst du mit deinem Clan kommunizieren ("/c").\nDer Handelskanal ist zum Tauschen von Kards da. Jeder der mit dir auf der gleichen Insel ist, hat Zugang dazu, aber du kannst nur alle 30 Sekunden eine Nachricht schreiben ("/t").\nIm Privat-Chat kannst du mit nur einer Person reden (" /w "  Leertaste und dem Coachnamen der Person mit der du reden willst).\n\nÜber die Registerkarten über dem Chat kannst du einstellen, welche Kanäle du in deinem Chat aufführen möchtest und so schnell von einer Konfiguration zur anderen wechseln!
content.29.132=<b>Dies ist das Informationsfenster des Kämpfers.</b>\n\nDieses Fenster gruppiert alle Informationen, die du benötigst, um die Statistiken und den Zustand eines deiner Kämpfer oder die deines Gegners zu kennen.\n
content.29.133=Ist zur Zeit nicht implementiert.
content.29.134=<b>Dies ist das Fenster am Ende eines Kampfes.</b>\n\nDiese Fenster fasst die wichtigen Informationen der Partie zusammen: Wer hat gewonnen, wie lange hat die Partie gedauert und welche Kards wurden vom Sieger gewonnen (zum Gewinnen von Kards, muss man 2 Kämpfe hintereinander gewinnen). Du erfährst auch ein paar Informationen über die zwei Coachs, wie zum Beispiel ihre Stufe.
content.29.135=<b>Dies ist das Fenster zum Kampfbeginn.</b>\n\nDieses Fenster stellt dir kurz das gegnerische Team und einige Statistiken des oder der Coachs vor, denen du gegenüber stehst.
content.29.136=<b>Du befindest dich in der Platzierungsphase.</b>\n\nIn dieser Phase platzierst du deine Charakter auf verschiedene Startfelder.\n\nUm einen Charakter zu verschieben, einfach auf ihn drauf klicken (er erscheint dann hell hervorgehoben)  und dann auf das Feld klicken, auf das er platziert werden soll.\nIst das Feld besetzt, wird der ausgewählte Charakter dort platziert, während der sich vorher dort befunden habene Charakter auf dem ursprünglichen Feld deines Charakters landet. 
content.29.137=<b>Dies ist das Fenster zum Tauschen von Kards, hier kannst du Kards sicher vergeben und empfangen.</b>\n\nDas Prinzip ist einfach: zuerst schiebst du die Kards, die du dem Coach geben möchtest in die dafür vorhergesehenen Plätze neben dem Namen des Coachs, mit dem du die Transaktion begonnen hast. \nWarte ab bis der andere Coach ebenfalls seine Kards platziert hat und kreuz dann das Feld "Fertig" an. \n\nIst das Feld "Fertig" angehakt und der andere Coach ändert die Kards die er mit dir tauschen will, dann entfernt sich das Häkchen automatisch. Das ist normal und soll verhindern, dass jemand mit schlechten Absichten in letzter Minute seine Karte zurückzieht und dich betrügt. Sei also unbesorgt, du kannst in Ruhe Kards tauschen!
content.29.138=<b>Dies ist das Fenster zum Erstellen eines Kämpfers.</b>\n\nWenn du zu Beginn des Tutorials am Spielanfang nicht richtig verstanden hast, wie man einen Charakter erstellt, dann beziehe dich auf das Spielerhandbuch in deinem Dofus-Arena Installationsverzeichnis.
content.29.139=<b>Dies ist das Fenster zum Ändern von Kämpfern.</b>\n\nWenn du zu Beginn des Tutorials am Spielanfang nicht richtig verstanden hast, wie man einen Charakter verändert, dann beziehe dich auf das Spielerhandbuch in deinem Dofus-Arena Installationsverzeichnis.
content.29.140=<b>Dies ist das Fenster zum Erstellen von Teams.</b>\n\nHier kannst du ein neues Team erstellen. Du musst deinem Team Kämpfer zuordnen, um mit diesem spielen zu können.\nVergiss nicht, dass die einzig wichtige Regel beim Erstellen eines Teams lautet, niemals mehr als 6000 Budgetpunkte zu verbrauchen.
content.29.141=<b>Dies ist das Fenster zum Erstellen eines Teams im Kooperationsmodus.</b>\n\nHier kannst du mit einem Freund aus deiner Freundesliste ein neues Team erstellen. \n\nVergiss nicht, dass die einzig wichtige Regel beim Erstellen eines Teams lautet, niemals mehr als 6000 Budgetpunkte zu verbrauchen.
content.29.142=<b>Du bist in der Beobachtungsphase.</b>\n\nDiese Phase erlaubt es dir, die gegnerischen Charkater, ihre Ausrüstung, sowie ihre Position zu analysieren.
content.29.143=<b>Du befindest dich in einer Herausforderung.</b>\n\nHerausforderungen sind Kämpfe, die in keinem Ranking berücksichtigt werden, die dir aber helfen können, das Spiel zu erlernen oder dich zu verbessern. \nManche Herausforderungen sind für erfahrene Spieler vorgesehen, mach dir also keine Sorgen, wenn du diese nicht sofort schaffst.\n\nAuf jeden Fall verlierst du beim Verlieren einer Herausforderung nie etwas; ganz im Gegenteil, bei manchen kannst du Coach-Kards gewinnen!
content.29.144=Dämon III
content.29.145=SuperBibis Tofu
content.29.146=Hey, Kumpel!\n\nWas machst du hier? Man merkt, dass du noch nie von den Hell's Tofus gehört hast. Soll ich dir ein kleines Requiem vorsingen?
content.29.147=Wir sind der Hormonde angekommen und glaub mir, das hier ist nicht gerade der gemütlichste Ort, den ich kenne.
content.29.148=Du wirst hier in der Gegend auf ein paar Stundenglasdämonen treffen. Ich rate dir zu tun, was sie dir sagen, denn sie mögen es nicht, wenn man ihnen widerspricht.
content.29.149=Nun gut, ich geh dann mal, ich kann nicht allzu lange hier in der Gegend bleiben.
content.29.150=Noch etwas, bevorzugst du den Rechts- oder den Linksklick zur Fortbewegung? (Wenn du deine Meinung änderst, dann kannst du dies immer noch im Optionsmenü abändern.)
content.29.151=Geh einfach über die Brücke da links und folge der Straße. Also, ich gehe dann mal, hier riecht es nach Dämonen... 
content.29.152=Hallo Abenteurer! Unglaublich, wie klein du doch bist! Hast du vergessen zu wachsen oder was? Du weißt bestimmt, wer ich bin, es sei denn, du warst schon eine Weile nicht mehr außer Haus. Ich bin der Dämon III und auf der Suche nach Coachs, je hartgesottener desto besser! Los, beweise mir, dass du keine Heulsuse bist...
content.29.153=Wen du nicht für immer auf dieser Insel feststecken willst, dann wirst du dich den 3 Herausforderungen stellen müssen, die ich stellen werde. Es sei denn, du willst hier bis ans Ende deiner Tage hier versauern...\n\nVorher musst du aber noch 3 Kämpfer rekrutieren. Keine Kämpfer, keine Herausforderungen, klar? Ist das auch bis in dein Spatzenhirn hindurch gedrungen?  
content.29.154=Hmm, du hast zu viele Kämpfer unter deinem Kommando, du kannst einen aus deinem Team entfernen, indem du ihn auswählst und dann auf das Kreuz klickst. Wenn du dann immer noch rekrutierst, dann komm wieder.
content.29.155=He du! Was glotzt du meine Frisur so an? Ich bin ein Iop, ein furchtloser Krieger ohne Tadel! Unser Motto: Draufhauen, dann nachdenken! Oder war das etwa Draufhauen ohne Nachzudenken? Weiß nicht mehr... 
content.29.156=Sei gegrüsst Abenteurer!  Mein kleiner Finger sagt mir, dass du neu hier bist... Ich bin ein Cra und niemand beherrscht Pfeil und Bogen so gut wie ich! Soll ich dir das mal zeigen? Dreh dich um und renn los!
content.29.157=Sieh mal einer an, ein kleiner Neuer...Was bringst du mir? Wie, gar nichts? Ich bin ein Enutröffchen und Kamas sind mein Hobby! Du hast doch nichts dagegen, das ich einen kleinen Blick in deine Geldbörse werfe?
content.29.158=Sei gegrüsst Abenteurer! Du siehst verloren aus... Keine Angst, bei mir bist du in guten Händen. Ich bin ein Feca, Verteidiger ohnegleichen! Unser Motto: In Deckung bleiben!
content.29.159=Das ist aber seltsam, ich kann mich nicht daran erinnern dich heraufbeschworen zu haben... Bist du neu hier? Ich bin ein Osamodas, Beschwörer und Bezähmer von Kreaturen. Das ist im Kampf ganz praktisch! Oder wenn man mal Lust auf ein paar Pelzstiefel hat...
content.29.160=Sei gegrüsst Abenteurer! Ich bin ein Sram, ein Dieb und Mörder. Naja, so daher gesagt hört sich das nicht so toll an, aber ich versichere dir, nützlich ist es allemal! Ich bin sicher, dass du an dem Tag an mich denken wirst, an dem du ein Schmuckstück heiss begehrst...
content.29.161=He du! Willkommen! Ich bin ein Sacrieur, manche sagen auch Berserker. Wenn mich meine Gegner schlagen, dann verzehnfachen sie nur meine Stärke! Ach, übrigens, hast du nicht Lust mir eine reinzuschlagen? Ich fühl mich etwas schwächlich heute... 
content.29.162=Hallo Grünschnabel! Ich bin ein Ecaflip und ein besessener Spieler. Ich habe keine Angst, viel zu riskieren! Wenn mich das Spielfieber packt, dann kann ich einfach nicht aufhören... Wie wär's denn mit einer kleinen Partie? Ein Freundschaftspiel, versteht sich...
content.29.163=Sei willkommen, Abenteurer! Dein Gesicht sagt mir jetzt nichts, du musst neu hier sein. Ich bin ein Eniripsa. Meine Besonderheit liegt darin, dass ich mit Worten heilen kann. Grosse Wehwehchen sind meine Spezialität! 
content.29.164=Hallo Neuling! Ich bin eine Sadida. Wenn ich mich nicht gerade um Salben oder Gifte kümmere, dann spiele ich mit Puppen! Ja, ja lach du nur, wenn du mal eines Tages mit ihnen zu tun hast, dann vergeht dir das Lachen schon noch...
content.29.165=Sei willkommen, Abenteurer. Ich bin ein Xelor und ich beherrsche die Zeit. Egal, ob es darum geht einen Feind zu verlangsamen oder sich zu teleportieren, das ist für mich ganz einfach und heutzutage gang und gäbe. Tja, man muss eben mit der Zeit gehen!
content.29.166=Ha-hallooo! Abent*hick*Teurer! *Schluck*! Ich bin ein Pandawa, ein tragender Krieger und meine Kräfte schöpfe ich aus *hicks*den Getr..aus'm Alkohol...Huch, das dreht sich aber... Aber wenn du mehr *hicks* über mich erfahren willst, dann lass uns das bei einem Schoppen besprechen... *Hicks*!
content.29.167=Nun, geh erst mal zu den Klassenmeistern, die werden dir helfen. Um sie zu finden kannst du deine Kard benutzen (Taste M).\n\nWenn du zu faul zum Laufen bist, dann kannst du immer noch Kämpfer rekrutieren, indem du du direkt auf deine Benutzeroberfläche klicken, wo die Teamverwaltung steht (der Button mit den zwei Schwertern, F4 Taste).
content.29.168=Ausgezeichnet, dein Team scheint ja was zu taugen, du wirst also meine 3 Herausforderungen annehmen können. Bist du bereit?
content.29.169=Soll das ein Witz sein? Und was ist mit den Kämpfern, die du mir bringen solltest? Hast du die unterwegs verloren, oder was? Ich geb dir noch eine letzte Chance, aber diesmal behältst du deine Mission im Auge, klar? Wir sind hier nicht zum Spaß da!
content.29.170=Pepitox
content.29.171=Zickatrine
content.29.172=Grüny
content.29.173=Haon
content.29.174=Pataklop
content.29.175=Stalad
content.29.176=Rutger
content.29.177=Lithian
content.29.178=Güs
content.29.179=Dzee
content.29.180=Ed Eraser
content.29.181=Guitel
content.29.182=Wie du siehst, ist deine Benutzeroberfläche noch recht schlicht.
content.29.183=Du siehst ein wenig bedeppert aus, also sag ich's dir, das kleine Rechteck unten rechts, das ist ein Chatfenster. Damit kannst du mit den anderen kommunizieren. Er ist aber noch zu anderem gut...aber dazu später. Naja, wenn du überlebst...
content.29.184=Dies ist die Benutzeroberfläche zum Verwalten deines Teams. Los, klick drauf.
content.29.185=Natürlich sieht es hier in deinem Team so leer aus, wie in einem Iophirn!
content.29.186=Lass uns den Klassenmeistern einen Besuch abstatten! Sie erlauben es dir, deine ersten 3 Kämpfer zu rekrutieren.
content.29.187=Um sie zu finden, müssen wir uns Richtung Nordwesten begeben. Wenn du dich verläufst, dann kannst du auf deine Karte hier schauen. 
content.29.188=Worauf wartest du?! Na los, beweg dich! Du solltest schon längst weg sein! Falls nötig, kannst du mich anklicken.
content.29.189=Was?! Was soll dieser Unsinn?!
content.29.190=Grrr! Kurzum... Dieses Icon repräsentiert die von dir im Spiel vollbrachten Heldentaten. Während deiner ersten Schritte in der Hormonde wird es sicher mehrfach erscheinen.
content.29.191=Los, es gilt keine Zeit zu verlieren! Deine Kämpfer warten weiter im Norden auf dich!
content.29.192=Es ist nun an der Zeit, dass ich dir erkläre, wo wir uns befinden. Was für ein Durcheinander hier, nicht wahr?
content.29.193=Die Stundenglasdämonen, unsere Meister, haben die Hormonde erschaffen. Sie haben der Welt der Zwölf hier und da aus verschiedenen Epochen diverse Parzellen entrissen. Deshalb sieht das hier auch so aus wie eine einzige Baustelle!
content.29.194=Ach, aber du hast ja immer noch nicht deine Kämpfer rekrutiert! Na los, etwas mehr Mumm! Jetzt ist nicht der Moment zum Faulenzen!
content.29.195=Der Dämon III?! Hier?! Da hast du aber Glück! Wenn du mit ihm reden willst, klicke ihn an.
content.29.196=Der Dämon III kommt ab und zu auf die Insel. Er führt bei Coachs wie dir Tests durch. Wenn du es schaffst, bekommst du Zutritt zur Totem Arena, wo die Qualifikationsrunden für die großen Turniere stattfinden.
content.29.197=Was hältst du davon, wenn wir ein wenig spielen? Wie wär's mit den 3 Herausforderungen?
content.29.198=Aaahh! Endlich! Jetzt stehen wir endlich vor den Klassenmeistern!
content.29.199=Jeder von ihnen wird dir die Eigenschaften der eigenen Klasse erklären.
content.29.200=Bravo! Nicht schlecht für einen Anfänger! Ein kleiner Trick der dir nützlich sein könnte: wenn du einen Gegner von der Seite schlägst, dann fügst du ihm 20% Schaden mehr zu und wenn du ihm in den Rücken schlägst, dann sind es sogar 40%. Das ist immer gut zu wissen, nicht wahr?
content.29.201=Wenn du diese neue Herausforderung schaffst, dann werde ich dir von der Erfahrung erzählen.
content.29.202=Alle Achtung, du hast Potential! Man sollte eben nicht nur nach dem Äußeren gehen! Ha! Ha!
content.29.203=Im Laufe der Kämpfe werden die Mitglieder deines Teams stärker und gewinnen an Erfahrung.
content.29.204=Jetzt schließe dein Fenster des Kampfendes und öffne die Benutzeroberfläche für die Teamverwaltung, ich werde dir zeigen, wie man diese Erfahrungspunkte benutzt.
content.29.205=Ausgezeichnet! Jetzt klicke auf den Button "Kanedo" der sich hier befindet.
content.29.206=Sehr gut! Dein Kanedo stellt die Entwicklung deines Kämpfers dar. Wie du siehst, steht dein Charakter noch am Startpunkt seines Kanedos.
content.29.207=Die meisten der Sphären die sich auf dem Kanedo befinden, bringen Boni ein. Um sie zu bekommen, musst du auf diesen Sphären landen. 
content.29.208=Wenn du wissen möchtest, um welchen Bonus es sich hierbei handelt, dann fahre mit der Maus darüber. Versuch es mal mit der ersten Sphäre auf dem Kanedo. Wenn du dann eine Sphäre auswählen möchtest, dann musst du drauf klicken, aber da du ja erst anfängst, werde ich es für dich tun.
content.29.209=Wie du sehen kannst, ist ein Button "Kaufen" unten rechts erschienen, genau unter dem Preis der Sphäre in EP.
content.29.210=Du besitzt 3 XP und die erste Sphäre kostet nur 2 XP-Punkte, also kannst du diese Sphäre kaufen. Jetzt musst du nur noch auf den Button "Kaufen" klicken!
content.29.211=Perfekt! Dein Kämpfer besitzt nun diesen Bonus. Sobald du über ausreichend XP-Punkte verfügst, kannst du den nächsten erwerben und immer so weiter. Je weiter du im Kanedo vorankommst, desto mächtiger werden die Boni! Das versteht sich von selbst!
content.29.212=Nun gehen wir zur letzten Herausforderung des Dämonen III über. Vergiss nicht, dass jeder Kämpfer seinen eigenen Kanedo besitzt, du musst also die Erfahrung eines jeden einzelnen ausschöpfen.
content.29.213=Gut gemacht! Dieser Krachler hatte eine Lektion verdient! Er ist nun zu Staub zermalmt!
content.29.214=Hast du das gesehen?! Der Dämon III hat deine Stärke anerkannt und hat dir Zugang zu neuen Optionen in der Benutzeroberfläche verschafft! Du wirst nun bis zu 4 Kämpfer rekrutieren können, ohne zu den Klassenmeistern gehen zu müssen, klicke einfach nur auf die Benutzeroberfläche der Teamverwaltung.
content.29.215=Zum Entdecken dieser Optionen, wirst du später noch ausreichend Zeit haben. Merk dir aber im Moment, dass du jederzeit deine Heldentaten und dein Kards-Sammelsurium konsultieren kannst.
content.29.216=Ach ja, das Sammelsurium... Das ist ganz einfach der Ort, wo du die Kards einordnen kannst, die du gewonnen, gekauft oder ausgetauscht  hast.
content.29.217=Mit den Kards kannst du sich zum Beispiel einkleiden. Was ganz nützlich sein kann! Ha! Ha! Ha! Um ihre Großartigkeit zur Schau zu stellen, bekleiden sich die besten Coachs mit legendären Sets, die ihnen außerdem Boni einbringen.
content.29.218=Aber dazu später mehr. Lass uns zu einem Zaap gehen!
content.29.219=So, da wären wir! Jetzt klicke auf den Zaap.
content.29.220=Wie du sicherlich bemerkt hast, öffnet sich beim Klicken auf den Zaap dein Sammelsurium auf der Seite mit den Zaap-Kards. Wenn du zum Dämon I willst, dann musst du in der Kategorie "Zaaps der ersten Inseln" auf die Kard "Hort von Dämon I" doppelklicken. Los, mach zu! Klick drauf!
content.29.221=Ganz nett hier die Deko, findest du nicht?
content.29.222=Das nenn ich Schwein haben! Wir sind zum richtigen Zeitpunkt am richtigen Ort gelandet! Der Dämon I befindet sich ein wenig weiter weg. Er kümmert sich um die Anmeldungen zum großen Turnier.
content.29.223=Jetzt tu nicht so schüchtern! Lauf los und melde dich an!
content.29.224=Da wären wir. Ich stell dir den Dämon der 58. Minute vor. Sei vorsichtig, er ist ein sehr guter Beschwörer und er schlägt hart zu... Um heil aus dem Kampf hervorzutreten, musst du die Bonusfelder der Arena benutzen.
content.29.225=Wenn ein Kämpfer seine Runde auf einem Bonusfeld beginnt, dann profitiert er von dessen Wirkungen. Das können AP sein, Resistenzen und noch andere Sachen.
content.29.226=Umsichtig eingesetzt, können die Bonus-Resistenzfelder dich zum Sieg führen!
content.29.227=Hier, sieh dir mal diesen kleinen bösen Dämon der 52. Minute an! Er ist nicht sehr stark, aber seine Arena ist mit Fallen gespickt. \nSei also vorsichtig!
content.29.228=Die Malusfelder werden zu Beginn der Runde aktiviert. Ein Todesfeld tötet den Kämpfer umgehend, wohingegen ihm ein Feld mit einer Falle Verletzungen zufügt.
content.29.229=Das Besondere am Dämon der 52. Minute ist, dass er Anziehungszauber einsetzt, um Kämpfer in die Nähe seiner Fallen zu versetzen. Also Vorsicht! 
content.29.230=Noch eine letzte Sache. Dank der Stabilisationszaubersprüche kannst du ihn daran hindern, dich zu einem Malusfeld zu ziehen. Denk dran!
content.29.231=Das da ist der Dämon der 46. Minute. Man nennt ihn auch den "Sniper". Um ihn zu besiegen, bewege dich auf ihn zu, indem du dich dank der Hindernisse schützt und achte gut auf deine Spezialkards!
content.29.232=Deine Spezialkards erscheinen oben rechts auf deinem Bildschirm. Die erste ist diejenige, die für die laufende Runde aktiv ist. Sie bringt allen in der Arena anwesenden Kämpfer Boni oder Mali.
content.29.233=Die zwei anderen Spezialkards werden in der nächsten Runde aktiviert. Das Geheimnis eines guten Coachs liegt darin, immer ein Auge drauf zu haben und so seine Strategie besser vorzubereiten.
content.29.234=Bei dieser Herausforderung musst du die Spezialkards benutzen, die dir von Nutzen sein können. Vergiss nicht, dich gut zu verstecken, sobald die Kards des Dämons der 46. Minute erscheinen!
content.29.235=Ich stelle dir den Dämonen der 25. Minute vor. Er ist nicht gerade zimperlich und macht aus seinen Gegnern Feingehacktes.
content.29.236=Um ihn zu besiegen, musst du deine Aktionskards benutzen. Es handelt sich um Spezialzaubersprüche, die nur einmal pro Partie von einem beliebigen deiner Kämpfer benutzt werden können.
content.29.237=Ich sag's frei heraus, im dir bevorstehenden Kampf entscheidet sich alles in der ersten Runde. Dein Sieg hängt vom passenden Aneinanderreihen deiner Aktionskards ab!
content.29.238=Jetzt aber zu den ernsten Angelegenheiten... Jetzt wirst du alles anwenden, was ich dir beigebracht habe.
content.29.239=Ein letzter Rat: Orte genau das Ziel das du zuerst angreifen willst. Los geht's! Viel Glück!
content.29.240=Herzlichen Glückwunsch! Ich bin beeindruckt! 
content.29.241=Du bist nun bereit, dich anderen Coaches zu stellen. Aber vorher musst du deine Anmeldung beim Dämon I bestätigen.
content.29.242=So, Schluss mit lustig! Du benötigst jetzt einen Gegner, mit dessen Hilfe du dir einen Namen machen kannst. Öffne dazu die Benutzeroberfläche der Teamverwaltung.
content.29.243=Jedes Mal, wenn du ein Match bei einem großen Turnier finden möchtest, brauchst du nur auf diesen Button zu klicken, egal, wo du dich gerade befindest. Erkundschafte auch die anderen Inseln, es gibt da prächtige Plätze zu besichtigen!
content.29.244=Das große Turnier hilft dir dabei, deine Beliebtheit erhöhen. Indem du ein Maximum an Spielen gewinnst, kannst du dich zum beliebtesten Coach des großen Turniers mausern!
content.29.245=Wenn du das Ranking der besten Coachs der Saison sehen möchtest, dann klicke auf diesen Button.
content.29.246=Damit dein Name im Ranking erscheint, musst du dich unter die 2000 besten Coaches platzieren. Der Coach-Button zeigt dir deinen genauen Platz.
content.29.247=Vergiss nicht, dass deine Kämpfer nicht unsterblich sind! Sie brauchen viel Aufmerksamkeit!
content.29.248=Man muss sie manchmal auf der Ersatzbank ausruhen lassen, sonst können sie schnell ermüden oder sich verletzen.
content.29.249=Denk auch dran, ihnen Mut zu machen. Sorge dafür, dass sie nicht allzu viele Spiele verlieren und nicht zu oft KO gehen. Lass sie aber auch nicht auf der Bank vermodern!
content.29.250=Darüber reden wir später. Es ist an der Zeit, die anderen Inseln zu erkunden. Sobald du dich dazu bereit fühlst, kannst du einen Kampf im großen Turnier beginnen.
content.29.251=Na, möchtest du dein Glück beim großen Turnier versuchen? Das trifft sich gut, wir hatten ziemlich viele Verluste in letzter Zeit... Ein wenig neues Blut wird uns gut tun!
content.29.252=Um deine Anmeldung zu validieren, musst du ein paar Prüfungen bestehen. Das Publikum verliert nicht gerne Zeit mit Anfängern!
content.29.253=Wenn du es schaffst, die anderen 5 Dämonen zu besiegen, die auf der Insel sind, dann bekommst du Zugang zum großen Turnier!
content.29.254=Ich habe gehört, du hättest über die fünf Minutendämonen triumphiert, gut gemacht! High Five! Hahaha!
content.29.255=Nun gut. Du hast dich der Teilnahme am großen Turnier für würdig erwiesen. Ich gebe dir also den Zugang dafür frei. Nimm diese Zaapkarten, damit kannst du auf die anderen Inseln gehen.
content.29.256=Ausgezeichnet! Du hast überlebt! Du bist also doch keine Weichei, so wie ich dachte... Ich mach nur Spaß!
content.29.257=Du scheinst beunruhigt zu sein... etwas unwohl, vielleicht? Mach dir keine Sorgen, das haben schon so viele vor dir mitgemacht. Es gab sogar Überlebende!
content.29.258=Hm...nun. Wenn du deine Freiheit wiedergewinnen willst, dann musst du Mut und Stärke beweisen!
content.29.259=Ich glaube, wir werden uns gut zu zweit amüsieren!  Ich lass dich deine ersten Schritte in der Arena machen und kann es kaum erwarten zu sehen, wie du dich machst!
content.29.261=Dämon I
content.29.262=Dämon der 58. Minute
content.29.263=Dämon der 52. Minute
content.29.264=Dämon der 46. Minute
content.29.265=Dämon der 25. Minute
content.29.266=Dämon der 12. Minute
content.29.267=Du meinst also, du könntest mich besiegen? Dem Dämon I muss es wirklich an Kämpfern mangeln, wenn er mir solche Mickerlinge wie dich schickt... Los, zeig mir was du drauf hast!
content.29.268=Du meinst also, du könntest mich besiegen? Dem Dämon I muss es wirklich an Kämpfern mangeln, wenn er mir solche Mickerlinge wie dich schickt... Los, zeig mir was du drauf hast!
content.29.269=Du meinst also, du könntest mich besiegen? Dem Dämon I muss es wirklich an Kämpfern mangeln, wenn er mir solche Mickerlinge wie dich schickt... Los, zeig mir was du drauf hast!
content.29.270=Du meinst also, du könntest mich besiegen? Dem Dämon I muss es wirklich an Kämpfern mangeln, wenn er mir solche Mickerlinge wie dich schickt... Los, zeig mir was du drauf hast!
content.29.271=Du meinst also, du könntest mich besiegen? Dem Dämon I muss es wirklich an Kämpfern mangeln, wenn er mir solche Mickerlinge wie dich schickt... Los, zeig mir was du drauf hast!
content.29.272=Abschussgerät für Feenwerke
content.29.273=Gut gemacht, Kleiner! Ich denke, du kannst es mit etwas zäheren Gegnern aufnehmen. Hier ist eine Zaap-Kard, benutze sie mit dem Zaap im Nordosten der Insel.\n\nAlso, bis dann! Wenn du jemals nach Maknala kommst, dann komm mich besuchen, ich hab da noch andere Herausforderungen für dich.
content.29.274=Du bist meiner nicht würdig. Besiege erst mal die anderen vier Minutendämonen auf dieser Insel. Wenn du das geschafft hast, dann lasse ich mich vielleicht dazu herab, dir ein Duell zu gewähren.
content.29.275=Muaharharhar! Ich habe Barnabas entführt und werde ihn niemals freilassen! Um meine Kristalle zu zerstören müsste schon jemand Stärkeres kommen.
content.29.276=Sekundendämon
content.29.277=Sieh mal, da ist 37! Ein Sklave des Dämons der 12. Minute. Erinnerst du dich nicht mehr an ihn? Du hast ihn bei deiner Anfkunft auf Hormonde bekämpft!
content.29.278=Er hat ein Gefängnis erbaut, in dem sich ein Gefangener allerhöchster Wichtigkeit für seinen Meister befindet. Angeblich soll das Gefängnis 100% aus- und einbruchssicher sein. Was hältst du davon, ihm das Gegenteil zu beweisen?!
content.29.279=Denk dran: selbst mit 100% Elementarresistenz ist man noch lange nicht immun in diesem Element. Denn mit genügend hohem Schadensbonus können Schläge trotz der Resistenz noch Schaden verursachen.
content.29.280=Was höre ich da? Du willst den Gefangenen befreien? Harharhar! Du hast nicht die geringste Chance! Ich habe das Kristallgefängnissystem meines Meisters nämlich nochmal verbessert. Es ist nun unüberwindbar!
content.29.281=Dämon der 37. Sekunde
content.29.282=Jetzt geht es ans Eingemachte! Platziere als Erstes deinen Iop auf ein passendes Feld deiner Wahl während der Platzierungsphase.
content.29.283=Da es sich hierbei bloß um einen Trainingskampf handelt, gibt es kein Zeitlimit. In einem normalen Kampf hättest du allerdings nur 30 Sekunden, um deine Kämpfer zu platzieren.
content.29.284=Zum Platzieren eines Kämpfers musst du ihn anklicken und anschließend auf das gewünschte Zielfeld klicken. Wenn sich dort bereits ein anderer Charakter befindet, tauschen die beiden ihren Platz. Keine Sorge, hier kann das nicht passieren, dein Iop ist der einzige Kämpfer hier.
content.29.285=Wenn du all dies verinnerlicht hast, dann klick auf den "Bereit" Button.
content.29.286=Wie du sicher gemerkt hast, gibt es nach der Platzierungsphase noch eine Beobachtungsphase, die 10 Sekunden dauert.
content.29.287=Während der Beobachtungsphase kannst du die Position deiner Gegner ansehen. Durch Anklicken der Kämpfer in der Timeline links oben ist es sogar möglich, die Werte aller Kämpfer einzusehen.
content.29.288=Für das Training habe ich die Zeitbeschränkung von normalerweise 30 Sekunden pro Runde entfernt. Das lässt dir genug Zeit, die Timeline eingehend zu studieren.
content.29.289=Greif diesen Fresssack an, sobald du bereit bist. Du verfügst über 3 BP (Bewegungspunkte), um näher an ihn heranzukommen. Das machst du, indem du eines der Felder vor ihm anklickst.
content.29.290=Hab keine Angst! Geh ruhig näher ran, indem du das Feld direkt vor ihm anklickst. Die Art des Klicks (Links- oder Rechtsklick) hängt dabei davon ab, wie du dich am Anfang entschieden hast. Die getroffene Wahl lässt sich jeder Zeit nochmal abändern.
content.29.291=Sehr gut! Benutze als nächstes den Zauberspruch "Druck" um ihn zu besiegen! Klicke dazu auf den entsprechenden Zauberspruch in deiner Zauberleiste unten links und klick anschließend das Ziel an.
content.29.292=Äh, ja, das war schon mal gar nicht schlecht. Aber versuch vielleicht besser, den Fresssack anzuvisieren, indem du das Feld anklickst, auf dem er sich gerade befindet. Sonst wird es sehr schwierig, ihn zu besiegen...
content.29.293=Sehr gut, du hast ihn erwischt! Noch ein guter Treffer mit Druck und er müsste erledigt sein. Dann bist du mit dieser Trainingseinheit fertig.
content.29.294=Unten links findest du die (blaue) Anzeige deiner AP (Aktionspunkte). Druck benötigt 3 AP. Wenn dir genügend Punkte bleiben, dann wirke erneut den Zauber. Wenn nicht, beende die laufende Runde, um deine AP wieder auf 6 aufzufüllen.
