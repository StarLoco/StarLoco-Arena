content.31.3=Alter\n\nWas geht?\n\nWas hast du hier auf unserem Gebiet zu suchen, du Penner?\n\nDu bist hier bei den Hell's Tofus, also red los, solange du noch deine Zähne hast!\n\nWas? Du willst mich zu SuperBidi bringen? Habt ihr das gehört, Jungs? Da will einer meine Keule spüren!\nDas trifft sich gut, ich habe da eine kleine Nachricht für ihn und die werde ich mit deinem Blut verfassen!\n\nNa schön, ich lass dir noch eine Chance: zieh deine Hose aus, deine Jacke, deine Stiefel und mach dich aus dem Staub.\nWenn du in 20 Sekunden noch da bist, dann putze ich die Räder meiner Harley mit deinem Furzgesicht, kapiert? 
content.31.6=Die Iops sind zweifellos meine Lieblingskämpfer, die Inkarnation der rohen Kraft selbst, Zeichen des edlen Kampfes.\n\nNun ja, wenn man schön und stark ist... dann kommt man auch gut bei den Frauen an. \n\nDu wirst sehen, in dem Kampf den ich dir anbiete, wird dir die charmante Eniripsa in deinem Team beim Kampf gegen die Krachlerarmee sehr nützlich sein.  \n\nNutze die ihr zur Verfügung stehenden Zaubersprüche gut! Das Schlagwort lautet hier: Heilen. Dafür hat sie eine ganz Liste mit Wörtern zu ihrer Verfügung: Pflegendes Wort, Wort des Opferns,  Wort der Regeneration, etc.\n\nWenn du die Herausforderung schaffst, dann wird sie dir ein paar süße Worte als Gratulation ins Ohr flüstern.
content.31.9=Sei im Kampf schnell und dabei vorsichtig! \n\nUm dieser Armee von Kamikaze-Opferpüppchen beizukommen, die sich zudem noch schneller als sonst fortbewegen, verfügst du nur über Crâs mit ihren Rückstoßpfeilen!\n\nEine explosive Herausforderung!
content.31.11=Teamarbeit...\n\nUm den Mega-Krachler zu besiegen, bedarf es mehr als nur des besonderen, persönlichen Einsatzes.\n\nDer Schlüssel zu dieser Herausforderung liegt ganz einfach in der Koordination zwischen Iops Wut, der Schlüsselrolle des Hauptcharakters und der Platzierung des Pandawas. Versuche die passende Kombination zu finden!\n\nAch ja, fast hätte ich es vergessen, wenn dein Iop wütend wird, dann bleibe nicht in seiner Nähe.\n\nEin Ratschlag:\n\nDein Xélor "Tinie" kann sich einem der zwei Charakter hingeben, damit dieser seine Zaubersprüche voll zur Geltung bringen kann. Iops Wut richtet auf den zwei Feldern ringsum den Iop herum Schaden an. Was die Wurf- und Tragezauber deines Pandawas betrifft: diese werden dir dabei helfen, den Mega-Krachler zu besiegen, wenn du ihn auf der Karte richtig platzierst.
content.31.12=Test-Herausforderung (Limero)
content.31.13=Bei dieser Herausforderung musst du Jackie und Abraham gegen sechs Sadidas zum Sieg verhelfen.\n\nOb sie es wohl mit deiner Hilfe schaffen werden, ihre Feinde loszuwerden oder werden sie sich auch weiterhin mit Schaufelhieben zusetzen?\n\nFür diese Süßwassermatrosen auf Schatzsuche ist diese Herausforderung kein Zuckerschlecken!\n\nEin Tipp:\n\nDeine Gegner führen keine direkten Angriffe aus und einer deiner Zaubersprüche verfügt über ganz besondere Nebenwirkungen, die dir dabei helfen, sie zu besiegen.
content.31.14=Bei Xélor! Wie konnten diese Zifferblätter zu Portalen werden?\n\nNimm schnell diesen Stoßtrupp und schließe die Portale sonst bringen wahnsinnige Beschwörungen die Kämpfe in der Arena aus dem Gleichgewicht!\n\nUnsere vorangegangenen Analysen zeigen an, dass die aus den Portalen hervortretenden Beschwörungen aggressiv sind und nach dem Zufallsprinzip erscheinen. Der Charakteranalysator funktioniert allerdings. Wenn ihr also auf die Icons in der Timeline klickt, dann könnt ihr nachprüfen, was wahrscheinlich aus den Portalen heraustritt. \n\nVermeide in den Einflussbereich mehrerer Zifferblätter zu geraten! Dein Team wird sonst nämlich möglicherweise stark darunter zu leiden haben... \n\nAch, schlechte Neuigkeit: Jeanine, unsere Eniripsa-Sekretärin ist leider unpässlich...\n\nKleiner Tipp: Wenn die Zaubersprüche nicht mehr funktionieren, dann bleiben euch immer noch die Fäuste...\n\nAls Hilfe für Spielanfänger: Alle Zifferblätter zu zerstören ist ein komplexes Unterfangen. Sich den Beschwörungen zu stellen, ist schon schwer genug. Wenn du es schaffst, mindestens 20 Runden durchzuhalten, dann kann man davon ausgehen, dass du gegen sie zu kämpfen weißt. 
content.31.15=Bei Xélor! Wie konnten diese Zifferblätter zu Portalen werden?\n\nNimm schnell diesen Stoßtrupp, um die Flut der Monster einzudämmen sonst bringen wahnsinnige Beschwörungen die Kämpfe in der Arena aus dem Gleichgewicht! In der Zwischenzeit schicken wir unseren Spezialisten, den Xélor Montracristo, damit er sich drum kümmert. Wir werden euch dann seine Mitteilungen während eures Kampfes zusenden, sie helfen euch bestimmt weiter.\n\nUnsere vorangegangenen Analysen zeigen an, dass die aus den Portalen hervortretenden Beschwörungen aggressiv sind und nach dem Zufallsprinzip erscheinen. Der Charakteranalysator funktioniert allerdings. Wenn ihr also auf die Icons in der Timeline klickt, dann könnt ihr nachprüfen, was wahrscheinlich aus den Portalen heraustritt. \n\nVermeide in den Einflussbereich mehrerer Zifferblätter zu geraten! Dein Team wird sonst nämlich möglicherweise stark darunter zu leiden haben... \n\nAch, schlechte Neuigkeit: Jeanine, unsere Eniripsa-Sekretärin ist leider unpässlich...\n\nKleiner Tipp: Wenn die Zaubersprüche nicht mehr funktionieren, dann bleiben euch immer noch die Fäuste...\n\nAls Hilfe für Spielanfänger: Alle Zifferblätter zu zerstören ist ein komplexes Unterfangen. Sich den Beschwörungen zu stellen, ist schon schwer genug. Versuche, so lange wie nur möglich durchzuhalten, ohne einen einzigen Charakter zu verlieren und dies wird der Bewies dafür sein, dass du gegen Beschwörungen zu kämpfen weißt.
content.31.16=Sie kommen aus fernen östlichen Ländern und sie sind zu allem bereit, nur um die dämonischen olympischen Spiele zu gewinnen.\n\nIn der Zwischenzeit, nehmen sie am Mannschafts-Krachlerwurf teil.\n\nAber ihr Coach ist abwesend. Wahrscheinlich ist der dabei, sich in irgendeiner Taverne von Maknala zu betrinken.\n\nEs liegt an dir Kleiner. Zeig, was du drauf hast!
