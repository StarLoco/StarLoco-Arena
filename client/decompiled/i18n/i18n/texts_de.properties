content.11.1=Bei jedem Schlag werden eure Feinde sagen: Das stinkt zum Himmel...
content.11.2=Ideal zum Kitzeln von Gegnern, die sich angepiekst fühlen.
content.11.3=Mit seiner Hilfe werdet ihr mir Sicherheit weniger Federn lassen.
content.11.4=Sie macht alle völlig wahnsinnig. Wahrscheinlich sogar euch...
content.11.5=Nicht zu verwechseln mit dem Aufblaspüppchen, auch wenn diese hier ganz schön aufgeblasen ist!
content.11.6=Wenn man dem Gegner wie einen Baum ausreißen kann, dann darf man sich ruhig einen Ast lachen!
content.11.7=Mit diesem Zifferblatt konnten die Xelors zu allen Zeiten ihre Gegner aus der Fassung bringen. 
content.11.8=In eurem Alter wird es Zeit. Opfert eure Puppen!
content.11.9=Wenn der Krachler seine Fäuste krachen lässt, dann lässt das seine Gegner vor Furcht mit den Zähnen krachen!
