content.42.1=<b>Nehmt an den glorreichen Turnieren der Dofus-Arena Liga teil!</b>\n\nDie Turniere der Dofus-Arena Liga sind die berühmtesten der Hormonde und bringen daher auch die meisten Turnierpunkte! \n\nDiese Turniere verwenden die klassischen Regeln des 1 vs.1. Bei jedem Turniersieg gewinnt ihr (mehr und mehr) Turnierpunkte. <b>Wenn ihr im Turnier 4 Partien hintereinander gewinnt, dann könnt ihr das Maximum an Punkten einheimsen, nämlich 12.</b>.\n\nWenn ihr allerdings ausscheidet, dann verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nDas Turnier startet zu folgenden Stunden:\n\n- <b>01:30 Uhr-01:45 Uhr GMT+1</b> (deutsche Zeit)\n- <b>12:30 Uhr-12:45 Uhr GMT+1</b> (deutsche Zeit)\n- <b>18:30 Uhr-18:45 Uhr GMT+1</b> (deutsche Zeit)\n- <b>20:30 Uhr-20:45 Uhr GMT+1</b> (deutsche Zeit)\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu diesen Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.4=Turnier des Dämons III\n<b>Nehmt an diesem Turnier nach III. dämonischer Art teil</b>\n\n<b>Der Gewinner des Turniers erhält 10 Punkte, die anderen Teilnehmer nur 1 Punkt</b>. Tja, der Stärkere gewinnt eben, so ist das halt beim Dämon III.  \n\nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.5=<b>Wenn ihr dieses Turnier gewinnen wollt, dann müssen eure Kämpfer so stark miteinander verschweißt sein, wie IX und XXI.</b>\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.6=<b>Wärt ihr gerne der Macht des Mitternachtdämons nahe, der mit den Avataren der Götter seine Spielchen treibt? Dann ist dieses Turnier genau das Richtige für euch!</b>\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.7=<b>Heute Abend gilt: wo geprügelt wird, da fallen Zähne!</b>\n\nSchnellturniere ähneln den klassischen Turnieren der Dofus-Arena Liga in fast allen Punkten. Der einzige Unterschied besteht darin, dass das Turnier nicht über eine Woche verteilt in kurzen, festgelegten Zeiten gespielt wird, sondern an einem einzigen Abend!\n\nFür jeden Sieg während des Turniers gewinnt ihr Turnierpunkte (mehr und mehr). \n\n<b>Wenn ihr im Turnier 4 Partien hintereinander gewinnt, dann gewinnt ihr die Maximalzahl von 12 Punkten</b>.\nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.8=<b>Ihr liebt es, originelle Teams zusammenzustellen? Dann stellt eure Fähigkeiten im Enutrof-Turnier auf die Probe.</b>\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.9=<b>Im Gegensatz zum Enutrof-Turnier, könnt ihr beim Reiche-Leute-Turnier Teams mit sehr viel größerem Budget zusammenstellen, als sonst.</b>\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.10=<b>Ein Turnier, das für Ecaflips wie geschaffen ist, oder auch nicht. </b>\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
