content.9.1=Wüstes Gemetzel und metzelhafte Verwüstungen sind das Fundament der Iop-Religion. Jemandem mit Schlag und Tat zur Seite stehen ebenfalls. 
content.9.2="Wer Tofueier stiehlt, wird auch vor einem Fresssack nicht haltmachen." Wahnsinn, wieviel Wahrheit in solch alten Weisheiten steckt, und welch gute Laune sie bei Srams auslösen.
content.9.3="Einer für alle, und alle auf den Sacri!", ist ein Schlachtruf, der die Anhänger von Sacrieur entzückt. Und während ihre Göttin eine Träne der Rührung wegwischt, fegen diese währenddessen die Überreste ihrer Gegner vom Boden.
content.9.4="Niemand beißt die heilende Hand". Mit dieser und ähnlichen Redewendungen im Kopf pilgern die Eniripsas durchs Land, schütteln Heilung aus dem Ärmel und hegen und pflegen alles, was sich bewegt und sich in ihre Hände begibt, bis es endlich entnervt mit völlig heiler Haut davonkommen kann.
content.9.5=Als Sadida die Sadidettchen erschuf, hat er diesen einen verdammt miesen Charakter auf den Weg mitgegeben... Zum Glück gab er den männlichen Anhängern dafür gefügige Puppen für ihre Bedürfnisse.
content.9.6=Anhänger von Osamodas, ihr liebt eure Tiere und euer Gott weiß das! Oh ja! Gegner von einem Tofu zerstückeln lassen oder zusehen, wie sie von eurem Fresssack aufgefressen werden... Das Leben kann soooo schön sein!
content.9.7=Eine Göttin, die das Geheimnis enthüllt, wie man am schnellsten seine Ladung verschießt, das wirft doch seltsame Fragen auf, oder? Ok, es geht zwar nur um Pfeile, aber anscheinend reicht das schon aus, um viele begeisterte Anhänger zu sammeln.
content.9.8=Es geht doch nichts darüber, einen Enutrof rennen zu sehen! Mit diesen zusätzlichen BP sorgen die Enutrofs nun überall für allgemeine Erheiterung.
content.9.9=Xélor erscheint nur denjenigen, die auch wirklich an ihn glauben. Diese Weisheit enthält viel Wahrheit und Tiefe und eröffnet euch eine vollkommen neue Perspektive.
content.9.10=Was den ganzen Charme der Ecaflips ausmacht, ist die Tatsache, dass diese angesichts eines 5-blättrigen Kleeblattes genauso ergriffen reagieren, wie angesichts eines zu Brei geschlagenen Feindes.
content.9.11=Die Göttin Féca versorgt ihre Anhänger mit einer optimalen Panzerung. Mit diesem leichten und praktischen, doch gleichfalls hieb-und stichfesten Vollkörperschutz wird euch mit Sicherheit keiner mehr etwas anhaben können. Jedenfalls viele nicht.
content.9.12=Nun, ich möchte nicht unhöflich wirken, aber wann geht es hier endlich zur Sache?
content.9.13=Hexenfluch. Unglücksrabe. Pechvogel, rabenschwarz obendrein und auf euch fixiert! Darf man denn hoffen, noch Glück im Unglück zu haben, wenn man mit offenen Augen ins Unglück rennt?
content.9.14=Zuschlagen, ausweichen, Zauber wirken - all dies kann einen Krieger auf die Dauer schon ganz schon erschöpfen... Zudem ist heut noch Stichtag mit Präventiefschlag. Drum macht mit Hast ne Rast und schöpft Kraft!
content.9.15=Glaubtet ihr wirklich, noch lange so herumspringen zu können? Denn das werdet ihr nicht...
content.9.16=Nun seid ihr allergisch gegen Wasser : Seewasser, Quellwasser, Regenwasser, stilles Wasser und Spülwasser
content.9.17=Es riecht angekokelt... Beim kleinsten Funken werdet ihr eine gewaltige Menge an Kalorien verbraten - das ist das mindeste, was man sagen kann!
content.9.18=Hat euch schon mal jemand gesagt, dass ihr den anderen mal Luft zum Atmen lassen solltet? 
content.9.19=Hier riecht es nach Schweiß und Tränen... Noch einen kleinen Hauch Blut dazu, und alles ist perfekt.
content.9.20=Bei Magnalebus, dem ehrenwerten und berühmtesten Thaumaturgen aller Welten, Großgeist mit gestählten Zehen! Allen möge es nun besser gehen!
content.9.21=Hört ihr die laute Stimme der Verkündigung? "Es wird spritzen! Das wird eine feuchtfröhliche Angelegenheit!" Ein gutes Omen, meint ihr nicht auch?
content.9.22=Nichts rührt euch? Ihr seid ein abgestumpfter Brutalo? Aber, aber! Wer wird denn da Selbstzweifel aufkommen lassen! Nutzt es aus! Gleich startet hier die ultimative Metzelparty!
content.9.23=Es ist an der Zeit, dass eure Intelligenz Hand in Hand geht mit dem Untergang eurer Feinde! 
content.9.24=Ja genau! Jetzt könnt ihr euch mal so richtig durchpusten lassen!
content.9.25=Sprich mir diesen Satz 10 mal nach : "Geister der triefnassen Wasserwellen, die öfters an- und abschwellen, stärkt meine intellektuellen Gehirnzellen, um den Sieg mir sicherzustellen."\nEinfach und wirksam, meint ihr nicht?
content.9.26=Ihr kennt den Spruch: "Ein rollender Stein zermatscht Mark und Bein"? Aber wie ihr sicher wisst, verhindert Panik noch lange nicht die Gefahr an sich. Drum betrachtet euch nun als gewarnt: denn ein vorgewarnter Abenteurer zählt für zwei...
content.9.27=Der Kampf nimmt kein Ende? Jeder will endlich den schon seit langem verdienten Sieg feiern oder die Niederlage in Bier ertränken? Glücklicherweise erfüllt die Göttin Pandawa euren Wunsch und bietet euch genau das, ohne dass ihr dafür das Gemetzel unterbrechen müsst.
content.9.43=Die letzten Tests unsere Spezialisten war leider eher erfolglos. Während er viel Zeit mit Grübeleien und Fehlerfinden verbringt, kann man Selbiges ganz und gar nicht von beschworenen Kreaturen behaupten!
content.9.44=Beim Versuch, den Fluss der Zeit zu unterbrechen, scheint unser augenblicklicher Experte eine Welle der Gewalt bei beschworenen Kreaturen losgetreten zu haben!
content.9.45=Unser Spezialist versucht immer wieder, die Zifferblätter zu reparieren. Die letzten Tests könnten unerwünschte Auswirkungen haben. 
content.9.46=Unser Spezialist vor Ort, Montrakristo, scheint bei beschworenen Kreaturen einige neue Eigenschaften festgestellt zu haben, wie zum Beispiel eine gesteigerte Resistenz!
content.9.47=Wir haben jeglichen Kontakt mit unserem Spezialisten Montrakristo verloren, aber wir haben einen Bärenschrei gehört, wie ihn nur Osamodas hervorstossen können.
content.9.48=Was den ganzen Charme der Ecaflips ausmacht, ist die Tatsache, dass diese angesichts eines 5-blättrigen Kleeblattes genauso ergriffen reagieren, wie angesichts eines zu Brei geschlagenen Feindes.
content.9.49=Wüstes Gemetzel und metzelhafte Verwüstungen sind das Fundament der Iop-Religion. Jemandem mit Schlag und Tat zur Seite stehen ebenfalls. 
content.9.50=Eine Göttin, die das Geheimnis enthüllt, wie man am schnellsten seine Ladung verschießt, das wirft doch seltsame Fragen auf, oder? Ok, es geht zwar nur um Pfeile, aber anscheinend reicht das schon aus, um viele begeisterte Anhänger zu sammeln.
content.9.51="Doppelt geheilt, hält besser!" Mit solchen Sprüchen auf den Lippen pflegen Eniripsa-Anhänger dann loszuheilen, was ihre Stimme hergibt. Nichts und niemand kann ihrem Heilfest entrinnen!
content.9.52=Die Göttin Féca versorgt ihre Anhänger mit einer optimalen Panzerung. Mit diesem leichten und praktischen, doch gleichfalls hieb-und stichfesten Vollkörperschutz wird euch mit Sicherheit keiner mehr etwas anhaben können. Jedenfalls viele nicht.
content.9.53="Einer für alle und alle auf den Sacri!" Dieser Kriegsschrei wurde mit Sicherheit von einem Sacrieur für alle Sacrieurs entwickelt. Während die Göttin vor Rührung ein Tränchen ausdrückt, zerdrücken ihr währenddessen den nächsten Gegner!
content.9.54=Xélor erscheint nur denjenigen, die auch wirklich an ihn glauben. Diese Weisheit enthält viel Wahrheit und Tiefe und eröffnet euch eine vollkommen neue Perspektive.
content.9.55="Wer ein Tofu-Ei stiehlt, mach auch vorm Fresssack nicht halt!" \nWahnsinn, wieviel Wahrheit in solch alten Redewendungen steckt und welch gute Laune sie bei Sram-Anhängern verbreiten...
content.9.56=Der Kampf nimmt kein Ende? Jeder will endlich den schon seit langem verdienten Sieg feiern oder die Niederlage in Bier ertränken? Glücklicherweise erfüllt die Göttin Pandawa euren Wunsch und bietet euch genau das, ohne dass ihr dafür das Gemetzel unterbrechen müsst.
content.9.57=Es geht doch nichts darüber, einen Enutrof rennen zu sehen! Mit diesen zusätzlichen BP für seine Anhänger sorgt der Gott Enutrof nun überall für allgemeine Erheiterung.
content.9.58=Dass seine Anhänger Haustiere mögen, dass weiß ihr Gott sehr zu schätzen! Ha, die Gegner mit Tofus piesacken, ihnen dazu noch einen Fressack auf den Hals hetzen... Hach, was ist das Leben schön!
content.9.59=Als Sadida die Sadidettchen erschuf, gab er ihnen einen ganz schön miesen Charakter mit auf den Weg. Zum Glück für die männlichen Sadidas bekamen die Sadidettchen von ihrem Gott auch noch ein paar fügsame Püppchen zum Spielen!
