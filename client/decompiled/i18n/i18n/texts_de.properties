content.4.425=Das ist aber ein komisches Geräusch, den ein sauer gewordener Bär macht... und wenn es ein blutrünstiger Bär ist, dann hört sich das Ganze viel schlimmer an.
content.4.426=In diesem Fall ist Schizophrenie also von Vorteil?
content.4.427=Bis dieser Nebel sich verzogen hat, wird Blut fliessen.
content.4.428=Ihre Feinde sagen, sie sei ein Klotz am Bein. Ihre Freunde sagen das Gleiche.
content.4.429=Wenn es darum geht, Witze zu erzählen, ein Gläschen zu trinken und Köpfe zu zerquetschen, dann ist der Krachler der Ebenen der ideale Begleiter. 
content.4.430="Arcana tempus fugit!" 
content.4.431=Wenn ein Crâ sich für einen Sram hält...
content.4.432=Und hop!
content.4.433=Dieser Pfeil bohrt sich in einen beliebigen Gegner und zwar in die fleischigsten Körperteile.
content.4.434=Diese Puppe springt euren Gegnern um den Hals. Aber keine Sorge, deren Freude wird nur von kurzer Dauer sein.
content.4.435=Wenn es darum geht, Witze zu erzählen, ein Gläschen zu trinken und Köpfe zu zerquetschen, dann ist der Krachler der ideale Begleiter. 
content.4.436=Ansturm ist ein auf den Schlachtfeldern gefürchteter Zauberspruch, insbesondere die Variante "Anstürmende Neubauten".
content.4.437=Ganz plötzlich fühlen sich eure Gegner schwerfällig... und plump und unbeholfen. Ans Kämpfen ist nicht zu denken!
content.4.438=Ideal für sommerliche Grillabende und lange Winternächte. Hinterlässt euren Gegnern bleibende und brennend heiße Erinnerungen.
content.4.439=
content.4.440=Was auch immer das war, es war schnell... und es tat weh!
