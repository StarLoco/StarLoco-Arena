content.59.42=Die Hormonde ist mit verschiedenen Orten und verschiedenen Epochen verbunden. Von Arena aus kannst du bestimmte Gegenstände nach DOFUS oder nach Wakfu schicken. Wenn du an Turnieren teilnimmst, dann gewinnst du Jetons, mit denen du zum Beispiel DOFUS-Gegenstände kaufen kannst.
content.59.44=Hier hast du eine Zaap-Karte, die dich zur Höhle des Dämons I bringt (klicke auf den Zaap und wähle dann die Kard der Höhle des Dämonen). Er wird dir für deine nächsten Kämpfe ein paar nützliche Taktiken beibringen.
content.59.45=Hallo,\n\nAls ich noch unter den Lebenden weilte, war ich ein Champion des Elite-Modus. Was möchtest du wissen?
content.59.46=Der Elite-Modus ist für Coachs vorbehalten, die bereits alle Zaubersprüche und Ausrüstungen im Spiel gut beherrschen. Im Elite-Modus verfügst du für die Zusammenstellung deines Teams über ein Budget von 6000 Punkten, mit denen du ihm Zaubersprüche und Ausrüstungen zuteilen kannst. Auch als Anfänger im Elite-Modus erhältst du genauso viele Punkte, wie der beste Elite-Spieler und du hast genau den gleichen Zugang zu den Zaubersprüchen und Ausrüstungen wie dieser. Im Elite-Modus kämpfen alle mit den gleichen Chancen. \n \nIm Elite-Modus steigt deine Stufe, sobald du ein Match gewinnst und sinkt, wenn du verlierst. Die Dämonen können so über deine Stufe die passenden Gegner aussuchen.
content.59.47=Klicke in deiner Benutzeroberfläche der Teamverwaltung auf den Reiter Elite. Dort findest du 3 bereits zusammengestellte Teams mit denen du ein wenig üben kannst und so erfährst, wie Teams funktionieren.\n\nErstelle ein neues Team, sobald du dich dazu bereit fühlst. Füge dann Kämpfer ins Team hinzu, indem du auf "Kämpfer rekrutieren" klickst.\n\nVergiss nicht, dass du über 6000 Budgetpunkte verfügst, nicht mehr. Du wirst also zwischen 2 oder 3 sehr gut mit vielen Zaubern ausgerüsteten Kämpfern oder 5-6 weniger gut ausgerüsteten Kämpfern wählen müssen, die aber wiederum von ihrer Überzahl profitieren.
content.59.48=Ok, ich habe zwei Herausforderungen, die perfekt zu dir passen.  \n \nBei der ersten musst du darauf achten, dich in der Arena richtig zu platzieren und die Heilszauber deines Eniripsa klug einzusetzen.  \n \nIn der zweiten Herausforderung gilt es, die Mitglieder deines Teams und ihre Fähigkeiten exakt zu koordinieren, um deinen Gegnern beizukommen.
content.59.49=Je mehr <b>Siege du hintereinander</b> erringst, desto mehr Chancen hast du, nach einem gewonnenen Kampf Kards zu erhalten. Je <b>höher deine Stufe</b> desto seltener und wertvoller die erhaltenen Kards.
content.59.50=Hallo,\n\nich bin hier, um dir beim Verständnis des Evolution-Modus behilflich zu sein. Was möchtest du wissen?
content.59.51=Wenn du gerade in der Hormonde ankommst, dann ist der Evolution-Modus ideal. Mit Hilfe des Kanodo schaltest du Schritt für Schritt deine Zaubersprüche und Ausrüstungen für jeden deiner Kämpfer frei, das erleichtert das Lernen und das Erstellen deines ersten Teams. \n \nIm Evolution-Modus werden deine Kämpfer immer stärker und indem du Kämpfe aneinanderreihst, wird die Stärke eines Kämpfers durch seinen Rang bestimmt.  \n \nDie Liga in der du spielst wird durch den Rang bestimmt, den der stärkste deiner Kämpfer bekleidet. Je höher die Liga in der du spielst, desto mehr Kards und Ansehen bringt es. Dank deines Ansehens steigt deine Stufe und es ist auch das Ansehen, das dein Ranking der laufenden Saison bestimmt.  \n \nEs gilt, auf seine Kämpfer aufzupassen, sie können verletzt werden, wenn sie zum Beispiel völlig erschöpft in den Kampf gehen. Um das zu vermeiden und um mehr Erfahrung oder Ansehen zu gewinnen, sollte man die Boni ausnutzen, die von den Konsumgütern und Sets vergeben werden. \n \nVergiss nicht, dass du im Evolution-Modus keine Stufe verlierst, hab also keine Angst, eine Niederlage bringt dir eher sogar ansehen und Erfahrung!
content.59.52=In Evolution verfügst du nur über ein Team und eine Ersatzbank. Erstelle mit den Rekrutierungsbuttons deine Kämpfer direkt für dieses Team.  \n\nWenn du dein Team verändern möchtest, dann schicke bestimmte Kämpfer auf die Ersatzbank und rekrutiere neue dafür oder setze Kämpfer von der Ersatzbank in dein Team ein. 
content.59.53=Das Kanodo stellt den Lehrgang eines Kämpfers dar. Es besteht aus Sphären, die man mit Erfahrung erkaufen muss, die sich der Kämpfer angeeignet hat. \n \nMan kann nur eine Sphäre kaufen, die auf direktem Wege mit einer Sphäre verbunden ist, auf dem sich der Fortschritts-Cursor befindet (der Cursor wird durch den Kopf eures Kämpfers dargestellt). Erkaufte Sphären geben euch deren Boni, das können höhere Attributswerte sein, ein neuer Zauberspruch oder eine Ausrüstung, die sich für den Kämpfer freischalten. Achtung, es gibt auch Sphären, die Mali vergeben, aber das gehört zu den Opfern die ein Kämpfer bringen muss, um seine Lehren weiterzuführen.   \n \nEs gibt auch Spezialsphären, wie Portalssphären, die euch an einen anderen Ort des Kanodo teleportieren oder Barrieresphären, bei denen ihr zum Freischalten der Passage eine Kard opfern müsst. \n \nIndem ihr lernt, das Kanodo intelligent zu durchschreiten, könnt ihr so schneller zu wirkungsvolleren Kämpfern kommen, das ist fast schon ein Spiel für sich. 
content.59.54=Wie haben es ja bereits beim Evolution-Modus erklärt. Wenn deine Kämpfer verletzt werden, muss man sie heilen. Ein Kämpfer der nicht geheilt wird, erleidet im Kampf Mali und es ist sehr wahrscheinlich, dass sich seine Verletzungen verschlimmern.\n\nUm eine Verletzung zu heilen, gibt es nur eine Lösung, nämlich den Einsatz einer Heilungskard. Diese erhältst du entweder durch Tausch oder über die Boosters, die man mit Ogrinen auf der Webseite des Spiels kaufen kann.
content.59.55=Der Evolution-Modus unterscheidet sich von den anderen Modi im Kard-Gewinn. Im Evolution-Modus verfügst du über Boni, die deine Chancen beim Finden von Kards (Sammeln) erhöhen, sowie die Chancen, auf seltene zu stoßen (Filzen).  \n \nDiese Boni sind vor allem in den Sets zu finden, mit denen du dich ausstattest. Außerdem gilt: je höher deine Stufe und je mehr du in den höheren Ligen kämpfst, desto interessanter sind die Kards die du bei einem Sieg erhältst. \n \nIm Allgemeinen ist es so, dass man im Evolution-Modus die Kards etwas leichter erhält, als in den anderen Modi, aber da man diese ja auch ausgeben muss, zum Beispiel um sich zu heilen, ist das nachvollziehbar.
content.59.56=Hop!\n\nBevor du mich fragst, sag ich's dir gleich: Nein, das ist nicht mein Doppelgänger, sondern mein Zwilling. Wir sind die Gebrüder Noctis und zusammen waren wir einst Champions im 2 vs. 2 Modus! Was möchtest du wissen?
content.59.57=Mit dem 2 vs. 2 Modus kannst du mit einem Freund ein Elite-Team zusammenstellen und dir mit ihm die Kontrolle über die Kämpfer teilen, und ihr sie zu zweit in der Arena anführen. Dieser Modus ist sehr amüsant, denn er verlangt von deinem Mitspieler und dir eine sehr gute gegenseitige Kenntnis. Außerdem müsst ihr dazu imstande sein, sehr schnell miteinander zu kommunizieren, wenn ihr den Sieg davon tragen wollt.
content.59.58=Klicke in deiner Benutzeroberfläche der Teamverwaltung auf den Reiter 2 vs. 2. \n\nWenn du auf einen der Erstellungsbuttons unten am Fenster klickst, kannst du dir ein neues Team erstellen. Um die Zusammenstellung deines Teams zu bestätigen, musst du einen Freund aus deiner Freundesliste auswählen, mit dem du sie teilen willst und deinem Team einen Namen geben. Dann kannst du Kämpfer in dein Team hinzufügen, indem du auf "Kämpfer rekrutieren" klickst.\n\nVergiss nicht, dass du über 6000 Budgetpunkte verfügst, nicht mehr. Du wirst also zwischen 2 oder 3 sehr gut mit vielen Zaubern ausgerüsteten Kämpfern oder 5-6 weniger gut ausgerüsteten Kämpfern wählen müssen, die aber wiederum vom Zahlenvorteil profitieren. Bevor du spielst, musst du nur noch den Button zum Zuteilen von Kämpfern benutzen und das war's schon!
content.59.59=Je mehr <b>Siege du hintereinander</b> erringst, desto mehr Chancen hast du, nach einem gewonnenen Kampf Kards zu erhalten. Je <b>höher deine Stufe</b> desto seltener und wertvoller die erhaltenen Kards.
content.59.60=Hey, hallo!\n\nKomm zum alten Enutrof Gaisd der einst ein gefürchteter Turnierkämpfer war. Was möchtest du wissen?
content.59.61=Der Turnier-Modus steht als Modus etwas abseits, ich kann dir ein wenig darüber erzählen, aber wage dich nicht an ihn ran, bevor du zumindest einen der anderen Modi beherrschst! \n \nIn der Hormonde wird mindestens einmal pro Tag ein Turnier organisiert und findet oft zu ganz bestimmten Zeiten statt. Du kannst alle vorgesehenen Turniere in deinem Kalender einsehen, indem du unten auf deiner Benutzeroberfläche auf das Kalender-Icon klickst. \n \nDas Besondere an den Turnieren ist, dass sich die Spielregeln bei jedem Turnier ändern: Das Budget kann sich ändern, Zaubersprüche verboten sein und noch eine Menge anderer Sachen. \n \nUm an einem Turnier teilzunehmen, muss man sich anmelden und dann ein Team erstellen, das daran teilnehmen kann. Wenn die Stunde des Turniers naht, dann  kannst du in deiner Benutzeroberfläche der Teamverwaltung das Turnier und dein Team wählen und die Suche nach einem Gegner starten. \n \nTurniere sind sehr interessant und machen Spaß und ermöglichen außerdem das Gewinnen von noch nicht dagewesenen Belohnungen, sowie Belohnungen auf den anderen Spielen von Ankama!
content.59.62=Um sich für ein Turnier anzumelden, musst du dich entweder auf die Turnierinsel begeben und auf einen der Turniertotem klicken oder deinen Kalender benutzen, indem du auf das Kalender-Icon unten an deiner Benutzeroberfläche klickst. \n \nBei den Turnieren gibt es verschiedene Anmeldezeiten, du wirst dich also manchmal vor einem bestimmten Datum anmelden müssen.  \n \nAndere Turniere verlangen für eine Anmeldung eine Kard von dir. Diese Turniere bieten im Allgemeinen interessantere Belohnungen. \n \nManche Turniere sind nicht allen zugänglich, sie können privat oder einer Gilde vorbehalten sein oder nur für die besten Spieler, lies also immer gut die Beschreibungen eines Turniers durch, um die Anmeldebedingungen zu kennen.
content.59.63=J'aime ton esprit !\n\nEn participant aux tournois, tu gagneras des <b>jetons de tournois</b>. Tu pourras échanger ces jetons sur<b> l'île des tournois</b> contre des <b>kards exclusives.</b> \nParmi ces kards certaines te permettront <b>d'envoyer des objets</b> sur des jeux ankama comme <b>DOFUS. </b>Tu peux par exemple envoyer des parchemins de caractéristiques ou de sorts ou encore la fameuse panoplie champion !
content.59.65=Willkommen auf meiner Insel,\n\nIch bin der Dämon I. Um die Kampfprinzipien für Fortgeschrittene zu erlernen, geh zu meinen Dienern, den Minutendämonen.
content.59.66=Einen Kampf zu beginnen ist ganz einfach. Dazu brauchst du nur auf den Button <b>„Teamverwaltung"</b> klicken, der ein Fenster öffnet, wo du alle deine Teams verwalten kannst. \n \nDer Standard-Modus ist der Modus „Evolution" aber du kannst die Teams der anderen Spielmodi verwalten, indem auf deren Reiter ganz oben am Fenster klickst. \n \nSobald der Spielmodus ausgewählt ist, erstellst du dein Team, stellst Kämpfer dort ein und klickst auf den Button „Kämpfen" und schon kümmern sich die Dämonen darum, einen Gegner für dich zu finden, der dir gewachsen ist!
content.59.69=Oui, effectivement n'oublie pas de bien <b>orienter</b> tes combattants après chaque <b>mouvement et attaque</b> pour ne pas te retrouver désavantagé.\nMais tu peux aussi tirer <b>profit</b> des placements de tes adversaires !\n\nUne attaque de dos inflige <b>40%</b> de dégâts supplémentaire.\nEt une attaque de coté <b>20%</b> de dégâts supplémentaire donc n'hésite pas a être <b>fourbe.</b>\n\nPar contre les dégâts de zone ou neutres ne bénéficient pas de ce bonus.
content.59.70=Blou 
content.59.71=Nouveau message
content.59.72=pour créer un retour de dialogue, il faut:\n-sélectionner le dialogue sur lequel on veux retourner\n-le copier\n-sélectionner le dialogue sur lequel on veux une réponse qui crée un retour\n-et coller
content.59.73=Nouveau message
content.59.74=Le sujet est vaste.\nQue veux-tu savoir précisément ?
content.59.75=Il existe quatres types de cartes en fonction de leur rareté, qui sont représentées par quatres couleurs différentes.\n\n- <b>Noir</b>, qui représente les cartes les plus banales.\n- <b>Cuivre</b>, pour les cartes communes.\n- <b>Argent</b>, symbolisant les cartes rares.\n- <b>OR</b>, qui est réservé aux cartes Ultra-rares.
content.59.76=Ici, tu te bat contre d'autres <b>joueurs</b> !\n\nNe t'étonne pas donc, si tu <b>perd</b> tes premiers matchs le temps de te faire la main.\nMais la victoire n'en sera que plus savoureuse !
content.59.77=Les kards représentent la totalité des <b>biens matériels</b> du jeu.\n\nElles forment ton <b>équipement, les compétences de tes combattants, ton argent</b>, etc.
content.59.78=Effectivement, chaque kard à une valeur en <b>kamas</b>, et fait office de monnaie.\nTu peux donc t'enrichir en collectionnant les kards.\n\n<b>C'est tellement plus simple de payer par carte de nos jours, tu sais.</b>
content.59.79=Pas toutes banane !\n\nCertaines kards sont effectivement des <b>morceaux d'armure</b>, et tu peux les équiper comme tel.\nDis toi qu'une kard est juste un <b>support</b> qui te permet d'indexer plus facilement ce que tu possède ! Tu ne revêt pas la carte évidemment !\n\nCependant fait <b>attention</b> au <b>niveau</b> de la kard ! même si tu revêt une pièce d'armure qui demande un niveau 15 par exemple, et que tu es niveau 10, tu ne <b>bénéficie pas</b> des bonus relatifs à celle-ci !\nMais ça ne t'empêche pas de le porter.
content.59.80=Il existe <b>beaucoup</b> de manières d'obtenir une kard.\n\n- La plus courante, est grâce aux <b>boufteurs</b> que tu peux récupérer sur le site en échange de quelques ogrines.\n- En mode évolution, à chaque fois que tu <b>gagne</b> un match, tu as une chance de gagner une Kard relative à ton niveau.\n- Tu peux aussi faire des <b>échanges</b> avec d'autres joueurs, et gonfler ta collection\n- Il existe certains <b>challenges</b> qui permettent d'en gagner !\n- Pour obtenir certaines kards rares tu dois aller en acheter chez un <b>kard master !</b>\n- Sinon tu as aussi les <b>Autels de fusion</b>, qui vont te permettre de créer des cartes que d'autres joueurs ne connaissent peut-être pas.\n- Et pour finir, tu peux obtenir des Kards inédites en participant à des <b>tournois !</b>
content.59.81=Les kard master, sont des <b>vendeurs</b> de cartes en quelques sortes, tu peux les trouver disséminés à travers l'hormonde.\n\nChaque zone possède au moins <b>un</b> kard master, qui propose des cartes plus ou moins puissantes en fonction du niveau de cette zone.\nC'est pour ça que certains kards masters sont très <b>convoités</b> par les coachs.\n\nComme je te l'ai dit précédemment pour acheter une kard tu dois <b>donner</b> d'autres kards qui feront office d'argent, il faut que le somme soit suffisante pour payer la kard que tu veux acheter.
content.59.82=Je vais tout t'expliquer en détails !\n\nL'autel de fusion, permet <b>d'obtenir</b> une kards si on <b>sacrifice</b> d'autres kards, en suivant une recette prédéfinie, et souvent <b>inconnue !</b>\nil faut donc que tu fasse des <b>essais</b> pour trouver les bonnes recettes.\n\nChaque Autel de fusion est <b>différent</b>, et plus ou moins <b>puissant</b> en fonction de la zone ou il est.\nDans une zone très haut niveau un autel de fusion peut-être si puissant qu'il permet d'avoir un taux de réussite à <b>100%</b> s'il est boosté à fond !\n\nMais les % de réussite d'une fusion dépend de beaucoup de critères, dont je vais t'expliquer le fonctionnement.\n\nIl existe des <b>Kards fusion</b>, qui sont spécialement conçues pour <b>booster</b> les autels\ndonc, par exemple, si tu souhaite faire une fusion avec des cartes de très haut niveau, non seulement il te faut un autel <b>extrêmement puissant</b>, mais aussi une carte fusion qui va <b>booster</b> tes chances de réussites !\n\nCe que tu dois retenir c'est que, plus la fusion que tu veux faire est puissante, plus elle est difficile à réaliser ! Il faut donc mettre toutes les chances de ton coté !\n\nCeci dit, si tu rate une fusion, ne perd pas espoir, en fonction de la puissance de l'autel tu as une chance de récupérer des cartes utilisées.\n\nMais n'oublie pas que les cartes les plus puissantes ne peuvent être obtenues que de cette manière, et qui sait, tu tombera peut être sur une Kard unique et jamais vue.
content.59.83=Le tacle est une compétence que <b>chaque combattant possède</b>, il permet d'avoir une chance de <b>bloquer le mouvement</b> d'un adversaire si il passe près de toi, et lui faire <b>passer son tour.</b>\n\nLe tacle est influencé par deux caractéristiques des combattants,<b> l'esquive, et le blocage !</b>\nL'esquive te permet de <b>réduire</b> tes chances de te faire bloquer par un adversaire.\nTandis que le blocage te permet d'avoir <b>plus </b>de chance de bloquer celui-ci.\n\nSi tu veux savoir combien de chances tu as d'esquiver un tacler sur une case, tu dois <b>placer</b> le curseur sur la case en face du combattant qui doit se déplacer. tu auras un nombre qui s'affichera.
content.59.84=Le <b>grimoire</b> de kards permet de <b>consulter</b> facilement ses cartes et savoir quelles cartes il nous manque.\nIl permet également de gérer ton <b>équipement</b> de coach !\n\nMais il possède aussi une autre particularité, il contient une <b>encyclopédie</b> sur toutes les classes et leur sorts, sur toutes les invocations possibles, et sur toutes les cartes actions utilisables en combat !\n\nAutrement dit il est <b>indispensable !</b>\n\nComment ça tu ne sais pas ou le trouver ? il se situe juste en dessous du bouton de gestion des combattants ! le gros bouton jaune orange en bas !
