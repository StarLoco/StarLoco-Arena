content.2.1=Dieses Schwert wurde durch die Tränen des Engels Raziel geweiht. Zufrieden rief er danach aus: " Dies ist Raziel! Drum gebt fein acht, gleich wird euer Kopf einen kürzer gemacht!" Wie sprachgewaltig!
content.2.2="Ein außergewöhnliches Schwert für Abenteurer auf der Suche nach außergewöhnlichen Erfahrungen" liest man im Bedienungshandbuch. Handbücher von Schwertern sind auch nicht mehr das, was sie mal waren.
content.2.3=Dieses Schwert wurde in den Tränen eines jungen WuWulfs getränkt. Viele Krieger glauben, das bringe ihnen Glück und Mut auf dem Schlachtfeld. Sie sind ja so naiv...
content.2.4=Da es gleich nach dem Schmieden im Blut eines Schweinedrachens abgeschreckt wurde, hat das Goultard einen eigentümlichen Geruch an sich. Riecht es nach Drachendung? Schweineurin? Schwer zu sagen.
content.2.5="Höllisch Scharf" - so äußerte sich der Schmied zufrieden nach Erschaffung dieser Waffe. Vielleicht waren das aber auch die Worte mit denen Vald seine Schwester beschrieb. So genau weiß man das nicht mehr.
content.2.6=Man fragt sich wirklich, was in aller Welt denn ein königlicher Fresssack mit einem Schwert anfängt? Sich morgens damit rasieren, vielleicht? Das würde auch erklären, warum das Schwert nach Wollfett riecht.
content.2.7=So furchtbar scharf und unglaublich stylisch ist diese Klinge, dass sie viele Neider finden wird... wenn ihr oft in Rablingskreisen verkehrt.
content.2.8=Ihr denkt, ihr seid schön, geschickt, intelligent und stark genug, um dieses Schwert zu führen? Wunderbar! Jetzt fehlt euch nur noch ein wenig Glück, um es gegen eine echte Klinge einzutauschen.
content.2.9=Vorsicht beim Umgang mit der Klingonia! Sie verursacht beim Gegner geistige Umnachtung auf Grund von plötzlich eintretender Kopflosigkeit.
content.2.10=Kalamitäter ist ein echt stylisches Schwert. Wenn der Gegner nicht gleich vor Angst und Schrecken bibbert, so wird es ihn trotzdem gehörig beeindrucken, damit ihr ihn schnell noch mit einem alten, aber gemeinen Trick überrumpeln könnt.
content.2.11=Mit dieser Waffe könnt ihr auf lahmen Gesellschaftsabenden leicht das Eis brechen. Und wer dabei eurem Charisma widersteht, dessen Willen verdient es, von ihr gebrochen zu werden.
content.2.12=Diese Klinge kann wie ein Fächer geführt werden und sorgt für eine optimale Luftzufuhr. Dabei könnt ihr gleichzeitig Moskitos dezimieren oder aber die Gesichter eurer Freunde entstellen.
content.2.14=Aus hervorragender Manufaktur hervorgebracht und für Frakturen wie gemacht, wird eurer Gegner abgeschlacht, bevor 3x Beißdolch er sagt.
content.2.15=Basher sind fürchterliche Waffen, gut geeignet für jeden Meuchelmörder. Wenn das Opfer auch nur den Widerschein der Klinge erblickt, wird es alle Gegenwehr aufgeben.
content.2.16=Die Blessurdolche gehörten einst dem berüchtigten Dunkelhand-Oger, der umkam, als er einen Bimd Oul-Paladin angriff...oder ein Stück Bworkwurst abschnitt. So genau weiß das niemand mehr.
content.2.17=Die Chakraden sind Schwesterdolche, die einst einer berüchtigten Diebin Amaknas gehörten. Diese war so professionell, dass sie es sogar schaffte, sich im Schlaf selbst zu berauben!
content.2.18=Diese Dolche geben ihrem Träger die Macht, Alles und Nichts zu stehlen, und zwar von Jedermann. Oder genauer: Irgendwas von Irgendwem. Oder war es umgekehrt? Wir werden es wohl nie erfahren...
content.2.19=Diese Dolche wurden speziell dazu geschaffen, Wurzeln und junge Triebe zu stutzen, doch dann stellte jemand fest, dass man aus ihnen ebenfalls eine nahezu tödliche Waffe machen kann...
content.2.20="Ohne Stoß ist doch nix los!" oder gar "Los, du Strolch, friss meinen Dolch!". Diese und andere Sprüche prasselten ständig aus dem Mund der gefürchteten Fechterin Elorie auf ihre Gegner ein, während sie sie derweil mit den Grausamen Dolchen außer Gefecht zu setzten pflegte.
content.2.21=Diese Dolche wurden konzipiert, um kurzen Prozess mit allem zu machen, was mit "oden" endet: Saurer Boden, Bademoden, Sauropoden oder WuWulf-...Testikel.
content.2.22=Dieser Dolch ist die letzte Arbeit des berühmten Waffenschmiedes Dolchevito. Es gibt wirklich schlimmere Wege, seine Karriere zu beenden.
content.2.23=Diese Dolche wurden von der ältesten Tochter der Hishantes-Familie geschmiedet. Gegen die langjährige Familientradition als Pralinenhersteller verstoßend, entschied sich Lapicki, Schmiedin zu werden und kam so zu Ruhm und Namen.
content.2.24=Diese Dolche gehörten einst einem berühmten, aber sehr zerstreuten Fantastilliardär, welcher stets Stiefel, Krone und sogar Unterhosen falsch herum anzog. Angesichts dessen stellt sich die Frage, wie er wohl diese Dolche gebrauchte...
content.2.25="Wie's brennt so tief der Schnitt vo' Leber bis Prostata!", schrie Ezil entsetzt auf, als er von Dark Vlad niedergemetzelt wurde. "Benennt meinen Lieblingsdolch Regatta!", verstanden seine Freunde. Sein letzter Wille wurde erfüllt.
content.2.28=Diese feine Waffe erlaubt es, selbst versteckte Ziele punktgenau zu treffen. Ihr solltet sie allerdings nur mit euren Fingerspitzen anfassen, denn sie ist mindestens genau so empfindlich wie die Herzen derer, die sie zerreißt.
content.2.29=Der Mann, der diesen Bogen erschaffen hat, ein gewisser Mark Hidsad, hat niemals richtig gelernt, damit umzugehen. Die meiste Zeit verletzte er seine Gegner genauso schwer, wie sich selbst.
content.2.30=Der Herzensbrecher gehörte einem Bogenschützen namens Nussknacker. Da der es irgendwann Leid war, ein mieser Bogenschütze zu sein, folgte er dem Rat seines Meisters und begann, sich auch auf Ziele über der Gürtellinie zu konzentrieren.
content.2.31=Abge hatte einfach den Bogen raus. Seine Pfeile erwischten den Gegner von hinten durch die Brust ins Auge.
content.2.32=Dieser Bogen ist ideal für Fischer. Damit können sie nämlich die Küste vom herumlungernden Ungeziefer befreien, ohne dafür von ihrem Sitz aufstehen zu müssen. Und dies auch noch durch das Fenster ihrer Lieblingskneipe hindurch! Wahnsinn!
content.2.33=Mit dem Penetrator werden sich eure Pfeile selbst durch die schmalsten Öffnungen bohren. Wie zum Beispiel des Gegners Nasenlöcher, sein Trommelfell, sein...
content.2.34=Der Ultimo-Bogen verschießt ausschließlich Ultimo-Pfeile. Woran erkennt man die? Nun, das ist einfach. Bevor ihr das Wort "Ultimatum" dreimal ausgesprochen habt, haben diese bereits ein Loch in euren Kilt gebohrt.
content.2.35=Aus der fehlgeschlagenen Kreuzung eines Astaknyden mit einem Trunknyden hat ein findiger Bogenbauer dieses hervorragende Kleinod herausgearbeitet. Könnten nur eure Eltern das Gleiche von euch behaupten...!
content.2.36=Was diesen Bogen angeht, so dürft ihr, wie jeder andere auch, dreimal raten, warum er einen solch bescheuerten Namen trägt.
content.2.37=Dieser Bogen verschießt Pfeile voller Liebe und Leidenschaft. (Glichermaßen stimmt, dass er voller Liebe und Leidenschaft Pfeile verschießt). So zielte der Engel auf eine bildhübsche Féca, und traf stattdessen einen Minotoror... ein Pfeil zuviel!
content.2.38=Dieser Bogen enthält zusätzlich auch noch eine integrierte Angel, mit der sich auch all die nicht fliegenden Fische aus dem Wasser holen lassen.
content.2.39=Dieser Zauberstab stammt geradewegs aus dem Limbo. Mit ihm kann man alles machen: Limbo tanzen, Filme drehen, Computerprogramme schreiben und natürlich auch Zaubersprüche wirken. Ganz schön fortschrittlich, was?
content.2.40=Der Ursprung des Wortes "Himmeline" ist umstritten. Während  "Himmel" als Stamm gut erkennbar ist, so wirkt das Suffix "ine" in diesem Kontext doch merkwürdig. Welche Assoziation ist nun richtig? Biene? Mine? Oder gar Latrine?
content.2.41=Dieses einfache Stockbrot wurde zu einer gefürchteten Waffe, nachdem Xaver, der Bäcker, es im Jahr 123 zum Warmhalten in den tiefsten Punkt seines Ofens geschoben hatte und 234 Jahre später aus Zufall wiederfand.
content.2.42=Dieser Stab besteht völlig aus Huvr-Holz, daher wurde er auch Huvrett genannt. Gut, dass sein Erschaffer kein Kabar-Holz dafür verwendet hat!
content.2.43=Man sagt, dieser Stab habe die Macht, andere zu beherrschen. Laut Anleitung soll man ihn heftig vor dem Gesicht der Zielperson hin- und herschütteln. Aber mit ihm auf sie einzudreschen, funktioniert meistens genauso gut.
content.2.44=Dieser Stab ist brennend heiß, wenn man ihn anfasst. Aber noch rätselhafter ist sein Aschegeruch, der die Vermutung nahelegt, dass das Holz einen Waldbrand überlebt hat.
content.2.45=Wabbel wurde aus hochschwabbeligem Material gefertigt. Drum läßt sich dieser Zauberstab (sofern man Stab dazu sagen kann) sehr schlecht handhaben. Nur beim Höhepunkt des Kampfes wird er erstaunlicherweise steinhart.
content.2.46=Überirdische Elemente wurden bei der Erschaffung dieses stets die Grenzen der Wirklichkeit durchstreifenden Stabes mit eingearbeitet. Sein Träger wird sicher mehr als einmal glauben, er sei in der 4ten Dimension gelandet.
content.2.47=Seltsam, aber wahr: der Heuler verstummte eines Nachts im tiefsten Descendre. Glücklicherweise, kann man sagen! Denn allein sein Husten lässt einem das Trommelfell platzen. Richtig furchterregend!
content.2.48=Die in Runa eingeritzten Runen behaupten, dass der erste, der ihr Geheimnis enträtseln könne, später zum König über ganz Amakna gekrönt würde. Aber mal ehrlich, wer glaubt denn noch an solch einen Unsinn?
content.2.49=Vor langer, langer Zeit gehörte dieser Stab einmal einem Prinzen, dessen kurze grüne Tunika die Phantasie mehr als nur eines Mädchens angeregte.
content.2.50=Beim Anblick eures Stabes überkommen eure Gegner schwere Kalaueranfälle! "Dieser Stab ist ja ganz karg, das Sternlein dran wohl darben mag!" Die Ärmsten... Deberk verhindert zwar, dass ihr mitlacht, aber nicht, dass ihr die Gegner kaputtmacht.
content.2.51=God Rod ist eine extrem mächtige Waffe. Selbst wenn ihr gerade mal eine kleine Schwäche verspürt, dann wird seine große Macht euch immernoch den Besten der Besten mindestens ebenbürtig sein lassen.
content.2.52=Dieser lebende Stecken hängt immer an den düsterlichsten Orten von ganz Amakna herum. Alle 300 Jahre ändert er Ort und Besitzer, wobei er es vorzieht, dabei immer möglichst dunkle und übelriechende Tunnel und Gänge zu nehmen.
content.2.53=Dieser Stab gehörte dem berüchtigten Wa Wabbit.
content.2.54=Der Erfolg des Wa Wabbit-Steckens führte zum Auftauchen einer großen Anzahl an Fälschungen auf dem Markt. Natürlich mit dem Ziel, die Imitate noch leichter verkaufen zu können. Ist ja schließlich eine altbekannte Technik der Immobilienmakler.
content.2.55=Es wird gesagt, dass man mit diesem Stock sogar ungestraft die Weichteile von Weich-Eich streicheln könne. Nun, wir würden es euch dennoch nicht empfehlen, denn das Streichelholz ist leicht entflammbar.
content.2.56=Diese Pflanzen fressende Wurzel buddelt sich einen Weg zwischen den vielen toten Blättern hindurch, um an junge Sprösslinge heran zu kommen. Eindrucksvoll... aber auch völlig unnütz, falls ihr nicht gerade gegen Löwenzahn kämpft.
content.2.57=Der Bärenmann benutzte diesen Stecken gern zum Zähmen von beschworenen Tieren und Monstern, sowie um seinen überspannten Kindern auf die Finger zu klopfen. Dieser Mann hatte verstanden, dass man ohne eine gute Kinderstube nicht weit kommt.
content.2.58=Eines Tages hing der Sadida Aga Dou am Ende seines Steckens eine kleine Puppe auf. Seitdem werfen sich alle Iopinen wie von Sinnen auf diesen Stecken beim Versuch, die Puppe zu erhaschen... sehr zur Freude Aga Dous.
content.2.59="Stock, ab jetzt heißt du Stroom! ", sprach der Sadidameister. Dann fügte er hinzu: "Möge dich der stroomigste Stroom während des Stroomens stroomen!" Das Schlimmste dabei ist: sein Wunsch ging in Erfüllung!
content.2.60=Der Nachtwächter ist ein Stecken, der seinem Träger mitunter dunkle Ringe unter den Augen beschert. Allerdings verdankt ihm so manch ein Gegner auch seine akute Zahnlosigkeit. Damit gleicht sich eben alles wieder aus.
content.2.61=Der Schlag-Baum hasst alles, was auf zwei Beinen geht und eine Axt benutzen kann. Könnt ihr euch nun vorstellen, welch eine Qual das war, von diesem Baum einen Stecken abzuschneiden? 
content.2.62=Dieser Stecken gibt im Kampf seltsame Töne von sich... Sie klingen, als wenn Pferdehaar über Ratzkatz-Gedärm gestrichen würde... Daher empfiehlt es sich, immer schön laut zu singen, während man seine Gegner erledigt.
content.2.63=Kaiser ist der Name des Schweinedrachens, welcher ganz auf einmal den Entschluss fasste, einen Jongleur zu fressen. Eine ausgesprochen schlechte Idee, wenn man bedenkt, dass der Jongleur gerade dabei war, mit 7 Hämmern zu üben...
content.2.64=Ragnarok ist ein wirklich sehr mächtiger Hammer, der in der Lage ist, Unwetter auszulösen... oder vor Wut blitzende Augen bei euren Verbündeten, falls diese versehentlich davon betroffen wurden.
content.2.65=Dieser Hammer gehörte einst dem Wächter des Tores der Hölle. Er verhinderte, dass die Lebenden dort hineingehen, die Toten herauskommen und sich die lebenden Toten überhaupt vom Fleck bewegen.
content.2.66=Rassrass befand sich einst in den Händen eines Kindes mit furchterregenden Kräften. Allerdings weiss niemand, wer diese Waffe nun besitzt, seitdem das Kind sie bei einem Abenteurer gegen einen Sack Murmeln eingetauscht hat.
content.2.67=Dieser Hammer ist dermaßen lächerlich, dass sich euer Gegner beim Anblick sofort kaputtlacht, während ihr ihn dann damit kaputtmacht.
content.2.68=Der Krötsal wurde aus dem Chitinpanzer einer weisen Schildkröte gefertigt, die ziemlich viel in Amakna herumgekommen war. "Schildkröten können dir mehr über den Weg erzählen als Hasen", das war ihr Lieblingsspruch. Während sich alle in der Umgebung gegenseitig umbringen, könnt ihr nun den Geschichten von Krötsal lauschen. 
content.2.69=Die Falistos sind außergewöhnliche Schmiede (die Qualität ihrer Hämmer ist dafür Beweis genug). Ehemals dämonische Anhänger Xélors, haben sie ihren Gott verlassen. Diese Tat hat schwere Folgen: nämlich ihre höllische Verspätung!
content.2.70="Was ist mit meinem Hammer, warum interessiert ihr euch alle für meinen Hammer?", brüllte Sledge wie üblich. Denn kein Kriegshammer ist dermaßen behämmert wie Sledges.
content.2.71=Nur Helden, hart wie Stahl werden diesen Hammer tragen können. Die Erklärung ist ganz kausal. Denn die Geheimwaffe des Hammers wirkt nasal...Flatulenza Infernal!!! Das hält Freund und Feind gleichermaßen in gesunder Bewegung, besonders in Nahkampfentfernung!
content.2.72=Wenn in Amakna junge Schüler nicht brav waren oder nicht lernen wollen, dann schlägt man ihnen mit diesem Hammer auf die Finger. Dieser eine hier hat hauptsächlich Iop-Glieder auf dem Gewissen.
content.2.73=Dies ist DIE Traumwaffe für alle Xélor-Anhänger, die auf der Suche nach dem gewissen Kick sind. Außerdem kann man mit ihr endlich einmal all den angestauten Dampf wegen der zu geringen Körpergröße ablassen.
content.2.74=Der Name Barabas ist eine Verballhornung des Kriegsrufes "Barh'Tah'Bass", der oft von den Milizen von Brâkmar bei ihren Manövern ausgerufen wird und soviel bedeutet wie : "Bleib 'art ann' bash'se".
content.2.75=Mit seinem seltsamen Aussehen auf halbem Wege zwischen einer Axt und einer Schaufel war Ares eine der sieben Waffen, die der Dämon Kajlir zum Besiegen der 'Bruderschaft der Purpur-Dofus sammelnden Enutrofs' verwendet hat.
content.2.76=Graubart war die Lieblingswaffe des Dämonenzwerges (oder Zwergdämonen?), der viele Dorfbewohner terrorisierte, weil er ohne auch nur "Vorsicht" zu rufen ihre Dörfer angriff, völlig ohne Rücksicht, so dass sie danach die Nachsicht hatten.
content.2.77=Das Goldzähnchen hält es mit der alten Volkswahrheit: "Reden ist Silber, Schweigen ist Gold." Daher fährt es seinen Gegnern ganz einfach über den Mund.
content.2.78=Ein Enutrof, der wohl in der Taverne ein wenig über seinen Durst getrunken hatte, stellte eines Tages fest, dass sich diese ursprünglich zum Ausheben unterirdischer Gänge konzipierte Schaufel auch hervorragend dazu eignet, Schädel von Gegnern zu bearbeiten.
content.2.79=Die Mischmaschschaufel ist DIE Lösung für all eure kleinen Gärtnereiproblemchen. Mit ihr könnt ihr sämtliche Radieschen aus dem Garten ausbuddeln und stolz euren Gegnern zeigen, mit der Wurzel voraus!
content.2.80=Diese Schaufel wird von den kannibällischen Priestern der Moon-Insel ausschließlich dazu genutzt, Zebub zu beschwören, eine Gottheit mit dem Kopf einer Kuh. Wozu das? Wer weiß...
content.2.81=Misacal verpasst einem den Mundgeruch eines kranken Schakals. Das ist recht störend für das Gesellschaftsleben. Daher ein guter Rat: Falls ihr zusammen mit anderen in die Schlacht zieht, dann wahrt immer ausreichend Abstand zu euren Gefährten.
content.2.82=Die Untreue Totengräberin hat schon mehr als einen Dummkopf beerdigt, der sich mit ihr an der Seite zu sicher geglaubt hat. Doch mit eisernem Willen und guter Durchsetzungskraft wird euch diese Waffe auch bei schweren Schicksalsschlägen treue Dienste leisten.
content.2.83=Wird der Wächter direkt vor eurer Eingangstür in den Boden gerammt, dann habt ihr von da an gantiert immer Ruhe und Frieden zu Hause. Denn der Wächter kann die sterblichen Überreste eurer Besucher auch schnell begraben.
content.2.84=Der genaue Augenblick, der für die Erschaffung dieser Schaufel wesentlich ist, bleibt ein von Eingeweihten gut gehütetes Geheimnis. Es heißt, die Mondphasen hätten was damit zu tun, aber das ist bloß reine Spekulation...
content.2.85=Solote ist eine Schaufel, die sich nicht abnutzt, wenn man sie benutzt, auch wenn man sie nicht putzt und viel nutzt. Damit ist alles gesagt, auch wenn nur wenig gesagt wurde. Hauptsache, sie ist Teil eurer Ausrüstung.
content.2.86=Mit Mamayabibo wird das Befüllen von Dutzenden von Maultaschen zum Kinderspiel. Das Verprügeln von ebenso vielen Flaschen ebenfalls. Tja, mit einem Mal machen all die lästigen Küchenarbeiten wieder richtig Spaß!
content.2.88=Mit diesem kleinen Hund macht selbst das tägliche Gassi-Gehen wieder Spass. Doch außer seinen gewohnten wildwachsenden Wurzeln sollte man ihm nichts zu fressen geben, sonst riskiert man dabei seine Hand zu verlieren.
content.2.89=Damen jeder Klasse werden beim Anblick dieses verschmitzten, kuscheligen, kleinen Fellknäuels weich. Allerdings sollte man dieses Tier keinesfalls unterschätzen.
content.2.90=Dieser kleine Wabbit ist ganz zahm. Daher wird er euch auch nicht beißen. Doch was alle anderen angeht...
content.2.91=Dieser süsse kleine Bwack wird später, irgendwann einmal, zu einem furchtbaren Kwacker werden. Doch bis dahin könnt ihr ihn getrost bei euch behalten.
content.2.92=Dieser süsse kleine Bwack wird später, irgendwann einmal, zu einem furchtbaren Kwacker werden. Doch bis dahin könnt ihr ihn getrost bei euch behalten.
content.2.93=Dieser süsse kleine Bwack wird später, irgendwann einmal, zu einem furchtbaren Kwacker werden. Doch bis dahin könnt ihr ihn getrost bei euch behalten.
content.2.94=Dieser süsse kleine Bwack wird später, irgendwann einmal zu einem furchtbaren Kwacker werden. Doch bis dahin könnt ihr ihn getrost bei euch behalten.
content.2.95=Dieser diebische kleine Klammeraffe scheint euch in sein Herz geschlossen zu haben. Er ist sehr fügsam, jedoch in kulinarischer Hinsicht sehr anspruchsvoll. Er isst nämlich nur Dinge, die auf seiner Insel wachsen.
content.2.96=Dieser fein gearbeitete Umhang wurde aus den Federn des letzten Heenchens von Amakna gefertigt. Eine echte Seltenheit also, die von vielen Sammlern heiß begeht wird.
content.2.97=Morgenappell auf der Hühnerfarm: "All' inn' Rei' "! Da sich der alte Hahn auch nach 20 "Rei' "-Rufen nicht blicken ließ, sollte er gerupft werden. Doch er entging der Strafe, da er nach 3 Tagem Hetzjagd tot umfiel. "...Rei' "schrie der Besitzer.
content.2.98=Die magische Kraft dieses Mantels wurde lange Zeit hinweg zu Unrecht unterbewertet, was zum Verschwinden von so manch einem Abenteurer geführt hat, unter anderem auch dem des berühmt-berüchtigten Minnesängers O'Heins.
content.2.99=Dieser mit Tofu-Federn besetzte Umhang erlaubt es seinem Träger, sehr schnell zu rennen und so leicht den Angreifern zu entkommen. Jedoch sollte man damit nicht erwarten, einen heldenhaften Eindruck zu hinterlassen...
content.2.102=Dieses Gewand gehört zu den Mächtigsten der ganzen Welt. Es verstärkt merklich die Kräfte seines Trägers. Ist es nicht gerade voll im Trend als Tourist durch die Schlachtfelder zu stolzieren?
content.2.103=Dieses königliche Gewand hat einmal der berühmte Wa Wabbit besessen. Seine Farbe lässt auf die Ernährungsgewohnheiten dieser Eminenz schließen. Das ist allerdings kein Grund, gleich unter die Frischköstler zu gehen!
content.2.104=Dieser seltsame Umhang zieht all seine Kraft aus seinem heruntergekommenen Aussehen. Drum behaltet für ihn folgenden Merkspruch immer im Hinterkopf: "Je schmutziger, desto nützlicher!"
content.2.105=Solchermaßen gewappnet, könnt ihr glatt durch den ganzen Wald stolzieren, ohne erkannt zu werden. Doch seht euch vor! Es kann schnell passieren, dass den Astaknyden bei eurem Anblick der Saft zur Krone schießt.
content.2.106=Dieses sackförmige Gewand hat alles was man sich nur wünschen kann: es ist behaglich, widerstandsfähig, schön gefärbt und höchst selten... Nur der Geruch ist eine Zumutung für jede Nasenhöhle.
content.2.107=Dieser elegante Umhang wird euch für alle Hobby-Botaniker unwiderstehlich machen.
content.2.108=Das Grobianium macht zwar den Anschein, die letzten 10 Modewechsel übersprungen zu haben, aber dafür ist es sehr wirkungsvoll im Kampf... für einen simplen Strohhut jedenfalls.
content.2.109=Dieser Dämonenschädel, der aus den unterschiedlichsten kleinen Knöchelchen zusammengefügt wurde, wird seinem Träger keine Kopfschmerzen bereiten, solange er zu seinem Geschmack steht. 
content.2.110=Dieser Hut ist nichts anderes, als ein umgedrehter, magischer Früchtekorb. Damit werdet ihr bestimmt eure gesamte Umgebung beeindrucken, vor allem, wenn es sich dabei um junge Bwork Magus-Lehrlinge handelt.
content.2.111=Mit diesem Hut aus miteinander verknoteten Chaferlederunterhosen seid ihr der neue Star... zumindest bei den weiblichen Bwork Magi mit ihren roten Bärten und ihrer überwältigenden Weiblichkeit...
content.2.112=Dies ist die gepolsterte Schale eines Dracheis. Es ist ideal dazu geeignet, euch z.B. gegen die Blitzstrahlen von betrunkenen Bwork Magi zu schützen. Einziger Nachteil: Damit seht ihr immer aus, wie frisch aus einem Ei geschlüpft.
content.2.113=Dieser Pilzhut stammt von einem der verblichenen großen Fungi-Meister Amaknas. Tapfer und allseits respektiert, endete Li Ling, der Röhrling, als Füllung eines Tofueieromeletts. Die Welt ist grausam und ungerecht...
content.2.114=Das Modell "Clint" ist ein Hut ganz schlicht und ohne Schnickschnack. Aber hochgradig schattenwerfend und imposant.
content.2.115=Dieser Hut ist speziell für kleine, flache Köpfe konzipiert worden. Er dürfte euch genau passen.
content.2.116=Mit diesem hübschen Helm werdet ihr fast so stylisch aussehen wie der berüchtigte Meister Rab.
content.2.117=Mit dieser Kappe auf dem Kopf seht ihr aus wie ein Drache... Ein Drache mit Haaren.. Ein etwas ungewöhnlicher Anblick, aber ideal, um im Kampf die Initiative zu behalten.
content.2.118=Der Smaragd-Dofus garantiert seinem Träger ein langes, langes, sehr, sehr langes Leben.
content.2.119=Erst mit einem Türkis-Dofus in den Händen werdet ihr die wahre Bedeutung des Begriffes "kritische Treffer" erfahren.
content.2.120=Dieser wunderschöne Dofus kommt geradewegs aus dem Innersten eines der majestätischsten Drachen von ganz Amakna. Aller Erd- und Luftschaden des Trägers wird erhöht.
content.2.121=Jetzt wisst ihr, warum Wabbits keine Brillen benötigen...
content.2.122=Dieser Dofus wird es euch ermöglichen, ganz nach Belieben zu kommen und zu gehen, und darüberhinaus noch vieles mehr...
content.2.123=Schüttelt diesen Dofus zu Beginn der Kämpfe hoch über eurem Kopf: Mit Sicherheit wird er die Reihen eurer Gegner ganz schön zum Schaudern bringen.
content.2.125=Diese tolle Hut erhöht die Stärke und Intelligenz seines Trägers, vorausgesetzt dieser kann sich an den strengen Geruch gewöhnen.
content.2.126=In der Vergangenheit wurde daraus Tee gebraut. Außerdem kann es auch geraucht werden. Einfach toll!
content.2.127=Das einzige, was noch beindruckender ist, als ein wütender Pilzling, ist ein wütender Pilzling mit einem Mantel. Ob sich der Pilzmantel als Accessoire der hohen Damen durchsetzen wird? Wer weiß...
content.2.128=Die Moskitomütz fiel einem Enutrof beim Entkleiden eines alten, kranken Moskitos in die Hände. Da besagter Enutrof ein Exzentriker war, fiel sie also genau richtig.
content.2.129=Diese aus Moskitohaut und -flügeln gefertigte Tasche war mal DAS Trendaccessoire auf Pausenhöfen. Doch heute wirkt es nur noch spießig und wurde vom aktuellen Modeschlager verdrängt, dem kleinen Schulranzen des Chef-Crocodylls.
content.2.130=Dieser steinerne Umhang ist vielleicht anfangs ein wenig ungemütlich, aber dennoch ein wirklich guter Schutz gegen Steinwürfe, oder aber gegen die noch viel gefährlichere  Krachlerspucke.
content.2.131=Dieser rötlich gefärbte, kleine Umhang kann im Notfall auch als Bettvorleger oder als Türmatte dienen, falls ihr sparen müsst und trotzdem eure Innenausstattung umdekorieren wollt.
content.2.132=Mit der Prespikapp auf dem Kopf seht ihr Debbie Crokett, der berühmtesten Jägerin der Gegenwart, zum Verwechseln ähnlich. Bloß, dass ihre Kopfbedeckung dazu dient, ihren beginnenden Haarausfall zu vertuschen.
content.2.133=Dieser Krachlerhelm, aus Fels herausgehauen, ist sein Gewicht in Gold wert! Er wird euch selbst vor den Angriffen eines Krachklotzes zu bewahren wissen.
content.2.134=Dieser Bogen gehörte Kuri, der berühmten Liebespriesterin und linken Hand von Oma Pralinchen höchstpersönlich. Kehrt niemals einer Liebespriesterin den Rücken zu. Ein einziger Pfeil ihres Bogens kann euch das Herz zerreißen, oder sogar euren Allerwertesten, wenn ihr euch euren Gegnern nicht stellt.
content.2.156=Mit diesem Umhang tarnen sich die Bewohner der Insel Dalbion, um, als Friedensengel erscheinend, die festländischen Nachbarn zu überrrumpeln.
content.2.157=Wenn dein Feind dich schlägt, halt ihm die andre Wange hin. Wenn er dich beleidigt, setz ihm die Krone auf!
content.2.158=Der Fuhu kann fuchsteufelswild werden, wenn ihm seine Beute entwischt. Glücklicherweise kommt dies allerdings ziemlich selten vor.
content.2.159=Der Weowabbit rettete einst seinen Stamm vor dem Ungetüm Gwendel, indem er es einfach in sein Maul schob. Daraufhin wurde er von Neidern in die Verbannung geschickt. Undank ist der Welten Lohn... 
content.2.162=Phantöffelchen werden oftmals unterschätzt. Doch einige von ihnen konnten als berühmte Stars die Welt der Geister mit ihren Heldentaten begeistern. Man spricht dann von sogenannten Phantöffelhelden!
content.2.163=Versucht doch einmal eine Handtasche aus ihm zu machen...
content.2.164=Der Rablingo ist ein entfernter Verwandter des Rablings. Er ist nur noch ein wenig anfälliger dafür ein Stück Käse aus dem Schnabel fallen zu lassen...
content.2.165=Krötschild ist wirklich der Archetyp einer Schildkröte. Wie in der Fabel vom Wabbit und der Schildkröte.
content.2.166="Eins ist sicher: Schnell rennen kann er nicht.Wenn er sich nicht regelmäßig bewegt, kann es sogar sein, dass er Wurzeln schlägt."
content.2.182=Cet arc doit son nom à son pouvoir dévastateur qui a fait des merveilles lors de la guerre des clones dans l'Hormonde.
