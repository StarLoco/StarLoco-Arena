content.38.275=Ihr habt mit dem Dämon III Bekanntschaft gemacht. Geht zu den Klassenmeistern, um Kämpfer zu rekrutieren.
content.38.276=Ihr habt eure ersten drei Kämpfer angeheuert. Geht zurück zum Dämon III.
content.38.277=Ihr habt allen Herausforderungen der Minutendämonen getrotzt.
content.38.278=Ihr habt die vier ersten Minutendämonen besiegt. Stellt euren Wert unter Beweis, indem ihr den fünften besiegt und so das Vertrauen des Dämonen I gewinnt.
