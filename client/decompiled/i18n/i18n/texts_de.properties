content.33.1=Nach Beratung hat der Rat der 24 beschlossen, euer bestes Team wegen Untätigkeit in den letzten zwei Wochen zu bestrafen, indem dessen Stärke gemindert wird! In den Arenen der Hormonde ist kein Platz für Faulenzer, vergesst das nicht!
content.33.2=Bravo!\nBei eurer Teilnahme an einem Arena Event habt ihr exklusive Gegenstände gewonnen.\nJetzt könnt ihr diese stolz vor allen neidischen Blicken zur Schau stellen.\n\nDas Ankama Team 
content.33.3=Der beigefügte Gegenstand stammt von der Arena Webseite.\nVielen Dank für euer Vertrauen in unseren Kurierdienst.\nWir hoffen, dass ihr von unseren minutenschnellen Lieferungen profitiert, so oft ihr wollt. \n\nDer dämonische Briefträger
content.33.4=Für eure Teilnahme an der Pre-Gold schicken wir euch diese exklusiven Runen, die euren Kämpfern beim Vorankommen helfen.\nViel Glück noch!\n\nDas Ankama Team
