content.42.13=<b>Pochs Test-Turnier</b>\n\nSchluss mit dem Geschwafel, jetzt gibt's Gemetzel!\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.14=<b>Ein extrem schnelles Turnier - ideal für Ungeduldige!</b>\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.15=<b>Ein Turnier für Powerspieler!</b>\n\nDie Evolution-Turniere ähneln in jeder Hinsicht dem normalen Evolution-Modus. Allerdings gibt es dabei keine Liga-Beschränkung.\nWorauf wartet ihr dann noch, aller Welt die Überlegenheit eures Teams zu demonstrieren?\n\nFür jeden Sieg während des Turniers gewinnt ihr Turnierpunkte (mehr und mehr). \n\n<b>Wenn ihr im Turnier 4 Partien hintereinander gewinnt, dann gewinnt ihr die Maximalzahl von 12 Punkten</b>.\n\nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.16=<b>Ein Turnier für all diejenigen, die es mögen, wenn um sie herum alles stirbt</b>\n\nWarum auch 15 Runden warten, bevor es wirklich zur Sache geht... Mit dem vorverlegten plötzlich eintretenden Tod geht es sofort zur Sache. Viel Glück!\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.17=Note de MBigotte : Ne pas modifier sans mon accords.\n\nCette définition de tournoi est utilisée UNIQUEMENT pour des tests avec de bons paramètres par défaut.
content.42.18=<b>An diesen dunklen Tagen, wo die Toten aus ihren Gräbern entsteigen und in der Welt der Lebenden ein wenig Spaß haben wollen, da wollen auch eure gestorbenen Kämpfer wieder am Turnier teilnehmen!</b>\n\nBei diesem außergewöhnlichen Turnier gibt es Belohnungen, die selbst Tote wieder aufwecken könnten. Schließlich gibt es mehr als  <b>100 Turnier-Jetons</b>. Auf den Gewinner des Turnieres wartet eine <b>Rote Piepmatzhaube!</b>\n\nBei jedem Sieg während des Turniers gewinnt ihr 2 Turnierpunkte.\n   \nWerdet ihr jedoch eliminiert, verlasst ihr das Turnier automatisch (natürlich mit den Punkten, die ihr bereits gewonnen habt).\n\nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
content.42.19=Habt ihr das Zeug zum MASTERCOACH?\n\nTretet gegen die Elite aller Coachs an und kämpft um euer Überleben in diesem harten Turnier mit KO-System. Kämpft um die Belohnung der Stärksten der Stärksten!\nZugang nur für Besitzer eines MasterCoach-Tickets, welches MasterCoach-Boostern beiliegt.
