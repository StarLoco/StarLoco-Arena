content.42.24=<b>Kämpfern, die den höchsten Rang im Evolution-Modus erreicht haben, werden zu Lebenden Legenden und erlangen dadurch Unsterblichkeit! Sie brauchen nicht mehr die gewöhnlichen Turniere zu besuchen, sondern zücken ihre Waffen nur noch im Kampf gegen andere Lebende Legenden!</b>\n\n<b>Bei diesem Turnier könnt ihr exklusive Belohnungen gewinnen, dank der Legenden-Jetons, die es zu gewinnen gibt.</b>\n\n   \nUm eine Partie in einem Turnier zu starten, müsst ihr ganz einfach nur auf die Einladungskard klicken, die unten links auf eurem Bildschirm zu bestimmten Uhrzeiten erscheint und über die ihr euch einen passenden Gegner suchen könnt.
