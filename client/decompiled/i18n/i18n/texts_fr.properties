content.60.149=Je reviendrais te voir plus tard.
content.60.150=A quoi me servent les kards?
content.60.151=J'ai encore quelques question !
content.60.152=ça sera tout pour le moment, merci.
content.60.153=Les kards font office d'argent? Des sortes de kards bancaires?
