summonDescription1=Le bouftou va se diriger vers l'adversaire le plus proche, puis l'attaquer avec le sort Morsure du Bouftou. Si plusieurs adversaires sont à la même distance, il choisira celui possédant le moins de points de vie.
summonDescription2=Le prespic est une invocation servant à ennuyer l'adversaire. Ces dégâts sont faibles, mais son potentiel de nuisance est élevé. Chaque tour, il va se diriger vers l'adversaire le plus proche, et l'attaquer avec son sort, ce qui aura pour effet de lui retirer un point d'action, en plus de faire quelques dégâts légers.
summonDescription3=Le Tofu est une invocation particulièrement rapide et nuisible. Chaque tour, il va se diriger vers l'adversaire le plus proche, et, en cas d'égalité, possédant le moins de point de vie. Il va ensuite l'attaquer avec son sort. A noter que si on lance une Piqure Motivante sur un tofu, celui ci attaque trois fois au lieu d'une seule.
summonDescription4=La folle est une invocation servant à ennuyer l'adversaire. Chaque tour, elle va se diriger vers l'adversaire le plus proche, et lui retirer un point d'action avec son sort. A noter qu'en cas de critique, elle lui retirera aussi un point de mouvement. De même, avec deux points d'action de plus, elle pourra lancer deux fois son sort.
summonDescription40=Le double du Sram est une invocation pouvant perturber fortement l'adversaire car il possède le même nom que votre Sram, et qu'il est difficile de le dissocier de celui qui l'a invoqué. Par contre, son comportement est des plus simples, chaque tour, il se dirige vers l'adversaire le plus proche, et, en cas d'égalité, celui ayant le moins de points de vie.
summonDescription5=La bloqueuse se dirige vers l'adversaire le plus proche, et reste à son contact. Elle ne fait rien d'autre, mais possède une forte valeur de blocage et un grand nombre de points de vie, ce qui la rend particulièrement désagréable pour tous les combattants jouant sur la mobilité.
summonDescription6=Les arbres sont utilisés comme obstacles passifs. Ils ne font rien et ne sont pas bougeables. Par contre, ils possèdent de nombreux points de vie et bloquent les lignes de vue. Ils peuvent donc protéger efficacement les combattants qui se cachent derrière.
summonDescription7=Le cadran est un obstacle passif. La seule chose qu'il va faire est lancer son sort Mirwar qui renvoit tous les sorts de dégâts vers leur lanceur. Si vous voulez tuer un cadran, il va falloir utiliser vos poings, ou une arme. A noter que les sorts comme poison et tous les dégâts de poussée fonctionnent sur lui, de même, s'il est désenvouté, il perdra sa protection jusqu'à ce qu'il relance Mirwar.
summonDescription8=La sacrifiée est une invocation particulièrement crainte. Une fois invoquée, elle va se diriger vers l'adversaire le plus proche, et, en cas d'égalité, possédant le moins de points de vie. Puis, elle va exploser, occasionnant de considérables dégâts. Bien entendu, le fait d'exploser détruit la sacrifiée.
summonDescription9=Le craqueleur est une invocation particulièrement puissante. Chaque tour, elle va se diriger vers l'adversaire le plus proche, et, en cas d'égalité, celui ayant le moins de points de vie. Ensuite, elle va lui infliger deux attaques puissantes qui lui retireront chacune un point de mouvement.
