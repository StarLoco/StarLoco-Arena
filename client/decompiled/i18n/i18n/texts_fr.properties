content.42.13=<b>Tournoi de test pour Poch </b>\n\nOn est pas là pour le blabla, mais bien pour casser des bras !\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.14=<b>Un tournoi pour les rapides et les impatients !</b>\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.15=<b>Ce soir, c'est la sortie des gros bills !</b>\n\nLes tournois évolution sont en tout point similaire au mode évolution, mais sans limites de ligues. Montrez à tout le monde la supériorité de vos combattants, et votre capacité d'entraînement incroyable.\n\nA chaque victoire pendant le tournoi, vous gagnerez des points de tournoi.<b>Gagnez 4 matchs d'affilée dans le tournoi et vous empocherez le maximum de points : 12</b>. Si vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.16=<b>Un tournoi pour ceux qui aiment quand ça meure vite et beaucoup</b>\n\nPourquoi attendre 15 tours avant que les équipes se rencontrent. La mort subite, c'est pour maintenant. Bonne chance.\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.17=Note de MBigotte : Ne pas modifier sans mon accord.\n\nCette définition de tournoi est utilisée UNIQUEMENT pour des tests avec de bons paramètres par défaut.\n
content.42.18=<b>En ces sombres jours, les morts se relèvent et décident de faire partie de la fète. Les combattants de votre cimetière qui trouvaient l'éternité un peu longue seront ravis de participer à ce tournoi !</b>\n\nCe tournoi exceptionnel vous propose des récompenses à faire se relever les morts vu qu'en plus de <b>100 jetons tournoi le gagnant remportera la coiffe Piou Rouge ! </b>\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.19=Avez-vous ce qu'il faut pour devenir le MASTERCOACH ?\n\nAffrontez l'Elite des Coachs dans des tournois à élimination directe.\nBattez vous pour votre honneur, pour votre survie... et gagnez la récompense des plus forts !\nAccès limités aux possesseurs d'un Ticket MasterCoach, disponible uniquement dans les boufteurs MasterCoach.
content.42.20=Note de MBigotte : Ne pas modifier sans mon accord.\n\nCette définition de tournoi est utilisée UNIQUEMENT pour des tests avec de bons paramètres par défaut.\n
