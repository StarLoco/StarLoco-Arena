content.29.267=Alors comme ça, tu crois que tu peux me vaincre ? Démon I doit vraiment être en manque de combattants pour m'envoyer des gringalets comme toi... Allez montre moi ce que tu vaux !
content.29.268=Alors comme ça, tu crois que tu peux me vaincre ? Démon I doit vraiment être en manque de combattants pour m'envoyer des gringalets comme toi... Allez montre moi ce que tu vaux !
content.29.269=Alors comme ça, tu crois que tu peux me vaincre ? Démon I doit vraiment être en manque de combattants pour m'envoyer des gringalets comme toi... Allez montre moi ce que tu vaux !
content.29.270=Alors comme ça, tu crois que tu peux me vaincre ? Démon I doit vraiment être en manque de combattants pour m'envoyer des gringalets comme toi... Allez montre moi ce que tu vaux !
content.29.271=Pfeuh, tu crois qu'en ayant vaincu tous les autres démons d'ici tu m'arrive à la cheville?\n\nHAHAHAHAHA !\n\nEn garde !
content.29.272=Propulseur de fées d'artifices
content.29.273=Bien joué p'tit gars ! Tu m'as l'air prêt à affronter des adversaires un peu plus coriaces. Tiens voila une kard zaap, utilise la avec le zaap qui se situe au nord-est de l'île.\n\nAllez salut ! Si jamais tu vas sur Maknala, passe me voir, j'aurai d'autres défis à te proposer.
content.29.274=Tu n'est pas digne de m'affronter. Essaye déjà de vaincre les quatre autres démons des minutes présents sur cette île. Si tu y parviens, je daignerai peut être t'accorder un duel.
content.29.275=Mouahaha ! j'ai kidnappé Barnabé et je ne le rendrai jamais ! Sauf si tu éclates mes potes les cristaux.
content.29.276=Démon des Secondes
content.29.277=Tiens, voilà 37 ! Il est l'un des esclaves du démon de la 12e minute. Tu te souviens sûrement de lui, tu l'as affronté à ton arrivée dans l'Hormonde ! 
content.29.278=Il a construit une prison qui renferme un détenu de la plus haute importance, pour son maître. Il prétend qu'elle est inviolable. Que dirais-tu de lui prouver le contraire ?! 
content.29.279=N'oublie pas qu'avoir 100 % de résistance ne veut pas dire qu'on est invulnérable ! Si tes bonus aux dégâts sont suffisants, tes coups pourront affecter la cible. 
content.29.280=Qu'est-ce que j'entends ? Tu veux délivrer notre prisonnier ? Ah ah ! Tu n'as aucune chance, j'ai amélioré le système de prison cristalline de mon maître. Désormais, il est invulnérable ! 
content.29.281=Démon de la 37ème seconde
content.29.282=Bon, les choses sérieuses commencent. Avant toute chose, tu peux positionner ton Iop pendant la phase de placement.
content.29.283=Vu qu'on s'entraine, tu n'as pas de temps limite, mais dans un vrai combat tu n'auras que 30 secondes pour positionner tout tes combattants.
content.29.284=Pour positionner un combattant, sélectionne-le avec le clic gauche puis sélectionne la case de départ où tu veux le déplacer. Si un autre combattant s'y trouve, ils échangeront leur place (pas de soucis ici, ton Iop est tout seul).
content.29.285=Une fois que tu as bien compris, clique sur le bouton "Prêt".
content.29.286=Après la phase de placement tu as remarqué qu'il y avait une phase d'observation qui a duré 10 secondes.
content.29.287=Pendant la phase d'observation tu peux voir le positionnement de ton ennemi et même les caractéristiques de ces combattants si tu clique sur la timeline en haut à gauche.
content.29.288=Pour ton entrainement j'ai retiré le chrono de 30 secondes qui détermine un tour de combattant en vrai combat, tu as donc le temps si tu veux de regarder la timeline maintenant.
content.29.289=Une fois que tu te sentiras prêt, va donc attaquer ce bouftou. Tu dispose de 3 PM (Points de Mouvements) pour te rapprocher de lui en cliquant sur la case devant lui.
content.29.290=N'aie pas peur ! Rapproche-toi de lui en cliquant sur la case juste en face de lui. Le clic (croit ou gauche) dépend du choix que tu as fais en arrivant ici, tu pourras le changer si ça ne te plais pas.
content.29.291=Très bien ! Maintenant utilise le sort pression pour le tuer ! Clique sur le sort dans ta barre de sort en bas à gauche puis clique sur ta cible.
content.29.292=Heu, c'était pas mal, mais vise plutôt le bouftou en cliquant sur sa case, sinon tu ne risques pas de lui faire mal!
content.29.293=Très bien, tu l'as touché ! Encore un coup de pression et tu l'auras vaincu !
content.29.294=Tu peux voir ton total de PA (Point d'Actions) écrit en bleu en bas à gauche. Pression coûte 3 PA,  s'il t'en reste assez, fais le une seconde fois, sinon passe ton tour pour récupérer 6 PA.
content.29.295=Baan
content.29.296=Gostof Sacrieur
content.29.297=Gostof Iop
content.29.298=Gostof Enutrof
content.29.299=Gostof Sramette
content.29.300=Aïe ! On dirait bien qu'un de tes combattants vient de se blesser. C'est pas une bonne nouvelle ça, si tu ne le soignes pas, il sera handicapé pour les prochains combats.
content.29.301=Et un grand nombre de blessures peut provoquer la mort. Enfin, moi je dis ça, je dis rien, après tout ce sont tes combattants, t'en fais ce que tu veux.
content.29.302=Bien sûr, tu peux choisir de ne pas le soigner... Mais sache que plus un combattant est fatigué, ou blessé, et plus il a de chances de subir de nouvelles blessures.
content.29.303=Il me semble avoir entendu un coach l'autre jour, qui disait qu'il avait reçu pleins d'objets de soins dans un boufteur...
content.29.304=Une fois que tu auras trouvé une potion de résurrection, rends-toi au cimetière pour récupérer le corps de ton combattant. Si tu ne sais pas où c'est, consulte ta carte (touche M).
content.29.305=Pour l'instant, je te conseille d'envoyer ton combattant au cimetière, où il pourra reposer en paix
content.29.306=Bon rassures-toi, tout n'est pas perdu. Tu te rappelles des boufteurs dont je t'avais parlé ? Et bien en plus des objets de soins, il parait qu'on y trouve des potions de résurrection.
content.29.307=Et ba voila ! Je t'avais prévenu pourtant ! Tu n'as pas voulu m'écouter, et maintenant un de tes combattants vient de mourir !
content.29.308=Hey ! Toi là bas ! Oui, toi. Arrête de faire cette tête d'ahuri et viens discuter avec moi. Quoi ? Tu ne sais pas comment te déplacer ? C'est simple, tu as le choix entre le clic droit ou le clic gauche.
