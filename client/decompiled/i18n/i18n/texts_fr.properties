help.aoe=<b>Zone d'effet</b>\n\nC'est la zone d'effet que ton sort touchera. La valeur en dessous indique la taille de la zone. Un point signifie que ton sort touche une seule case. Une croix signifie que ton sort touche une zone dans toutes les directions. Une ligne signifie que ton sort touche toutes les cibles en ligne droite.
help.cardActionPoints=<b>Coût en points d'action</b>\n\nC'est le nombre de points d'action qu'il faudra dépenser pour pouvoir lancer ce sort.
help.cardRange=<b>Portée</b>\n\nC'est la distance minimale et maximale à laquelle ce sort peut-être lancé. Une portée de 0 indique que c'est un sort ne pouvant être lancé que sur soit, ou que c'est un sort qui affecte toute la kard.
help.cardValue=<b>Coût en kama</b>
helpConsumable=<b>utilisation des consommables</b>\nPour utiliser vos consommables, <b>cliquez gauche</b> sur la kard puis sur le combattant de votre choix.
help.cooldown=<b>Temps de relance (temps de relance global)</b>\n\nC'est le nombre de tour qu'il faudra attendre pour pouvoir relancer ce sort. S'il y a un chiffre entre parenthèse, cela signifie que ce sort a un temps de relance global, ce qui veut dire que tes autres personnages ne pourront pas non plus lancer ce sort pendant ce délai. Ton adversaire, lui, pourra malgré tout en faire usage.
help.criticalHit=<b>Pourcentage de coups critiques</b>\n\nPourcentage de chance de faire un coup critique à chaque fois que le combattant lance un sort ou porte une attaque.
help.damageRebound=<b>Renvoi de dommage</b>\n\nC'est le pourcentage de dommages qui sont renvoyés à l'attaquant à chaque fois que ce personnage est blessé.
help.dmg=<b>Bonus aux dégâts</b>\n\nC'est un pourcentage de dégâts en plus sur toutes les attaques qui utilisent des éléments (air, feu, terre et eau)
help.dodge=<b>Esquive</b>\n\nA chaque fois que ton combattant quittera le corps à corps d'un adversaire, celui ci pourra tenter de le bloquer, pour lui faire perdre son tour. Ce sont tes chances d'esquive qui donneront ton pourcentage de chance de ne pas être bloqué. Avoir 100% en esquive te garantis de toujours esquiver les personnages qui ont 0% de chance de blocage, mais tes chances diminuent contre un adversaires avec plus en blocage. Tous les personnages ont, de base, 100% en esquive.
help.earth=<b>Bonus aux dégâts de terre</b>\n\nC'est un pourcentage de dégâts en plus sur toutes les attaques qui utilisent l'élément terre, représenté par une icône marron.
help.earthRes=<b>Résistance aux dégâts de terre</b>\n\nReprésente ton pourcentage de résistance aux dégâts de terre. Les attaques utilisant l'élément terre, représentée par une icône marron, seront diminuées de ce pourcentage de dégâts. Attention, avoir 100% de résistance ne te garantis pas d'être immunisé à cet élément, car le bonus aux dégâts de ton adversaire se soustrait à ta résistance.
help.fighterActionPoints=<b>Points d'action</b>\n\nChaque tour, ton combattant aura ce nombre de points d'action. Pendant son tour, il pourra les utiliser pour lancer des sorts ou attaquer au corps à corps. Un personnage avec beaucoup de points d'action pourra effectuer plus d'action pendant son tour. En général, les combattants ont six points d'action.
help.fighterRange=<b>Bonus de portée</b>\n\nC'est le nombre de cases qu'il faudra rajouter à la portée de tous les sorts que lance ton personnage. Attention, les sorts qui se lancent au corps à corps ne sont pas affectés par les bonus ou malus de portée.
help.fighterValue=<b>Coût du personnage</b>\n\nC'est le coût en kama de ton personnage. Une équipe standard coûte au maximum 6000 kamas et peut contenir de 1 à 6 personnages.
help.fire=<b>Bonus aux dégâts de feu</b>\n\nC'est un pourcentage de dégâts en plus sur toutes les attaques qui utilisent l'élément feu, représenté par une icône rouge.
help.fireRes=<b>Résistance aux dégâts de feu</b>\n\nReprésente ton pourcentage de résistance aux dégâts de feu. Les attaques utilisant l'élément feu, représentée par une icône rouge, seront diminuées de ce pourcentage de dégâts. Attention, avoir 100% de résistance ne te garantis pas d'être immunisé à cet élément, car le bonus aux dégâts de ton adversaire se soustrait à ta résistance.
help.firework=Grâce au <b>propulseur de fée d'artifices</b>, organisez les plus beaux spectacles pyrotechniques de l'Hormonde ! Placez vos kards fées d'artifice dans l'ordre que vous souhaitez qu'elles soient lancées et indiquez en dessous de celles-ci le délai de lancement.
help.healBonus=<b>Bonus aux soins</b>\n\nC'est le pourcentage de bonus qui sera appliqué à tous les soins que lance ton personnage.
help.healthPoints=<b>Nombre de points de vie</b>\n\nSi un combattant tombe à zéro point de vie, il meurt. Si tous tes combattants sont morts, tu perds le combat. Les points de vie d'un combattant sont compris en général entre 60 et 100 points de vie.
help.initiativePoints=<b>Points d'initiative</b>\n\nAu cours du combat, les combattants agiront dans l'ordre inverse de leur initiative, toujours dans le même ordre, sauf s'ils ont exactement la même initiative, et dans ce cas là, ce sera au hasard. En général, les initiatives sont comprises entre 0 et 100.
help.movePoints=<b>Nombre de points de mouvement</b>\n\nChaque tour, quand ce sera à lui de jouer, ton combattant pourra se déplacer de ce nombre de cases. En général, les combattants ont trois points de mouvement.
help.nbSummons=<b>Nombre d'invocation</b>\n\nCe nombre représente le nombre d'invocations que ton combattant peut contrôler simultanément lors d'un combat.
help.openClose=tutoriels
help.res=<b>Résistance aux dégâts</b>\n\nReprésente ton pourcentage de résistance aux dégâts élémentaux (air, feu, terre et eau). Les attaques utilisant un élément seront diminuées de ce pourcentage de dégâts. Attention, avoir 100% de résistance ne te garantis pas d'être immunisé aux dégâts, car le bonus aux dégâts de ton adversaire se soustrait à ta résistance.
help.summonCC=<b>Maîtrise des invocations : coups critiques</b>\n\nLes invocations de ton combattant bénéficient d'un bonus aux coups critiques. Elle aura plus de chances de faire un coup critique lorsqu'elle  lance un sort ou porte une attaque.
help.summonDmg=<b>Maîtrise des invocations : dégâts</b>\n\nLes invocations de ton combattant bénéficient d'un bonus aux dégâts.
help.summonHp=<b>Maîtrise des invocations : points de vie</b>\n\n\nLes invocations de ton combattant bénéficient d'un bonus aux points de vie.
help.summonRes=<b>Maîtrise des invocations : résistance</b>\n\nLes invocations de ton combattant bénéficient d'un bonus à la résistance aux dégâts.
help.summonTackle=<b>Maîtrise des invocations : blocage</b>\n\nLes invocations de ton combattant bénéficient d'un bonus de blocage. A chaque fois qu'un adversaire tentera de quitter le corps à corps d'une de tes invocations, celle ci tentera de le bloquer pour l'en empêcher. Dans ces cas là, il devra faire un test d'esquive contre sa capacité de blocage.
help.tackle=<b>Blocage</b>\n\nA chaque fois qu'un adversaire tentera de quitter le corps à corps de ton combattant, celui ci tentera de le bloquer pour l'en empêcher. Dans ces cas là, il devra faire un test d'esquive contre ta capacité de blocage.Tu connaitras la probabilité que tu as de bloquer un adversaire en soustrayant ta valeur de blocage à son esquive. Beaucoup de combattants ont 0% en blocage, et ne bloqueront donc jamais un adversaire.
help.target=<b>Cible</b>\n\nLibre signifie que le sort est lançable où on veut. Vide signifie que c'est un sort qu'il faut lancer sur une case libre. Alliés signifie que c'est un sort qui n'affecte que les alliés. Moi signifie que c'est un sort qui doit être lancé sur ce combattant exclusivement. Invoc signifie que c'est un sort qui doit être lancé sur une invocation.
help.water=<b>Bonus aux dégâts d'eau</b>\n\nC'est un pourcentage de dégâts en plus sur toutes les attaques qui utilisent l'élément eau, représenté par une icône bleu.
help.waterRes=<b>Résistance aux dégâts d'eau</b>\n\nReprésente ton pourcentage de résistance aux dégâts d'eau. Les attaques utilisant l'élément eau, représentée par une icône bleu, seront diminuées de ce pourcentage de dégâts. Attention, avoir 100% de résistance ne te garantis pas d'être immunisé à cet élément, car le bonus aux dégâts de ton adversaire se soustrait à ta résistance.
help.wind=<b>Bonus aux dégâts d'air</b>\n\nC'est un pourcentage de dégâts en plus sur toutes les attaques qui utilisent l'élément air, représenté par une icône vert.
help.windRes=<b>Résistance aux dégâts d'air</b>\n\nReprésente ton pourcentage de résistance aux dégâts d'air. Les attaques utilisant l'élément air, représentée par une icône vert, seront diminuées de ce pourcentage de dégâts. Attention, avoir 100% de résistance ne te garantis pas d'être immunisé à cet élément, car le bonus aux dégâts de ton adversaire se soustrait à ta résistance.
