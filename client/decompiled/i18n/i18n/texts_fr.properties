content.29.90=Aïe ! Aïe aïe !
content.29.91=C'est quoi ce truc ? Et t'es qui toi ?
content.29.92=Rhââââ ! On peut plus se faire une balade dimensionnelle sans tomber sur un coin pollué par des déchets...
content.29.93=Ah moins que... C'est encore un coup des Démons des Heures ! Ils rôdent dans le coin, pas vrai ?
content.29.94=Je vois. Tu comprends rien. Je t'explique. Mon nom, c'est Adamaï. Tu as été capturé par un Démon des Heures. Tu es téléporté en ce moment même vers leur monde ! Une fois là-bas, tu vas devoir recruter une équipe de gladiateurs qui se battront pour toi...
content.29.95=Si toi et tes guerriers vous remportez suffisamment de victoires vous vous classerez premiers du classement, et vous serez libres !
content.29.96=Sinon... ben... tu meurs.
content.29.97=Attention, ça risque de secouer...
content.29.98=Y'a deux trois choses à savoir ici. Tu risques de passer un sale moment si je ne t'en parle pas.
content.29.99=Comme ça par exemple...
content.29.100=Alors, quand je dirai : "en cliquant sur les épées, tu déclenches une recherche de combat", tu cliqueras sur les épées. Et tu déclencheras un combat. Epatant, hein ? Mais tu ne le fais PAS maintenant...
content.29.101=T'es discipliné, toi. J'aime ça. Maintenant, clique là où ça brille. Plus vite, j'ai pas que ça à faire.
content.29.102=Voici une équipe prédéfinie. Tu pourras bientôt la tester, ou lancer un combat en cliquant...
content.29.103=En cliquant... ?
content.29.104=En cliquant sur les épées ! Bien vu. Je sais que ça te démange, mais tu ne vas pas le faire tout de suite.
content.29.105=Ce que tu vas faire à présent est sans doute la chose la plus importante de ta vie de coach : gérer ton équipe, et équiper tes combattants.
content.29.106=Clique sur le bouton qui brille pour créer une nouvelle équipe puis donne lui un nom et valide en cliquant sur OK
content.29.107=Maintenant clique sur "Recruter un combattant", puis, une fois que tu auras déterminé sa classe et son nom, valide avec le bouton OK
content.29.108=Tu vas lui ajouter un chapeau à 100 Kamas. Trouve le chapeau nommé Coiffe du Ploukosse, et double clique sur lui.
content.29.109=Et voilà ! Ce combattant bénéficie d'un bonus de 15% aux dégâts de feu. Si tu ne sais pas ce que c'est, c'est que tu n'as pas lu le manuel. Et ça, c'est TRES mal !
content.29.110=Tu peux maintenant fermer cette fenêtre. Il y aurait encore des choses à dire, je te laisse les découvrir par toi-même.
content.29.111=En cliquant sur les épées, tu lances une recherche de combat contre un autre coach. Avant ça, teste ton équipe et peaufine tes tactiques.
content.29.113=C'est le moment de nous quitter. Je te renvoie vers d'autres gens comme toi. Moi j'y vais, ça sent le démon par ici..
content.29.114=Bon, n'oublies pas de prendre aussi des sorts pour tes combattants, ça s'ajoute comme un équipement sauf que tu les choisis dans la liste de droite. Tu verras ça te sera très utile.
content.29.115=Hey ! Je t'ai dit de pas toucher à ça ! Ecoutes moi un peu, tu vas en avoir besoin.
content.29.116=Passer le tutorial
content.29.117=Hummm, tu m'as l'air plein de potentiel toi.\n\nMontre moi un peu ce dont tu es capable en combat. Je pourrais peut-être même t'apprendre quelques trucs, histoire que tu survives et, qui sait, qu'un jour tu combattes pour moi dans l'arène !
content.29.118=<b>Tu es sur une île de Dofus-Arena.</b>\n\nTu diriges ici ton coach qui peut interagir avec d'autres coachs (des autres joueurs) ou des objets et PNJ (personnages non-joueurs).\n\nUn clic droit te permet d'avancer alors qu'un clic gauche sur un objet ou joueur te permettra souvent d'interagir avec. Tu peux modifier cela et intervertir les clics en passant par le menu d'option.
content.29.119=<b>Tu es dans un combat, pour avoir plus d'infos sur les fenêtres en combat, cherche le démon III sur l'île de Maknala ou lis le chapitre correspondant dans le manuel du joueur que tu trouveras dans ton répertoire d'installation Dofus-Arena.</b>
content.29.120=<b>Tu es sur la fenêtre de classement.</b>\n\nCette fenêtre représente le classement des meilleurs joueurs de Dofus-Arena.\nEn plus de te montrer la position du joueur,  cette fenêtre te donne des infos sur la meilleure équipe jouée par ce joueur comme sa force, le nombre de victoires et de défaites du joueur avec cette équipe, etc.
content.29.121=<b>Tu es sur la fenêtre de statistiques de coach.</b>\n\nSur cette fenêtre, tu peux  voir quelques informations intéressantes comme le temps que tu as passé à jouer à Dofus-Arena ou le nombre de victoires ou de défaites de l'ensemble de tes équipes.
content.29.122=<b>Tu es sur la fenêtre sociale, cette fenêtre te permet de gérer ta liste d'amis, ta "blacklist" et ton clan.</b>
content.29.123=<b>Tu es sur la fenêtre d'inventaire de ton coach.</b>\n\nTu vois affichée ici la liste de toutes les kards coachs que tu possèdes (les kards que tu gagnes à la fin d'un combat et qui ne servent que sur les îles de coachs). \n\nLes onglets au dessus de cette fenêtre représentent les différentes catégories de kards (carte équipements, kard spéciales, kards de téléportation, ...).\n\nPour t'aider à retrouver les kards que tu recherches, tu disposes de plusieurs filtres sous forme de case à cocher à droite ou de menu déroulant au dessus de certaines fenêtres.
content.29.124=<b>Tu es sur la fenêtre de gestion des équipes.</b>\n\nC'est ici que sont répertoriées toutes tes équipes.\nElles sont triées par force (de la plus forte à la moins forte) et c'est l'équipe la plus forte qui donne le niveau de ton coach (si t'as meilleure équipe est niveau 14, ton coach sera de niveau 14).\n\nPour changer la composition d'une équipe, il te suffit de glisser et déposer un combattant depuis ta réserve de combattant (en bas à droite) vers une de tes équipes pour l'y ajouter et inversement pour en retirer un.\n\nSi tu veux créer un nouveau combattant dans une équipe, clique d'abord sur le bouton "créer combattant" en bas à droite de la fenêtre, il va apparaître dans ta réserve de combattants depuis laquelle tu peux l'envoyer vers ton équipe.\n\nN'oublies pas que la seule règle importante lors de la création d'une équipe est de ne jamais dépasser 6000 points de budget.
content.29.125=<b>Tu es sur la fenêtre de rapport des bugs.</b>\n\nDécris ton problème et explique si possible comment le reproduire en tapant ton texte dans les champs appropriés. Clique ensuite sur valider pour que ton message soit envoyé directement aux développeurs du jeu. Ceux-ci ne te répondront pas directement mais ils essaieront de régler au plus vite le problème que tu as décris !
content.29.126=<b>Tu es sur la fenêtre des options du jeu.</b>\n\nTu peux régler ici les différents paramètres du jeu, mais attention, les paramètres vidéo peuvent grandement affecter la vitesse du jeu voir l'empêcher de fonctionner !
content.29.127=<b>Tu es sur la fenêtre de gestion de ta boite aux lettres.</b>\n\nGrâce aux boites aux lettres, tu peux envoyer des messages à un autre coach et en recevoir (qu'il soit connecté ou non).  \nLes boites aux lettres fonctionnent comme une boite d'e-mails, et tu peux même envoyer par leur intermédiaire des kards coachs en les glissant dans les emplacements adéquat lorsque tu créé un nouveau message.
content.29.128=<b>Tu es sur la fenêtre de création d'un nouveau courrier.</b>\n\nCette fenêtre te permet d'envoyer un message à un coach (connecté ou non). Pour ce faire, tu dois entrer le nom du coach et cliquer sur le bouton de vérification à coté de ce nom pour vérifier que le destinataire de ton message existe.\n\nEnsuite, il ne te reste plus qu'à donner un titre à ton message et à l'écrire, puis à cliquer sur le bouton d'envoi.\n\nTu peux aussi glisser des kards aux emplacements prévus à cet effet pour envoyer des kards coachs en même temps que ton mail.
content.29.129=<b>Tu es sur la fenêtre du KardMaster ! Le KardMaster est un démon mineur qui te propose d'échanger des kards en ta possession contre des kards qu'il possède.</b>\nPour ce faire, sélectionne dans la fenêtre de gauche la kard qui t'intéresse, tu peux même en sélectionner plusieurs à l'aide de la touche SHIFT. \n\nUne fois que tu auras sélectionné la ou les kard(s) qui t'intéresse(nt), tu verras qu'en dessous de la liste apparaît la valeur en Kamas que te demande le KardMaster en échange de cette ou ces kard(s).\n\nTu dois donc maintenant glisser des kards depuis ton inventaire dans la zone d'échange du KardMaster (qui se trouve en bas dans la fenêtre gauche) jusqu'à atteindre ou dépasser le montant demandé par le KardMaster (tu vois la valeur totale des kards que tu as glissé apparaître juste au dessus de la zone d'échange, à gauche du signe "/".\n\nUne fois que tu as glissé assez de kards, tu peux cliquer sur le bouton "Acheter", une fenêtre apparaitra alors pour t'informer que la transaction à réussie et tu trouveras tes nouvelles kards dans ton inventaire.
content.29.130=<b>Tu es sur la fenêtre d'utilisation d'un Zaap.</b>\n\nLes Zaaps sont des moyens de transports entre les différentes îles de Dofus-Arena. Pour utiliser un Zaap, tu dois posséder la kard de la destination vers laquelle tu veux qu'il te transporte. \n\nLes kards Zaaps se gagnent notamment en gagnant des niveaux avec ton coach.
content.29.131=<b>En bas à droite de ton écran se trouve la fenêtre de chat. C'est grâce à elle que tu peux communiquer avec les autres joueurs. </b>\n\nLe chat possède plusieurs canaux de communication qui te permettent de choisir à qui tu veux parler. Pour définir le canal sur lequel tu parles, utilise le raccourcis correspondant. \n\nLes canaux les plus importants sont :\n\nLe canal "Général" te permet de t'adresser à tous les joueurs autour de toi (raccourcis : "/s").\nLe canal clan te permets de parler à ton clan ("/c").\nLe canal commerce est fait pour échanger des kards, tout le monde sur la même île que toi y a accès, mais tu ne peux y écrire qu'une fois toutes les 30 secondes ("/t").\nLe canal privé qui te permet de parler à uniquement une personne (" /w " suivi d'un espace et du nom de coach de la personne avec qui tu veux parler).\n\n\nLes onglets au dessus du chat permettent de configurer quels canaux tu veux afficher dans ton chat et de passer rapidement d'une configuration à l'autre !
content.29.132=<b>Tu es sur la fenêtre d'information de combattant.</b>\n\nCette fenêtre regroupe toutes les informations dont tu as besoin pour connaître les statistiques et l'état d'un de tes combattants ou des combattants de l'adversaire.
content.29.133=Pas géré pour le moment. Sait on jamais plus tard. Ne pas traduire
content.29.134=<b>Tu es sur la fenêtre de fin de combat.</b>\n\nCette fenêtre résume les informations importantes de la partie : Qui a gagné, combien de temps à duré la partie et quel kards ont été gagnées par le vainqueur (pour gagner des kards, il faut réussir à gagner 2 matchs d'affilée). Tu peux aussi voir quelques informations sur les deux coachs, telles que leur niveau par exemple.
content.29.135=<b>Tu es sur la fenêtre de début de combat.</b>\n\nCette fenêtre te présente brièvement l'équipe adverse et quelques statistiques du (ou des) coach(s) que tu vas affronter.
content.29.136=<b>Tu es dans la phase de placement.</b>\n\nCette phase te permet de déplacer tes personnages pour les positionner sur les différentes cases de départ possibles pour eux. \n\nPour déplacer un personnage, clique dessus (il va alors apparaître en surbrillance) et clique sur la case où tu veux qu'il soit placé.\nSi cette case est occupée, le personnage que tu avais sélectionné y est placé et le personnage qui y était est placé là où était ton personnage sélectionné.
content.29.137=<b>Tu es sur la fenêtre d'échange de kards, celle-ci te permet de donner et recevoir des kards de manière sécurisée. </b>\n\nLe principe est simple, glisse d'abord, dans les emplacements à coté du nom de ton coach, les kards que tu veux donner au coach avec qui tu as lancé la transaction. \n\nAttends que l'autre coach place aussi ses kards de son coté et seulement après, coche la case "prêt". \n\nSi tu as coché prêt et que le coach en échange avec toi change les kards qu'il veut t'échanger, ta case "prêt" va se décocher automatique, c'est normal, c'est pour éviter que quelqu'un de malveillant retire au dernier moment sa kard et t'arnaque. Soit donc rassurée, tu peux échanger en toute tranquillité !
content.29.138=<b>Tu es sur la fenêtre création de combattant.</b>\n\nSi tu n'as pas compris comment créer un personnage en suivant le tutoriel du début du jeu, reporte toi au manuel du joueur que tu trouveras dans ton répertoire d'installation Dofus-Arena.
content.29.139=<b>Tu es sur la fenêtre de modification de combattant.</b>\n\nSi tu n'as pas compris comment modifier un personnage en suivant le tutoriel du début du jeu, reporte toi au manuel du joueur que tu trouveras dans ton répertoire d'installation Dofus-Arena.
content.29.140=<b>Tu es sur la fenêtre de création d'équipe.</b>\n\nTu peux ici créer une nouvelle équipe. N'oublie pas d'attribuer des combattants à ton équipe afin de pouvoir la jouer.\nN'oublies pas que la seule règle importante lors de la création d'une équipe est de ne jamais dépasser 6000 points de budget.
content.29.141=<b>Tu es sur la fenêtre de création d'équipe. En mode coopératif.</b>\n\nTu peux ici créer une nouvelle équipe avec un ami qui fait partie de ta liste d'amis.\n\nN'oublies pas que la seule règle importante lors de la création d'une équipe est de ne jamais dépasser 6000 points de budget.
content.29.142=<b>Tu es dans la phase d'observation.</b>\n\nCette phase te permet d'analyser les personnages adverses et leur équipement ainsi que leur placement.
content.29.143=<b>Tu es dans un challenge.</b>\n\nLes challenges sont des combats qui ne comptent pour aucun classement mais qui peuvent  t'aider à apprendre le jeu ou à t'améliorer. \nCertains challenges sont aussi prévus pour des joueurs expérimentés, ne t'inquiètes donc pas si tu n'arrives pas tout de suite à les finir.\n\nDans tous les cas, jamais tu ne perdras quelque chose en perdant un challenge, par contre, certains te permettront de gagner des kards coachs !
content.29.144=Démon III
content.29.145=Tofu de SuperBidi
content.29.146=Hey, budy !\n\nQu'est ce que tu fais ici ? T'as jamais entendu parler des Hell's Tofus, ça se sent. Tu veux que je te chante un petit requiem ?
content.29.147=On vient d'arriver dans l'Hormonde, et crois-moi, c'est pas l'endroit le plus accueillant que je connaisse.
content.29.148=Tu risques de croiser quelques Démons des Heures dans le coin. Je te conseille de faire ce qu'ils te disent. En règle générale, ils n'aiment pas trop qu'on les contredise.
content.29.149=Bon, je vais devoir te laisser, je peux pas rester dans le coin trop longtemps.
content.29.150=Une dernière chose, tu préfères utiliser le clic droit ou le clic gauche pour te déplacer ? (Si jamais tu changes d'avis, tu pourras toujours aller dans le menu Options pour changer ça.)
content.29.151=Tu n'as qu'à traverser le pont à gauche là et suivre la route. Moi j'y vais, ça sent le démon par ici..
content.29.152=Salut l'aventurier ! C'est incroyable c'que tu es petit ! T'as oublié de grandir ou quoi ? Bon, à moins de ne pas être sorti de chez toi depuis des lustres, tu dois savoir qui je suis. Mais au cas où, je me présente, je suis le démon III. Je suis à la recherche de coachs, des durs, des vrais ! À toi de me prouver que tu n'es pas une fillette...
content.29.153=Si tu ne veux pas rester indéfiniment sur cette île, tu vas devoir relever les 3 défis que je vais te proposer. À moins que tu préfères rester croupir ici jusqu'à la fin de tes jours, c'est à toi de voir...\n\nMais avant cela, tu vas devoir recruter trois combattants. Pas de combattant, pas de défis, c'est clair ? C'est bien rentré dans ta ptite tête de pioche ? 
content.29.154=Hmm, tu as trop de combattants sous tes ordres, tu peux en supprimer un de ton équipe en le sélectionnant et en cliquant sur la croix. Reviens me voir après ça si tu veux toujours recruter.
content.29.155=Hey toi ! Qu'est-ce que t'as à regarder ma coupe de cheveux comme ça ? Je suis un Iop, guerrier fonceur et sans reproche ! Notre devise : foncer puis réfléchir ! À moins que ce soit foncer sans réfléchir ? Je ne sais plus... 
content.29.156=Salut aventurier ! Mon petit doigt me dit que tu es nouveau ici... Je suis un Crâ, et personne ne manie aussi bien les arcs que moi ! Tu veux que je te montre ? Tourne-toi un peu pour voir, et cours vite !
content.29.157=Tiens donc, un petit nouveau... Quelle belle pièce ! Qu'es-tu venu m'apporter ? Comment ça rien ?! Je suis une Enutrofette, et les kamas, c'est mon dada ! Tu ne vois pas d'inconvénient à ce que je jette un coup d'œil à ta bourse ? 
content.29.158=Salutations aventurier ! Tu m'as l'air un peu perdu... Ne t'inquiète pas, avec moi tu ne cours aucun danger. Je suis un Féca, défenseur hors pair ! Notre mot d'ordre : sortez couvert !
content.29.159=C'est bizarre, je ne me souviens pas t'avoir invoqué... Tu es nouveau ici ? Je suis un Osamodas, invocateur et dresseur de créatures. C'est très pratique en combat ! Ou quand on a envie d'une nouvelle paire de bottes fourrées...
content.29.160=Bonjour aventurier ! Je suis un Sram, voleur et assassin. Bon d'accord, dit comme ça, ça n'est pas très flatteur... Mais je peux t'assurer que ça peut s'avérer très utile ! Je suis sûr que le jour où tu convoiteras un bijou tu penseras à moi...
content.29.161=Hep toi ! Bienvenue ! Je suis un Sacrieur, autrement dit un Berzerker. Quand mes ennemis me frappent, ils ne font ni plus ni moins que décupler mes forces ! D'ailleurs, tu ne voudrais pas me cogner ? Je me sens faible aujourd'hui...
content.29.162=Salut le nouveau ! Je suis un Ecaflip, joueur invétéré. Parier gros, ça ne me fait pas peur ! Quand la fièvre du jeu m'emporte, impossible de m'arrêter... D'ailleurs, que dirais-tu d'une petite partie ? Amicale bien entendu...
content.29.163=Bienvenue l'aventurier ! Ton visage ne me dit rien, tu dois être nouveau ici. Je suis un Eniripsa. Ma particularité : soigner par la parole. Les gros bobos, c'est moi qui m'en charge ! Aux grands Mots les grands remèdes comme on dit !
content.29.164=Bienvenue le nouveau ! Je suis un Sadida. Quand je ne mets pas au point des onguents ou des poisons, je joue à la poupée ! C'est ça moque toi, mais si un jour tu as affaire à l'une d'entre elles, tu trouveras ça beaucoup moins drôle...
content.29.165=Je te souhaite la bienvenue, aventurier. Je suis un Xélor, je maîtrise le temps. Ralentir un ennemi ? Se téléporter ? Facile ! De nos jours, c'est courant. Hé oui mon ami, il faut savoir vivre avec son temps !
content.29.166=Salut hic ! aventu hic ! rier ! Je suis un Pandawa. Guerrier porteur, je puise ma force dans la hic ! boisson. Oula... ça tourne... Mais si tu veux hic ! en savoir un peu plus sur moi, on peut en parler autour d'une petite chopine, hic !
content.29.167=Bon alors, va voir les maîtres de classes, ils t'aideront. Pour les trouver, tu peux utiliser ta kard (touche M).\n\nSi tu es trop paresseux pour marcher, tu peux toujours recruter des combattants en cliquant directement sur ton interface de gestion d'équipe (le bouton avec les deux épées, touche F4).
content.29.168=Parfait, ton équipe m'a l'air de tenir la route, tu vas pouvoir essayer de relever mes 3 défis. T'es prêt ?
content.29.169=Tu te fiches de moi ? Et les combattants que tu devais me ramener ? Tu les as perdus en route ? Je te laisse une dernière chance, mais cette fois, tâche de ne pas perdre de vue ta mission ! On n'est pas là pour s'amuser !
content.29.170=Pépitox
content.29.171=Cicatrine
content.29.172=Grüny
content.29.173=Ewon
content.29.174=Pataclop
content.29.175=Stalad
