content.42.24=<b>Les combattants qui ont atteint le rang ultime dans le mode évolution se sont vu offrir l'immortalité ! Ils ont quitté la compétition pour devenir des légendes vivantes qui ne sortent plus les armes que contre d'autres légendes en tournoi.</b>\n\nCe tournoi exceptionnel vous propose des récompenses exclusives grâce aux jetons légendes qu'il vous fera gagner.</b>\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
