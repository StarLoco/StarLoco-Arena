content.33.1=Après délibération, le conseil des 24 a décidé de pénaliser votre meilleure équipe pour son inactivité ces 2 dernières semaines en diminuant sa force ! Il n'y a pas de place pour les fainéants dans les arènes de l'Hormonde, ne l'oubliez pas !
content.33.2=Bravo !\nGrâce à ta participation à un évènement Arena, tu as gagné des objets exclusifs.\nN'hésites pas à les arborer fièrement devant la populace envieuse.\n\nL'équipe Ankama.
content.33.3=L'objet ci joint vient du site web Arena.\nMerci pour la confiance que vous accordez à notre service courrier.\nNous espérons vous faire profiter de nos livraisons minute aussi souvent que vous le désirez.\n\nLe facteur démoniaque.
content.33.4=Pour votre participation à la pré gold de Dofus Arena, nous vous en envoyons en exclusivité ces runes pour aider à la progression de vos combattants.\nBonne chance pour la suite.\n\nL'équipe Ankama.
