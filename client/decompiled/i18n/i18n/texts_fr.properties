content.26.1=Panarzarb, la panoplie que l'on chausse pour apprendre à ses ennemis quelle pointure on est !
content.26.2=La panoplie Qideshir a longtemps était portée par Tamher avant de tomber dans des mains moins soigneuses.
content.26.3=Krono était toujours au taquet. Pour être à l'heure le matin, il se vêtait du strict minimum.
content.26.4=Cette panoplie ne doit surtout pas se porter à l'envers, sauf si vous êtes un Osamodas...
content.26.5=Détendez-vous, portez une Boufcoul et roulez-vous dans l'herbe.
content.26.6=C'est la panoplie préférée des aveugles aimant peser le pour et le contre avant de trancher dans le vif.
content.26.7=Lapin ou lapine, plusieurs fois par heure en moins de 30 secondes, ça en fait des cawottes !
content.26.8=Pas un poil sur le torse ? La tenue Barberare est pour tous les imberbes gavés aux testostérones.
content.26.9=Un baladin serait à l'origine, un paladin n'hésitant pas à porter des bas sous son armure.
content.26.10=De la gelée, un moule et hop un bouclier vivant antilaser.
content.26.11="Kam kam" fait la langue putréfiée du Chaferombi avant d'affronter un ennemi.
content.26.12="Tes kards ou la vie ?" Telle est la devise du Brigandin de grands chemins.
content.26.13=Pal, grill ou écarteur, le Bouhroh saura toujours  tourmenter un invité pour vos soirées entres ennemis.
content.26.14=Il faut toujours s'appuyer sur un Champepion pour gagner à tous les sports.
content.26.15=Engagez-vous qui disez, vous finirez chevalier !
content.26.16=Mangeons, bâfrons, boulottons et savourons le bouffon !
content.26.20=Vous avez remporté un tournoi sur l'île des avatars ! Vous gagnez le droit de porter cette prestigieuse panoplie.
content.26.22=Vous avez remporté un tournoi officiel de Dofus-Arena ! Vous gagnez le droit de porter cette prestigieuse panoplie.
content.26.23=Grilembore était un fin stratège, un maître en magie martiale. Il a fondé l'école qui porte son nom, pour que les enfants des autres coins du Monde puissent s'envoyer torgnoles, mandales, et gnons dans les règles de l'Art.
content.26.25=Al Alloupe est probablement le plus grand détective de tout Amakna. Accompagné du docteur Koifisse, il a notamment résolu la célèbre énigme du chienchien des Allister.
content.26.26=Attribué aux champions des tournois Dragon Blanc
content.26.27=La panoplie de tout vampyre qui se respecte.\nAvec elle non seulement vous ferez peur à vos ennemis, mais aussi à vos amis.
content.26.28=Le boufbowl, c'est un peu comme un combat dans l'arène, mais avec une balle comme excuse.
content.26.29=Les kards emotes permettent de s'exprimer plus ... physiquement.
content.26.30=Les kards zaaps te permettent d'utiliser les zaaps que tu trouveras sur chaque îles. Après avoir fait un clic droit sur un zaap, double clic sur la kard représentant ta destination !
