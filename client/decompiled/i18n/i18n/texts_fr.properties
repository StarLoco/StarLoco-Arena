content.20.456=Le roublard invoque à ses pied une bombe disposant de 12 PV, qui s'auto-inflige 2dégâts par round. Quand la bombe arrive à 0PV, elle explose ce qui produit un sort de zone sur 2cases infligeant 15 Dégâts de feu
