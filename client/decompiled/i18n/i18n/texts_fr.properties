content.29.180=Ed eraser
content.29.181=Guitel
content.29.182=Comme tu as pu le voir, ton interface est encore très épurée. 
content.29.183=Bon, tu as l'air un peu limité alors je te le dis, le petit rectangle en bas à droite là, c'est un Chat. Grâce à lui tu pourras communiquer avec les autres paumés dans ton genre. Il t'apportera bien plus encore, mais tu verras ça plus tard. Enfin... si tu survis.
content.29.184=Ici, c'est l'interface de gestion de ton équipe. Vas-y, clique dessus.
content.29.185=Bien évidemment, ton équipe est pour l'instant aussi vide que le cerveau d'un Iop !
content.29.186=À présent, rendons visite aux Maîtres des Classes ! Ils te permettront de recruter tes 3 premiers combattants.
content.29.187=Pour les trouver, nous devons nous diriger vers le nord-ouest. Si tu es perdu, tu peux consulter ta map, ici.
content.29.188=Qu'est-ce que tu attends ?! Allez remue toi un peu ! Tu devrais déjà être parti ! En cas de besoin, clique-moi dessus. 
content.29.189=Quoi ?! Qu'est-ce que c'est que cet exploit stupide ?! 
content.29.190=Grrr ! Bref... Cette icône représente les exploits que tu accomplis en jeu. Durant tes premiers pas dans l'Hormonde, elle apparaîtra à plusieurs reprises. 
content.29.191=Allez, ne perds pas de temps ! Tes combattants t'attendent plus au nord !
content.29.192=Il est maintenant temps que je t'explique où nous nous trouvons. Quel désordre ici, pas vrai ? 
content.29.193=Ce sont les Démons des Heures, nos maîtres, qui ont construit l'Hormonde. Ils ont arraché ici et là et à des époques différentes des parcelles du Monde des Douze. Voilà pourquoi cet endroit ressemble à un immense chantier !
content.29.194=Mais j'y pense, tu n'as toujours pas recruté tes combattants ! Allez un peu de nerf, ça n'est pas le moment de flemmarder !
content.29.195=Le démon III ?! Ici ?! On peut dire que tu as de la chance ! Pour lui parler, clique dessus.
content.29.196=Le démon III vient de temps en temps sur l'île. Il fait passer des tests aux coachs comme toi. Si tu réussis, tu pourras accéder à la Totem Arena où ont lieu les qualificatifs des grands tournois. 
content.29.197=Qu'est-ce que tu dirais de jouer un peu ? Je te propose d'essayer de relever les 3 défis !
content.29.198=Aaaah ! Enfin ! Nous voilà arrivés devant les Maîtres de Classes !
content.29.199=Chacun d'eux va t'expliquer les caractéristiques de sa propre classe. 
content.29.200=Bravo ! Tu ne te débrouilles pas si mal pour un débutant ! Une petite astuce qui pourra t'être utile : lorsque tu frappes un ennemi de côté, tu fais 20 % de dégâts en plus et 40 % de dégâts en plus quand tu le frappes dans le dos. C'est toujours bon à savoir, pas vrai ? 
content.29.201=Si tu parviens à remporter ce nouveau défi, je te parlerai de l'expérience. 
content.29.202=Décidément, tu as du potentiel ! Comme quoi, il ne faut pas se fier aux apparences ! Ah ah !
content.29.203=Au fur et à mesure des combats, les membres de ton équipe deviendront plus forts et gagneront en expérience.
content.29.204=Ferme ta fenêtre de fin de combat et ouvre ton interface de gestion d'équipe, je vais justement te montrer comment utiliser ces points d'expérience.
content.29.205=Parfait ! Maintenant, clique sur le bouton "Kanodo" qui se trouve ici.
content.29.206= Très bien ! Ton Kanodo représente l'évolution de ton combattant. Comme tu peux le constater, ton perso est encore au point de départ de son Kanodo.
content.29.207=La plupart des sphères placées sur le trajet que suit ton kanodo délivrent des bonus. Pour les obtenir, tu dois atterrir dans ces sphères. 
content.29.208=Pour savoir de quel bonus il s'agit, passe ta souris dessus. Essaye avec la première sphère du Kanodo.  Ensuite pour sélectionner une sphère, il faut cliquer dessus, mais puisque tu débutes, je vais le faire pour toi.
content.29.209=Comme tu peux le voir, un bouton "acheter" est apparu en bas à droite, juste en dessous du prix en XP de la sphère. 
content.29.210=Sachant que tu as 3 XP et que la première sphère ne coûte que 2 points d'XP, tu peux acheter cette sphère. Il ne te reste plus qu'à cliquer sur le bouton "acheter" !
content.29.211=Parfait ! Ton combattant possède maintenant ce bonus. Une fois que tu auras suffisamment de points d'XP, tu pourras acheter le suivant, et ainsi de suite. Plus tu avances dans le Kanodo, plus les bonus sont puissants. Ça va de soi !
content.29.212=Passons maintenant au dernier défi du démon III. N'oublie pas que chaque combattant possède son Kanodo, tu dois donc mettre à profit l'expérience de chacun d'entre eux 
content.29.213=Bien joué ! Ce Craqueleur méritait une bonne leçon ! Le voilà transformé en poussière !
content.29.214=Tu as vu ça ?! Le démon III a reconnu ta force, il t'a donné accès à de nouvelles options d'interface ! Tu vas pouvoir recruter jusqu'à 4 combattants sans aller voir les maîtres de classe, simplement en cliquant dans ton interface de gestion d'équipe.
content.29.215=Tu auras tout le temps de découvrir ces options plus tard. La seule chose que tu dois retenir pour le moment, c'est qu'à tout instant tu peux consulter tes exploits et ton grimoire de Kards. 
content.29.216=Ah oui, le grimoire... C'est simple, il s'agit de l'endroit où sont rangées toutes les Kards que tu as gagnées, achetées ou échangées. 
content.29.217=Les Kards vont par exemple te permettre de t'habiller. Ce qui pourra visiblement t'être utile ! Ah ah ah ! Pour afficher leur grandeur, les meilleurs coaches enfilent des panoplies légendaires. En prime, elles leur apportent des bonus. 
content.29.218=Mais on verra ça plus tard. Pour moment, allons-nous-en d'ici et rejoignons le Zaap !
content.29.219=Nous y voilà ! À présent, clique sur le Zaap. 
content.29.220=Comme tu peux le remarquer, en cliquant sur le Zaap, tu as ouvert ton grimoire à la page des Kards Zaap. Pour rejoindre le démon I, sélectionne la catégorie "Zaaps des premières îles" puis double-clique sur la Kard "Repaire du démon I". Allez, vas-y, fais-toi plaisir ! Clique !
content.29.221=Plutôt sympa la déco par ici, tu ne trouves pas ?
content.29.222=C'est ce qui s'appelle avoir de la chance ! On a atterri au bon endroit et au bon moment ! Le démon I se trouve un peu plus loin. C'est lui qui se charge des inscriptions au grand tournoi. 
content.29.223=Allez, ne fais pas ton timide ! Cours donc t'inscrire ! 
content.29.224=Nous y sommes. Je te présente le démon de la 58ème minute. Sois prudent, c'est un très bon invocateur et il tape fort... Pour sortir sain et sauf de ce combat, tu devras utiliser les cases bonus de l'arène. 
content.29.225=Lorsqu'un combattant débute son tour sur une case bonus, il bénéficie de ses effets. Elle pourra lui apporter des PA, de la résistance et bien d'autres choses encore. 
content.29.226=Utilisées à bon escient, les cases bonus de résistance te mèneront à la victoire !
content.29.227=Tiens, regarde, voilà ce petit vicieux de démon de la 52ème minute ! Il n'est pas très puissant, mais son arène est truffée de cases piégées. Alors sois vigilant !
content.29.228=Les cases malus s'activent en début de tour. Une case mort tuera instantanément le combattant, tandis qu'une case piège lui infligera des blessures. 
content.29.229=Le démon de la 52ème minute a la particularité d'utiliser des sorts d'attirance pour déplacer les combattants vers ses pièges. Alors prudence !
content.29.230=Une dernière chose. Grâce aux sorts de stabilisation, tu pourras l'empêcher de t'entraîner vers une case malus. Penses-y !
content.29.231=Lui, c'est le démon de la 46ème minute. On l'appelle le "sniper". Pour le vaincre, avance vers lui en te protégeant grâce aux obstacles, et reste bien attentif à tes Kards événement !
content.29.232=Tes kards événement apparaissent en haut à droite de ton écran. La première est celle qui est active pour le tour en cours. Elle apportera des bonus ou des malus à tous les combattants présents dans l'arène. 
content.29.233=Les deux autres kards événement s'activeront au prochain tour. Le secret d'un bon coach est de toujours y jeter un coup d'œil pour préparer au mieux sa stratégie !
content.29.234=Pour ce défi, tu devras utiliser les kards événements qui pourront t'être bénéfiques. N'oublie pas de bien te cacher lorsque les kards du démon de la 46ème minute apparaîtront !
content.29.235=Je te présente le démon de la 25ème minute. À défaut de faire dans la dentelle, il en fabrique avec la peau de ses adversaires !
content.29.236=Pour le battre, tu dois utiliser les Kards action. Il s'agit de sorts spéciaux utilisables une seule fois par partie et par n'importe lequel de tes combattants.
content.29.237=Je ne vais pas te mentir, dans le combat qui t'attend, tout se jouera au premier tour. Ta victoire dépend du bon enchaînement de tes Kards action !
content.29.238=Il est temps de passer aux choses sérieuses... Tu vas maintenant devoir mettre en application tout ce que je t'ai appris !
content.29.239=Un dernier conseil : essaye de bien repérer la cible à attaquer en premier. C'est parti ! Bonne chance !
content.29.240=Toutes mes félicitations ! Je suis impressionné ! 
content.29.241=Te voilà maintenant fin prêt pour t'attaquer à d'autres coaches. Mais avant cela, tu dois confirmer ton inscription auprès du démon I. 
content.29.242=Bon, finie la rigolade ! Il te faut maintenant un adversaire grâce auquel tu pourras te faire une renommée. Pour cela, ouvre ton interface de gestion d'équipe. 
content.29.243=À chaque fois que tu voudras trouver un match de grand tournoi, tu n'auras qu'à cliquer sur ce bouton, quel que soit l'endroit où tu te trouves. N'hésite pas à t'aventurer sur les autres îles, il y a de magnifiques endroits à visiter !
content.29.244=Le grand tournoi va te permettre d'accroître ta popularité. En remportant un maximum de matchs, tu pourras devenir le coach le plus populaire du grand tournoi !
content.29.245=Pour voir apparaître le classement des meilleurs coaches de la saison, clique sur ce bouton. 
content.29.246=Pour que ton nom apparaisse dans le classement, tu devras te classer parmi les 2000 meilleurs coaches. Le bouton coach te permettra de connaître ta place exacte.
content.29.247=N'oublie pas que tes combattants ne sont pas immortels, ils ont besoin de beaucoup d'attention ! 
content.29.248=Il sera parfois nécessaire de les laisser se reposer sur le banc des remplaçants, sans quoi ils risquent de se fatiguer, voire de se blesser. 
content.29.249=Pense aussi à ménager leur moral. Pour cela, assure-toi qu'ils ne perdent pas trop de matchs et qu'ils soient trop souvent KO. Évite aussi de les oublier sur les bancs !
content.29.250=On en reparlera plus tard. Il est temps pour toi d'aller explorer les autres îles. Lorsque tu te sentiras prêt, tu pourras lancer un combat dans le grand tournoi. 
content.29.251=Alors comme ça tu veux tenter ta chance au grand tournoi ? Tu tombes à pic, on a eu pas mal de pertes ces derniers temps... Un peu de sang neuf ne nous fera pas de mal !
content.29.252=Pour valider ton inscription, tu dois passer les épreuves qualificatives. Le public n'aime pas perdre son temps avec des débutants !
content.29.253=Si tu parviens à vaincre les cinq autres démons présents sur l'île, tu repartiras avec un accès au grand tournoi en poche !
content.29.254=J'ai entendu dire que tu avais triomphé auprès des cinq Démons des Minutes, bien joué ! Tape-m'en cinq ! Visiblement c'est déjà fait ! Ah ah ah !
content.29.255=Hum... bref. Tu t'es montré digne de participer au grand tournoi. Je t'en donne l'accès de suite ! Prends ces cartes de Zaap, elles te permettront de te rendre sur les autres îles. 
content.29.256=Magnifique ! Tu as survécu ! Tu n'es pas si Moumoule que tu en as l'air... Oh allez, je plaisante !
content.29.257=Tu as l'air inquiet... Un peu barbouillé peut-être ? Ne t'en fais pas, beaucoup d'autres sont passés par là avant toi. Il y a même eu des survivants !
content.29.258=Hum... bref. Si tu veux regagner ta liberté, il va falloir faire preuve de force et de courage !
content.29.259=Je sens qu'on va bien s'amuser tous les deux ! Je vais t'aider à faire tes premiers pas dans l'arène, j'ai hâte de voir comment tu t'en sors !
content.29.261=Démon I
