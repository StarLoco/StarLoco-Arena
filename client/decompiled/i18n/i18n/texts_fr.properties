content.31.3=T'as des bottes\nMon pote\nElles me bottent\n\nQu'est ce tu viens faire dans notre terrain vague, bouseux ?\nIci, t'es chez les Hell's Tofus, alors parle tant que t'as des dents !\n\nQuoi ? Me défier ? Zavez entendu les mecs ? Y a un cave qui veut gouter de ma batte.\nCa tombe bien, j'ai un petit message à lui passer, et je vais l'écrire de ton sang !\n\nAllez, je te laisse une chance, tu retires ton falsard, ton blouson et tes bottes, et tu te tires illico.\nSi dans 20 secondes, t'es encore sur le bitume, je nettoie les roues de ma Harley sur ta face de pet. Pigé ?
content.31.6=Les iops sont sûrement mes combattants préférés, l'incarnation même de la force brute, le combat noble.\n\nCela dit, quand on est beau et fort ... on aime en profiter auprès de la gente féminine. \n\nTu verras que dans le combat que je te propose, en plus d'être une très bonne motivation pour ton Iop, la charmante eniripsa qui est dans ton équipe te sera très utile pour venir à bout de l'armée de craqueleur qui t'attends. \n\nUtilise à bon escient les sorts dont elle dispose, son maitre mot : le soin. Et pour cela elle a un vrai dictionnaire à sa disposition : mot soignant, mot de sacrifice, mot de régénération, etc.\n\n\nRéussi donc mon défi, puis profites des mots doux qu'elle glissera à ton oreille pour te féliciter.
content.31.9=Sois rapide et prudent pour combattre !\nTu n'auras que des  Cras disposant du sort flèche de recul pour venir à bout d'une armée  de sacrifiées kamikases qui en plus se déplaceront plus vite que d'habitude !\n\nUn défi Explosif !
content.31.11=Le travail d'équipe...\n\nPour vaincre ce Méga Craqueleur, le mérite personnel ne te suffira pas.\n\nLa clef de ce défi réside simplement dans la coordination entre le colérique, le pivot et le placeur, à toi de trouver la bonne combinaison !\n\nAh oui j'allais oublier, évite de rester près de ton Iop quand il se met en colère.\n\nConseil :\n\nTon Xélor "Tinie" peut dévouer un des deux autres personnages pour lui permettre d'utiliser pleinement ses sorts. La colère de Iop fait des dégâts sur deux cases tout autour de ton Iop. Quant aux sorts pour porter et jeter de ton panda, ils devraient te permettre de tuer le Méga Craqueleur si tu le mets au bon endroit sur la carte.
content.31.12=Défi test (Limero)
content.31.13=Dans ce défi, tu vas devoir mener à la victoire Jackie et Abraham qui sont en galère contre six Sadidas.\nRéussirontils grâce à toi à se débarrasser de leurs ennemis où vont-ils continuer à se disputer à coup de pelle ?\n\nCe défis ne manque pas de sel pour ces marins d'eau douce chercheurs de trésor !\n\n\nAstuce :\nTes ennemis ne font pas d'attaques directes et un de tes sorts a des effets secondaires très particuliers qui t'aidera à les vaincre.
content.31.14=Par Xelor ! Comment des Cadrans ont-ils pu devenirs des portails ?\nVite prends cette équipe de choc pour les fermer, sinon les invocations folles vont déséquilibrer les combats des Arènes !\nNos analyses préliminaires indiquent que les invocations sortantes sont agressives et sortent de façon aléatoire des portails. Par contre il semblerait que l'analyseur de personnage fonctionne, vous pourrez donc vérifier ce qui risque de sortir des portails en cliquant sur leurs icones dans la timeline.\nFais attention, évite de croiser les effluves sur les cadrans, il est possible que ton équipe en souffre fortement... \nAh, mauvaise nouvelle, Jeanine, notre secrétaire Enirispa est indisposée...\n\nAstuce : Quand les sorts ne marchent pas, il reste toujours les poings...\n\nAide pour les joueurs débutants : Détruire tous les cadrans est une tache des plus complexes. Tenir face aux invocations est déjà assez difficile comme cela. Si tu arrives à tenir 20 tours minimum, on peut considérer que tu sais te battre contre elles.
content.31.15=Par Xelor ! Comment des Cadrans ont-ils pu devenirs des portails ?\nVite, prends cette équipe de choc pour contenir le flux de créatures, sinon les invocations folles vont déséquilibrer les combats des Arènes ! Pendant ce temps là, nous envoyons notre spécialiste, le Xélor Montracristo, pour se pencher sur la chose. Nous vous transmettrons ses communications pendant votre combat, elles devraient vous aider.\nNos analyses préliminaires indiquent que les invocations sortantes sont agressives et sortent de façon aléatoire des portails. Par contre il semblerait que l'analyseur de personnage fonctionne, vous pourrez donc vérifier ce qui risque de sortir des portails en cliquant sur leurs icones dans la timeline.\nFais attention, évite de croiser les effluves sur les cadrans, il est possible que ton équipe en souffre fortement... \nAh, mauvaise nouvelle, Jeanine, notre secrétaire Enirispa est indisposée...\n\nAstuce pour les débutants : Ce défi est la version difficile du défi paradoxe xélorite. Détruire tous les cadrans est une tache des plus complexes. Tenir face aux invocations est déjà assez difficile comme cela. Essaye de tenir le plus longtemps possible sans perdre un seul personnage, et  tu prouveras que tu sais te battre contre des invocations.
content.31.16=Ils viennent d'une lointaine terre orientale, ils sont prêts à tout pour gagner les jeux olympiques démoniaques.\nEt en attendant, ils concourrent au lancer de craqueleur en équipe.\n\nMais leur coach est absent, certainement en train de se biturer dans une taverne de Maknala.\nAlors, à toi de jouer, petit, fais tes preuves.
