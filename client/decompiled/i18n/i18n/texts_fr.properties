content.53.4=Dans ce tournoi, les règles suivantes changent : \nVous ne pouvez jouer qu'avec un combattant, qui bénéficie des 6000K de budget pour lui tout seul.\nDe même, les sorts Piège mortel et Corruption sont interdits.
content.53.5=Dans ce tournoi, les règles suivantes changent : \nVous ne pouvez jouer qu'avec un duo de combattants de classes différentes, qui bénéficieront des 6000K de budget à eux deux.\nDe même, les sorts Piège mortel et Corruption sont interdits.
content.53.6=Dans ce tournoi, les règles suivantes changent : \nVous ne pouvez plus observer l'équipements, les sorts et le statistiques de votre adversaire : vous jouez en aveugle !
content.53.7=Ce tournoi utilise les règles classiques du 1vs1.
content.53.8=Dans ce tournoi, les règles suivantes changent : \nVous n'avez que 4000 points de budget pour créer votre équipe.
content.53.9=Dans ce tournoi, les règles suivantes changent : \nVous avez 8000 points de budget pour créer votre équipe.
content.53.10=Dans ce tournoi, les règles suivantes changent : \nVous n'avez pas de limite de budget, mais vous ne pouvez jouer qu'avec 4 combattants dans votre équipe.\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.
