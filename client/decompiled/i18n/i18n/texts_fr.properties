endFightTurnAchievementDescription0=C'est tout ?\nMais t'es une chochote ! T'as eu trop peur de nous ? Tu veux un nounours pour dormir le soir ?\nPfff, nous qui voulions seulement jouer.
endFightTurnAchievementDescription1=Mhm... Pas mal. Mais tache quand même de faire mieux la prochaine fois.\nNous, on aime quand tu tentes de résister.
endFightTurnAchievementDescription2=Excellent ! On s'est bien amusé !\nC'est rare de voir des coachs qui savent tenir en respect nos défis du temps.
endFightTurnAchievementDescription3=Toi, tu sais te battre ! Tu as tenu 30 tours, bravo.\nJ'espère qu'on entendra encore parler de toi, tu sais te battre.
