content.53.13=Dans ce tournoi, les règles changent : Vous n'avez pas de limite de budget, mais vous ne pouvez jouer qu'avec 4 combattants dans votre équipe.
content.53.14=Dans ce tournoi, les règles suivantes changent : \n5 combattants minimum.\nDe plus, vous n'aurez que 10 secondes pour jouer chacun de vos tours.
content.53.15=Ces tournois utilisent les règles classiques de l'évolution. Vous pourrez y jouer avec votre équipe habituelle, et ce, quels que soient les niveaux de vos combattants. \nPar contre, vous ne recevrez pas d'expérience, pas de fatigue, pas de blessures, pas de morts. De même, vos potions et sorts feront effet tout le long du tournoi, et ne s'épuiseront pas. C'est l'occasion de se faire plaisir !
content.53.16=Dans ce tournoi, les règles suivantes changent : \nLa mort subite commence au tour 2.
