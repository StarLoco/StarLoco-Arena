content.59.42=L'Hormonde est<b> intemporel</b> il est en lien avec différents lieux et différentes époques. Depuis Arena tu peux <b>envoyer</b> certains objets sur DOFUS ou Wakfu. Si tu participes à des tournois, tu gagneras des <b>jetons</b> qui te permettront d'acheter des Items DOFUS par exemple.
content.59.44=Et bien.... Il me semble que tu es suffisamment robuste pour y survivre.... Tiens, voila une <b>carte zaap</b> qui t'amènera au repaire du Démon I <b>(pour l'utiliser clique sur le zaap puis choisis la kard du repaire du démon I).</b> Il devrait pouvoir t'enseigner quelques <b>tactiques</b> utiles pour tes prochains combats.\n\nCependant fait attention à ses démons, la dernière fois que j'ai proposé à un coach d'aller lui rendre visite, il n'est jamais revenu...\nC'était il y a 4 ans...
content.59.45=Salutation !\n\nDe mon vivant j'étais un champion du mode Elite, et toutes les jolies filles étaient à mes pieds !! \nMais aujourd'hui c'est une autre histoire...\nj'ai tous les gostofs les plus sexy à mes pieds ! Si je peux t'aider en quoi que ce soit n'hésite donc pas, ça peut toujours augmenter ma cote.
content.59.46=Le <b>mode élite</b> est réservé aux coachs qui<b> maîtrisent</b> déjà bien tous les sorts et équipements du jeu. \nDans le mode élite, tu disposes d'un budget de<b> 6000 points</b> pour former ton équipe et lui attribuer sorts et équipements. Même si tu débutes dans le mode élite, tu as autant de points que le meilleur des joueurs élites et tu as accès à autant de sorts et équipements que lui. <b>Dans le mode élite, tout le monde se bat sur un pied d'égalité.</b>\nil faut juste être bon <b>stratège !</b>\n\nUn autre point important ton <b>niveau</b> dans le mode élite <b>augmente</b> quand tu gagnes des matchs et <b>diminue </b>quand tu en perds. C'est grâce à ce niveau que les démons essayent de te trouver des adversaires à ta taille.\n\nMais fais attention ils n'aiment pas s'ennuyer pendant un combat !
content.59.47=Dans ton <b>interface de gestion d'équipe</b>, clique sur <b>l'onglet élite</b>. Tu devrais voir <b>3</b> équipes préconstruites qui te permettent de <b>t'entrainer </b>un peu et de comprendre comment sont faites les équipes.\n\nCrée toi une nouvelle équipe dès que tu te sentiras <b>prêt</b>. Ensuite, ajoute des combattants dans l'équipe en cliquant sur <b>"recruter un combattant".</b>\n\nN'oublie pas, tu dispose de<b> 6000 points de budget</b>, pas plus. Donc il faudra choisir entre 2 ou 3 combattants <b>très bien équipés</b> avec beaucoup de sorts ou 5-6 moins bien équipés mais qui profiteront de <b>l'avantage du nombre.</b>
content.59.48=Ok, j'ai deux défis qui seront parfaits pour te faire la main.\n\nDans le premier tu devras faire très attention à bien te placer dans l'arène et utiliser les soins de ton Eniripsa à bon escient. \n\nDans le deuxième défi, tu devras coordonner parfaitement les membres de ton équipe et leurs capacités pour venir à bout de tes ennemis.\n\nOn verra si tu es si bon que ça.
content.59.49=Plus tu enchaînes les <b>victoires d'affilée</b> et plus les chances de recevoir des kards après un combat gagné augmente. Evidemment plus tu as un <b>bon niveau</b> et plus les kards reçues seront rares et précieuses.
content.59.50=Aïe ! satanée dague, MAIS... MAIS JE SAIGNE ! AAAAAAAAH !!!\nCOMMENT UN GOSTOF PEUT-IL SAIGNER ?!\n\nhein? ah ! un nouveau, viens par ici.\nJe suis la pour t'aider à comprendre le mode évolution, n'hésite pas à me poser des questions.
content.59.51=oui !\nLe mode évolution est super si tu <b>viens d'arriver</b> dans l'hormonde. Grâce au <b>kanodo</b> tu débloques tes sorts et les équipements de chacun de tes combattants petit à petit, c'est donc <b>plus simple</b> de les apprendre et de faire ta première équipe.\n\nDans le mode évolution, tes combattants deviennent de <b>plus en plus forts</b> donc en enchainant les combats, la force d'un combattant est déterminée par son <b>rang. </b>\n\nLa <b>ligue</b> dans laquelle tu joues est déterminée par le rang du plus fort de tes combattants. Plus tu joues dans une ligue élevée, plus tu gagnes des <b>kards</b> et de la <b>réputation. </b>C'est grâce à la réputation que tu augmentes de <b>niveau </b>et c'est la réputation qui donne ton classement de la saison en cours. \n\nAttention cependant à tes combattants, ils peuvent être <b>blessés</b> si ils combattent en étant trop fatigués par exemple. Pour éviter ça et pour gagner plus d'expérience ou de réputation, profite des bonus donnés par les <b>consommables</b> et les <b>panoplies.</b>\n\nPour finir, n'oublie pas, en mode évolution tu ne<b> perds pas</b> de niveau, donc n'ait pas peur, la défaite te rapporte même de la réputation et de l'expérience !\n\nCeci dit fait attention à ne pas <b>surmener</b> tes combattants, utilise tes <b>remplaçants</b> avec alternance pour limiter la <b>fatigue</b> de ton équipe.
content.59.52=En évolution, tu ne disposes que <b>d'une équipe et un banc de remplaçants.</b> Crée donc directement tes combattants dans cette équipe grâce aux <b>boutons de recrutement.</b>\n\nSi tu veux modifier ton équipe, mets les combattants que tu veux sur le<b> banc</b> et recrutes-en de nouveaux à leur place ou fait monter ceux qui étaient sur le banc dans ton équipe.\n\n<b>MAIS FAIS ATTENTION !</b> tu ne peux supprimer que <b>4 </b>combattants par semaine !\nje te conseille donc de regarder et d'étudier les descriptions de chaque classe et de leurs compétences dans ton sommaire (qui se trouve dans un onglet de ton inventaire)
content.59.53=Le <b>Kanodo </b>représente l'apprentissage d'un combattant. Il est composé de sphères qu'il faut <b>acheter </b>grâce à <b>l'expérience </b>acquise par le combattant.\nC'est une sorte d'arbre de talent !\n\nOn ne peut acheter qu'une sphère disposant d'un chemin direct avec la sphère sur laquelle le curseur de progression est situé (curseur symbolisé par la tête de votre combattant). \nLes sphères une fois achetées vous donnent leur bonus qui peut être une augmentation de caractéristique, un nouveau sort ou un ensemble d'équipements qui se débloque pour le combattant. Attention, il y a aussi des sphères qui donnent des malus, cela représente un sacrifice qu'un combattant doit faire pour continuer son apprentissage.\n\nIl existe des sphères spéciales aussi comme les sphères portails qui vous téléportent à un autre endroit du kanodo ou les sphères barrières qui vous demandent de sacrifier une kard pour débloquer le passage.\n\nApprendre à parcourir intelligemment le kanodo vous permettra d'avoir des combattants plus efficaces plus vite, c'est un jeu en soi.
content.59.54=Comme tu le sais si tu as bien écouté ce que nous t'avons expliqué concernant le mode évolution, tes combattants peuvent être <b>blessés </b>et doivent alors être soignés. \nUn combattant non soigné a des <b>malus </b>en combat et a de grandes chances d'aggraver sa blessure.\n\nPour se soigner d'une blessure, il n'existe <b>qu'une solution</b> : Utiliser une <b>kard de soin</b> que tu peux obtenir par <b>échange</b> ou dans les <b>boufteurs </b>que tu peux acheter contre quelques ogrines sur le site du jeu.\n\nC'est magique, avec ça tout repousse ! Enfin... presque tout !
content.59.55=Le mode évolution marche <b>différemment</b> des autres modes concernant le gain de kards. Dans le mode évolution, tu disposes de <b>bonus</b> pour améliorer ta chance de trouver des kards (collection) et ta chance qu'elles soient plus<b> rares </b>(prospection). \n\nCes bonus se trouvent surtout sur les <b>panoplies</b> dont tu t'équiperas. A part ça, plus tu es de <b>haut niveau</b> et plus tu combats dans des <b>ligues élevées</b>, plus les kards que tu récupèreras en cas de victoire seront de <b>haut niveau.</b>\n\nOn récupère généralement un peu plus <b>facilement</b> des kards en mode évolution que dans les autres modes, mais vu qu'il faut aussi en dépenser, pour se soigner par exemple, c'est logique.
content.59.56=Hep !\n\nJe te préviens avant que tu me demandes : Non, ce n'est pas mon double, c'est mon jumeau. Nous sommes les frères Noctis, et ensemble nous étions des des champions dans le mode 2vs2 !
content.59.57=QUOI?! tu ne connais pas le mode 2vs2 ??\n\nCe mode te permet de créer une équipe <b>élite </b>avec un <b>ami</b> et d'en partager le contrôle des combattants pour que vous la <b>dirigiez à deux</b> dans l'arène. \n\nCe mode est très amusant car il demande à ton coéquipier et à toi-même une très bonne <b>coordination</b> ainsi qu'une capacité à très vite communiquer si vous voulez remporter la victoire.
content.59.58=Dans ton interface de gestion d'équipe, clique sur<b> l'onglet</b> 2vs2. \n\nCrée toi une nouvelle équipe en cliquant sur<b> un des boutons</b> de créations en bas de la fenêtre. Pour valider la création de ton équipe, tu dois choisir un<b> ami</b> qui se trouve dans ta liste d'amis avec qui tu veux la <b>partager</b> et tu dois donner un <b>nom </b>à cette équipe. Ensuite, ajoute des combattants dans l'équipe en cliquant sur<b> "recruter un combattant".</b>\n\nN'oublie pas, tu dispose de <b>6000</b> points de budget, pas plus. Donc il faudra choisir entre <b>2 ou 3</b> combattants très bien équipés avec beaucoup de sorts ou<b> 5-6</b> moins bien équipés mais qui profiteront de l'avantage du nombre. \nEnsuite, avant de jouer, il vous suffit d'utiliser le <b>bouton d'attribution </b>de combattants pour partager ceux-ci et le tour est joué !
content.59.59=Tu aurais pas des gènes d'Enutrof toi?\n\nPlus tu enchaînes les <b>victoires d'affilée</b> et plus les chances de recevoir des kards après un combat gagné augmente. Evidemment plus tu as un <b>bon niveau</b> et plus les kards reçues seront rares et précieuses.
content.59.60=Hey, salut !\n\nViens voir le vieux gostof enutrof qui fût jadis un redoutable compétiteur en tournoi. Que veux-tu savoir ?
content.59.61=OH ! un peu de respect !\n\nLe mode tournoi est un <b>mode à part</b>, je vais un peu t'en parler, mais ne t'y attaque pas avant de maitriser au minimum un des autres modes !\n\nUn tournoi est organisé au moins <b>une fois par jour</b> dans l'hormonde et se déroule souvent à des heures bien <b>précises. </b>Tu peux voir tous les tournois prévus dans ton calendrier en cliquant sur l'icône <b>calendrier</b> en bas sur ton interface.\n\n La particularité des tournois est que les règles des matchs <b>changent</b> pour chaque tournoi : Le budget peut changer, des sorts être interdits et bien d'autres choses encore.\n\nPour faire un tournoi il te faut t'y <b>inscrire,</b> puis créer une équipe qui peut y participer. Quand l'heure du tournoi arrivera tu pourras dans ton interface de gestion d'équipe sélectionner le tournoi et ton équipe et lancer la recherche d'un adversaire.\n\nLes tournois sont très intéressants et amusants et permettent en plus de gagner des récompenses <b>inédites</b> et des récompenses sur les autres jeux <b>Ankama !</b>\n\nTu peux également créer ton propre tounoi, si tu as la kard spéciale "Création de tournoi"
content.59.62=Pour<b> s'inscrire </b>à un tournoi, il te faut soit te rendre sur l'île des tournois et cliquer sur le <b>totem des tournois</b>, soit utiliser ton <b>calendrier</b> en cliquant sur l'icône calendrier en bas de ton interface.\n\nLes tournois ont des périodes d'inscription variables, parfois tu devras obligatoirement t'y inscrire <b>avant</b> une certaine date. \n\nD'autres tournois te demanderont une<b> kard</b> en échange de ton inscription. Ces tournois offrent généralement des <b>récompenses bien plus intéressantes.</b>\n\nPour finir, certains tournois ne sont<b> pas accessibles</b> à tous le monde, ils peuvent être privés et réservés à une <b>guilde</b> où réservés aux <b>meilleurs joueurs</b>, lis toujours bien la description d'un tournoi donc pour en connaître les modalités d'inscription.
content.59.63=J'aime ton esprit !\n\nEn participant aux tournois, tu gagneras des <b>jetons de tournois</b>. Tu pourras échanger ces jetons sur<b> l'île des tournois</b> contre des <b>kards exclusives.</b> \nParmi ces kards certaines te permettront <b>d'envoyer des objets</b> sur des jeux ankama comme <b>DOFUS. </b>Tu peux par exemple envoyer des parchemins de caractéristiques ou de sorts ou encore la fameuse panoplie champion !
content.59.65=EH TOI ! que fais-tu ici!\n\nPardon? tu souhaite apprendre les concepts avancés de combat? Pfeuh.\nHors de ma vue, je ne m'occupe pas de moucherons dans ton genre.\n\nCeci dit... Hmmm ton équipe ma l'air d'être de la bonne chair à canon.\nva voir mes serviteurs les démons des minutes, ils sauront t'endurcir.
content.59.66=Pour lancer un combat, c'est très simple. Il te suffit de cliquer sur le bouton <b>"Gestion d'équipe"</b> (le gros bouton jaune/orange en bas là avec trois bonhommes dessus) qui va t'ouvrir une fenêtre où tu peux <b>gérer toutes tes équipes.</b>\n\nLe mode de jeu par défaut est le mode <b>"évolution"</b> mais tu peux gérer les équipes des autres modes de jeu en cliquant sur leur onglet tout en haut de la fenêtre.\n\nUne fois le mode de jeu sélectionné, il te reste à <b>créer ton équipe</b> et la remplir de combattant puis de cliquer sur le bouton "Combattre" les démons se chargeront de trouver un adversaire à ta taille ! Tache de ne pas les décevoir.
content.59.69=Oui, effectivement n'oublie pas de bien <b>orienter</b> tes combattants après chaque <b>mouvement et attaque</b> pour ne pas te retrouver désavantagé.\nMais tu peux aussi tirer <b>profit</b> des placements de tes adversaires !\n\nUne attaque de dos inflige <b>40%</b> de dégâts supplémentaire.\nEt une attaque de coté <b>20%</b> de dégâts supplémentaire donc n'hésite pas a être <b>fourbe.</b>\n\nPar contre les dégâts de zone ou neutres ne bénéficient pas de ce bonus.
