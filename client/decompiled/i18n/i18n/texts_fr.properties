content.59.7=Salut,\n\nJe m'appelle Baan. Je suis ici pour te guider dans l'Hormonde, la dimension où tu te trouves. Que veux tu savoir ?.
content.59.8=Très bien. Quel sujet t'intéresse ?
content.59.10=Ok, je t'emmène dans l'arène d'entraînement. J'ai un <b>bouftou</b> là bas qui adore se prendre des coups.\n<b>Ne le ménage pas.</b>
content.59.11=Dans ce monde, ta place dans les <b>classements</b> et ta collection de <b>Kards</b> sont tes deux objectifs principaux !\n\nPour gagner des places dans les différents classements de l'Hormonde, tu dois<b> enchainer les victoires </b> dans l'arène en affrontant les autres joueurs afin de prouver que tu es le plus fort.\n\nGagner des matchs te permettra aussi de gagner des <u><b>kards</b></u> et les ajouter à ton grimoire. Pour obtenir toutes les  <b>kards</b> de l'Hormonde tu disposes aussi des <b>boufteurs</b> (que tu achètes grâce aux ogrines sur le site web du jeu), des <b>Kardmasters</b> que tu rencontreras sur les îles ainsi que des <b>laboratoires de fusion</b>.\n\nPour le moment, concentre-toi sur un mode de jeu (le mode évolution est un bon début) et essaie d'y aligner les victoires.\nva voir le gostof Sacrieur, il est expert dans ce domaine.
content.59.12=Il existe de nombreux types de combats, aussi appelés <b>modes de jeu</b>, dans l'Hormonde. Tu trouveras sur cette île des <b>gostofs</b> qui t'expliqueront plus en détail chacun de ces modes de jeu. \n\nSache en résumé que le <b>mode évolution</b> te permet de jouer une équipe dont la force augmente avec l'entraînement. Au contraire, le <b>mode élite</b>  met chacun sur un pied d'égalité, mais demande une bonne connaissance du jeu, autrement dit, ne commence pas par lui. \n\nLe <b>mode élite 2vs2</b> te propose de partager une équipe élite avec un ami pour jouer en duo.\n\nEt pour finir le <b>mode tournoi</b> aussi appelé <b>mode personnalisé</b> te propose de jouer avec des règles chaque fois différentes et de participer à des tournois qui te permettront de gagner de superbes <b>Kards</b> et même des items <b>DOFUS</b> ou <b>Wakfu</b> !\n\nEn passant, les <b>gostofs</b> ne demandent qu'à t'aider, leurs âmes de combattants tombés dans l'arène doivent accomplir cette dernière tâche avant d'être libérées donc n'hésite pas.\n\nLe gostof Iop peut te renseigner sur le mode élite, et te proposer des entrainements.\nLe gostof Sramette faisait partie des meilleurs combattants du mode 2vs2, elle saura te guider.\nLe gostof Enutrof, riche mais aujourd'hui mort, était un redoutable adversaire du mode tournois.\nEt pour finir le gostof Sacrieur est un vétéran du mode évolution, il t'apprendra les bases.
