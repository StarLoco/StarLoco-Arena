enteringTimeChallenge=Les démons du temps ne trouvent pas d'adversaire de ton niveau actuellement et ont donc décidé de tester combien de tour tu survivras face à un de leur "défi du temps".\n\nSurvis le plus longtemps possible, chaque tour passé te fais gagner de l'expérience et ne t'inquiètes pas tu n'auras pas de fatigue ni de blessure ou de mort dans un défi du temps et bien sûr pas de défaite comptabilisée, ce n'est pas un match comptant pour le classement !\n\nBonne chance.
