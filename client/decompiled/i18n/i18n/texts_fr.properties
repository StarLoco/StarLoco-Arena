content.26.48=Ces kards sont à utiliser directement après la mort d'un combattant ou au cimetière pour le ramener d'entre les morts.
content.26.49=Trouvez le lanceur et faites vos propres compositions en variant les couleurs et les types de fées d'artifice.
content.26.51=Les démons se sont un jour réunis pour interdire le Péo, du fait de ses effets trop puissants. Heureusement, ils ne se sont jamais mis d'accord. Le Péo, ça vous réveille un mort de fatigue.
content.26.52=Ralliez votre clan grâce à ces splendides étandards. Pendant leur prochain combat, tous les membres de votre guilde gagneront un bonus. Attention, deux étendards ne peuvent être actifs en même temps.
content.26.53=Une petite baisse de forme, le moral dans les chaussettes, une potion d'Arena Max, et ça repart. Arena Max, la boisson qui tue des ours !
content.26.54=Potions à utiliser si vous voulez améliorer vos chances de gagner de bonnes kards à la fin d'un combat. Les potions Am, Stram et Gram sont les seules potions à pouvoir être utilisées toutes en même temps.
content.26.55=Les runes servent à débloquer les cadenas dans le kanodo de tes combattants. De plus, pendant quelques combats, elles augmenteront ses capacités. Les runes mineures sont utilisées pour les premiers cadenas de tous les kanodos.
content.26.56=Les potions d'expérience permettent de donner un petit coup de boost à un de vos combattants. Très pratique si vous décidez de recruter un guerrier débutant.
content.26.57=Grâce à cette panoplie fantomatique, vous pourrez dire à vos amis que vous êtes plein d'esprit !
content.26.58=Avec cette panoplie sur le dos, vous pourrez commander aux Bouftous... ou vous faire encorner par eux parce que vous avez dépouillé leur chef ! 
content.26.59=Une panoplie pour tous ceux qui veulent afficher leur richesse au grand jour... ou pour tous ceux qui rêvent de se faire détrousser !
content.26.60=Si vous êtes un partisan du déséquilibre, cette panoplie est faite pour vous. Si vous êtes un déséquilibré aussi, remarque...
content.26.61=Les potions élémentaires montent les dégâts d'un de vos personnage dans un élément, et ce pendant 3 combats.  Attention, toutes ces potions ont aussi un effet négatif à prendre en compte.
content.26.62=Chacune de ces potions permet de protéger un de vos combattants contre un élément en particulier, et ce pendant 3 combats. Attention, toutes ces potions ont aussi un effet négatif à prendre en compte.
