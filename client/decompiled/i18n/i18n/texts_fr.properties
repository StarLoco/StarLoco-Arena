content.31.29=Commençons en douceur et voyons comment tu te débrouilles contre un simple bouftou ... Avec trois combattants, ça ne devrait pas poser problème, même à un gringalet comme toi ...
content.31.30=Alors comme ça on a battu le bouftou ? C'est biiiieeennnnn ... Bon on va voir comment tu te débrouilleras contre la vague de monstres qui t'attend au défi suivant.\n\nAttention, ceux-ci sont friands de tes points d'actions, ne t'étonnes pas de ne plus pouvoir lancer de sort si tu les laisses t'en voler trop !
content.31.31=OK ok, ils étaient nombreux ces prespics et ces folles, mais ça tapait pas bien fort hein !\n\nVoyons ce que tu peux faire contre un vrai adversaire. Ce coup-ci, vous ne serez pas trop de trois pour le battre je pense.\n\nLe craqueleur est costaud, il tape fort et en plus il te vole tes points de mouvement. Un petit conseil si tu ne veux pas ressembler à une carpette : essaye au maximum de le frapper de loin avant que lui ne te bloque au corps à corps.
content.31.32=Expédié en quelques secondes. Voila un combat comme on les aime, sanglant et rapide. N'oublie jamais l'importance des cartes actions, tu devras toujours les utiliser au meilleur moment. Elles coutent peu de points d'action et sont souvent beaucoup plus fortes qu'un sort de combattant. Elles t'apporteront la polyvalence qui te donnera la victoire.
content.31.33=Tu es fin prêt ! Va voir le démon I, il devrait te donner le droit de participer au grand tournoi. Et si tu veux revenir t'entraîner auprès de nous, n'hésite pas. Tes combattants continueront de gagner un peu d'expérience, tant qu'ils seront débutants. Après, il te faudra te battre contre d'autres coachs pour gagner plus d'expérience.
content.31.34=Bravo ! Quelle victoire phénoménale. Donc, ne pas oublier, les cases bonus peuvent donner un avantage décisif en combat. Dans les arènes du grand tournoi, elles se trouveront souvent au milieu du terrain. Essaye de les utiliser, tu verras combien elles peuvent changer l'issue d'un combat.
content.31.35=Tu as déjoué les pièges du démon de la 52ème minute, bien joué. En combat, n'oublie jamais les cases piège. Celles ci peuvent faire de gros dégâts, mais les cases mort, elles, tueront net un personnage. Si tu as des personnages pouvant pousser, attirer, ou échanger de position avec l'adversaire, il ne faut pas hésiter, et le poser dessus.
content.31.36=Hop là, expédié. Une fois pris au corps à corps, un archer ne peut plus faire grand chose. Une fois arrivé au grand tournoi, il faudra que tu gardes le réflexe de toujours regarder les kards des deux prochains tours. Elles ne seront jamais aussi violentes que celles que tu viens de voir, mais elles peuvent toujours autant changer l'issue d'un combat.
content.31.37=Tu ne te sens pas bien, petit coach ?\nTrop de poison ? Hooo, petite nature.
content.31.38=Mouaaahahahaha !\nTu l'aimes ce Iop.\nNous, il nous fait toujours rire, surtout quand il écrase une malheureuse équipe.
content.31.39=On a songé à mettre un seul gardien, qui pose des questions.\nMais c'est plus drôle quand les flèches de recul partent.\nDommage que personne ne soit tombé...
content.31.40=Sympa mon potager ?\nJ'y fais pousser des kawottes.\nMais pour éviter les wabbits, j'y mets toujours quelques gardiens.\nQui écrasent les wabbits.
content.31.41=Et bien ? C'est tout ?\nOn voulait voir ce que t'avais dans le ventre... On est déçu, t'es sur de pouvoir faire le spectacle en tournoi, gringalet ?
content.31.42=Haaa, un bon défi comme ça, ça vous requinque.\nC'est notre petit remontant celui là.\nUn Sram, et ça repart.
content.31.43=Ils sont gentils ces Eniripsas. Distribution de soins, et distribution de baffes. Comme ça, l'adversaire tient plus longtemps, souffre plus longtemps, et nous, on se régale.
content.31.44=Maintenant que tu as senti la force des démons des secondes, retourne dans l'arène affronter tes pairs.\nNous voulons du combat, des blessés et des morts. Exécution !
content.31.45=Bravo ! Tu as donné une bonne leçon à ce démon ! Grâce à toi, Barnabé est libre ! À présent, utilise sa Kard pour le renvoyer auprès de son propriétaire, dans le Monde des 12. 
content.31.46=
