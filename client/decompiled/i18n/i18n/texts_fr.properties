challengeHelpDescription32=Tu as tenu... 10 secondes. Tu peux mieux faire. Il faut utiliser les kards actions de ton coach. Tu en as trois. Vent repoussant repousse un adversaire. Si tu remarques, le démon en bas se trouve juste devant une case mortelle. Pousse le dedans. La carte éclair a une longue portée. Elle devrait te permettre d'atteindre le double. La carte accélération, elle, te fera aller beaucoup plus vite.
challengeHelpDescription33=Bon, là, je vais t'aider, parce que c'est pas trivial. Le premier cristal que tu dois tuer est le cristal régénérant, tout à gauche. Mais pour l'atteindre, il te faudra faire attention au cristal de puissance qui le protège. Essaye d'utiliser les capacités de tes personnages, comme l'invisibilité, le bond, l'accélération ou même un ralentissement ou un tir tranquilisant pour passer sans prendre de coup.
challengeHelpDescription34=Aïe aïe aïe. il est gros et il fait mal lui. Je vais te donner un petit conseil. Sur la carte, tu as pu voir deux cases marrons avec des étoiles jaunes. Si tes personnages commencent leur tour dessus, il gagneront beaucoup en dégâts, et devraient rapidement tuer le gros démon.
challengeHelpDescription35=Tu es tombé dans les pièges du démon de la 52ème minute. Ton objectif est de faire passer un seul personnage, une fois que tu auras atteint le démon, celui ci ne t'attaqueras pas, et tu pourras le tuer facilement. Si tu veux passer la case du milieu... essaye de mettre un personnage dessus, par exemple. Si si, fais moi confiance.
challengeHelpDescription36=Mets toi à couvert !! Comment veux tu gagner contre un archer si tu restes comme un gros fruit au milieu de l'arène ? Donc, fais en sorte de toujours finir ton tour derrière un arbre. Pour t'aider, il y a des kards d'évènements bonus. Tous les 6 tours, tes combattants gagneront des points de mouvement. Profite de ce tour là pour passer d'un arbre à l'autre.
challengeHelpDescription45=C'est raté pour cette fois, mais ne désespère pas ! Utilise les cases bonus à bon escient tout en évitant les attaques simultanées des cristaux. Si ça ne suffit pas, entraîne tes combattants et reviens affronter ce satané démon avec un maximum de bonus aux dégâts ! 
