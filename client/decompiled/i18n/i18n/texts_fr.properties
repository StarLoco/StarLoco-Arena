content.26.67=De la poussière d'ange ! Dans l'Hormonde ?\nC'est interdit par les Démons des Heures, et tous ceux qui en utilisent risque de voir leur réputation en souffrir. Mais c'est tellement puissant... qui peut résister à l'envie de tester ?
