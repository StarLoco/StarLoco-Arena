content.42.1=<b>Participez aux glorieux tournois de la Dofus-Arena league !</b>\n\nLes tournois Dofus-Arena league sont les tournois les plus réputés de l'hormonde et donc ceux qui rapportent le plus de points tournoi !\n\nCes tournois utilisent les règles classiques du 1vs1. A chaque victoire pendant le tournoi, vous gagnerez des points de tournoi (de plus en plus). <b>Gagnez 4 matchs d'affilée dans le tournoi et vous empocherez le maximum de points : 12</b>.\n\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nLe tournoi s'active aux heures suivantes :\n- <b>1h30-1h45 GMT+1</b> (l'heure française)\n-<b>12h30-12h45 GMT+1</b> (l'heure française)\n- <b>18h30-18h45 GMT+1</b> (l'heure française)\n- <b>20h30-20h45 GMT+1</b> (l'heure française)\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.\n\n
content.42.4=Tournoi Démon III\n<b>Participez à ce duel brutal façon démon III</b>\n\n<b>Le gagnant du tournoi remportera 10 points, les autres participants uniquement 1 points</b>. Et oui, c'est ça la loi du plus fort sauce démon III.  \nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.5=<b>Il faudra que vos combattant soient soudés comme IX et XXI pour espérer gagner ce tournoi.</b>\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.6=<b>Vous aimez le bluff et la stratégie ? Ce tournoi est fait pour vous ! Insufflez la peur dans le coeur de votre adversaire qui n'a aucun moyen de savoir les sorts et équipements de vos combattants.</b>\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.7=<b>Ce soir, c'est soirée déchaussage de dents !</b>\n\nLes tournois rapides sont en tout point semblable aux tournois classiques de la ligue Dofus-Arena. La seule différence est qu'au lieu de se jouer en une semaine sur des courtes périodes d'activation, ceux-ci se jouent en une et une seule soirée !\n\nA chaque victoire pendant le tournoi, vous gagnerez des points de tournoi.\n\n<b>Gagnez 4 matchs d'affilée dans le tournoi et vous empocherez le maximum de points : 12</b>. \nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.8=<b>Vous adorez composer des équipes originales ? Venez tester vos capacités dans le tournoi enutrof.</b>\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.9=<b>A l'opposée du tournoi enutrof, le tournoi des riches vous propose de créer des équipes avec beaucoup plus de budget que d'habitude.</b>\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.10=<b>Un tournoi fait pour les écaflips, ou pas. </b>\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
