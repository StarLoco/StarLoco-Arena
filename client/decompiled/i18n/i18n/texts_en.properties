content.31.3=You got boots\nHomie\nI get a kick out of them\n\nWhat are you doing in our wasteland, simpleton?\nYou're amongst Hell's Tofus, now, so speak up or forever hold the pieces of your teeth.\n\nWhat? Defy me? You hear that guys? There's an idiot here who's looking for a beating.\nIt's good timing, I've got a little message for him, and I'm going to write it in your blood!\n\nGo on, I'll give you a chance. You take off your trousers, shirt and shoes and then run off pronto.\nIf you're still on the tarmac in 20 seconds, I'm going to clean the wheels of my Harley with your ugly mug. Understood?
content.31.6=The Iops are my favourite types of warriors, the incarnation of brute force itself, noble combat.\n\nThat said, when you're strong and handsome... you like to show off in front of the ladies.\n\nYou will see that in the battle I'm about to offer you, as well as being good motivation for your Iop, the charming eniripsa in your team will be very useful in taking out the crackler army which is waiting for you.\n\nUse her spells wisely and remember, her keyword is "care". And, for that, she has a whole dictionary available to her: Healing Word, Word of Sacrifice, Regenerating Word, etc.\n\nFirst of all, succeed at the challenge, and then sit back and enjoy the congratulatory words she'll whisper in your ear.
content.31.9=Act carefully and quickly!\nYou'll only have Cras armed with the Retreat Arrow spell to bring down an army of sacrificed kamikazes, who'll be moving much more quickly than usual too!\n\n\nAn Explosive Challenge!
content.31.11=Teamwork...\n\nTo defeat the Mega Crackler, personal merit will not be enough.\n\nThe key to this challenge is in the coordination of positioning, wrath and pivot, and it's up to you to find the right combination!\n\nOh yes, I almost forgot! Try not to stand next to the Iop when he's angry. \n\nYour Xelor "Tinie" can dedicate itself to one of the two other characters to enable them to use their spells to the full extent. Iop's wrath does damage to the two tiles surrounding your Iop. As for your Panda's carry and throw spells, you should be able to use them to kill the Mega Crackler if you get them on the right part of the map.
content.31.12=test Challenge (Limero)
content.31.13=In this challenge, you're going to have to help Jackie and Abraham, who've got themselves into a sticky situation against six Sadidas.\nWill they manage to get rid of their enemies thanks to you, or are they going to have to carry on battling it out?\n\n\nThese challenges stir up plenty of interest for landlubbers in search of treasure!\n\n\n\n\nTip:\nYour enemies won't attack directly and one of your spells has special secondary effects which will help you beat them.
content.31.14=By Xelor! How did these Dials turn into portals?\nQuick, take this elite team to close them, or the wild invocations will destabilise the fights at the Arenas!\nOur preliminary analysis indicates that the outgoing invocations are aggressive and are leaving the portals unpredictably. The good news is, it seems the character analyser works so you can check the risk factor of going through a certain portal by clicking on their icons on the timeline.\nBe careful, try to keep away from the unpleasant smells emanating from the dials or your team might suffer terribly...\nAh, bad news, Jeanine, our Eniripsa secretary is currently unavailable...\n\nTip: If the spells don't work, you can always try old-fashioned one on one combat...\n\nHelp for beginners: Destroying all the dials is one of the most complex tasks. Withstanding the invocations is hard enough work as it is. If you can manage to hold on for at least 20 turns, it's probably safe to assume you're ready to fight against them. 
content.31.15=By Xelor! How did these Dials turn into portals?\nQuick, take this elite team to contain the flux of creatures, or the wild invocations will destabilise the fights in the Arenas! While you're doing this, we'll send our specialist, Xelor Deathwatch, to have a closer look. We'll pass on any information to you during the battle. It should be of help.\nOur preliminary analysis indicates that the outgoing invocations are aggressive and are leaving the portal unpredictably. The good news is, it seems the character analyser works so you can check the risk factor of going through a certain portal by clicking on their icons on the timeline.\nBe careful, try to keep away from the unpleasant smells emanating from the dials or your team might suffer terribly...\nAh, bad news, Jeanine, our Eniripsa secretary is currently unavailable...\n\nTip for beginners: This challenge is the more difficult version of Xelorite Paradox. Destroying all the dials is one of the most complex tasks. Withstanding the invocations is hard enough work as it is. Try to hold on for as long as possible without losing any of your team members, and you will prove that you know how to battle invocations.
content.31.16=They've come from far away, in the east, and are prepared to do whatever it takes to win the demon olympic games.\n\nAnd in the meantime, they're trying to get a crackler into their team.\n\nBut their coach isn't there. He's no doubt having a booze-up in some Maknalian tavern.\n\nSo it's up to you to play, son. Show them what you've got.
