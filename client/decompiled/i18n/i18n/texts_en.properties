content.26.1=Weerdtrot, the set you wear when you think your enemies are starting to doubt your... size.
content.26.2=The set Zatrox used to be worn by Urmhum before it fell into less careful hands.
content.26.3=Krono was always at the top. To be on time in the morning, he wore the bare minimum of clothes and lived on a diet of worms and birdseed.
content.26.4=This set is not to be worn inside out, unless you are an Osamodas...
content.26.5=Relax, wear a Gobkool and roll in the grass.
content.26.6=This is the favorite set of blind people who like to weigh the pros and cons before taking insane decisions.
content.26.7=Wabbits do it several times an hour that's why they need an enormous amount of cawwots!
content.26.8=The Bhairbarian set is perfect for testosterone-stuffed bald people.
content.26.9=Furatnheit was a knight who used to wear stocking under his armor to keep him warm.
content.26.10=Some jelly, a mold and you've got yourself a living anti-laser shield.
content.26.11="Kam Kam" goes the rotten tongue of the Chaferombi before it attacks an enemy.
content.26.12=Your cards or your life... That's the motto of the roaming highwayboys. 
content.26.13=Impaling, burning or quartering, the Thorturer will always find a way to torment your guests when you have them round for tea.
content.26.14=With this set, your fans will pop up like mushrooms... or maybe you'll just be left standing in the dark, covered in dirt.
content.26.15=Sign up they said, and you'll become a knight!
content.26.16=Let's gobble, swallow, digest and savor the jester!
content.26.20=You've suffered but you made it through! You won a tournament on Avatar Island! Now you can wear this prestigious set and show off to everyone you beat!
content.26.22=You've suffered but you made it through! You won an official Dofus-Arena tournament! Now you can wear this prestigious set and show off to everyone you beat!
content.26.23=Grilembore was a master strategist and a martial magician. He founded the school of the same name for children from all over the World to come and practise their fighting skills in the tradition of the Art. What a man!
content.26.25=Sir Lookhums is probably the greatest private investigator in all Amakna. He's mainly famous for solving the mystery of the Bow Wow of the Allisters, together with Dr Vatsun.
content.26.26=This set will be given to the champions of the White Dragon Tournaments. 
content.26.27=Every self-respecting vampyre has one of these sets.
content.26.28=Gobbowl is a bit like combat in the arena, but with a ball.
content.26.29=Emote kards allow you to express yourself more... physically.
content.26.30=Zaap kards mean you can use the zaaps you'll find on every island. To use it, right click on a zaap, then double click on the kard representing the destination you'd like to go to.
content.26.31=
content.26.32=Special Kards can be used to accomplish anything in the Outer World, such as creating a clan or more fire works.
