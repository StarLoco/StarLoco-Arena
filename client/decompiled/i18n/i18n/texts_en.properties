content.29.300=Ouch! It looks like one of your fighters has just been injured. That's not good new, and if you don't heal him, he'll be handicapped for the next fights.
content.29.301=And a lot of injuries can lead to death. Well, it's not really for me to interfere. They're your fighters, after all. You do what you like.
content.29.302=Of course, you can choose not to heal him... But you should know that the more tired or injured a fighter is, the greater chance he has of getting injured again.
content.29.303=The other day, I think I heard a coach say he got loads of healing items from a Booster...
content.29.304=Once you've found a resurrection potion, you need to go to the cemetery to get your fighters body. If you don't know where it is, check your map (M key).
content.29.305=For the moment, I'd advise you to send your fighter to the cemetery where he can rest in peace.
content.29.306=Don't worry, all is not lost. You remember the Boosters I told you about? Well, as well as healing items, you'll also find resurrection potions in them.
content.29.307=There you go! I hate to say I told you so... You wouldn't listen though, and now one of your fighters is dead!
content.29.308=Hey! You, there! Yes, you. Stop looking so confused and come and talk to me. What's that? You don't know how to move? It's easy, you can either right click or left click.
