content.29.90=Ouch! Ouch! Ouch!
content.29.91=What's that? And... Who are you?
content.29.92=Rhaaaaaa! This place is completely loitered... how disgusting!
content.29.93=Unless... The Hour Demons have something to do with it! They're roaming around... aren't they?
content.29.94=I see. You don't get it. Let me explain. My name is Adamai. You have been captured by the Hour Demons. You are being teleported towards their world right this minute! Once you get there, you will have to recruit fighters who will fight for you...
content.29.95=If you and your fighters win all the fights, you will be ranked first and be free again!
content.29.96=Or else... well... you're dead!
content.29.97=Watch out! It might shake a little...
content.29.98=There are a couple of things you'll need to know. And you'll have a hard time surviving here if I don't explain them to you.
content.29.99=Like this, for instance...
content.29.100=So, when I say: "by clicking on the swords, you start searching for a fight", you'll click on the swords. And you'll start a fight. How great is this? But don't do it NOW...
content.29.101=You're well-behaved. I like that. Now, click on the shiny thing. Hurry! I've got other fish to fry!
content.29.102=Here is a preset team. You'll soon be able to test it, or start a fight by clicking...
content.29.103=By clicking...??
content.29.104=By clicking on the swords! Well done! I know you're dying to click but don't do it just yet...
content.29.105=What you're going to do now is probably the most important thing in your coach's life: manage your team, and equip your fighters.
content.29.106=Click on the shiny button to create a new team. Name it as you wish and confirm by clicking OK.
content.29.107=Now click on "Recruit a fighter". When you are done selecting its class, and naming it, confirm by clicking OK.
content.29.108=Equip your fighter with a 100-Kama hat. Search for the Dora hat and then double click on it. 
content.29.109=There you go! Now this fighter gets a 15% Air damage bonus. If you don't know what Air damage is, it means that you haven't read the game guide... And that's REALLY BAD!
content.29.110=You can now close this window. Even though there would be a lot of other things to say, I'm going to let you discover them on your own.
content.29.111=By clicking on the swords, you start searching for a fight against another coach. Before you do so, test your team and refine your strategies.
content.29.113=Well, it's time for us to part. I'm off! It smells like demon around here...
content.29.114=Don't forget to take spells for your fighters as well. You equip them just like any other piece of equipment except that you pick them from the list on the right. You'll see... they'll come in handy!
content.29.115=Hey! I told you not to touch that! You'd better start listening to what I say, for your own sake!
content.29.116=Take the tutorial
content.29.117=Hmmmm, you appear to have plenty of potential.\n\nShow me what you're capable of in combat. I might even be able to teach you a few things. Let's see how you get on, and who knows, one day you might get to fight me in the Arena!
content.29.118=<b>You are on an Arena island.</b>\n\nHere, you can manage your coach. They can interact with other players' coaches, objects or NPC (non-player characters).\n\nRight-click to move or left-click an item or player to interact with them. If you'd rather set this up the other way round, you can change the mouse settings in the options menu.
content.29.119=<b>You're in a fight. To get more information about the windows available to you during a fight, speak to Demon III on the Island of Maknala or read the corresponding chapter in the player's manual. You'll find it in the Dofus-Arena installation folder.</b>
content.29.120=<b>This is the ranking window.</b>\n\nThis window shows the ranking of the best Dofus-Arena players.\nAs well as showing you a player's position, the window gives you information about the best team used by that player, like their strength, the number of victories and defeats the player has had with that team etc.
content.29.121=<b>This is the coach statistics window.</b>\n\nIn this window you'll see some useful information like the time you've spent playing Dofus-Arena or the number of victories or defeats of all of your teams.
content.29.122=<b>This is the social window, which allows you to manage your friends list, your "blacklist" or your clan.</b>\n
content.29.123=<b>You are on your coach's inventory window.</b>\n\nDisplayed here is a list of all the coach kards you have in your possession (kards that you've won at the end of a fight and are only used on the coach's' islands).\n\nThe tabs at the top of this window represent the different categories of cards (equipment cards, special cards, teleportation cards etc.).\n\nTo help you locate the cards you're looking for, there are several filters in the form of boxes to tick to the right of the pop-up menu underneath certain windows.
content.29.124=<b>The is the team management window.</b>\n\nAll your teams are listed here.\nThey are sorted by strength (from strongest to weakest) and the strongest team gives your coach their level (if your best team is level 14, your coach will also be level 14).\n\nTo change the composition of a team, you just need to drag a character from your reserve (at the bottom right) and drop it into one of your teams. To remove a player from a team, do the reverse - drag the player from the team and drop it into the reserve.\n\nIf you want to create a new team member, first click on the "create character" button at the bottom right of the window. The new character will appear in your reserve and from there you can send it to your team.\n\nDon't forget that the most important rule when you're creating a team is to never exceed 6,000 budget points.
content.29.125=<b>This is the bug report window.</b>\n\nDescribe your problem and if possible explain how it can be reproduced in the appropriate fields. Then click confirm to send your message straight to the developers. They won't reply to you directly but they will try to fix the problem as soon as possible!
content.29.126=<b>This is the game options window.</b>\n\nHere you can control the different game options, but be careful, the video options can greatly affect the speed of the game or even stop it working at all!
content.29.127=<b>This is the letterbox management window.</b>\n\nThanks to the letterbox, you can send and receive messages to and from another coach (whether they're online or not).\nThis letterbox functions like email, and you can even send coach cards by dragging them to the appropriate boxes when you create a new message.
content.29.128=<b>You are on the create a new message window.</b>\n\nThis window allows you to send a message to a coach (whether they're online or not). To do this, you must enter the name of the coach and click on the validate button next to the name, which will check that the person exists.\n\nThen, all that remains is for you to give your message a title, write it, and click on the send button.\n\nYou can also drag kards into the relevant locations and send them at the same time as your mail.
content.29.129=<b>You are on the KardMaster window. KardMaster is a minor demon. You can exchange kards in your possession for kards in his.</b>\n\nTo do this, select the kard you're interested in from the left window. You can even select multiple cards using the SHIFT key.\n\nOnce you've selected the kard (or kards) that interests you, the amount of Kamas KardMaster wants for it (or them) will be shown underneath the list.\n\nYou'll then need to drag kards from your inventory to KardMaster's exchange area (which you'll find at the bottom of the window on the left) until you've met or exceeded the amount KardMaster asks for (you'll see the total value of the kards you've dragged over appear just above the exchange area, to the left of the "/" symbol.\n\nOnce you've dragged the kards across, click on the "Buy" button, and a window will appear letting you know that the transaction was successful. You'll find your new kards in your inventory.
content.29.130=<b>You are on the Zaap usage window.</b>\n\nZaaps are the means of transport between the different Arena islands. To use a Zaap, you must possess the kard of the destination you wish to travel to.\n\nZaap kards are mainly won when your coach gains levels.
content.29.131=<b>At the bottom right of your screen you'll find the chat window, and through this you'll be able to communicate with other players. </b>\n\nThe chat system has several channels which allow you to chose who you want to talk to. To define which channel you want to talk on, use the corresponding shortcut.\n\nThe most important channels are:\n\nThe "General" channel, which allows you to talk to all players in the vicinity (shortcut: "/s")\nThe clan channel, which allows you to talk to your clan ("/c")\nThe trade channel, which allows you to exchange cards. Everyone on the same island as you has access to it, but you can only send a message once every 30 seconds. ("/t")\nThe private channel, which allows you to speak directly to someone ("/w " followed by a space and the name of the coach of the person you wish to speak to).\n\n\nThe tabs above the chat window allow you to configure which channels you want to be displayed and to switch quickly between configurations.
content.29.132=<b>This is the fighter information window.</b>\n\nThis window contains all the information you need to see the statistics and state of one of your fighters or one of your adversary's fighters.
content.29.133=Pas géré pour le moment. Sait on jamais plus tard. Ne pas traduire
content.29.134=<b>You are on the end of combat window.</b>\n\nThis window shows a summary of the game: who won, how long the game took and what kards the winner received (to receive kards, you must win 2 consecutive matches). You will also see information about the two coaches, such as their level, for example.
content.29.135=<b>This is the start of combat window.</b>\n\nThis window briefly shows you the opposing team and a few statistics about the coach or coaches that you will be facing.
content.29.136=<b>You are in the positioning phase.</b>\n\nDuring this phase you can move your characters to position them on the different start cells available.\n\nTo move a character, click on it (it will appear highlighted) and then click on the cell where you want it to be positioned.\nIf the square is already occupied, the character you have selected is placed there and the character already on the cell moves to where your selected character was.
content.29.137=<b>You are on the kard trading window, allowing you to send and receive kards securely. </b>\n\nIt's quite straightforward, drag the kards you want to give to the coach with whom you're trading into the slots next to the name of your coach.\nWait for the other coach to put their kards up for trade as well, then tick the "ready" box.\n\nIf you've ticked the box and the coach who you're trading with changes the kards he wants to give you, the "ready" box will automatically clear. This is normal, and stops malicious players from withdrawing their kards at the last minute and cheating you out of yours. So, don't worry, you can trade with complete peace of mind!
content.29.138=<b>This is the fighter creation window.</b>\n\nIf you still don't understand how to create a character having followed the tutorial at the start of the game, please read the player's manual that you'll find in your Dofus-Arena installation folder.
content.29.139=<b>This is the fighter modification window.</b>\n\nIf you still don't understand how to modify a fighter having followed the tutorial at the start of the game, please read the player's manual that you'll find in your Dofus-Arena installation folder.
content.29.140=<b>This is the team creation window.</b>\n\nHere you can create a new team. Don't forget to allocate fighters to your team so you can play with it.\nDon't forget that the most important rule when you're creating a team is to never exceed 6,000 budget points.
content.29.141=<b>This is the co-operative mode team creation window.</b>\n\nHere you can create a team with a player who is on your friends list.\n\nDon't forget that the most important rule when you're creating a team is to never exceed 6,000 budget points.
content.29.142=<b>You are in the observation phase.</b>\n\nThis phase allows you to analyze the opposing characters, their equipment and their position.
content.29.143=<b>You are in a challenge.</b>\n\nA challenge is a fight that doesn't count towards any ranking but can help you to better understand the game or improve your skills.\nSome of the challenges are for more experienced players, so don't worry if you don't finish them all straight away.\n\nWhatever the case, you won't lose anything by failing a challenge, and in fact, some of them will reward you with coach kards!
content.29.144=Demon III
content.29.145=SuperBidi's Tofu
content.29.146=Hey, buddy!\n\nWhat are you doing here? You've never heard of the Hell's Tofus, it seems. Should I get the carpenter to make your coffin now or later? 
content.29.147=We've just arrived in the Outer World and, believe me, this is not the most welcoming place I've ever been.
content.29.148=You might run into a few Demons of the Hours round here. If I were you, I'd just do what they tell you. They don't like being argued with.
content.29.149=Ok, I'm going to have to leave you know. I can't stay around here too long.
content.29.150=One last thing, do you prefer using right click or left click to move? (If you ever change your mind, you can always change the settings in the Options menu).
content.29.151=All you need to do is cross the bridge over there on the left, and follow the road. As for me, I'm leaving. It stinks of demons around here.
content.29.152=Hey, adventurer! I can't believe how small you are! Did you forget to grow up or something? Anyway, unless you've been living under a rock for the last few centuries, you'll know who I am. Just in case, though, I'll introduce myself: I am demon III. I'm looking for coaches, real tough ones! Why don't you prove to me you're not a little girl...
content.29.153=If you don't want to stay on this island indefinitely, you're going to have to complete the 3 challenges I'm about to set you. Unless you'd rather be stuck here for the rest of your life, it's up to you...\n\nBut before that, you're going to have to recruit three fighters. No fighters, no challenges, understood? Have you got that through your thick skull?
content.29.154=Hmm, you have too many fighters at your command. You can delete one of your team members by selecting them and clicking on the cross. Come back and see me once you've done that, if you're still looking for someone.
content.29.155=Hey, you! Why are you looking at my hair like that? I'm a fearless and irreproachable warrior! Our motto is: act first, think later! Unless it's act without thinking? I can't remember anymore...
content.29.156=Hi, adventurer! A little birdie tells me you're new here... I'm a Cra, and no-one handles a bow as well as me! You want me to show you? Keep looking at me, and run quickly!
content.29.157=Look, a new guy... How dear! What have you brought me? Nothing?! I'm an Enutrofette and Kamas are my thing! You don't mind if I take a little look in your purse? 
content.29.158=Greetings, adventurer! You look a little lost... Don't worry, you're safe with me. I'm a Feca, a first rate defender! Our motto: Go out covered!
content.29.159=That's strange, I don't remember summoning you... You're new here? I'm an Osamodas, creature summoner and breeder. It's very practical in combat! Or when you need a new pair of fur boots...
content.29.160=Hello, adventurer! I'm a Sram, thief and assassin. Ok, when you put it like that it's not very flattering... But it can be very useful, you know! I'm sure one day, when you've got your eye on some pretty jewel, you'll think of me...
content.29.161=Hey, you! Welcome! I'm a Sacrier, otherwise known as a Berserker. When my enemies hit me, they just increase my strength tenfold! You wouldn't like to throw me a few punches, would you? I'm feeling a little weak today...
content.29.162=Hi, newbie! I'm an Ecaflip, incorrigible gambler. I'm not afraid to go all or nothing! When the game fever takes over, I'm unstoppable... Actually, what would you say to a little game? Friendly, of course...
content.29.163=Welcome, adventurer! I don't recognise your face, you must be new here. I'm an Eniripsa. My speciality's healing through word. If you get any big booboos, you need to come to me! With great Words come great remedies, as they say!
content.29.164=Welcome, newbie! I'm a Sadida. When I'm not developing new potions and ointments, I'm playing with my dolls! Go ahead, laugh. But if you're ever unlucky enough to go cross one, you'll be laughing on the other side of your face...
content.29.165=I bid you welcome, adventurer. I'm a Xelor, I control time. Slow down an enemy? Teleport? Easy! Nowadays, everyone's doing it. It's true, my friend, you need to know how to move with the times!
content.29.166=Alright, hic! Adevent hic! Urer! I'm a Pandawa. Carrying warrior, I draw my strength from the hic! Drink. Onno... 's not good... But if you want hic! To find out a bit more about me, we can go for a pint sometime, hic!
content.29.167=Ok, go and see the class masters, they'll help you. If you want to find them, use your map (M key).\n\nIf you're too lazy to walk there, you can always hire fighters by clicking directly on your team management interface (the button with two swords, F4 Key).
content.29.168=Great, your team passes muster. You're going to be able to try to complete my 3 challenges. Are you ready?
content.29.169=Are you mocking me? And the fighters you were supposed to bring? Did you lose them on the way? I'll give you one last chance, but this time, try not to get distracted! This is not a game, you know!
content.29.170=Pepitoo
content.29.171=Scartrine
content.29.172=Greeny
content.29.173=Ewon
content.29.174=Nosigar
content.29.175=Stalad
content.29.176=Rutger
content.29.177=Lithian
content.29.178=Gus
content.29.179=Zee
content.29.180=Ed Isace
content.29.181=Guitel
content.29.182=As you can see, your interface is looking rather empty.
content.29.183=Ok, you look a little slow, so I'll explain. The little rectangle in the bottom right is the Chat. You can use it to communicate with other idiots, like yourself. It also has a few other uses, but you'll find out about those later. Well, if you live long enough.
content.29.184=This is the team management interface. Go ahead, click on it.
content.29.185=At the moment, your team is as empty as a Iop's head, obviously!
content.29.186=Now, let's go and visit the Class Masters! They'll let you recruit your first 3 fighters.
content.29.187=To find them, we should head north-west. If you get lost, you can always check your map, here.
content.29.188=What are you waiting for?! Get a move on! You should have already left! If you need me, click on me.
content.29.189=What?! What's this stupid achievement thing?
content.29.190=Grrr! Ok, so this icon represents the achievements you've accomplished in game. It will appear quite regularly as you're starting off in the Outer World.
content.29.191=Come one, let's not waste time! You fighters are waiting for you up north!
content.29.192=Now it's time for me to tell you where we are. It's a bit chaotic, don't you think?
content.29.193=The Demons of the Hours, our masters, built the Outer World. They took bits of land here and there from the World of Twelve. That's why the place looks like a big building site!
content.29.194=But now I think about it, you still haven't recruited any fighters! Come on, let's get a move on. Now's not the time to stand around chatting!
content.29.195=Demon III?! Here?! You're in luck! Click on him to talk to him.
content.29.196=Demon III visits the island from time to time. He sets tests for coaches like you. If you pass, you will gain access to the Totem Arena, where the qualification stage for the great tournaments takes place.
content.29.197=What would you say to playing for a little while? You could have a go at completing the 3 challenges!
content.29.198=Aaaah! Finally! Here are the Class Masters!
content.29.199=Each one of them will explain the characteristics of their own class.
content.29.200=Well done! You're not doing too badly for a beginner! Here's a little tip that could be useful: when you hit an enemy from the side, you'll do 20% more damage. If you hit an enemy in the back, you'll do 40% more damage. Always good to know!
content.29.201=If you can complete this new challenge, I'll tell you about experience.
content.29.202=Clearly, you have potential! Just goes to show, you shouldn't judge a book by its cover! Ha ha!
content.29.203=Over the course of the fights, the members of your team will grow stronger and gain experience.
content.29.204=Close your end of combat window and open your team management interface. I'll show you how to use your experience points.
content.29.205=Perfect! Now, click on the "Kanodo" button, which is here.
content.29.206=Very good! Your Kanodo shows your fighter's evolution. As you can see, your character is still at the departure point of your Kanodo.
content.29.207=The majority of the spheres you'll find on your Kanodo will give you bonuses. To get them, you have to land on these spheres.
content.29.208=If you want to know which bonus you'll get, hover your mouse over it. Try with the first Kanodo sphere. Then, if you want to select a sphere, you have to click on it. Since you're just starting out, I'll do it for you.
content.29.209=As you can see, a "buy" button has appeared in the lower right, just above the XP cost of the sphere.
content.29.210=Since you have 3 XP and the next sphere only costs 2 XP, you can buy this sphere. All you have to do is click on the "buy" button!
content.29.211=Perfect! Your fighter will now benefit from this bonus. Once you have enough XP, you will be able to buy the next sphere and so on. The further along the Kanodo you go, the more powerful the bonuses will become. It's self-explanatory really!
content.29.212=Now let's move on to demon III's final challenge. Don't forget that each fighter has his own Kanodo, so you have to make the most of their experience individually.
content.29.213=Well done! You really taught that Crackler a lesson! You turned him into dust!
content.29.214=Did you see that?! Demon III has recognised your power. He's given you access to new interface options! You're going to be able to recruit up to 4 fighters without having to go to see the class masters, just by clicking on the team management interface.
content.29.215=You'll have time to look into these options more later. The only thing you need to know for the moment, is that you can consult your achievements and your Kard grimoire whenever you like.
content.29.216=Ah yes, the grimoire... It's simply the place where all the kards you've won, bought or exchanged are kept.
content.29.217=These kards will, for example, allow you to dress yourself. Which can be really useful! Ha ha ha! You can judge a coach by what he wears, and the best of them slip on legendary sets. What's more, the sets give them bonuses.
content.29.218=But we'll find out more about that later. Right now, let's get out of here and get to that Zaap!
content.29.219=Here we are! Now, click on the Zaap.
content.29.220=As you can see, when you click on the Zaap, your grimoire opens to the Zaap Kards page. If you want to go to see demon I, choose the category 'Zaaps to the first islands", then double click on the "Demon I Lair" kard. Go on, let loose! Click!
content.29.221=Nice decoration round here, don't you think?
content.29.222=Now that's what you call being lucky! We landed at the right place, at the right time! Demon I's just a bit further on. He's the one who's in charge of registrations to the great tournament.
content.29.223=Come on, don't be shy! Run over there and sign up!
content.29.224=Here we are. I'd like to introduce you to the Demon of the 58th Minute. Careful, he's a very good summoner and he hits quite hard, too.  If you want to get out of this combat safe and sound, you're going to have to use the bonus cases in the arena.
content.29.225=If a fighter starts their turn on a bonus cell, he will benefit from its effects. It might give them AP, resistance or many other things.
content.29.226=When used properly, resistance bonus cells can lead you to victory!
content.29.227=Hey, look! There's that nasty little demon of the 52nd minute! He's not very powerful, but his arena is full of trap cells. Be careful!
content.29.228=Penalty cases are activated at the start of each turn. A death cell will kill the fighter instantly, which a trap cell will injure him.
content.29.229=The Demon of the 52nd Minute's speciality is to use attraction spells to draw fighters to his traps. Watch out!
content.29.230=One last thing. Stabilisation spells should prevent you from being drawn to a penalty case. Bear that in mind!
content.29.231=Him, he's the Demon of the 46th Minute. We call him "sniper". To defeat him, you have to move closer to him, protecting yourself with obstacles, and pay close attention to your event kards!
content.29.232=Your event kards appear in the top right of your screen. The first one is the one that's active during the turn in progress. It will give bonuses or penalties to all fighters present in the arena.
content.29.233=The two other event kards will be activated during the next turn. The secret of a good coach is to always keep an eye on the kards so they can better prepare their strategy!
content.29.234=For this challenge, you should find the event kards beneficial. Don't forget to hide when the Demon of the 46th Minute's kards appear!
content.29.235=This is the Demon of the 25th Minute. He's more interested in playing rough than playing nice.
content.29.236=To beat him, you'll need to use your action Kards. These are special spells that can only be used once per game. Any of your fighters can cast them.
content.29.237=I'm not going to lie to you, in the next combat, the first turn will win or lose you the battle. Your victory will depend on getting your action Kards in the right order.
content.29.238=It's time to get down to business... Now, you're going to put everything you've learned into use!
content.29.239=One last tip: try to spot the target you want to attack first. Here we go! Good luck!
content.29.240=Congratulations! I'm impressed!
content.29.241=Now you're finally ready to go head to head with the other coaches. But, before you do, you have to validate your registration with Demon I.
content.29.242=Ok, playtime's over! Now, you need an opponent who can help you build up a reputation. To do this, open your team management interface.
content.29.243=Each time you want to find a great tournament match, all you have to do is click on this button, wherever you are. Make sure you explore the other islands, there are some incredible places to visit!
content.29.244=The great tournament can increase your popularity. Win as many matches as you can and become the most popular coach in the great tournament!
content.29.245=To see the ranking for the best coaches of the season, click on the button.
content.29.246=If you want your name to appear in the rankings, you need to finish amongst the 2000 best coaches. The coach button will show you your exact ranking.
content.29.247=Don't forget that your fighters aren't immortal. They're going to need a lot of attention!
content.29.248=Sometimes you'll need to let them rest on the sub bench to make sure they don't get too tired, or even injured.
content.29.249=You should also think about keeping their spirits up. Make sure they don't lose too many matches and aren't KO too often. Don't put them on the sub bench and forget about them either!
content.29.250=We'll talk about it again later. Now it's time for you to go and explore the other islands. When you feel ready, you can launch a fight in the great tournament.
content.29.251=So, you want to try your luck at the great tournament then? You've arrived at a good moment. We've had quite a few losers recently... A bit of new blood would be most welcome!
content.29.252=To validate your registration, you have to pass the qualification stage. The public don't like wasting their time with beginners. 
content.29.253=If you manage to beat the five other demons on the island, you will leave with a pass to access the great tournament!
content.29.254=I've heard you've already beaten the other five Demons of the Minutes. Well done! Gimme five! Oh, you already have! Ha ha ha!
content.29.255=Hmm... ok. You've proved yourself worthy of the great tournament. I'll let you in right away! Take these Zaap cards. You can use them to travel to the other islands.
content.29.256=Magnificent! You survived! You're not as big a Mumussel as you look... Oh, come on! I was kidding!
content.29.257=You look worried... Feeling a bit queasy, perhaps? Don't worry, you're not the first. Some of them even lived to tell the tale!
content.29.258=Hmm... ok. If you want to win back your freedom, you're going to have to show strength and courage!
content.29.259=I think the two of us are going to have a lot of fun together! I'm going to help you take your first steps into the arena. I can't wait to see how you do!
