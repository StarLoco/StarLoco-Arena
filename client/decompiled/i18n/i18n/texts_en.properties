content.4.3=This arrow will just find and hit the most chubby parts of your enemies.
content.4.4=Okay, so you're gonna give your mortal foe a good thrashing. But have you got the wood for a coffin or will you leave the poor guy's family suffer even more?
content.4.5=Just like the truth, the Sword of Fate hurts. And just like the truth, it should be saved for when really necessary.
content.4.6=There's nothing like a bit of hopping to get yourself out of a tight spot or to launch a deadly attack.
content.4.7=Vitality is about fieriness and vigor, others say it's all in the wrist. Bah! Who knows!
content.4.8=You and your allies are taking advantage of the Iops' legendary bravery!
content.4.9=As the god Iop used to say, 'What doesn't kill you, or remove more than two limbs, can only make used thong hair '. Something like that anyway.
content.4.10=Victory often hangs by a thread... or a coin. Defeat hangs in much the same way. Have a go!
content.4.11="Cunning as a cat" is a very common expression, especially among Ecaflips.
content.4.12=The Great Ecaflip prophet used to start his prayers like this, "Oh Ecaflip disciples, you who jump like a pretty Mush Mush..." The prophet was exposed as an alcoholic many years later.
content.4.13=All or Nothing, the name says it all. You have been warned.
content.4.14=Very handy for seasoning your salads, the spell of the same name is also very effective in increasing luck.
content.4.15=Here is a typically Ecaflipician spell. It was created by the magus Skouh'Moun', nicknamed "bringer of bad luck".
content.4.16=This arrow is magic. It's been enchanted by Dardondakal, the white dragon. It's also very sharp. 
content.4.17=Old and young alike will be giggling with joy when they get their hands on the The Frozen Arrow. Make sure you don't lick it though, it's not a popsicle.
content.4.18=Ideal for barbecues in summer and for cold evenings in winter, this will leave a burning impression in your opponents' memory.
content.4.19=With the spell Bat's Eye, your enemies will be blind in the blink of an eye. It's like watching headless chickens run about. Even better, headless chickens who've tried to kill you.
content.4.20=The goddess Cra gave Eagle Eye to her disciples. "Longer shall be the range of your shots" she said. How true!
content.4.21=This spell relieves you from pain.
content.4.22=Alright! A vitality cure for one of your allies, this one's on you!
content.4.23=A spell that will boost your allies so much they'll probably start hacking themselves to pieces.
content.4.24=A beautiful devotional gesture that we'd like to see a bit more often.
content.4.25=After a good group therapy session, your allies are feeling much better!
content.4.26=Assault is a feared spell on battlefields, especially in its advanced form, "Assault and Pepper".
content.4.27=This spell will attract your enemies like Trool dung attracts Moskitos. It's not exactly glorious but it works!
content.4.28=Sacriers hate to see anyone take a hit for them. This spell will help you solve that problem.
content.4.29=Bloodthirsty Madness will put an end to the scurge of small bonus drops, which are bound to happen in long battles.
content.4.30="The impact of your blow, this spell will increase. Bad news for your enemy that sure is." Enough poetry. Now is time for some fury.
content.4.31=Have you ever been attacked by a fierce cloud? The idea's pretty funny, right? Well, challenge a Feca, and you'll only laugh once.
content.4.32=There is nothing like a good suit of armor to make a formidable enemy look pathetic.
content.4.33=There is nothing like a good suit of armor to make the attacks of your fiercest enemies seem pathetic.
content.4.34=This spell will protect you and your allies from the small inconveniences of a warrior's life: scratches, scars, gashes etc.
content.4.35=With this spell, your opponents will feel so sluggish that you'll be doing them a favor by exterminating them. They'd be a burden on their family otherwise. They're better off dead.
content.4.36=This spell will protect you from some of the main inconveniences of a warrior's life - disembowelment, shattered bones, broken nails etc.
content.4.37=All of a sudden, your enemies feel clumsy... too awkward and bumbling even to cuddle. Don't even think about fighting!
content.4.38=When an Enutrof starts flicking coins, you'd better watch out. It's not normal and there's usually something behind it.
content.4.39=Ideal both for charging your enemies and beating a hasty retreat. Enutrofs tend to overuse this spell.
content.4.40=If this spell could take off an Enutrofette's panties, it would be absolutely perfect.
content.4.41=This spell is very useful for getting rid of any unwelcome visitors who pollute the garden or the battlefields.
content.4.42=All of a sudden, your enemies become as sluggish as jellies. Stop laughing and finish them off.
content.4.43=In the arsenal that god Xelor granted his disciples, there was a weapon that wasn't inspired by clocks but by the Prespic. Shake hands with it at your peril.
content.4.44=The very first Xelor Clockwork was provided with a paddle wheel. Big mistake. They didn't consider the fact that a paddle wheel needs water to turn. Then Xelor made a spell to solve the problem.
content.4.45=For Xelors, teleportation is as easy as ABC. Delivering a hammer blow on the head of their enemies is easier still.
content.4.46=No one is more altruistic than a Xelor in the heat of battle. They're always happy to stand back and let the others fight it out.
content.4.47=It is said that Xelor disciples cover their bodies with bandages to disfigure their enemies more easily.
content.4.48=All of a sudden, both your friends and your enemies like you.
content.4.49="War is terrible. Your teeth will suffer big damage." Enutrof Proverb.
content.4.50=Like unruly children, your enemies must be taught a lesson.
content.4.51="A ummoned Tofu i ure to make great laughter around you". This proverb misled many enemies due to the missing 's'. Can you imagine what it feels like to die because of a spelling mistake? 
content.4.55="He who likes animals, likes people". In your case, neither is true, which explains the beautiful fur coat that you killed your neighbour for.
content.4.57=Osamodas disciples, keep your cracking whip for your summoned creatures. That's more than they deserve.
content.4.61=You wouldn't believe what great projectiles crows make. In fact, they make such great projectiles, you have to wonder if they were ever meant to be birds at all...
content.4.63=There's nothing underhanded in repelling an enemy to avoid getting up close...
content.4.65=The age-old trick of throwing a stone to create a diversion. What's more, it works.
content.4.67=Is it the horrifying expression of the Sram warrior that makes the enemy take a few steps back? The bad breath? Smelly feet? Who knows...
content.4.69=Being schizophrenic has its good points.
content.4.71=Did you know? There's a little vampiric side to Srams. This won't improve their reputation.
content.4.73=It would be polite to show your victim the following advisory notice before using this spell.\n"Warning: This attack may cause the following side-effects: Death. If symptoms persist, please consult your local undertaker."
content.4.75=Thorny and offensive, this prickly spell is just the way it should be.
content.4.79=Happy is the Sadida who summons dolls! It's better than nothing, isn't it?
content.4.83=When a Sadida casts "Earthquake" on a horde of enemies, they all shake so much that they unwillingly beat each other up before finally kicking the bucket.
content.4.85=You've never played at dolls before, but don't you wish you had? The time is right to make up for your wasted youth.
content.4.104=Tofus are real Casanovas! Their kisses are so intense that they'll make your heart burst for real.
content.4.105=You must know that when a Gobball's hungry, it will bite into just about anything! And they love Bow Meows...
content.4.106=Prespics are nothing but low-down, jibe lovin' people pickers!
content.4.107=This doll is happiest when at its most annoying, and its piercing shriek has burst more than a few eardrums!
content.4.109=This doll was crafted from canvas. That's what makes it look so peculiar.
content.4.110=Much like the renowned Dime bar, divine snack of the gods, this gobball is soft on the outside and crunchy on the inside. Unlike a Dime bar, it doesn't taste like caramel.
content.4.111=The summoned Prespic is mischievous. Like the probes of the legendary FOUs, it sticks its thorns in the most unexpected places...
content.4.112=Her enemies say she's a millstone round their neck. And so do her friends.
content.4.117=One thing is sure, you do know how to take care of your troops. Just don't start thinking you're some kind of god though.
content.4.126=Be careful. Just because a Pandawa lifts you up on its shoulders, doesn't mean you've to drool like a baby.
content.4.127=Throw your enemy... yeah, throw the dirty rogue. It does involve getting up close and personal, which is never nice, but it's well worth it.
content.4.128=When a Pandawa pops open an Explosive Flask, the other team should run for cover!
content.4.129="It's raining Pandawas... Alleluia" Ah yes, a famous incantation that makes Pandawas rain down upon you! How fantastic on carnival day!
content.4.130=With this spell, you'll be as steady as a rock, deep-rooted, nailed to the ground... nothing more, nothing less.
content.4.131=With a few good swigs of fermented drink, you can be sure that sooner or later a Pandawa will unleash their feared alcoholic breath. This is their idea of heaven.
content.4.132=Not only can Pandawas carry their allies, they can also carry their enemies. The difference is, they tell their allies when they're going to drop them.
content.4.133=Regeneration is a typically Eniripsical spell. Besides, the effects of this magic are lasting... it'll drive your enemies crazy.
