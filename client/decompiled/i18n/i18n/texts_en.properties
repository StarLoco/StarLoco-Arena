content.42.1=Take part in the glorious Dofus Arena league tournaments!\n\nThe Dofus Arena league tournaments are the most talked about tournaments in the Outer World and, therefore, are the ones where you can win the most tournament points!\n\nThese tournaments use the classic 1vs1 rules. You'll win more and more tournament points for each victory during the tournament. Win 4 tournament matches in a row and you'll get maximum points: 12.\n\nIf you're eliminated, on the other hand, you will automatically leave the tournament (with the points you've already won, of course).\n\nThe tournament takes place at the following times:\n\n1:30-1:45 GMT+1 (French time)\n12:30-12:45 GMT+1 (French time)\n18:30-18:45 GMT+1 (French time)\n20:30-20:45 GMT + 1 (French time)\n\nTo start a fight in a tournament, you simply have to click on the invitation kard which appears in the bottom left of your screen during these times and this should allow you to search for a suitable opponent.  
content.42.4=Demon III Tournament\n<b>Take part in this demon III style duel</b>\n\n<b>The winner of the tournament gets 10 points and the other participants will only get 1 point each.</b> And, yes, that is demon III's most important rule.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.5=<b>Your fighters need to be united like IX and XXI to hope to win this tournament</b>\n\nFor each victory during the tournament, you will win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.6=<b>Would you like to reach the power of midnight that plays with the avatars of god? This tournament is right up your street!</b>\n\nFor each victory during the tournament, you'll win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.7=<b>Tonight, it's kick your teeth out night!</b>\n\nQuick tournaments are identical to classic Arena tournaments is almost every way. The only difference is that instead of being played out during short activation periods over the course of the week, they're played out in just one evening!\n\nFor each victory during the tournament, you'll win tournament points.\n\n<b>Win 4 matches in a row in a tournament and you'll get maximum points: 12</b>\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.8=<b>Do you love creating original teams? Come and test your skills in the Enutrof tournament.</b>\n\nFor each victory during the tournament, you will win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.9=<b>In contrast to the Enutrof tournament, the Tournament of Riches gives you the chance to create teams with a much bigger budget than usual.</b>\n\nFor each victory during the tournament, you will win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.10=<b>This tournament is made for Ecaflips, or not.</b>\n\nFor each victory during the tournament, you will win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.11=Cheated Tournament
content.42.12=Note from MBigotte : Do not modify without my permission.\n\nThis tournament definition is ONLY used for tests with the right default settings.
content.42.13=<b>Tournoi de test pour Poch </b>\n\nOn est pas là pour le blabla, mais bien pour casser des bras !\n\nA chaque victoire pendant le tournoi, vous gagnerez deux points de tournoi.\nSi vous êtes éliminé par contre, vous quittez automatiquement le tournoi (avec les points que vous avez déjà empochés bien sûr).\n\nPour lancer un match dans un tournoi, il vous faut simplement cliquer sur la kard invitation qui apparaît en bas à gauche de votre écran à ces heures là et vous permet de chercher un adversaire adéquat.
content.42.14=<b>A tournament for those who can't wait, or just don't want to!</b>\n\nFor each victory during the tournament, you will win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.15=<b>Tonight's the night we get out the big guns!</b>\n\nEvolution Tournaments are very similar to evolution mode, except they're not limited by leagues. Show the world how superior your fighters are to theirs, and how much better you're capable of training them.\n\nFor each tournament victory, you will win tournament points. <b>Win 4 matches in a row in the tournament and you'll get the maximum number of points: 12</b>. If you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.16=<b>A tournament for those who like to die quickly and often</b>\n\nWhy wait 15 turns before the teams even meet each other? Sudden Death, that's living for the moment. Good luck!\n\nFor each victory during the tournament, you will win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.17=Note de MBigotte : Ne pas modifier sans mon accord.\n\nCette définition de tournoi est utilisée UNIQUEMENT pour des tests avec de bons paramètres par défaut.\n
content.42.18=<b>On dark days such as this, the dead come back to life and decide to join in the party. The fighters in your cemetery who think eternity's taking forever will be only too happy to take part in this tournament!</b>\n\nThis exceptional tournament will grant you prizes so good that the dead would rise to get them, given that as well as 100 tournament coins, the winner will get the Red Piwi headset!</b>\n\nFor each victory during the tournament, you will win two tournament points.\nIf you are eliminated, however, you will automatically leave the tournament (with the points you have already earned, of course).\n\nTo start a match during the tournament, simply click on the invitation kard which will appear to the bottom left of your screen during this time and you will be able to search for a suitable opponent.
content.42.19=Do you have what it takes to become the MASTERCOACH?\n\nConfront the Elite Coaches in direct elimination tournaments.\nFight for your honour, for survival... and win simply the best rewards!\nAccess is limited to those who have a MasterCoach Ticket, which is obtainable from MasterCoach Boosters.
