summary=Summary
summonDescription1=The Gobball will head to the nearest opponent and then attack them with the Gobball Bite spell. If several opponents are at the same distance from him, the Gobball will choose the one with the least HP.
summonDescription2=The prespic is the kind of summons that really gets on the enemy's nerves. It doesn't do much damage, but its potential to make a nuisance of itself should not be underestimated. Each round, it will attack the nearest opponent with a spell that not only takes away one of their action points, but also inflicts light damages.
summonDescription3=The Tofu is a particularly nimble and harmful summons. Each turn, he'll head for the nearest enemy and, in case of equidistance, the one with the least HP. Next, he attacks them with his spell. It's important to note, that if you cast a Motivating Sting on a tofu, he'll attack three times instead of once.
summonDescription4=The Madoll is a summons which annoys the enemy. During each turn, it heads to the nearest enemy and subtracts one of its action points with its spell. In critical cases, it can also remove a movement point. Also, with two extra action points it can cast its spell twice.
summonDescription40=The Sram Dopple is a summons that can cause big problems for the opponent because it bears the same name as your Sram and it can be quite difficult to tell the two apart. However, the Dopple's behaviour is more simplistic and, at the start of each turn, he heads towards the closest opponent or, if two opponents are equidistant from him, the one with the fewest health points.
summonDescription5=The Block heads towards the nearest enemy and sticks with him. It doesn't do anything else, but is very good at blocking and has a lot of health points, which make it particularly problematic for those fighters who rely on mobility.
summonDescription6=Trees are used as passive obstacles. They don't do anything and can't be moved. They do, however, have a lot of Health Points and block the line of vision. So they can effectively protect any fighters hiding behind them.
summonDescription7=The dial is a passive obstacle. The only thing it's going to do is launch its Mirwar spell which sends all sorts of damages towards its caster. If you want to kill a dial, you're going to need to use your fists, or a weapon. It may be useful to know that spells such as poison and any growth damages work on him, and, in the same manner, if he's unenchanted, he'll lose his protection until he recasts Mirwar.
summonDescription8= The Sacrificial Doll is one of the most feared summons. Once it has been summoned, it will direct itself to the closest opponent who, in the case of equidistance, has the fewest health points. Then, it explodes causing significant damage. Of course, once the Sacrificial Doll has blown itself up, it is destroyed.
summonDescription9=The Crackler is a particularly powerful summons. At the start of each turn, it will head to the nearest opponent and, in the case of equidistance, the one with fewest health points. Then, it will carry out two powerful attacks which will each subtract one movement point from the target.
