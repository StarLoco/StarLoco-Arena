help.cardValue=Cost in Kamas
helpConsumable=Use of consumables\nTo use your consumables, left click on the kard, then on the fighter of you'd like to use it for.
help.cooldown=Recasting Time (global recasting time)\n\nThis is the number of turns you have to wait before you can recast the spell. If the figure appears in brackets, this means it's a global recast time, so none of your characters will be able to recast the spell during this time. Your adversary, however, will be able to use it.
help.criticalHit=Percentage of critical hits\n\nChance, in percentage, of dealing a critical hit each time the fight launches a spell or carries out an attack.
help.damageRebound=Damage Reflection\n\nIt's the percentage of damages which will be reflected back on the attacker each time this character is injured.
help.dmg=<b>Damage bonus</b>\n\n\n\nBoosts damage rate on elemental attacks (earth, win... I mean air, fire and water)
help.dodge=Evade\n\nEach time your fighter tries to leave a physical fight against an adversary, the latter can try to block him, causing him to lose a turn. Your evade chances indicate your chances of not being blocked as a percentage. If you have 100% in evade, you're guaranteed to be able to dodge a character who has 0% blocking chance, but your chances of escaping fall against an adversary with more blocking. All characters start off with 100% in evade.
help.earth=Earth damage bonus\n\nThis is the percentage of additional damage on any earth element attacks, represented by a brown icon.
help.earthRes=Earth damage resistance\n\nRepresents the percentage of your resistance to earth damage. Earth element attacks, represented by  a brown icon, will be decreased by this percentage of damage. Take note, having 100% resistance does not guarantee you immunity from this element, since the damage bonus of you adversary will be subtracted from your resistance.
help.fighterActionPoints=Action Points\n\nAt the beginning of each turn, your fighter will have this many action points. During his turn, he will be able to use them to cast spells or launch physical attacks. The more points a character has, the more they will be able to do, per turn. Fighters normally have six action points.
help.fighterRange=Range Bonus\n\nThis is the number of cells that should be added to the range of any spells your character launches. Be aware that hand to hand combat spells aren't affected by range bonuses or penalties.
help.fighterValue=Cost to character\n\nThis is the cost, in Kamas, to your character. A standard teams costs 6000 kamas and can contain 1-6 members.
help.fire=Fire damage bonus\n\nThis is the percentage of additional damage on any fire element attacks, represented by a red icon.
help.fireRes=Fire damage resistance\n\nRepresents the percentage of your resistance to fire damage. Fire element attacks, represented by  a red icon, will be decreased by this percentage of damage. Take note, having 100% resistance does not guarantee you immunity from this element, since the damage bonus of you adversary will be subtracted from your resistance.
help.firework=Thanks to the Fairywork launcher, you can put on the most spectacular pyrotechnic displays in the Outer World! Place your fairy kards in the order you'd like to launch them and specify the time between launches below.
help.healBonus=Heal Bonus\n\nThis the percentage of bonus which will be applied to all the heals cast by your character.
help.healthPoints=<b>Amount of HP</b>\n\nIf a fighter has 0 HP, he dies. If all your fighters are dead, you lose the fight. A fighter normally has between 60 and 100 Health Points.
help.initiativePoints=Initiative Points\n\nDuring a fight, fighters will act in reverse order of initiative and will stay in that order unless two of them have the same initiative, in which case, they will be chosen randomly. Normally, you can have initiative between 0 and 100.
help.movePoints=Amount of Movement Points\n\nDuring each of your fighter's turns, he will be able to move this many cells. Fighters normally have three movement points.
help.nbSummons=<b>Summons number</b>\n\n\n\nIndicates the amount of summons your fighter can control during a fight.
help.openClose=tutorials
help.res=<b>Damage resist</b>\n\n\n\nIndicates in percent your resistance to elementary damage (air, fire, earth and water). Elemental attacks will be deduced from that number. Careful, 100% resist doesn't mean you're fully immune to damage.
help.summonCC=<b>Summons: critical hits</b>\n\n\n\nYour fighter's summons will get a bonus on criticals. Increasing their chances of critical when hitting or using a spell.
help.summonDmg=<b>Summons: damage</b>\n\n\n\nYour fighter's summons will get a damage resist bonus.
help.summonHp=<b>Summons: HP</b>\n\n\n\n\n\nYour fighter's summons will get an HP bonus.
help.summonRes=<b>Summons: resist</b>\n\n\n\nDamage resist bonus.
help.summonTackle=<b>Summons: tackle</b>
help.tackle=<b>Blocking</b>\n\nEach time an adversary tries to leave hand to hand combat, your fighter will attempt to stop him by blocking him. In such cases, he will have to test his evasion skills against your blocking skills. This characteristic indicates your chance of blocking an adversary who has 100% evade. Many fighters have 0% in blocking, and will never block an adversary.
help.target=Target\n\nFree means you can cast the spell wherever you like. Empty means you have to cast the spell on an empty cell. Allied means it's a spell that only affects your allies. Me means the spell can only be cast on that fighter. Summon means it's a spell that has to be cast on a summons.
help.water=Water damage bonus\n\nThis is the percentage of additional damage on any water element attacks, represented by a blue icon.
help.waterRes=Water damage resistance\n\nRepresents the percentage of your resistance to water damage. Water element attacks, represented by  a blue icon, will be decreased by this percentage of damage. Take note, having 100% resistance does not guarantee you immunity from this element, since the damage bonus of you adversary will be subtracted from your resistance.
help.wind=Wind damage bonus\n\nThis is the percentage of additional damage on any air element attacks, represented by a green icon.
help.windRes=Wind damage resistance\n\nRepresents the percentage of your resistance to airdamage. Air element attacks, represented by  a green icon, will be decreased by this percentage of damage. Take note, having 100% resistance does not guarantee you immunity from this element, since the damage bonus of you adversary will be subtracted from your resistance.
