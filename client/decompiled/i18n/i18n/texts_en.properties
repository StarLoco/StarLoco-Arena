content.2.1=This sword was blessed by the tears of Raziel, the angel. Satisfied with it, he shouted: 'Beware of Raziel, he will crush your peepee brain!' How eloquent!
content.2.2="An exceptional blade for thrill-seeking adventurers." This is what you can read on the user's manual of this sword. Manuals are definitely no longer what they used to be.
content.2.3=This sword has been soaked in the tears of a young Boowolf. Many warriors believe it will bring them luck and give them courage on the battlefield. They're so naive...
content.2.4=As it soaked for many years in Dragon Pig blood, the Goultard sword gives off a strange smell. Dragonic dung? Porcine urine?  It's hard to tell.
content.2.5=Sharp and infernal. Two words the monster who forged these blades used to describe the weapons. He says he based them on his mother in law. What does that mean?
content.2.6=You may wonder what a Royal Gobball would want with a sword. A shave in the morning? Maybe. That would explain why it smells of wet hair...
content.2.7=Dreadfully sharp and incredibly classy, this blade will make your Crow friends jealous.
content.2.8=You think you're handsome, skilled, clever and strong enough to handle this sword? Perfect: now, you'll need some luck too so you can swap it for a real blade.
content.2.9=This sword belonged to the famous Badoul, a brave warrior who one day went off his rocker in mid fight. Let me tell you he was not happy about going mad.
content.2.10=The Kalamitass is a very peculiar weapon. Even if it doesn't frighten your enemies, be sure that it will impress the pants off them and shock them to bits.
content.2.11=This ice-breaking sword will give you the gift of charm. And if things don't go as planned with your loved one, it makes breaking up a lot smoother too... 
content.2.12=One of your options is to use this blade as a fan, by waving it into the air. It's also an excellent technique to decimate Moskitos or disfigure your friends.
content.2.14=Built according to an excellent technique, the Crocleuse daggers will instantly make an outstanding warrior out of you.
content.2.15=The Bashers are dreadful assassin's daggers. If your victim catches even a glimpse of its blade, he will begin to sob uncontrollably.
content.2.16=The Blessdags come from the famous Dark Hand Ogre who died fighting a Bimd Oul knight... or cutting a Bwork sausage, nobody really knows.
content.2.17=Chakra Style is a pair of daggers that once belonged to a famous thief of Amakna. She even managed to rob herself in her sleep. That's how good she was!
content.2.18=These daggers allow you to steal anything from everyone and, above all, everything from anyone, or vice versa... nobody remembers the story precisely.
content.2.19=These daggers are particularly suited to cutting roots and young shoots. You can imagine how relieved the plants were when people started turning them on their neighbors instead.
content.2.20="Bigger than Jick Nagger, I'll catch your ma and bag her. Like a ton a bricks, a pile of stick and two sharpened Elorie Daggers!" This is how Elorie used to speak. They say everyone in her home town, Chompton, speaks the same...
content.2.21=Those daggers were designed to mince anything that rhymes with scrawls - dolls, walls, town halls or Boowolf... testicalls. 
content.2.22=We owe these daggers to a craftsman named Daguiero. This was his last creation worthy of interest. A good way of ending his career...
content.2.23=Those daggers were forged by the elder of the Hishantes family. Rebel to the family tradition, she refused to become a confectioner and followed her dream of becoming a forger.
content.2.24=These daggers once belonged to a famous but absent-minded king. He used to put on his boots, crown and pants in the wrong order. This makes you wonder about whether you want to touch these daggers at all.
content.2.25="Christ, my dug they guts out as... !" Cried Ezil while Dark Vlad was knocking him off. "Christen my daggers Regattas!" That's what his friends thought they heard. His last will was respected.
content.2.28=The String has thrilled many monsters' hearts. It is a fine weapon, able to point an arrow towards the most hidden spots.
content.2.29=The man who created this bow, a Marc Hidsad, never really learnt how to use it properly. He usually injured himself more than his opponents.
content.2.30=The Heartbreaking bow belonged to Bollbreak the archer. Tired of being a mediocre archer, he followed a particular piece of his master's advice and started to aim above the belt, at last.
content.2.31=Tendo the archer kept praising the benefits of a drink called Nwazis: "What are you drinking Tendo Tell Me? Nwazis is good is good!" This bow owes its name to these legendary events.
content.2.32=Fishermen used this bow to clean the vermin off the coastlines of Amakna... The cowards usually committed the pesticide from the windows of the local bars.
content.2.33=With the Penetrator, you'll shoot arrows likely to get into the narrowest orifices such as a nostril, an ear, a...
content.2.34=The Ultimo bow shoots ultimate arrows. How do you recognize ultimate arrows? That's easy: they pierce a hole right through your kilt as soon as you pronounce the word 'ultimate' three times.
content.2.35=This bow is a messed up crossbreed of a Trunknid and a Treechnid. It's obviously a failure for a Lumberjack, but a true success for a Bow Carver. 
content.2.36=You are perfectly entitled to wonder why this bow has such a stupid name.
content.2.37=This bow used to shoot arrows full of love and sensual delight. One day, the angel who owned it, aimed at a beautiful Feca and hit a Minotoror. That was the end of the fun and games for good.
content.2.38=This bow has a fishing rod attached... for all your hunting needs!
content.2.39=This limber piece of timber comes from Limbo. You can do everything with the wand: dance the limbo, carry out low-cost limbosuctions, and, of course... cast spells.
content.2.40=The origin of the word 'Celestine' is vague. If the root 'Celestial' is well-known, the suffix 'ine' is a puzzle: divine? latrine? swine? Anyway, it's made of pine.
content.2.41=This modest wand became a fearsome weapon after Xavier the Baker left it in his oven for 234 years while he was on his rounds in year 123.
content.2.42=This wand was carved in Huvr wood, which explains the origin of its name.
content.2.43=According to the tag, this wand has the power to make people obey whoever is holding it. The instructions say you have to shake it rapidly near your adversary. If it doesn't work, try and poke them in the eye with it.
content.2.44=This wand is red-hot to the touch. But the most confusing thing about it is its ash smell which would remind you of a forest fire in full swing.
content.2.45=This wand is composed of soft materials, making it very tricky to use. However, once produced in combat by an experienced warrior, it reveals its true power.
content.2.46=Supernatural elements conspired in the birth of this wand which shimmers on the very border between the real world and... Aliens? Well, it gives me the willies, I tell ya.
content.2.47=Strange fact - the Yellite suddenly became voiceless one Descendre night. The neighbors were delighted, they drank wine from her shoes that night I tell you, drank wine from the loudmouth's shoes.
content.2.48=The runes engraved in Runa Wood say that the first one to decipher its secret will be appointed king of Amakna. Anyone who believes that should be locked up, just like those guys who are trying to pull that sword of of that rock up in Amakna.
content.2.49=This wand used to belong to a prince whose short, green tunic made many a young girl fantasize.
content.2.50=When they see your wand, your rivals won't be able to stop making idiotic puns - Verdo will stop you laughing... but not from destroying.
content.2.51=The God Rod is a fearsome weapon. Very powerful, its bearer can perform even when the mist of exhaustion darkens his mind.
content.2.52=This living staff hangs around the darkest corners of the Amakna universe. It wakes up once every 300 years to change location or owner.
content.2.53=This staff belonged to the notorious Wa Wabbit.
content.2.54=The success of the Wa Wabbit Staff has contributed to the arrival of various staffs like this one, all with the same name so they're sure to sell. 
content.2.55=People say that this staff can make a female Treechnid blush. You can even try to tickle the privates of the Soft Oak to charm it. However, we would not recommend it, the Soft Oak is a very possessive creature...
content.2.56=People say this root is herbivore. It quickly worms its way through dead leaves and eats young shots. Very impressive. But, well, unless you're fighting Dandelions, it's just useless.
content.2.57=The bearman used this staff to tame his summoned Bear and from time to time, to rap his children's knuckles when they didn't do their homework. Here's a man who understood the value of education.
content.2.58=One day, the Sadida Aga Dou hung a small doll at the end of his staff. Since then, Iopettes jump on the staff to catch it to the Sadida's greatest joy.
content.2.59="Staff, you'll be called Stroom!" said the Sadida master. He then added: "May the Stroomest Stroom stroom you as you stroom on your merry way." The worst thing is, he was right.
content.2.60=The minute you pick this stick up, two rings will form under your eyes. You won't mind when I tell you that it's guaranteed to place your enemies in a more permanent sleep.
content.2.61=The bruising tree hates whatever moves on two legs and can handle an axe. You can imagine how hard it's been to carve a staff from the wood. Its name will give you some idea.
content.2.62=Strange sounds come out of this staff when it's used properly... it's like horsehairs rubbing off Bow Meow guts. You just can't help humming a tune as you finish your enemies off.
content.2.63=Kaiser the Dragon Pig went to the circus to find a juggler and eat him. He trotted up close and sniffed with his nose, but the juggler was juggling sharp daggers and broken glass. Poor Dragon Pig.
content.2.64=The Ragnarok is powerful enough to raise a storm. It can also raise the temper of your friends if you don't know how to use it properly.
content.2.65=This hammer once belonged to the guardian of the Door of Hell. He prevented the living from coming in, the dead from going out and the living dead from urinating through the letterbox. Dirty monkeys!
content.2.66=Sargasse once belonged to a child with terrible powers. Tragedy really struck when the little brat traded it for a bag of marbles.
content.2.67=This hammer is so ridiculous that your enemy will laugh his head off. This should give you just enough time to beat it off with the very same hammer... Isn't that ironic?
content.2.68=This hammer imparts the ancestral knowledge of the Tortoises, such as - 'If someone offers you tea and you have no hands left, kill them with your ears'. Nobody knows if it's to be taken literally or not. 
content.2.69=Falistos are exceptional blacksmiths (their hammers can prove it). They're also Xelor demons who've renounced their god. There's a price for such an act: they're always running late.
content.2.70="Don't eat my grass and don't trespass", Jackhas sang. A Jackhas who enjoys screaming his lyrics into his war hammer while watching his reflection in ponds... that's quite unusual, isn't it?
content.2.71=Only real heroes will be able to carry this hammer. But they will also be afflicted with serious wind problems. A very powerful weapon in close combat.
content.2.72=In Amakna, when pupils are too loud, too quiet, too smart or too dumb, they receive a firm smash on the knuckles with this hammer. 
content.2.73=It's THE weapon Xelors dreamt of when they were fifteen, especially those looking for thrills and spills. It helps them to get over the endemic Xelor height complex nicely.
content.2.74=Barabas is the abbreviation of the Barbar'aha'ass war cry, which is commonly used in battle by the Brakmarian militia. It means approximately " Be hard and stab for the ass".
content.2.75=Halfway between an axe and a shovel, Ares was one of the seven weapons used by the demon Kajlir to overcome the Brotherhood of the Enutrofs, who were collecting Crimson Dofus at the time.
content.2.76=Greybeard was the favourite weapon of the demon-dwarf Assan Cehef, who terrorized many villagers in surprise attacks.
content.2.77=This gardening shovel is great for digging up roots and weeds, but as a warrior friend of mine always says... 'Wot cuts da root cuts more dan da root too.' Wise words.
content.2.78=An Enutrof builder who had had a few drinks too many at the tavern realized one night that this shovel could do more than dig holes in the ground.
content.2.79=If too many of your enemies are pushing up the daisies in your garden, you can always weed them out with this magnificent shovel.
content.2.80=This shovel is extensively used by the Kanniball priests of Moon Island to summon Zebuth, a divinity with a cow head. What for, I wonder. Who knows...
content.2.81=Misacal's breath smells like the devil's toe-cheese, which in the long run, might damage your social life. Keep your friends not so close and your enemies closer.
content.2.82=Many foolish fellows out-stayed their welcome by the Unfaithful Gravedigger's side only to find themselves buried nose deep in top soil. Steel your nerves and use it only when you really need it.
content.2.83=Stood next to your front door, the Keeper will guarantee peace and quiet at home. She'll also come in handy for burying the remains of anyone who is crazy enough to visit.
content.2.84=The phases of the moon dictate when and where these shovels can be made. As usual, nobody who knows the secret seems willing to let the cat eat the beans.
content.2.85=The Solote Shovel is only useful if you use it. Not informative enough for you? Well, just count yourself lucky you have one.
content.2.86=With Mamayabibo, stuffing loads of small buns at once is easy as pie. Same with small dwarves. I find a pickle and red onion filling is excellent with fresh dwarves.
content.2.88=This dog has to be dragged out the door everytime it pees. This is also the only time it can't bite you. Just make sure you're far away when it's finished peeing.
content.2.89=The fairer sex is unanimous in its love for this mischievous but cuddly hairball. What a fearsome animal!
content.2.90=This little wabbit is domesticated and won't bite you. The same cannot be said for everyone else it sees.
content.2.91=This cute little Bwak will soon become an ugly Kwak. No reason to be afraid until then, so keep it with you.
content.2.92=This cute little Bwak will soon become an ugly Kwak. No reason to be afraid until then, so keep it with you.
content.2.93=This cute little Bwak will soon become an ugly Kwak. No reason to be afraid until then, so keep it with you.
content.2.94=This cute little Bwak will soon become an ugly Kwak. No reason to be afraid until then, so keep it with you.
content.2.95=This pinchy little monkey seems to like you now. It is very docile but also very demanding as far as food is concerned. It'll only eat things that have grown on its island.
content.2.96=Collectors dream of acquiring this amazing cloak, made of feathers from the last Cheeken in Amakna.
content.2.97=The battery cock whose feathers made this cape fought its killers for several days and nights before finally dying of exhaustion. Let me tell you, killing that crazy chicken nearly finished them off too.
content.2.98=Made for those irritating souls who always want to have the last word.
content.2.99=This cloak has been handsewn with Tofu feathers to allow you to run away from your enemies faster. A cowardly-looking cape for cowardly acts.
content.2.102=This cloak is certainly one of the most powerful weapons in the world. It increases all the characteristics of its wearer. 
content.2.103=This cape once belonged to the famous Wa Wabbit and it's permanently impregnated with its perspiration and other secretions. You will think about the king of Was whenever you wear it.
content.2.104=This strange cape draws its strength from its rundown look. The dirtier it is, the more useful it becomes.
content.2.105=With this thing on, all you'll have to worry about is that sticky sap that drips out of the Treechnids. It's soo hard to wash off.
content.2.106=This cape has it all: it is resistant, comfortable, and rare... But its smell will beat your nose cavity with a stench-whip of horror odour. For the hundredth time, you cannot have it all!
content.2.107=You'll be irresistible with this elegant cape.
content.2.108=It might look like a 'has been', but the Slob Headgear can hold its own... and that's saying a lot for a straw hat.
content.2.109=This demon skull, rebuilt from various bones, makes its bearer look graceful and elegant... Your girl friends will envy you...
content.2.110=The explorers' favorite hat.
content.2.111=With this hat of leather Chafer briefs, the female bwork magi won't be able to resist you. That's not a good thing, mind - many are known to wear long, red beards and none are known for their femininity.
content.2.112=A white Dreggon shell, padded with leather and wool, is ideal to protect your noggin against basic attacks, and even the flashes of lightning tossed about by a drunken Bwork Magus. You'll also look like you just fell out of a big chicken's backside.
content.2.113=The Champo used to belong to a great Fungi Master of Amakma. Brave and respected, he nevertheless met his end in the middle of a plate of scrambled Tofu eggs. What a cruel world...
content.2.114=The Clint is a simple but classy hat. 
content.2.115=Just like you, turtles have very small heads. How convenient! This cap is just the right size for the two of you.
content.2.116=Thanks to this magnificent helmet, you'll have as much class as the notorious Lord Crow.
content.2.117=With this hat on, you'll look like a dragon... but a hairy dragon. It's a bit shocking!
content.2.118=The emerald Dofus assures a long, long, longlong, very very long life to its bearer.
content.2.119=With the turquoise Dofus, you will begin to understand the essence of critical hits.
content.2.120=This beautiful Dofus, coming right from the hole of one of the most majestic Dragons in Amakna, will increase the air and earth damage of its bearer.
content.2.121=Now you know why Wabbits run so fast and do not need glasses...
content.2.122=This Dofus will allow you to come and go as you please, and to enjoy many, many pleasures...
content.2.123=Brandish this Dofus at the start of a fight - it will cause a chill to run through the hearts of your enemies.
content.2.125=This magnificent headgear increases the strength and intelligence of wearers... if they can endure the smell.
content.2.126=Musheadgear used to be used to make herbal tea or to be smoked. This headgear really has it all.
content.2.127=The only thing more impressive than a livid Mush Mush is a livid Mush Mush wearing a cloak. 
content.2.128=This headgear was given its exotic name by the eccentric Enutrof who first discovered it while stripping off a sick old Moskito. 
content.2.129=Made out of Moskito skin and wings, this bag used to be a big fad in schools. Today, it is old-fashioned and has been replaced by the Small Chief Crocodyl schoolbag.
content.2.130=You won't be complaining about the stiffness of this cloak when it saves your life under a hail of Crackler spit.
content.2.131=This small, reddish cloak can be also used as a rug or doormat when you come home in the evening, saving some of your hard-earned Kamas for the tavern.
content.2.132=With this prespwig on, you'll look like Debbie Crockett, the most celebrated huntress of the modern age, but a tragic victim of premature baldness. That's not to say that this rat-bitten, off-red wig is any better than a balding nut.
content.2.133=When a Crackrock comes knocking on your skull and ringing on your neck, this stone helmet is really worth its weight in gold. 
content.2.134=This bow belonged to Kuri, the famous Love Priestess and left-hand woman of Granny Candy. Never turn your back on a Love Priestess. One arrow from this bow is enough to tear your heart to shreds, or your arse if you have actually turned around.
content.2.156=Inhabitants of Dalbion Island give this cape out each year to anyone who manages to stab a continental in the back.
content.2.157=If your enemy hits you on the cheek, offer him the other also. If your enemy insults you, crown him.
content.2.158=As sly as a starving Tofu, the Foksowl darts straight at its victim's neck and pecks hell for leather!
content.2.159=This Wabbit trapped the ray man between its bum cheeks to save its tribe. Since being banned from its island, it's been desperately trying to ressurect its social life.
content.2.162=Ghasts may look cute, but they can be very ghastly and are even considered as horrible criminals in the Hormonde.
content.2.163=Just go ahead and try making a bag out this little monster...
content.2.164=The Crowch is almost identical to the Crow - in fact, they're cousins. When Aesop told the story about the fox and the piece of cheese, it was really this guy he was talking about.
content.2.165=Atooin is the child that was born at the end of the fable of the tortoise and the hare. And you thought it didn't end happily ever after... 
content.2.166="He sure doesn't move fast, this guy. In fact, if you don't chase him away, he might just take root right here!"
content.2.182=Cet arc doit son nom à son pouvoir dévastateur qui a fait des merveilles lors de la guerre des clones dans l'Hormonde.
