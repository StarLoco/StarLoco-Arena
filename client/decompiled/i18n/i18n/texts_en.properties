content.53.4=In this tournament, the following rules change:\nYou can play using just one fighter, who will be able to benefit from the whole 6000K budget for himself.\nThe spells Lethal Trap and Corruption are forbidden.
content.53.5=In this tournament, the following rules change:\nYou can play with a duo of fighters of different classes, who will be able to benefit from a 6000K budget split between the two of them.\nThe spells Lethal Trap and Corruption are forbidden.
content.53.6=In this tournament, the following rules change:\nYou have an unlimited budget to create your team.
content.53.7=This tournament uses the classic 1vs1 rules.
content.53.8=In this tournament, the following rules change:\nYou only have 4000 budget points to create your team.
content.53.9=In this tournament, the following rules change:\nYou have 8000 budget points to create your team.
content.53.10=In this tournament, the following rules change:\nYou have an unlimited budget, but you can only play with four fighters per team.\nFor each victory during the tournament, you will win two tournament points.
