content.59.2=How are you?
content.59.7=Hi,\n\nI'm Baan. My job is to guide you through the Outer World, the dimension in which you find yourself now. What would you like to know?
content.59.8=Ok. Which subject are you interested in?
content.59.10=Ok, I'll take you into the training arena. I've got a Gobball there who just loves taking hits.
content.59.11=In this world, your place in the <b>rankings</b> and your <b>Kard</b> collection are your two main objectives!\n\nTo appear in the various league tables of the Outer World, you have to win one fight after another in the arena, by confronting other players to prove you are the strongest.\n\nWinning matches will also enable you to win <b>kards</b> and add them to your grimoire. You can also get all the <b>kards</b> in the Outer World in <b>boosters</b> (that you buy using ogrines on the website) and from <b>Kardmasters</b> that you'll meet on the islands and in <b>fusion laboratories</b>.\n\nAt the moment, just concentrate on the game mode (evolution mode is good for beginners) and getting consecutive victories.
content.59.12=There are numerous types of combat, also known as <b>game modes</b> in the Outer World. On this island, you'll also find the <b>ghostofs</b> who will tell you about each of these game modes in more detail.\nAs a brief summary, <b>evolution mode</b> allows you to play with a team whose strength increases with training. On the other hand, <b>elite mode</b> has everyone starting off on an equal footing, but also requires a good understanding of the game. In other words, it's not for beginners. The <b>2vs2 elite mode</b> lets you share an elite team with a friend and finally, <b>tournament mode</b>, also called <b>personalised mode</b> lets you play with different rules and participate in tournaments, which will let you win special <b>Kards</b> and even <b>DOFUS</b> and <b>WAKFU</b> items!\n\nBy the way, the <b>ghostofs</b> only want to help you. They are the souls of warriors fallen in the arenas and must complete this final task before they can be free, so don't hesitate to ask them any questions.
content.59.13=Talk about tokens.
content.59.14=Talk about the fact that your opponents are humans too.
content.59.15=Here, take this zaap kard. It will take you to Demon I. He should be able to teach you a few interesting game concepts.
