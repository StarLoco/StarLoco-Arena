content.33.1=After some deliberation, the council of 24 has decided to penalise your best team for its inactivity during these last two weeks by decreasing its strength! There's no room for slackers in the Outer World Arenas, and don't you forget it!
content.33.2=Well done!\nBy participating in the Arena tournament, you've won some exclusive items.\nDon't be shy about showing them off in front of your jealous peers.\n\nAnkama Team
content.33.3=The attached object has been sent to you by the Arena website.\nThank you for placing your trust in our delivery service.\nWe hope you will continue to use our last minute delivery service in the future.\n\nThe Postmaniac
content.33.4=To thank you for yout participation in the Dofus Arena pregold, we've sent you some exclusive runes to help the development of your fighters.\n\nGood luck for the future!\n\nAnkama Team
