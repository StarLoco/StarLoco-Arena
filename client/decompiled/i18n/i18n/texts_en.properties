challengeHelpDescription32=You lasted... 10 seconds. You can do better than that. You'll need to use your coach's action kards. You have three. Repelling Wind repels an adversary.  If you look, you'll notice the demon below is standing just in front of a deadly cell. Push him onto it. The lightning kard has a long range. It should allow you to reach twice as far. The acceleration kard will make you go much faster.
challengeHelpDescription33=I'm going to help you out here, because it's quite important. The first crystal you have to kill is the regenerating crystal, on your left. But to get to it, you have to beware of the powerful crystal protecting it. Try to use your team's abilities, such as invisibility, jump, acceleration or slowing down, or a paralyzing arrow to get past it unharmed. 
challengeHelpDescription34=Ouch! That one's big and nasty. Let me give you some advice. You should see two yellow stared brown cells on the map. If you characters start their turn on them, they will gain a damage boost and should be able to kill that big demon quickly.
challengeHelpDescription35=You fell in the 52nd Minute Demon's traps. You aim is to get one character through. Once you've reached the demon, he won't attack you and you can kill him easily. If you want to use the middle cell... try to put someone one it, for example. Go on, you can trust me.
challengeHelpDescription36=Get to cover! How can you win if an archer can spot you a mile away? Use trees and bonus cards to end your turn in cover. You will get bonus MPs every 6 turns, try to use it.
challengeHelpDescription45=You didn't made this time, but don't let down! Use bonus cells while dodging the cristals attacks, if that's not enought, level up your fighters.
