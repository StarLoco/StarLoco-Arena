content.53.13=Dans ce tournoi, les règles changent : Vous n'avez pas de limite de budget, mais vous ne pouvez jouer qu'avec 4 combattants dans votre équipe.
content.53.14=In this tournament, the following rules change:\nMinimum 5 fighters.\nAND You will only have 10 seconds to play each of your turns.
content.53.15=These tournaments use the classic evolution rules. You can play with your normal team, regardless of the your fighters' levels.\nHowever, you will not receive any experience and you will not suffer fatigue, injuries or death. Your potions will be effective throughout the tournament and will not run out. It's time to have some fun!
content.53.16=In this tournament, the following rules change:\nSudden Death begins in the second turn.
