content.29.272=Fairywork launcher
content.29.273=Well done, kid! I think you're ready to move on to some tougher opponents now. Here's a zaap card, use it with the zaap located on the north-east of the island.\n\nBye, then! If you're ever on Maknala, come and see me. I'll have some more challenges for you.
content.29.274=You're not worthy of confronting me. Try to defeat the other four demons of the minutes on this island. If you manage it, I might agree to duel with you.
content.29.275=Mwa ha ha ha! I've kidnapped Barnaby and I'll never give him back! Unless you blow up my friends, the crystals.
content.29.276=Demon of the Seconds
content.29.277=Look, there's 37! He's one of the Demon of the 12th Minute's slaves. You must remember him, you confronted him when you first arrived in the Outer World!
content.29.278=He built a prison that holds a VIP (Very Important Prisoner), for his master. He claims it's invulnerable. How would you like to prove him wrong?!
content.29.279=Don't forget that having 100% resistance doesn't make you invulnerable! If you have sufficient damage bonuses, your hits should affect the target.
content.29.280=What's that I hear? You want to rescue our prisoner? Ha ha! No chance! I've improved my master's crystalline prison system. Now, it's invulnerable!
content.29.281=Demon of the 37th Second
content.29.282=Ok, let's get down to business. Before any else, you should position your Iop during the positioning phase.
content.29.283=Since you're still training, there's no time limit. In a real battle, though, you'd only have 30 seconds to position all your fighters.
content.29.284=To position your fighter, select them by left clicking, then select the case you want to move him to. If another fighter is already on this cell, they will change places (no worries here, since your Iop is on his own).
content.29.285=Once you feel you've got the hang of it, click on the "Ready" button.
content.29.286=After the positioning phase, you will have noticed there is an observation phase which lasts 10 seconds.
content.29.287=Pendant la phase d'observation tu peux voir le positionnement de ton ennemi et même les caractéristiques de ces combattants si tu clique sur la timeline en haut à gauche.
content.29.288=For your training, I've removed the 30 second countdown, which is used in a combat turn in a real fight, so that you have time to look at the timeline now, if you want to.
content.29.289=Once you feel ready, attack the Gobball. You have 3 MP (Movement Points) so you can move closer to him by clicking on the cell in front of him.
content.29.290=Don't be afraid! Move towards to him by clicking on the cell opposite him. Whether you right click or left depends on which button you chose when you got here. You can change it if you prefer.
content.29.291=Very good! Now use the Pressure spell to kill him! Click on the spell in the spell bar in the bottom left, then click on the target.
content.29.292=Erm, that wasn't bad. But next time try aiming for the Gobball by clicking on its cell, or you might have trouble beating it.
content.29.293=Great! You got it! Another hit with Pressure and you'll have beaten it, which will bring this training session to an end.
content.29.294=You can see the total number of your AP (Action Points) written in blue in the bottom left. Pressure uses 3 AP so, if you have enough of them, repeat the spell. If not, you'll have to skip a turn to get 6 AP.
