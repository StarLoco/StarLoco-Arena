content.31.29=Let's ease you into this slowly and see how well you do against just the one Gobball... With three fighters it shouldn't prove too much of a problem, not even for a weakling like you...
content.31.30=So, that's how you beat a Gobball then? Goooood... Well, now let's see how you get on with the wave of monsters waiting for you in the next challenge.\n\n\nBe careful, though, these monsters like to gobble up your action points, so don't be too surprised to find you can't cast any more spells if you've let them steal one too many of them!
content.31.31=OK, ok, so there were quite a few of those prespics and madolls, but it's not like they hit very hard! \n\nLet's see what you can do against a real adversary.  This time, it's going to take at least three of you to beat it, I'd say.\n\nThe crackler is pretty tough, he hits hard and he steals your movement points. Here's some advice, if you don't want to end up ressembling a doormat: Try to hit him as many times as possible from a distance before he stops you in hand to hand combat.
content.31.32=Over in a few seconds. This is the type of fight we like, bloody and fast. Don't ever forget the importance of action cards. You should always wait until the right moment to use them. They don't use up many action points and are often a lot stronger than combat spells. They will give you the sort of flexibility that will lead to victory.
content.31.33=You're finally ready! Go and see demon I, he should give you permission to take part in the big tournament. You're free to come back here and train too, if you want. As long as your fighters are beginners, they'll carry gaining a bit of experience. Afterwards, you'll need to go and fight other coaches to gain more experience.
content.31.34=Well done! What a phenomenal victory. So, don't forget, bonus tiles can give you a decisive advantage in battle. In the arenas of the grand tournament, you'll often find them in the middle of the fighting ground. Try them out and see how they can change the course of a battle.
content.31.35=You managed to avoid the demon traps in the 52nd minutes, well done! Never forget the trap tiles during battle. These do a lot of damage, but the death tiles can kill someone outright. If your character can push, attract or change position with your opponant, you shouldn't hesitate to put him on one.
content.31.36=There you go, over and done with. An archer's pretty useless once they get into hand to hand combat. Once you get to the grand tournament, you'll need to get into the habit of checking the kards for the next two rounds. They will never be as violent as the ones you've just seen, but they can still change the course of a fight.
content.31.37=You're not feeling well, little coach?\nToo much poison? What a wimp!
content.31.38=Mwahahahaha!\nYou like this Iop.\nHe makes us laugh, especially when he's wiped out some unfortunate team.
content.31.39=We made sure there was a guardian there, to ask questions.\nBut it's more fun when the Retreat Arrows start flying.\nShame no one fell...
content.31.40=You like my vegetable garden?\nI grow cawottes there.\nI get round the wabbit problem by making sure there are always a couple of guardians stationned around my garden.\nAs pest control.
content.31.41=Well? Is that it?\nWe wanted to see what you were made of... we're disappointed. You will put on a show at the tournament though, won't you, weakling?
content.31.42=Ha, a good challenge, that's what you need.\nThat's our little pick-me-up, that is.\nA Sram, and here we go again.
content.31.43=They're kind, these Eniripsas. Caring and clobbering people. This way, their adversary lasts longer, suffers longer and, as for us, well, we thoroughly enjoy it.
content.31.44=Now you've felt the force of the Demons of Seconds, go back to the arena and confront your peers.\nWe want to see proper fighting, injuries and death. Execution!
content.31.45=Well done! You really taught a lesson to that demon! Thanks to you, Barnabe is free! You can now use his Kard in order to send him back to his owner in the Wolrd of 12,
