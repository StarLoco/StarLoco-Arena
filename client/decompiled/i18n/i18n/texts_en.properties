content.6.1=This class has the most efficient protection spells. An old hand of Feca's Shield can go through battlefields, undergo violent assaults and come out of it without a scratch. Feca respects her followers and protects them from enemy blows, bad weather or even illness.
content.6.2=The disciples of this class tame creatures and prepare them to fight alongside them. They have a perfect knowledge of nature.
content.6.3=The disciples of Enutrof are not natural born fighters, but they can, in time, become formidable opponents thanks to their equipment.
content.6.4=The disciples of Sram are the worst devils in the world of Amakna. They thieve and cheat without remorse... Sram is the only authority they respect.
content.6.5=The disciples of Xelor's Sandglass play around with time. They can slow down and speed up their enemies or allies. Their god is apparently shaped like a clock...
content.6.6=The disciples of this class are born players. They are capable of risking their lives for the love of the game. The problem is that their spells can backfire on them at any time...
content.6.7=The spells of the healers are words and prayers. Most of them work if the enemy stays within earshot.
content.6.8=Iop, god of power and strength, despises weakness. His disciples can rarely expect his intervention on their behalf.
content.6.9=Precision, agility and dexterity are the key words of that class. Its disciples are just converted archers.
content.6.10=The class of the Sadida's Shoe is composed of curious creatures. They sleep 23 hours a day and are in complete harmony with nature.
content.6.11=The disciples of the goddess Sacrier have a perfect knowledge of pain. Their fighting techniques are based on will and stamina.
content.6.12=The disciples of Pandawa get their strength from fermented drinks. Their spine is muscular and their shoulders robust, allowing them to carry three or four times their body weight! During fights, Pandawas use this talent either to whisk their allies out of harm's way or to lift their enemies up and smash them onto the ground.
content.6.13=Rogues are masters of tricks. They attack from a distance and use their bombs to create chains of explosions. Their also use spells to avoid close combat encounters.
content.6.14=Masqueraiders collect and use masks which give them powers. Each masks having its own powers, the masqueraider has to switch at the right moment during the fight in order to be able to become a close combat berserk or coward fighting from a distance.
