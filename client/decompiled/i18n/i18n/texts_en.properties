content.9.1=Slaughter and ravage are the pillars of the Iop religion... Gutting and bloodletting are part of the cult, too. From now on, you can bludgeon everyone like a brute and claim that god told you to do it!
content.9.2="Might as well get hung for a Gobball as for a Tofu egg". It's amazing how true this old proverb is, and how it always puts Srams in a good mood when they hear it.
content.9.3="One for all and all for Sacri!" A war cry that delights all Sacriers. Your goddess sheds a tear... you shed blood!
content.9.4="A healing hand is worth two in her bush". Such traditional sayings give Eniripsas the heart to heal everything they come accross.
content.9.5=When he created the Sadidettes, Sadida didn't realize how strong their personality would be... Fortunately, he also created docile dolls for his male disciples to use whenever they want.
content.9.6=Disciples of Osamodas, you love your pets and your god knows it! Tearing your enemies to pieces with a Tofu or dismembering them with a Gobball... ain't that the good life?
content.9.7=Ever heard about the leprechaun and his pot of gold under the rainbow? Well this goddess is a bit like that, except her bow is real and her pot, well, it's more like a pot of blood...
content.9.8=Watching an Enutrof run is a fascinating experience. Funny, though, they usually seem to be running away.
content.9.9=Xelor only appears to those who really believe in him. You'll just have to trust us on this one...
content.9.10=What we really love about the Ecaflips is the tears they shed for all beautiful things. A five-leaf clover, a sobbing enemy - all is beautiful to them.
content.9.11=The Feca Goddess provides her disciples with almost impenetrable armor-plating. She has been known to stretch the truth a bit, though...
content.9.12=Well, I don't mean to be rude but are we going to spend the whole night on this?
content.9.13=Jinx. Rotten luck. Misfortune. Does every cloud really have a silver lining? I think it's more like a third of clouds, don't you?
content.9.14=Slowly in the mornings, and not too fast in the afternoons.\nThis kard works at the start of a fight to give your fighters time to get into position in the arena.
content.9.15=Did you think you'd go on hopping about for much longer? Well, not any more...
content.9.16=Now you are allergic to water... sea water, spring water, rain water and even Roger Water.
content.9.17=There's a smell of scorching: well, even some light exercise will burn a few calories!
content.9.18=Has anyone ever told you that you should give some fresh air to people around you? Well, now would be a good time to start.
content.9.19=It smellls of sweat and tears here... a few drops of blood in the mix and everything will be perfect.
content.9.20=By Magnalebus, the revered, glorified, noble-minded and muscular miracle-worker! Now everyone's feeling a lot better!
content.9.21=Just like Jone Ardvarc - the famous Cra archer, you hear the voice of an angel above you: ''It's gonna squirt! it's gonna be a juicy one!'' Whatever happened to Jone again?
content.9.22=Nothing touches your heart? You're a real brute? Well this is your chance to shine, away from the eyes of the peace-besotted masses. It's open season!
content.9.23=Let's make the words intelligence (yours) rhyme with pain (theirs). Impossible? Just wait and see!
content.9.24=Here's a wind that goes straight to your stomach!
content.9.25=Repeat this sentence out loud ten times: "Spirit of the wet waves, you're affecting my brainwaves, help me get the victory that everybody craves." Quite a simple and effective ritual, don't you think?
content.9.26=You're thinking, "A rolling stone tosses a scare my way..." But you are well aware that being scared does not take the danger away. So now you know: a forewarned adventurer is a forearmed adventurer...
content.9.27=The fighting seems without end? Everyone's eager to retire to the tavern - even if it means losing. Well, thank your lucky star Pandawa's here... she'll give you a sense of finality, and you won't even have to stop fighting!
content.9.43=Since the latest tests were inconclusive, our expert is in an intense reflection stage. As for the creatures invoked, well, they're not going to waste.
content.9.44=In his attempt to block the temporal flux, our expert is supposed to have unleashed a wave of violence amongst the invoked creatures.
content.9.45=Our expert is still trying to repair the dials. These latest tests could produce some undesirable effects.
content.9.46=Our on site expert, Deathwatch, claims to have found new properties in the invoked creatures, most notably increased resistance.
content.9.47=We've lost contact with our expert, Deathwatch. On the other hand, we heard a bear cry like only an Osamodas can do one.
content.9.48=What's nice about the Ecaflips, is to to see them as sensitive to the charm of a five-leaf clover as that of a defeated enemy.
content.9.49=Carnage and destruction are the founding principles of the Iop cult... And slaughtering and disembowelment too, of course. You're finally ready to hit like a brute.
content.9.50=You have to wonder about a goddess who reveals her secret to make men shoot more quickly. Ok, we're talking about a bow and arrow, but that's all it takes to get her disciples excited.
content.9.51="A healing hand's better than two in the bush". It's sayings like this that Eniripsas use to willingly care for anything that moves.
content.9.52=The Feca Goddess will give you a pure breastplate, bulletproof armour! Let me know how good it is. Light and practical, it will save you from certain death. Well, almost.
content.9.53="One for all and all on the Sacri!" is the war cry that enchants Sacriers: you goddess wipes away an tender tear and you, you wipe away your enemies!
content.9.54=Luckily, Xelor apparitions wisely only appear to those who believe in Xelor. That's very deep, it's true, and will open your mind to a brand new point of view.
content.9.55="He who steals a Tofu egg, steals a Gobball". It's odd how these old sayings are so true and put the Srams in such a good mood.
content.9.56=Is the fight over yet? Everyone would rather be celebrating their victory or drowning their defeat, wouldn't they? Luckily, Pandawa is there to give you the experience you want, without having to stop the slaughtering!
content.9.57=It's a funny sight to see a disciple of Enutrof running. Astonish your friends: The god Enutrof has now given you a great freedom of movement!
content.9.58=Disciples of Osamodas, you like pets and your god knows it! Ah! Cutting an enemy to pieces with a Tofu, tearing them limb from limb with a Gobball... that's the life!
content.9.59=It would seem that, when Sadida created the Sadidettes he gave them a lousy personality... Luckily for the Sadida disciples, he also make sweet dolls to order.
