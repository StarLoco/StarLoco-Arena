content.26.48=These kards are to be used immediately after the death of a fighter, or at the cemetary, to bring him back to the land of the living.
content.26.49=Find a launcher and create your own display by varying the colours and types of fairyworks.
content.26.51=The demons had a meeting one day, to ban the Peo, because it's effects are too powerful. Luckily, they never reached an agreement. The Peo can wake up someone who died from exhaustion.
content.26.52=Rally your troops with these splendid flags. During their next fight, all members of your guild will win a bonus. Remember, you can only use one flag at a time though.
content.26.53=Not on form? Low moral? All you need is the Arena Max potion and you'll be off again before you know it. Arena Max, the drink that kills bears!
content.26.54=Use these potions to improve your chances of winning good kards at the end of a fight. The Am, Stram and Gram potions are the only ones that can be used at the same time.
content.26.55=Runes are used to unlock the padlocks to your fighters' kanados. What's more, for a few fights, they'll make them more skilled. The minor runes are used to unlock the first padlocks to all the kanodos.
content.26.56=These experience potions can give one of your fighters a boost. Very practical if you decide to recruit a beginner.
content.26.57=Thanks to this ghostly set you'll be able to tell your friends you'll be full of spirit!
content.26.58=With this set on your back, you'll be able to order around the Gobballs... or get torn to shreds by them for having skinning their chief!
content.26.59=A set for all those who want to show their wealth to the world... or for those who dream of being robbed!
content.26.60=If you're a fan of instability, this set is made for you. If you're a little unstable yourself, take note...
content.26.61=The elementary potions increase the amount of damage one of your characters can do in one element, and they last 3 fights. Be careful, these potions also have a negative effect to take into account.
content.26.62=You can use each one of these potions to protect one of your fighters from a particular element, for 3 fights. Be careful though, these potions also have some negative side effects.
content.26.63=These little potions can be used to improve a fighter's skill. Be careful, since they can also produce negative side effects.
content.26.64=Nice potions to improve a fighter's skills. Careful, these potions also have negative side effects.
content.26.65=Good potions to improve a fighter's skills. Careful, these potions also have negative side effects.
content.26.66=Magnificent potions to increase a fighter's skills. Be careful, you also have to take into account the potion's negative effects.
content.26.67=Angel Dust! In the Outer World?\nIt's been banned by the Hour Demons, and anyone who uses it will pay with their reputation. But it's so powerful, who could possibly resiste the temptation to try it out?
content.26.68=These potions treat all a fighter's light injuries. Careful though, the majority of them also have negative side effects to take into account.
content.26.69=These potions treat all a fighter's serious injuries. Careful though, the majority of them also have negative side effects to take into account.
content.26.70=These elixirs treat all a fighter's light injuries. Careful though, the majority of them also have negative side effects to take into account.
content.26.71=These elixirs treat all a fighter's serious injuries. Careful though, the majority of them also have negative side effects to take into account.
content.26.72=These spells treat your whole team's light injuries. Beware, the majority of these rituals also have negative side effects to take into account.
content.26.73=These spells treat your whole team's serious injuries. Warning: The majority of these rituals also have negative side effects to take into account.
content.26.74=These spells heal your whole team's serious injuries. Warning: these spells also have negative side effects to take into account.
content.26.75=These spells treat your whole team's serious injuries. Beware, the majority of these rituals also have negative side effects to take into account.
content.26.76=Rally your troops with these incredible flags. During their next fight, all members of your guild will win a bonus. Remember, you can only use one flag at a time though.
content.26.77=Rally your troops with these pretty flags. During their next fight, all members of your guild will win a bonus. Remember, you can only use one flag at a time though.
content.26.78=Runes are used to unlock the padlocks to your fighters' kanados. What's more, for a few fights, they'll make them more skilled. The major runes are used to unlock the central padlocks to all the kanodos.
content.26.79=Runes are used to unlock the padlocks to your fighters' kanados. What's more, for a few fights, they'll make them more skilled. The ultimate runes are used to unlock the last padlocks to all the kanodos.
content.26.80=Soon, the zaapis kards will give you access to completely new islands.
content.26.82=Find a launcher and create your own display by varying the colours and types of explosive fairies.
content.26.83=Find a launcher and create your own display by varying the colours and types of fairy fountains.
