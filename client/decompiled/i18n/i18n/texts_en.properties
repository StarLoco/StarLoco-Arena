content.59.42=The Outer World is a link between different places and different eras. You can send certain items to DOFUS or WAKFU from Arena. If you take part in tournaments, you will win tokens that you can use to buy DOFUS Items, for example.
content.59.44=Here, take this zaap kard. It will take you to Demon I's lair (to use it, click on the zaap, then choose the Demon I's Lair kard). He should be able to teach you a few techniques that might prove useful in combat.
content.59.45=Hello,\n\nIn my lifetime, I was an Elite mode champion. What do you want to know?
content.59.46=Elite mode is reserved for coaches who have already mastered the game spells and items. In elite mode, you will have a budget of 6000 points to form you team and equip them with spells and equipment. Even if you start off in elite mode, you will have as many points as the best elite players and access to the same equipment and spells as them. In elite mode, everyone starts off an equal footing.\n\nIn elite mode, you gain levels when you win matches and lose levels when you lose matches. Your level enables the demons to match you will suitable opponents.
content.59.47=In your team management interface, click on the elite tab. You should see 3 pre-made teams which you can use to practise with and get a better idea of how to create your own team.\n\nCreate a new team when you feel ready. You can add fighters to the team by clicking on "recruit a fighter".\n\nDon't forget, you only have 6000 budget points. So, you'll need to choose between having 2 or 3 well-equipped fighters with plenty of spells, or having 5 or 6 less well-equipped fighters who find their strength in numbers.
content.59.48=Ok, I've got two challenges that will be perfect for you.\n\nFor the first one, you will have to make sure you're well positioned in the arena and you make good use of your Eniripsa's heals.\n\nFor the second challenge, you will have to perfectly coordinate the members of your team and their skills to put an end to your enemies.
content.59.49=The more <b>consecutive victories</b> you get, the more your chances of getting kards after a fight increases. Obviously, the <b>higher level</b> you are, the rarer and more precious the kards you get will be.
content.59.50=Hi,\n\nI'm here to help you understand Evolution mode. What would you like to know?
content.59.51=Evolution mode is great if you've just arrived in the outer world. Bit by bit, you'll be able to unlock spells and equipment on your Kanodo, which makes it easier to learn how to use them and to create your first team.
content.59.52=In evolution, you only have one team and a sub bench. Create your team of fighters directly using the recruitment buttons.\n\nIf you want to make any changes to your team, choose which fighters you want to send to the bench and either replace them with newly recruited fighters or bring fighters who are already on your team's sub bench back into the game.
content.59.53=The Kanodo shows the fighter's progress. It is made up of spheres that can be bought using the experience gained from fighting.\n\nYou can only buy a sphere which forms a direct path with the sphere on which the progression cursor is situated (cursor is symbolised with your fighter's head). Once you've bought the spheres, they will give you bonuses such as the improvement of a characteristic, a new spell or new equipment which can be unlocked for your fighter. You also need to watch out for penalties, though, which can require the fighter to make a sacrifice if he wants to continue progressing. \n\nThere are also special spheres, such as portal spheres that will teleport you to another place on the Kanodo, or barrier spheres, which will ask you to sacrifice a kard to unlock the passage.\n\nLearning to navigate the Kanodo intelligently means your fighters will become more efficient, more quickly. It's a game in itself!
content.59.54=As you will know, if you've been listening to what we've been telling you about Evolution mode, your fighters can get injured and must, therefore, be healed. An unhealed fighter will not only be penalised in combat, but there's also a good chance his injury will worsen.\n\nThere's only one way to heal a wound: Use a heal kard that you can get either through an exchange, or in Boosters that you buy using ogrines on the game's website.
content.59.55=Evolution mode works differently from other kard winning modes. In evolution mode, you will have bonuses to improve your chance of finding kards (collection) and your chance of finding rare kards (prospecting).\n\nYou'll get most of these bonuses from the sets you equip. Apart from that, the higher level you are and the more high ranking fighters you have, the more kards you'll get in high level victories.\n\nYou will find it slightly easier to win kards in evolution mode than in the other game modes, but that's logical since you'll also need to use more to heal injuries, for example.
content.59.56=Hey!\n\nBefore you ask: No, he's not my dopple, he's my twin. We're the Noctis brothers, and together we're the 2vs2 champions! What do you want to know?
content.59.57=2vs2 mode lets you create a team with a friend and share control of the fighters so you can play together in the arena. This mode is fun because it requires both your team mate and yourself to know each other very well and be able to communicate quickly, if you want to win.
content.59.58=In your team management interface, click on the 2vs2 tab.\nCreate a new team by clicking on one of the creation buttons at the bottom of the window. To confirm the creation of your team, you need to select the friend from your friend list with whom you want to share, and give your team a name. Then, add fighters to the team by clicking on "recruit a fighter".\nDon't forget, you only have 6000 budget points. So, you'll need to choose between having 2 or 3 well-equipped fighters with plenty of spells, or having 5 or 6 less well-equipped fighters which rely on strength in numbers. Before you start a game, all you have to do is use the fighter distribution button to share them between you and you're done!
content.59.59=The more <b>consecutive victories</b> you get, the more your chances of getting kards after a fight increases. Obviously, the <b>higher level</b> you are, the rarer and more precious the kards you get will be.
content.59.60=Hey, hi!\n\nCome and see the old Enutrof ghostof who used to be a fearful tournament competitor. What is it you'd like to know?
content.59.61=Tournament mode is a different kind of game play. I'll tell you about it, but you shouldn't try it until you've at least mastered the basics of the other modes!\n\nA tournament is organised at least once a day in the outer world and takes place at specific times. You can see all the up and coming tournaments in your calendar by clicking on the calendar icon at the bottom of your interface.\n\nTournaments are different from the other modes because the match rules change for each tournament: The budget can change, spells can be forbidden and many other things.\n\nTo take part in a tournament, you have to register, then create a team to take part. When the tournament starts, you can select the tournament and your team in the team management interface and search for an opponent.\n\nTournaments are very interesting and fun and allow you to win exclusive rewards and rewards for other Ankama games!
content.59.62=To register for a tournament, you either have to go to tournament island and click on the tournament totem or use the calendar by clicking on the calendar icon at the bottom of your interface.\n\nThe registration periods for the tournaments can change. Sometimes, you might have to register before a certain time.\n\nOther tournaments might ask you for a kard to register. These tournaments normally have much more interesting rewards.\n\nFinally, not all tournaments are accessible to everyone. They can be private and reserved for a guild, or reserved for better players. Always read a tournament's description to find out more about the registration details. 
content.59.63=When you participate in the tournament, you can win tournament tokens. Exchange these tokens for exclusive kards on tournament island. Some of these kards will let you send items to other Ankama games, such as DOFUS. You can, for example, send characteristic scrolls, spells or even the famous champion set! 
content.59.65=Welcome to my island,\n\nI am Demon I. If you want to learn more about advanced fighting techniques, go and see my servants, the demons of the minutes.
content.59.66=Starting a fight's easy. All you have to do is click on the <b>Team Management</b> button and a window will open which will allow you to manage all your teams.\n\nThe default game mode is "evolution", but you can manage teams from other game modes by clicking on the tab at the top of the window.\n\nOnce you have chosen you game mode, all you have to do is create your team and add fighters, then click on the "Fight" button and the demons will find you a somebody your own size to pick on!
content.59.69=Oui, effectivement n'oublie pas de bien <b>orienter</b> tes combattants après chaque <b>mouvement et attaque</b> pour ne pas te retrouver désavantagé.\nMais tu peux aussi tirer <b>profit</b> des placements de tes adversaires !\n\nUne attaque de dos inflige <b>40%</b> de dégâts supplémentaire.\nEt une attaque de coté <b>20%</b> de dégâts supplémentaire donc n'hésite pas a être <b>fourbe.</b>\n\nPar contre les dégâts de zone ou neutres ne bénéficient pas de ce bonus.
content.59.70=Blou 
content.59.71=Nouveau message
content.59.72=pour créer un retour de dialogue, il faut:\n-sélectionner le dialogue sur lequel on veux retourner\n-le copier\n-sélectionner le dialogue sur lequel on veux une réponse qui crée un retour\n-et coller
content.59.73=Nouveau message
content.59.74=Le sujet est vaste.\nQue veux-tu savoir précisément ?
content.59.75=Il existe quatres types de cartes en fonction de leur rareté, qui sont représentées par quatres couleurs différentes.\n\n- <b>Noir</b>, qui représente les cartes les plus banales.\n- <b>Cuivre</b>, pour les cartes communes.\n- <b>Argent</b>, symbolisant les cartes rares.\n- <b>OR</b>, qui est réservé aux cartes Ultra-rares.
content.59.76=Ici, tu te bat contre d'autres <b>joueurs</b> !\n\nNe t'étonne pas donc, si tu <b>perd</b> tes premiers matchs le temps de te faire la main.\nMais la victoire n'en sera que plus savoureuse !
content.59.77=Les kards représentent la totalité des <b>biens matériels</b> du jeu.\n\nElles forment ton <b>équipement, les compétences de tes combattants, ton argent</b>, etc.
content.59.78=Effectivement, chaque kard à une valeur en <b>kamas</b>, et fait office de monnaie.\nTu peux donc t'enrichir en collectionnant les kards.\n\n<b>C'est tellement plus simple de payer par carte de nos jours, tu sais.</b>
content.59.79=Pas toutes banane !\n\nCertaines kards sont effectivement des <b>morceaux d'armure</b>, et tu peux les équiper comme tel.\nDis toi qu'une kard est juste un <b>support</b> qui te permet d'indexer plus facilement ce que tu possède ! Tu ne revêt pas la carte évidemment !\n\nCependant fait <b>attention</b> au <b>niveau</b> de la kard ! même si tu revêt une pièce d'armure qui demande un niveau 15 par exemple, et que tu es niveau 10, tu ne <b>bénéficie pas</b> des bonus relatifs à celle-ci !\nMais ça ne t'empêche pas de le porter.
content.59.80=Il existe <b>beaucoup</b> de manières d'obtenir une kard.\n\n- La plus courante, est grâce aux <b>boufteurs</b> que tu peux récupérer sur le site en échange de quelques ogrines.\n- En mode évolution, à chaque fois que tu <b>gagne</b> un match, tu as une chance de gagner une Kard relative à ton niveau.\n- Tu peux aussi faire des <b>échanges</b> avec d'autres joueurs, et gonfler ta collection\n- Il existe certains <b>challenges</b> qui permettent d'en gagner !\n- Pour obtenir certaines kards rares tu dois aller en acheter chez un <b>kard master !</b>\n- Sinon tu as aussi les <b>Autels de fusion</b>, qui vont te permettre de créer des cartes que d'autres joueurs ne connaissent peut-être pas.\n- Et pour finir, tu peux obtenir des Kards inédites en participant à des <b>tournois !</b>
content.59.81=Les kard master, sont des <b>vendeurs</b> de cartes en quelques sortes, tu peux les trouver disséminés à travers l'hormonde.\n\nChaque zone possède au moins <b>un</b> kard master, qui propose des cartes plus ou moins puissantes en fonction du niveau de cette zone.\nC'est pour ça que certains kards masters sont très <b>convoités</b> par les coachs.\n\nComme je te l'ai dit précédemment pour acheter une kard tu dois <b>donner</b> d'autres kards qui feront office d'argent, il faut que le somme soit suffisante pour payer la kard que tu veux acheter.
content.59.82=Je vais tout t'expliquer en détails !\n\nL'autel de fusion, permet <b>d'obtenir</b> une kards si on <b>sacrifice</b> d'autres kards, en suivant une recette prédéfinie, et souvent <b>inconnue !</b>\nil faut donc que tu fasse des <b>essais</b> pour trouver les bonnes recettes.\n\nChaque Autel de fusion est <b>différent</b>, et plus ou moins <b>puissant</b> en fonction de la zone ou il est.\nDans une zone très haut niveau un autel de fusion peut-être si puissant qu'il permet d'avoir un taux de réussite à <b>100%</b> s'il est boosté à fond !\n\nMais les % de réussite d'une fusion dépend de beaucoup de critères, dont je vais t'expliquer le fonctionnement.\n\nIl existe des <b>Kards fusion</b>, qui sont spécialement conçues pour <b>booster</b> les autels\ndonc, par exemple, si tu souhaite faire une fusion avec des cartes de très haut niveau, non seulement il te faut un autel <b>extrêmement puissant</b>, mais aussi une carte fusion qui va <b>booster</b> tes chances de réussites !\n\nCe que tu dois retenir c'est que, plus la fusion que tu veux faire est puissante, plus elle est difficile à réaliser ! Il faut donc mettre toutes les chances de ton coté !\n\nCeci dit, si tu rate une fusion, ne perd pas espoir, en fonction de la puissance de l'autel tu as une chance de récupérer des cartes utilisées.\n\nMais n'oublie pas que les cartes les plus puissantes ne peuvent être obtenues que de cette manière, et qui sait, tu tombera peut être sur une Kard unique et jamais vue.
content.59.83=Le tacle est une compétence que <b>chaque combattant possède</b>, il permet d'avoir une chance de <b>bloquer le mouvement</b> d'un adversaire si il passe près de toi, et lui faire <b>passer son tour.</b>\n\nLe tacle est influencé par deux caractéristiques des combattants,<b> l'esquive, et le blocage !</b>\nL'esquive te permet de <b>réduire</b> tes chances de te faire bloquer par un adversaire.\nTandis que le blocage te permet d'avoir <b>plus </b>de chance de bloquer celui-ci.\n\nSi tu veux savoir combien de chances tu as d'esquiver un tacler sur une case, tu dois <b>placer</b> le curseur sur la case en face du combattant qui doit se déplacer. tu auras un nombre qui s'affichera.
content.59.84=Le <b>grimoire</b> de kards permet de <b>consulter</b> facilement ses cartes et savoir quelles cartes il nous manque.\nIl permet également de gérer ton <b>équipement</b> de coach !\n\nMais il possède aussi une autre particularité, il contient une <b>encyclopédie</b> sur toutes les classes et leur sorts, sur toutes les invocations possibles, et sur toutes les cartes actions utilisables en combat !\n\nAutrement dit il est <b>indispensable !</b>\n\nComment ça tu ne sais pas ou le trouver ? il se situe juste en dessous du bouton de gestion des combattants ! le gros bouton jaune orange en bas !
