{{define "content"}}
<section class="section">
  <div class="grid-texture" aria-hidden="true"></div>
  <div class="blob blob-accent" style="width:420px;height:420px;right:-140px;top:-120px" aria-hidden="true"></div>

  <div class="container container-narrow">
    <div class="eyebrow">{{t "login.eyebrow"}}</div>
    <h1>{{t "login.title"}}</h1>
    <p class="lede mb-4">{{t "login.lede"}}</p>

    {{if .Error}}<div class="notice notice-error">{{.Error}}</div>{{end}}

    <div class="card">
      <form method="post" action="/login">
        <div class="form-row">
          <label for="login">{{t "login.account"}}</label>
          <input type="text" id="login" name="login" value="{{.FormLogin}}"
                 autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
        </div>
        <div class="form-row">
          <label for="password">{{t "login.password"}}</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">{{t "login.submit"}}</button>
      </form>
    </div>

    {{if .RegistrationEnabled}}
      <p class="center mt-3 small">{{t "login.noaccount"}} <a href="/register">{{t "login.createone"}}</a>.</p>
    {{end}}
  </div>
</section>
{{end}}
