{{define "content"}}
<section class="section">
  <div class="grid-texture" aria-hidden="true"></div>
  <div class="blob blob-accent" style="width:420px;height:420px;right:-140px;top:-120px" aria-hidden="true"></div>

  <div class="container container-narrow">
    <div class="eyebrow">Welcome back</div>
    <h1>Sign in</h1>
    <p class="lede mb-4">Use the same account you use in the game client.</p>

    {{if .Error}}<div class="notice notice-error">{{.Error}}</div>{{end}}

    <div class="card">
      <form method="post" action="/login">
        <div class="form-row">
          <label for="login">Account name</label>
          <input type="text" id="login" name="login" value="{{.FormLogin}}"
                 autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
      </form>
    </div>

    {{if .RegistrationEnabled}}
      <p class="center mt-3 small">No account yet? <a href="/register">Create one</a>.</p>
    {{end}}
  </div>
</section>
{{end}}
