{{define "content"}}
<section class="section">
  <div class="grid-texture" aria-hidden="true"></div>
  <div class="container container-narrow">
    <div class="eyebrow">Security</div>
    <h1>Change password</h1>
    <p class="lede mb-4">
      This is the same password you use in the game client, so you will need the new one there too.
    </p>

    {{if .Error}}<div class="notice notice-error">{{.Error}}</div>{{end}}

    {{if not .Impersonating}}
    <div class="card">
      <form method="post" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <div class="form-row">
          <label for="current">Current password</label>
          <input type="password" id="current" name="current" autocomplete="current-password" autofocus required>
        </div>
        <div class="form-row">
          <label for="password">New password</label>
          <input type="password" id="password" name="password"
                 autocomplete="new-password" minlength="{{.MinPassword}}" required>
          <div class="hint">At least {{.MinPassword}} characters.</div>
        </div>
        <div class="form-row">
          <label for="confirm">Repeat the new password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" type="submit">Change password</button>
          <a class="btn btn-secondary" href="/account">Cancel</a>
        </div>
      </form>
    </div>
    {{end}}
  </div>
</section>
{{end}}
