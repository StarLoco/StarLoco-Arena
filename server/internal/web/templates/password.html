{{define "content"}}
<section class="section">
  <div class="grid-texture" aria-hidden="true"></div>
  <div class="container container-narrow">
    <div class="eyebrow">{{t "password.eyebrow"}}</div>
    <h1>{{t "password.title"}}</h1>
    <p class="lede mb-4">
      {{t "password.lede"}}
    </p>

    {{if .Error}}<div class="notice notice-error">{{.Error}}</div>{{end}}

    {{if not .Impersonating}}
    <div class="card">
      <form method="post" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <div class="form-row">
          <label for="current">{{t "password.current"}}</label>
          <input type="password" id="current" name="current" autocomplete="current-password" autofocus required>
        </div>
        <div class="form-row">
          <label for="password">{{t "password.new"}}</label>
          <input type="password" id="password" name="password"
                 autocomplete="new-password" minlength="{{.MinPassword}}" required>
          <div class="hint">At least {{.MinPassword}} characters.</div>
        </div>
        <div class="form-row">
          <label for="confirm">{{t "password.repeat"}}</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" type="submit">{{t "password.submit"}}</button>
          <a class="btn btn-secondary" href="/account">{{t "password.cancel"}}</a>
        </div>
      </form>
    </div>
    {{end}}
  </div>
</section>
{{end}}
