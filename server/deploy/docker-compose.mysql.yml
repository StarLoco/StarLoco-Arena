# DofusArena 2.70 — server + MySQL / MariaDB (production).
#
#   docker compose -f deploy/docker-compose.mysql.yml up --build
#
# The server waits for a healthy MySQL before starting.

services:
  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: arena
      MYSQL_USER: arena
      MYSQL_PASSWORD: arena
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uarena", "-parena"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  arena:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dofusarena-2.70:latest
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5555:5555"
    environment:
      ARENA_ADDR: "0.0.0.0:5555"
      ARENA_LOG_LEVEL: "info"
      ARENA_DATA_DIR: "/data"
      ARENA_DB_DRIVER: "mysql"
      ARENA_DB_DSN: "arena:arena@tcp(mysql:3306)/arena?charset=utf8mb4&parseTime=True&loc=UTC"
      ARENA_DB_MAX_OPEN_CONNS: "50"
      ARENA_DB_MAX_IDLE_CONNS: "10"
    volumes:
      - ${ARENA_DATA_DIR:-./data}:/data:ro
    restart: unless-stopped

volumes:
  mysql-data:
