# DofusArena 2.70 — standalone server with SQLite (single container).
# Simplest deployment: one process, an embedded DB file, no external services.
#
#   docker compose -f deploy/docker-compose.sqlite.yml up --build
#
# The image bundles its own small game-data subset; mount your own at /data
# (see deploy/README.md) only if you want to use different data.

services:
  arena:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dofusarena-2.70:latest
    ports:
      - "5555:5555"   # game client
      - "8080:8080"   # account web portal
    environment:
      ARENA_ADDR: "0.0.0.0:5555"
      ARENA_WEB_ADDR: "0.0.0.0:8080"
      ARENA_LOG_LEVEL: "info"
      ARENA_DATA_DIR: "/data"
      ARENA_DB_DRIVER: "sqlite"
      ARENA_DB_DSN: "/state/arena.db"
    volumes:
      # Persist the SQLite DB across restarts.
      - arena-state:/state
      # Mount the client game data (read-only).
      - ${ARENA_DATA_DIR:-./data}:/data:ro
    restart: unless-stopped

volumes:
  arena-state:
